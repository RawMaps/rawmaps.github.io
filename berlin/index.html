50).","lines":"","price_en":"Gratis exterior","time_en":"20–30 min","hours_en":"","search":"Checkpoint Charlie","search_en":"Checkpoint Charlie"},{"day":"d1","name":"Topografía del Terror","name_en":"Topography of Terror","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.506747,"lng":13.3837099,"maps":"https://maps.google.com/?cid=3984513367586465352","price":"Gratis","time":"1.5–2h","hours":"Diario 10:00–20:00","rating":"","desc":"El museo más visitado de Berlín y con razón. Construido sobre los terrenos de la antigua Gestapo. La exposición documenta la escalada del nazismo con fotografías y textos originales. El exterior preserva los sótanos de la Gestapo.","desc_en":"Berlin's most visited museum — and rightly so. Built on the former Gestapo grounds. The exhibition documents the rise of Nazism with original photographs and texts. The exterior preserves the Gestapo basements.","tip":"Llegar a las 10h en la apertura — sin grupos escolares. Llegar tarde es la peor opción: se llena.","tip_en":"Arrive at 10:00 opening — no school groups. Arriving late is the worst option: it fills up fast.","lines":"","price_en":"Gratis","time_en":"1.5–2h","hours_en":"Diario 10:00–20:00","search":"Topografía del Terror","search_en":"Topography of Terror"},{"day":"d1","name":"Estación de Anhalt (ruina)","name_en":"Anhalter Bahnhof (ruin)","type":"spot","intensity":2,"isFriki":false,"icon":"1598","lat":52.5036889,"lng":13.3824896,"maps":"https://maps.google.com/?cid=8216093722250485297","price":"Gratis","time":"15–20 min","hours":"","rating":"","desc":"Lo que queda de la mayor estación de trenes de Europa antes de la guerra. La sala de espera en ruinas, con columnas oxidadas y techos derrumbados, es uno de los espacios más evocadores de Berlín. Sin señales, sin turistas.","desc_en":"What remains of Europe's largest train station before the war. The ruined waiting room, with rusted columns and collapsed ceilings, is one of Berlin's most evocative spaces. No signs, no tourists.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"15–20 min","hours_en":"","search":"Estación de Anhalt (ruina)","search_en":"Anhalter Bahnhof (ruin)"},{"day":"d1","name":"Berlin Story Bunker","name_en":"Berlin Story Bunker","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5029008,"lng":13.3803901,"maps":"https://maps.google.com/?cid=3701284762457210507","price":"Aprox. 15€","time":"1–1.5h","hours":"Diario 10:00–19:00","rating":"","desc":"El búnker antiaéreo de 5 plantas. La exposición sobre Hitler y el nazismo es diferente a la Topografía: más visual, más cronológica, más centrada en la psicología del poder. El espacio del búnker en sí ya vale la visita.","desc_en":"The 5-storey anti-aircraft bunker. The Hitler and Nazism exhibition is different from the Topography: more visual, more chronological, more focused on the psychology of power. The bunker space itself is already worth the visit.","tip":"","tip_en":"","lines":"","price_en":"Aprox. 15€","time_en":"1–1.5h","hours_en":"Diario 10:00–19:00","search":"Berlin Story Bunker","search_en":"Berlin Story Bunker"},{"day":"d1","name":"Hansa Studios","name_en":"Hansa Studios","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=18154407675057978183","price":"Gratis (solo exterior)","time":"10 min","hours":"","rating":"","desc":"El estudio donde Bowie grabó \"Heroes\" y \"Low\" (1976–79). También Iggy Pop, U2 y Nick Cave. Sigue siendo un estudio activo — sin acceso. El valor está en saber que ese edificio es exactamente donde Bowie miró el Muro y escribió lo que escribió.","desc_en":"The studio where Bowie recorded \"Heroes\" and \"Low\" (1976–79). Also Iggy Pop, U2 and Nick Cave. Still an active studio — no access. The value is in knowing that building is exactly where Bowie looked at the Wall and wrote what he wrote.","tip":"","tip_en":"","lines":"","price_en":"Gratis (solo exterior)","time_en":"10 min","hours_en":"","search":"Hansa Studios","search_en":"Hansa Studios"},{"day":"d1","name":"Gendarmenmarkt","name_en":"Gendarmenmarkt","type":"spot","intensity":1,"isFriki":false,"icon":"1580","lat":52.5131523,"lng":13.3915191,"maps":"https://maps.google.com/?q=Gendarmenmarkt,+10117+Berlin,+Deutschland&ftid=0x47a851da61eecfe7:0x5e97daa3558a2da7","price":"Gratis plaza · Torre 3€","time":"30–45 min","hours":"Torre Mar–Dom 10:00–18:00","rating":"","desc":"La plaza más elegante de Berlín: dos catedrales simétricas flanqueando el Konzerthaus. La proporción y calma que le falta al Brandenburger Tor. En invierno tiene uno de los mejores mercados de Navidad.","desc_en":"Berlin's most elegant square: two symmetrical cathedrals flanking the Konzerthaus. The proportion and calm the Brandenburg Gate lacks. In winter it has one of the best Christmas markets.","tip":"Subir a la torre de la Catedral Francesa (3€) da la mejor perspectiva de la plaza. Vale si el tiempo acompaña.","tip_en":"Climbing the French Cathedral tower (€3) gives the best perspective of the square. Worth it if the weather is good.","lines":"","price_en":"Gratis plaza · Torre 3€","time_en":"30–45 min","hours_en":"Torre Mar–Dom 10:00–18:00","search":"Gendarmenmarkt","search_en":"Gendarmenmarkt"},{"day":"d1","name":"Catedral Alemana — exposición gratuita","name_en":"German Cathedral — free exhibition","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5127168,"lng":13.3925442,"maps":"https://maps.google.com/?cid=909960261274310056","price":"Gratis","time":"30–45 min","hours":"Mar–Dom 10:00–19:00 · Cerrado lunes","rating":"","desc":"Exposición permanente gratuita sobre la historia del parlamentarismo alemán. El edificio es precioso y la exposición es genuinamente buena. Ignorada por la mayoría de turistas que solo fotografían la plaza.","desc_en":"Free permanent exhibition on the history of German parliamentarism. The building is beautiful and the exhibition is genuinely good. Ignored by most tourists who only photograph the square.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"Mar–Dom 10:00–19:00 · Cerrado lunes","search":"Catedral Alemana — exposición gratuita","search_en":"German Cathedral — free exhibition"},{"day":"d1","name":"Catedral de Santa Eduvigis","name_en":"St Hedwig's Cathedral","type":"spot","intensity":2,"isFriki":false,"icon":"1706","lat":52.5159214,"lng":13.3946271,"maps":"https://maps.google.com/?cid=1473900651108792695","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"La catedral católica más antigua de Berlín (1773), encargada por Federico el Grande. Interior circular con enorme claraboya central influenciado directamente por el Panteón de Roma. Tranquila, poco visitada.","desc_en":"Berlin's oldest Catholic cathedral (1773), commissioned by Frederick the Great. Circular interior with a huge central skylight directly influenced by the Pantheon in Rome. Quiet, rarely visited.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Catedral de Santa Eduvigis","search_en":"St Hedwig's Cathedral"},{"day":"d1","name":"Bebelplatz","name_en":"Bebelplatz","type":"spot","intensity":2,"isFriki":false,"icon":"1580","lat":52.5168703,"lng":13.3956217,"maps":"https://maps.google.com/?cid=15417257465543100176","price":"Gratis","time":"15–20 min","hours":"24h","rating":"","desc":"La plaza donde los nazis quemaron 20.000 libros el 10 de mayo de 1933. En el centro del adoquinado hay una ventana de cristal que da a una sala subterránea con estantes blancos vacíos — la instalación de Micha Ullman. Una de las piezas de arte público más impactantes de Berlín.","desc_en":"The square where the Nazis burned 20,000 books on 10 May 1933. In the centre of the cobblestones there is a glass window looking into an underground room with empty white shelves — Micha Ullman's installation. One of Berlin's most powerful works of public art.","tip":"Busca el cristal en el suelo — en días soleados puede ser difícil de ver. Agáchate para apreciarla bien.","tip_en":"Look for the glass in the ground — on sunny days it can be hard to see. Crouch down to appreciate it properly.","lines":"","price_en":"Gratis","time_en":"15–20 min","hours_en":"24h","search":"Bebelplatz","search_en":"Bebelplatz"},{"day":"d1","name":"Staatsoper Unter den Linden","name_en":"Staatsoper Unter den Linden","type":"spot","intensity":2,"isFriki":false,"icon":"1598","lat":52.5171049,"lng":13.394703,"maps":"https://maps.google.com/?cid=9302602131855715441","price":"Localidades de pie desde 10€","time":"30–45 min si hay función","hours":"","rating":"","desc":"La ópera más antigua y prestigiosa de Berlín (1742). Destruida en la guerra y reconstruida. Las localidades de pie son una de las mejores formas de ver ópera de calidad a precio muy accesible.","desc_en":"Berlin's oldest and most prestigious opera house (1742). Destroyed in the war and rebuilt. Standing tickets are one of the best ways to see quality opera at a very accessible price.","tip":"","tip_en":"","lines":"","price_en":"Localidades de pie desde 10€","time_en":"30–45 min si hay función","hours_en":"","search":"Staatsoper Unter den Linden","search_en":"Staatsoper Unter den Linden"},{"day":"d1","name":"Alte Bibliothek","name_en":"Alte Bibliothek","type":"spot","intensity":2,"isFriki":false,"icon":"1548","lat":52.5170077,"lng":13.3932369,"maps":"https://maps.google.com/?cid=14880729692329942879","price":"Gratis","time":"10 min","hours":"","rating":"","desc":"La Biblioteca Antigua, apodada \"el Cómoda\" por su fachada curva barroca (1780). Hoy Facultad de Derecho de la Humboldt-Universität. Frente a Bebelplatz — el contraste entre el edificio culto y lo que pasó en la plaza es parte del mensaje.","desc_en":"The Old Library, nicknamed \"the Commode\" for its curved Baroque facade (1780). Now the Law Faculty of Humboldt University. Opposite Bebelplatz — the contrast between the erudite building and what happened in the square is part of the message.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"10 min","hours_en":"","search":"Alte Bibliothek","search_en":"Alte Bibliothek"},{"day":"d1","name":"Estatua ecuestre de Federico II","name_en":"Equestrian Statue of Frederick II","type":"spot","intensity":2,"isFriki":false,"icon":"1599","lat":52.5172695,"lng":13.3927528,"maps":"https://maps.google.com/?cid=6125967065758465659","price":"Gratis","time":"5–10 min","hours":"","rating":"","desc":"Federico el Grande a caballo en el centro de Unter den Linden. Retirada por la RDA por ser símbolo militarista, devuelta a su lugar en 1980 con una lectura diferente: símbolo de continuidad alemana.","desc_en":"Frederick the Great on horseback in the centre of Unter den Linden. Removed by the GDR as a militarist symbol, returned to its place in 1980 with a different reading: symbol of German continuity.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"5–10 min","hours_en":"","search":"Estatua ecuestre de Federico II","search_en":"Equestrian Statue of Frederick II"},{"day":"d1","name":"Biblioteca Estatal de Berlín","name_en":"Berlin State Library","type":"spot","intensity":2,"isFriki":false,"icon":"1548","lat":52.5175461,"lng":13.3917624,"maps":"https://maps.google.com/?cid=9299354654463181215","price":"Gratis para visitantes","time":"20–30 min","hours":"Lun–Vie 9:00–21:00 · Sáb 10:00–19:00","rating":"","desc":"Aparece en \"El cielo sobre Berlín\" de Wenders. La sala de lectura es una de las más bellas de Europa: luz cenital, madera oscura, silencio absoluto. Se puede entrar como visitante sin carné de investigador.","desc_en":"Featured in Wenders' \"Wings of Desire\". The reading room is one of the most beautiful in Europe: zenithal light, dark wood, absolute silence. You can enter as a visitor without a researcher's card.","tip":"","tip_en":"","lines":"","price_en":"Gratis para visitantes","time_en":"20–30 min","hours_en":"Lun–Vie 9:00–21:00 · Sáb 10:00–19:00","search":"Biblioteca Estatal de Berlín","search_en":"Berlin State Library"},{"day":"d1","name":"Unter den Linden","name_en":"Unter den Linden","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.517171,"lng":13.3891129,"maps":"https://maps.google.com/?q=Unter+den+Linden,+10117+Berlin,+Deutschland&ftid=0x47a851c4b08614df:0x6f592c283a8f1fe9","price":"Gratis","time":"20–30 min paseo completo","hours":"","rating":"","desc":"El bulevar histórico de 1.5 km desde la Isla de los Museos hasta la Puerta de Brandenburgo. Cuatro carriles flanqueados por tilos centenarios y edificios neoclásicos. Es la columna vertebral del día.","desc_en":"The 1.5km historic boulevard from Museum Island to the Brandenburg Gate. Four lanes flanked by century-old lime trees and neoclassical buildings. It's the spine of the day.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min paseo completo","hours_en":"","search":"Unter den Linden","search_en":"Unter den Linden"},{"day":"d1","name":"Holocaust Memorial","name_en":"Holocaust Memorial","type":"spot","intensity":2,"isFriki":false,"icon":"1599","lat":52.5139474,"lng":13.3787126,"maps":"https://maps.google.com/?cid=1455972816782253000","price":"Gratis","time":"1–1.5h","hours":"Campo 24h · Centro info Mar–Dom 10:00–20:00","rating":"","desc":"2.711 estelas de hormigón de distintas alturas sobre terreno irregular. Al entrar entre las estelas el ruido de la ciudad desaparece — la desorientación es intencionada. El centro de información subterráneo documenta historias individuales.","desc_en":"2,711 concrete stelae of different heights on uneven ground. When you enter between the stelae the city noise disappears — the disorientation is intentional. The underground information centre documents individual stories.","tip":"Ir a las 15–16h cuando las colas del centro han bajado. El campo de estelas funciona mejor solo o con poca gente.","tip_en":"Go at 15:00–16:00 when the centre queues have dropped. The field of stelae works best alone or with few people.","lines":"","price_en":"Gratis","time_en":"1–1.5h","hours_en":"Campo 24h · Centro info Mar–Dom 10:00–20:00","search":"Holocaust Memorial","search_en":"Holocaust Memorial"},{"day":"d1","name":"Führerbunker","name_en":"Führerbunker","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=16296777179154325881","price":"Gratis","time":"10–15 min","hours":"","rating":"","desc":"El lugar donde Hitler se suicidó el 30 de abril de 1945. Hoy es un parking. Los búnkers fueron demolidos deliberadamente para no crear lugar de peregrinaje. Hay una placa informativa discreta en la acera. No hay nada que ver, pero saber dónde estás tiene su propio peso.","desc_en":"The place where Hitler committed suicide on 30 April 1945. Today it's a car park. The bunkers were deliberately demolished to avoid creating a place of pilgrimage. There is a discreet information plaque on the pavement. There is nothing to see, but knowing where you are has its own weight.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"10–15 min","hours_en":"","search":"Führerbunker","search_en":"Führerbunker"},{"day":"d1","name":"Brandenburger Tor","name_en":"Brandenburg Gate","type":"spot","intensity":2,"isFriki":false,"icon":"1598","lat":52.5162746,"lng":13.377704,"maps":"https://maps.google.com/?cid=2791100708733537379","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"El símbolo más icónico de Berlín (1788). La Quadriga fue retirada por Napoleón a París en 1806 y devuelta 8 años después. Estuvo en plena Zona de Muerte del Muro durante 28 años. Mejor de tarde cuando el sol la ilumina de frente.","desc_en":"Berlin's most iconic symbol (1788). The Quadriga was taken by Napoleon to Paris in 1806 and returned 8 years later. It stood in the full Death Zone of the Wall for 28 years. Best in the afternoon when the sun illuminates it head-on.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Brandenburger Tor","search_en":"Brandenburg Gate"},{"day":"d1","name":"Reichstag","name_en":"Reichstag","type":"spot","intensity":1,"isFriki":false,"icon":"1548","lat":52.5186202,"lng":13.3761871,"maps":"https://maps.google.com/?cid=7213450297240288741","price":"Gratis con reserva obligatoria","time":"1–1.5h","hours":"Diario 8:00–24:00 (última visita 22:00)","rating":"","desc":"El parlamento alemán con la cúpula de cristal de Norman Foster. Las rampas en espiral rodean el cono central de espejos que refleja luz solar hacia el hemiciclo. Vistas 360° sobre Berlín. Reserva obligatoria con semanas de antelación. Pasaporte obligatorio.","desc_en":"The German parliament with Norman Foster's glass dome. The spiral ramps surround the central cone of mirrors that reflects sunlight into the chamber below. 360° views over Berlin. Mandatory booking weeks in advance. Passport required.","tip":"Slot de tarde (16–18h) — la luz sobre Berlín es mejor y el interior está menos concurrido. Pasaporte en la entrada.","tip_en":"Afternoon slot (16:00–18:00) — the light over Berlin is better and the interior is less crowded. Passport at the entrance.","lines":"","price_en":"Gratis con reserva obligatoria","time_en":"1–1.5h","hours_en":"Diario 8:00–24:00 (última visita 22:00)","search":"Reichstag","search_en":"Reichstag"},{"day":"d1","name":"Memorial soviético — Tiergarten","name_en":"Soviet Memorial — Tiergarten","type":"spot","intensity":2,"isFriki":false,"icon":"1599","lat":52.5166259,"lng":13.3719287,"maps":"https://maps.google.com/?cid=12680410888297930783","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"Monumento soviético en el corazón del Tiergarten, inaugurado en 1945 — construido con mármol de la Nueva Cancillería del Reich de Hitler. Dos tanques T-34 flanquean el soldado central. Más pequeño que Treptower Park, pero más íntimo.","desc_en":"Soviet monument in the heart of the Tiergarten, inaugurated in 1945 — built with marble from Hitler's New Reich Chancellery. Two T-34 tanks flank the central soldier. Smaller than Treptower Park, but more intimate.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Memorial soviético — Tiergarten","search_en":"Soviet Memorial — Tiergarten"},{"day":"d1","name":"Victory Column","name_en":"Victory Column","type":"spot","intensity":1,"isFriki":false,"icon":"1599","lat":52.5145229,"lng":13.3501085,"maps":"https://maps.google.com/?cid=6152620622259217865","price":"3.50€ subida · gratis exterior","time":"45–60 min","hours":"Lun–Vie 9:30–18:30 · Sáb–Dom 9:30–19:00","rating":"","desc":"La Siegessäule de 67 metros coronada por la Goldene Else. Hitler la trasladó 2 km de su posición original para ampliar el eje este–oeste. 285 escalones para vistas 360° sobre el Tiergarten.","desc_en":"The 67-metre Siegessäule crowned by the Goldene Else. Hitler moved it 2km from its original position to extend the east–west axis. 285 steps for 360° views over the Tiergarten.","tip":"Último punto del día. La Goldene Else brilla con la luz del atardecer. 285 escalones — si queda energía, compensa. Si no, el exterior ya vale.","tip_en":"Last point of the day. The Goldene Else glows at sunset. 285 steps — if you have energy left, worth it. If not, the exterior alone is enough.","lines":"","price_en":"3.50€ subida · gratis exterior","time_en":"45–60 min","hours_en":"Lun–Vie 9:30–18:30 · Sáb–Dom 9:30–19:00","search":"Victory Column","search_en":"Victory Column"},{"day":"d1","name":"LLEGADA D1: S Tiergarten","name_en":"END D1: S Tiergarten","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.513956,"lng":13.3362716,"maps":"https://maps.google.com/?cid=16973221166425712173","price":"","time":"","hours":"","rating":"","desc":"Hauptbahnhof (2 paradas) · Zoologischer Garten (2 paradas: U2, U9)","desc_en":"Hauptbahnhof (2 stops) · Zoologischer Garten (2 stops: U2, U9)","tip":"","tip_en":"","lines":"S5 · S7 · S75","price_en":"","time_en":"","hours_en":"","search":"LLEGADA D1: S Tiergarten","search_en":"END D1: S Tiergarten"},{"day":"d2","name":"SALIDA D2: U Naturkundemuseum","name_en":"START D2: U Naturkundemuseum","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.5312674,"lng":13.3822153,"maps":"https://maps.google.com/?cid=6886575713309147652","price":"","time":"","hours":"","rating":"","desc":"Salida Invalidenstrasse · 2 min a pie hasta el museo","desc_en":"Exit Invalidenstrasse · 2 min walk to museum","tip":"","tip_en":"","lines":"U6","price_en":"","time_en":"","hours_en":"","search":"SALIDA D2: U Naturkundemuseum","search_en":"START D2: U Naturkundemuseum"},{"day":"d2","name":"Museo de Historia Natural","name_en":"Natural History Museum","type":"spot","intensity":1,"isFriki":false,"icon":"1636","lat":52.5305726,"lng":13.3791755,"maps":"https://maps.google.com/?cid=8921686107429110412","price":"10€ adultos · 5€ reducida","time":"1.5–2h","hours":"Mar–Vie 9:30–18:00 · Sáb–Dom 10:00–18:00 · Cerrado lunes","rating":"","desc":"Uno de los mejores museos de historia natural de Europa. El esqueleto de Brachiosaurus de 13 metros — el más grande del mundo en exposición. La sala de aves extintas, la colección de meteoritos y el celacanto conservado en formol.","desc_en":"One of the best natural history museums in Europe. The 13-metre Brachiosaurus skeleton — the largest in display in the world. The extinct bird hall, the meteorite collection and the coelacanth preserved in formaldehyde.","tip":"Las salas de fósiles del siglo XIX tienen vitrinas originales con taxidermia de la época. El contraste con los módulos nuevos es parte del encanto.","tip_en":"The 19th-century fossil halls have original display cases with period taxidermy. The contrast with the new modules is part of the charm.","lines":"","price_en":"10€ adultos · 5€ reducida","time_en":"1.5–2h","hours_en":"Mar–Vie 9:30–18:00 · Sáb–Dom 10:00–18:00 · Cerrado lunes","search":"Museo de Historia Natural","search_en":"Natural History Museum"},{"day":"d2","name":"Cementerio de los Inválidos","name_en":"Invalidenfriedhof Cemetery","type":"spot","intensity":2,"isFriki":false,"icon":"1542","lat":52.5319164,"lng":13.3708928,"maps":"https://maps.google.com/?cid=6235450366002427228","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"Cementerio militar del siglo XVIII. Parte quedó dividido por el Muro — algunas tumbas estuvieron en la franja de la muerte durante 28 años. Poco visitado, muy tranquilo.","desc_en":"18th-century military cemetery. Part of it was divided by the Wall — some graves were in the death strip for 28 years. Rarely visited, very quiet.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Cementerio de los Inválidos","search_en":"Invalidenfriedhof Cemetery"},{"day":"d2","name":"Berlin Underworld","name_en":"Berlin Underworld","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5477911,"lng":13.3889929,"maps":"https://maps.google.com/?cid=13874845582211697570","price":"Aprox. 16€ adulto","time":"1.5–2h · tour guiado","hours":"","rating":"","desc":"Los mejores tours de búnker de Berlín. Recorridos por túneles y búnkers de la Segunda Guerra Mundial y la Guerra Fría, con guías muy bien documentados. El tour \"Dark Worlds\" es el más completo. Reserva con días de antelación.","desc_en":"Berlin's best bunker tours. Guided walks through WWII and Cold War tunnels and bunkers, with very well-documented guides. The \"Dark Worlds\" tour is the most complete. Book days in advance.","tip":"Los tours en inglés y alemán salen a horas fijas. Llevar una chaqueta — la temperatura bajo tierra es constante y baja.","tip_en":"English and German tours leave at fixed times. Bring a jacket — the underground temperature is constant and cold.","lines":"","price_en":"Aprox. 16€ adulto","time_en":"1.5–2h · tour guiado","hours_en":"","search":"Berlin Underworld","search_en":"Berlin Underworld"},{"day":"d2","name":"Flakturm Humboldthain","name_en":"Flakturm Humboldthain","type":"spot","intensity":2,"isFriki":false,"icon":"1598","lat":52.5474939,"lng":13.3850835,"maps":"https://maps.google.com/?cid=18192052525081482918","price":"Gratis exterior · Tours ~10€","time":"30–45 min","hours":"","rating":"","desc":"Una de las seis torres antiaéreas de Hitler. Volada parcialmente por los aliados — era tan sólida que la demolición quedó incompleta. Los restos están cubiertos de vegetación y forman una colina artificial con vistas al norte de Berlín.","desc_en":"One of Hitler's six anti-aircraft towers. Partially blown up by the Allies — it was so solid the demolition was incomplete. The remains are covered in vegetation and form an artificial hill with views north over Berlin.","tip":"La colina encima de la torre tiene vistas sorprendentes. Los tours del interior son los mejores de la ciudad.","tip_en":"The hill on top of the tower has surprising views. The interior tours are among the best in the city.","lines":"","price_en":"Gratis exterior · Tours ~10€","time_en":"30–45 min","hours_en":"","search":"Flakturm Humboldthain","search_en":"Flakturm Humboldthain"},{"day":"d2","name":"Bernauer Straße — Memorial del Muro","name_en":"Bernauer Straße — Wall Memorial","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.5375414,"lng":13.393641,"maps":"https://maps.google.com/?q=Bernauer+Str.,+Berlin,+Deutschland&ftid=0x47a851f0e6aef965:0x6f4b957334fdaafc","price":"Gratis","time":"1–1.5h","hours":"Diario 8:00–22:00 · Centro visitantes Mar–Dom 10:00–18:00","rating":"","desc":"El tramo más documentado del Muro. Aquí la frontera pasaba por la fachada de los edificios — los residentes escapaban saltando por las ventanas. Preserva el doble muro original y la franja de la muerte. Mucho más honesto que Checkpoint Charlie.","desc_en":"The most documented Wall stretch. Here the border ran through building facades — residents escaped by jumping from windows. Preserves the original double wall and the death strip. Far more honest than Checkpoint Charlie.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"1–1.5h","hours_en":"Diario 8:00–22:00 · Centro visitantes Mar–Dom 10:00–18:00","search":"Bernauer Straße — Memorial del Muro","search_en":"Bernauer Straße — Wall Memorial"},{"day":"d2","name":"Flohmarkt im Mauerpark","name_en":"Mauerpark Flea Market","type":"spot","intensity":2,"isFriki":false,"icon":"1684","lat":52.5413884,"lng":13.4023657,"maps":"https://maps.google.com/?cid=6475838200608449054","price":"Gratis entrada","time":"1.5–2h","hours":"Solo domingos 9:00–18:00","rating":"","desc":"El mercadillo dominical más famoso de Berlín a lo largo del corredor del Muro. Solo existe los domingos. Si tu Día 2 no es domingo, este punto no aplica.","desc_en":"Berlin's most famous Sunday flea market along the Wall corridor. It only exists on Sundays. If your Day 2 is not a Sunday, this point doesn't apply.","tip":"Solo domingos. Las primeras 2 horas son las mejores — a partir de las 11h está saturado.","tip_en":"Sundays only. The first 2 hours are the best — after 11:00 it's saturated.","lines":"","price_en":"Gratis entrada","time_en":"1.5–2h","hours_en":"Solo domingos 9:00–18:00","search":"Flohmarkt im Mauerpark","search_en":"Mauerpark Flea Market"},{"day":"d2","name":"Museo de la Kulturbrauerei","name_en":"Kulturbrauerei Museum","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.540383,"lng":13.414097,"maps":"https://maps.google.com/?cid=10169311538576559790","price":"Gratis","time":"1–1.5h","hours":"Mar–Dom 10:00–18:00 · Cerrado lunes","rating":"","desc":"Museo gratuito sobre la vida cotidiana en la Berlín Oriental. Los objetos reales — Trabants, muebles, uniformes, pancartas — con la estética mate del diseño de la RDA. Sin aglomeraciones, sin grupos organizados.","desc_en":"Free museum about everyday life in East Berlin. The real objects — Trabants, furniture, uniforms, banners — with the flat aesthetic of GDR design. No crowds, no organised groups.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"1–1.5h","hours_en":"Mar–Dom 10:00–18:00 · Cerrado lunes","search":"Museo de la Kulturbrauerei","search_en":"Kulturbrauerei Museum"},{"day":"d2","name":"Kulturbrauerei","name_en":"Kulturbrauerei","type":"spot","intensity":1,"isFriki":false,"icon":"1684","lat":52.5382032,"lng":13.4127133,"maps":"https://maps.google.com/?cid=1994452411317672679","price":"Gratis (complejo)","time":"30–45 min","hours":"","rating":"","desc":"Antigua fábrica de cerveza reconvertida en centro cultural. El complejo de ladrillo rojo con torres, patios y naves industriales aloja cines, clubs, mercados y bares. La arquitectura industrial tardovictoriana es excepcional.","desc_en":"Former brewery converted into a cultural centre. The red brick complex with towers, courtyards and industrial halls houses cinemas, clubs, markets and bars. The late-Victorian industrial architecture is exceptional.","tip":"","tip_en":"","lines":"","price_en":"Gratis (complejo)","time_en":"30–45 min","hours_en":"","search":"Kulturbrauerei","search_en":"Kulturbrauerei"},{"day":"d2","name":"Jüdischer Friedhof Schönhauser Allee","name_en":"Jüdischer Friedhof Schönhauser Allee","type":"spot","intensity":2,"isFriki":false,"icon":"1542","lat":52.5343731,"lng":13.4130453,"maps":"https://maps.google.com/?cid=10482211609963375412","price":"Gratis","time":"30–45 min","hours":"Lun–Jue 9:00–16:00 · Vie 9:00–13:00 · Dom 10:00–16:00 · Cerrado sábados y festivos judíos","rating":"","desc":"Cementerio judío de 1827. Las tumbas del siglo XIX con inscripciones en hebreo, alemán y francés están cubiertas de musgo y vegetación densa — un bosque urbano silencioso.","desc_en":"Jewish cemetery from 1827. The 19th-century graves with inscriptions in Hebrew, German and French are covered in moss and dense vegetation — a silent urban forest.","tip":"Verificar que no sea festivo judío antes de ir. Los hombres deben cubrir la cabeza — hay kipás en la entrada.","tip_en":"Check it's not a Jewish holiday before going. Men must cover their heads — kippot are available at the entrance.","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"Lun–Jue 9:00–16:00 · Vie 9:00–13:00 · Dom 10:00–16:00 · Cerrado sábados y festivos judíos","search":"Jüdischer Friedhof Schönhauser Allee","search_en":"Jüdischer Friedhof Schönhauser Allee"},{"day":"d2","name":"Wasserturm Prenzlauer Berg","name_en":"Wasserturm Prenzlauer Berg","type":"spot","intensity":2,"isFriki":false,"icon":"1535","lat":52.5341937,"lng":13.4186129,"maps":"https://maps.google.com/?cid=3060530968340711284","price":"Gratis exterior","time":"10–15 min","hours":"","rating":"","desc":"Torre de agua de ladrillo de 1877, la más antigua de Berlín. En el sótano los nazis instalaron en 1933 uno de los primeros campos de concentración improvisados de la ciudad. Una placa en la base lo conmemora.","desc_en":"Brick water tower from 1877, the oldest in Berlin. In the basement the Nazis installed in 1933 one of the city's first improvised concentration camps. A plaque at the base commemorates it.","tip":"","tip_en":"","lines":"","price_en":"Gratis exterior","time_en":"10–15 min","hours_en":"","search":"Wasserturm Prenzlauer Berg","search_en":"Wasserturm Prenzlauer Berg"},{"day":"d2","name":"Patio grafitero — Haus Schwarzenberg","name_en":"Graffiti Courtyard — Haus Schwarzenberg","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=6132102717509833568","price":"Gratis · Museo Weidt: donativo","time":"30–45 min","hours":"","rating":"","desc":"Pasaje oculto en Mitte con el graffiti más denso y antiguo de Berlín. El Haus Schwarzenberg fue el único edificio de la zona que no fue rehabilitado en los 90. Aloja bares alternativos y capas de arte callejero que se remontan a los años 90.","desc_en":"Hidden passage in Mitte with Berlin's densest and oldest graffiti. Haus Schwarzenberg was the only building in the area not refurbished in the 90s. It houses alternative bars and layers of street art going back to the 1990s.","tip":"","tip_en":"","lines":"","price_en":"Gratis · Museo Weidt: donativo","time_en":"30–45 min","hours_en":"","search":"Patio grafitero — Haus Schwarzenberg","search_en":"Graffiti Courtyard — Haus Schwarzenberg"},{"day":"d2","name":"Hackesche Höfe","name_en":"Hackesche Höfe","type":"spot","intensity":1,"isFriki":false,"icon":"1873","lat":52.5240221,"lng":13.4024126,"maps":"https://maps.google.com/?cid=17400861047434578232","price":"Gratis","time":"20–30 min","hours":"Aprox 10:00–20:00","rating":"","desc":"Complejo de ocho patios interiores conectados en Art Nouveau, el más grande de Europa de este estilo (1907). La fachada de cerámica del primer patio es el detalle más fotográfico.","desc_en":"Complex of eight connected interior courtyards in Art Nouveau — the largest in Europe of this style (1907). The ceramic facade of the first courtyard is the most photogenic detail.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"Aprox 10:00–20:00","search":"Hackesche Höfe","search_en":"Hackesche Höfe"},{"day":"d2","name":"Hackescher Markt","name_en":"Hackescher Markt","type":"spot","intensity":2,"isFriki":false,"icon":"1684","lat":52.5237159,"lng":13.4022679,"maps":"https://maps.google.com/?q=Hackescher+Markt,+10178+Berlin,+Deutschland&ftid=0x47a851e0ce50d3fb:0x69ec81cf4ec66f34","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"Los arcos de ladrillo bajo la línea elevada del S-Bahn. El mercado en los arcos, las terrazas, la mezcla de berlineses y turistas. Buen punto de llegada — el S+U conecta con prácticamente toda la ciudad.","desc_en":"The brick arches under the elevated S-Bahn line. The market in the arches, the terraces, the mix of Berliners and tourists. Good arrival point — the S+U connects to practically the whole city.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Hackescher Markt","search_en":"Hackescher Markt"},{"day":"d2","name":"LLEGADA D2: S+U Hackescher Markt","name_en":"END D2: S+U Hackescher Markt","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.5226613,"lng":13.4022971,"maps":"https://maps.google.com/?cid=7727645945779319757","price":"","time":"","hours":"","rating":"","desc":"S este: Ostbahnhof · S norte/sur: Hauptbahnhof / Potsdamer Platz · U8: Alexanderplatz (1 parada)","desc_en":"S east: Ostbahnhof · U8: Alexanderplatz (1 stop)","tip":"","tip_en":"","lines":"S3 · S5 · S7 · S75 · U8","price_en":"","time_en":"","hours_en":"","search":"LLEGADA D2: S+U Hackescher Markt","search_en":"END D2: S+U Hackescher Markt"},{"day":"d3","name":"SALIDA D3: Winterfeldtplatz","name_en":"START D3: Winterfeldtplatz","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.4957378,"lng":13.3544831,"maps":"https://maps.google.com/?cid=11225861475816558728","price":"","time":"","hours":"","rating":"","desc":"Sin parada directa · 5–7 min a pie desde U Viktoria-Luise-Platz o U Nollendorfplatz","desc_en":"No direct stop · 5–7 min walk from U Viktoria-Luise-Platz or U Nollendorfplatz","tip":"","tip_en":"","lines":"U4 · U1 · U2 · Bus M19/M29","price_en":"","time_en":"","hours_en":"","search":"SALIDA D3: Winterfeldtplatz","search_en":"START D3: Winterfeldtplatz"},{"day":"d3","name":"Mercado Winterfeldtplatz","name_en":"Winterfeldtplatz Market","type":"spot","intensity":2,"isFriki":false,"icon":"1684","lat":52.4968074,"lng":13.3542667,"maps":"https://maps.google.com/?cid=12360210257439535243","price":"Gratis entrada · Productos 3–15€","time":"1–1.5h","hours":"Miér 8:00–14:00 · Sáb 8:00–16:00","rating":"","desc":"El mercado de barrio más querido de Schöneberg. Frutas, verduras, quesos, especias, flores y comida caliente. Los sábados es el mercado de Berlín: lleno de familias del barrio, no de turistas.","desc_en":"Schöneberg's most beloved neighbourhood market. Fruit, vegetables, cheeses, spices, flowers and hot food. On Saturdays it's Berlin's market: full of local families, not tourists.","tip":"Los sábados hay puestos de desayuno-almuerzo excepcionales. Llegar antes de las 10h para encontrar sitio en las mesas.","tip_en":"On Saturdays there are exceptional breakfast-lunch stalls. Arrive before 10:00 to find a seat at the tables.","lines":"","price_en":"Gratis entrada · Productos 3–15€","time_en":"1–1.5h","hours_en":"Miér 8:00–14:00 · Sáb 8:00–16:00","search":"Mercado Winterfeldtplatz","search_en":"Winterfeldtplatz Market"},{"day":"d3","name":"Gedenkstein — placa deportados","name_en":"Memorial Stone — deportees","type":"spot","intensity":2,"isFriki":false,"icon":"1599","lat":52.4994609,"lng":13.3534745,"maps":"https://maps.google.com/?cid=11004042884784107322","price":"Gratis","time":"5 min","hours":"","rating":"","desc":"Placa conmemorativa de los homosexuales deportados y exterminados en campos de concentración. En Schöneberg, el barrio históricamente LGBTQ+ de Berlín.","desc_en":"Memorial plaque for homosexuals deported and killed in concentration camps. In Schöneberg, Berlin's historically LGBTQ+ neighbourhood.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"5 min","hours_en":"","search":"Gedenkstein — placa deportados","search_en":"Memorial Stone — deportees"},{"day":"d3","name":"Urban Nation","name_en":"Urban Nation","type":"spot","intensity":1,"isFriki":false,"icon":"1636","lat":52.4987058,"lng":13.3565036,"maps":"https://maps.google.com/?cid=14458222782289239335","price":"Gratis","time":"1–1.5h","hours":"Mar–Dom 10:00–18:00 · Cerrado lunes","rating":"","desc":"El primer museo de street art de Berlín — y uno de los mejores del mundo. Exposiciones temporales de artistas internacionales. El exterior del edificio ya es una galería: murales de Shepard Fairey, ROA y otros.","desc_en":"Berlin's first street art museum — and one of the best in the world. Temporary exhibitions by international artists. The building exterior is already a gallery: murals by Shepard Fairey, ROA and others.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"1–1.5h","hours_en":"Mar–Dom 10:00–18:00 · Cerrado lunes","search":"Urban Nation","search_en":"Urban Nation"},{"day":"d3","name":"Café Neues Ufer","name_en":"Café Neues Ufer","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=15283986332239972279","price":"Café 3–4€ · Desayuno 7–12€","time":"30–45 min","hours":"Diario desde 9:00","rating":"","desc":"El bar gay donde David Bowie e Iggy Pop eran habituales durante los años berlineses. Hoy sigue siendo un café de barrio tranquilo, sin sobreexplotación turística. Las fotos en las paredes son discretas y auténticas.","desc_en":"The gay bar where David Bowie and Iggy Pop were regulars during their Berlin years. Today it's still a quiet neighbourhood café, without tourist overexploitation. The photos on the walls are discreet and authentic.","tip":"","tip_en":"","lines":"","price_en":"Café 3–4€ · Desayuno 7–12€","time_en":"30–45 min","hours_en":"Diario desde 9:00","search":"Café Neues Ufer","search_en":"Café Neues Ufer"},{"day":"d3","name":"Apartamento de David Bowie","name_en":"David Bowie's Apartment","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=11403171023744351171","price":"Gratis","time":"5–10 min","hours":"","rating":"","desc":"La placa conmemorativa en la fachada del Altbau donde Bowie vivió con Iggy Pop entre 1976 y 1978 mientras grababa la Trilogía de Berlín. Hauptstraße 155. Para quien conoce la música, el contexto tiene su propio peso.","desc_en":"The commemorative plaque on the facade of the Altbau where Bowie lived with Iggy Pop between 1976 and 1978 while recording the Berlin Trilogy. Hauptstraße 155. For those who know the music, the context has its own weight.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"5–10 min","hours_en":"","search":"Apartamento de David Bowie","search_en":"David Bowie's Apartment"},{"day":"d3","name":"Rathaus Schöneberg","name_en":"Rathaus Schöneberg","type":"spot","intensity":2,"isFriki":false,"icon":"1548","lat":52.4849484,"lng":13.3441669,"maps":"https://maps.google.com/?cid=256110643032517683","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"El ayuntamiento desde cuya ventana JFK pronunció el \"Ich bin ein Berliner\" en 1963 ante 450.000 personas. La sala del discurso está en la segunda planta y se puede visitar.","desc_en":"The town hall from whose window JFK delivered his \"Ich bin ein Berliner\" speech in 1963 to 450,000 people. The speech hall is on the second floor and can be visited.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Rathaus Schöneberg","search_en":"Rathaus Schöneberg"},{"day":"d3","name":"John-F.-Kennedy-Platz","name_en":"John-F.-Kennedy-Platz","type":"spot","intensity":2,"isFriki":false,"icon":"1535","lat":52.4847485,"lng":13.3450178,"maps":"https://maps.google.com/?q=John-F.-Kennedy-Platz,+10+Berlin-Bezirk+Tempelhof-Sch%C3%B6neberg,+Deutschland&ftid=0x47a8506825d92077:0x63341ee177bc660c","price":"Gratis","time":"10–15 min","hours":"24h · Mercado Vie 10:00–18:00","rating":"","desc":"La plaza frente al Rathaus Schöneberg, rebautizada en honor a Kennedy tras su discurso. Tranquila, con un pequeño mercado los viernes.","desc_en":"The square in front of Rathaus Schöneberg, renamed in Kennedy's honour after his speech. Quiet, with a small market on Fridays.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"10–15 min","hours_en":"24h · Mercado Vie 10:00–18:00","search":"John-F.-Kennedy-Platz","search_en":"John-F.-Kennedy-Platz"},{"day":"d3","name":"Rudolph-Wilde-Park","name_en":"Rudolph-Wilde-Park","type":"spot","intensity":2,"isFriki":false,"icon":"1720","lat":52.4828472,"lng":13.3411489,"maps":"https://maps.google.com/?cid=9969615511390922990","price":"Gratis","time":"20 min descanso","hours":"","rating":"","desc":"Parque verde en el centro de Schöneberg. Buen punto de descanso entre el mercado y los puntos más al sur.","desc_en":"Green park in central Schöneberg. Good rest point between the market and the points further south.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20 min descanso","hours_en":"","search":"Rudolph-Wilde-Park","search_en":"Rudolph-Wilde-Park"},{"day":"d3","name":"Schwerbelastungskörper","name_en":"Schwerbelastungskörper","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=515322756369396473","price":"Gratis","time":"30–45 min","hours":"Mar–Dom 13:00–18:00 (abril–octubre) · Exterior siempre accesible","rating":"","desc":"Cilindro de hormigón de 12.650 toneladas construido en 1941 para probar si el suelo de Berlín aguantaría el arco de triunfo de la Germania de Hitler. El resultado: se hundió 18 cm en 3 años. El proyecto se abandonó. El cilindro sigue aquí. Todavía hundiéndose.","desc_en":"A 12,650-tonne concrete cylinder built in 1941 to test whether Berlin's ground could support the triumphal arch of Hitler's Germania. The result: it sank 18cm in 3 years. The project was abandoned. The cylinder is still here. Still sinking.","tip":"Vale absolutamente la pena el desvío. Casi nadie sabe que existe.","tip_en":"Absolutely worth the detour. Almost nobody knows it exists.","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"Mar–Dom 13:00–18:00 (abril–octubre) · Exterior siempre accesible","search":"Schwerbelastungskörper","search_en":"Schwerbelastungskörper"},{"day":"d3","name":"Viktoria Park","name_en":"Viktoria Park","type":"spot","intensity":2,"isFriki":false,"icon":"1720","lat":52.488227,"lng":13.3800144,"maps":"https://maps.google.com/?cid=9404708838332496912","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"Colina de 66 metros en Kreuzberg con obelisco neogótico dedicado a las guerras napoleónicas. Las vistas desde lo alto son las mejores del barrio. La cascada artificial que baja por la colina es el elemento más inesperado.","desc_en":"66-metre hill in Kreuzberg with a neo-Gothic obelisk dedicated to the Napoleonic Wars. The views from the top are the best in the neighbourhood. The artificial waterfall running down the hill is the most unexpected element.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Viktoria Park","search_en":"Viktoria Park"},{"day":"d3","name":"Bergmannkiez","name_en":"Bergmannkiez","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.4888995,"lng":13.397023,"maps":"https://maps.google.com/?q=Bergmannstra%C3%9Fe,+10961+Berlin-Bezirk+Friedrichshain-Kreuzberg,+Deutschland&ftid=0x47a84fd9d0b3ef9f:0x5b592aabaa4306c6","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"La calle más representativa del Kreuzberg no turístico: tiendas vintage, bares de barrio, panaderías turcas y el mercado cubierto Marheineke. Pasear la Bergmannstraße de un extremo a otro es entender por qué Kreuzberg es uno de los mejores barrios de Europa.","desc_en":"The most representative street of non-touristy Kreuzberg: vintage shops, neighbourhood bars, Turkish bakeries and the Marheineke covered market. Walking Bergmannstraße from one end to the other is understanding why Kreuzberg is one of the best neighbourhoods in Europe.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Bergmannkiez","search_en":"Bergmannkiez"},{"day":"d3","name":"Fichtebunker","name_en":"Fichtebunker","type":"spot","intensity":3,"isFriki":false,"icon":"1636","lat":52.4903547,"lng":13.4129079,"maps":"https://maps.google.com/?cid=2995006103052355003","price":"Aprox. 17€","time":"1.5h tour guiado","hours":"","rating":"","desc":"Antiguo gasómetro de 1882 reconvertido en búnker antiaéreo. Berliner Unterwelten ofrece tours por el interior — la estructura cilíndrica de 9 pisos con divisiones de madera originales es única en Berlín.","desc_en":"Former gasometer from 1882 converted into an anti-aircraft bunker. Berliner Unterwelten offers interior tours — the 9-storey cylindrical structure with original wooden partitions is unique in Berlin.","tip":"","tip_en":"","lines":"","price_en":"Aprox. 17€","time_en":"1.5h tour guiado","hours_en":"","search":"Fichtebunker","search_en":"Fichtebunker"},{"day":"d3","name":"Körnerpark","name_en":"Körnerpark","type":"spot","intensity":1,"isFriki":false,"icon":"1720","lat":52.471517,"lng":13.4382048,"maps":"https://maps.google.com/?cid=9274814620909705472","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"Jardín formal hundido por debajo del nivel de la calle — una sorpresa en medio de Neukölln. Balaustradas de mármol, fuentes, estatuas y parterres de flores. El ruido de la ciudad desaparece cuando bajas los escalones.","desc_en":"Formal garden sunken below street level — a surprise in the middle of Neukölln. Marble balustrades, fountains, statues and flower beds. The city noise disappears when you descend the steps.","tip":"Uno de los jardines más bonitos y menos conocidos de Berlín. Vale el desvío solo por la sorpresa.","tip_en":"One of Berlin's most beautiful and least known gardens. Worth the detour just for the surprise.","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Körnerpark","search_en":"Körnerpark"},{"day":"d3","name":"Tempelhofer Feld","name_en":"Tempelhofer Feld","type":"spot","intensity":1,"isFriki":false,"icon":"1873","lat":52.4748569,"lng":13.4005926,"maps":"https://maps.google.com/?cid=9838551651646665099","price":"Gratis","time":"1.5–2h","hours":"Diario desde las 6:00 hasta el atardecer","rating":"","desc":"El antiguo aeropuerto de Tempelhof convertido en el parque urbano más grande de Europa. La pista de aterrizaje intacta de 1.5 km, berlineses en bici, patines y cometas. Los edificios del aeropuerto al fondo. Un espacio que solo puede existir en Berlín.","desc_en":"The former Tempelhof airport converted into Europe's largest urban park. The intact 1.5km runway, Berliners on bikes, skates and kites. The airport buildings in the background. A space that could only exist in Berlin.","tip":"Llegar a las 16h — la luz de tarde sobre la pista y los edificios es excepcional. Fines de semana hay puestos de comida en las entradas.","tip_en":"Arrive at 16:00 — the afternoon light over the runway and buildings is exceptional. At weekends there are food stalls at the entrances.","lines":"","price_en":"Gratis","time_en":"1.5–2h","hours_en":"Diario desde las 6:00 hasta el atardecer","search":"Tempelhofer Feld","search_en":"Tempelhofer Feld"},{"day":"d3","name":"Aeropuerto de Tempelhof (edificio)","name_en":"Tempelhof Airport (building)","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.4824974,"lng":13.38914,"maps":"https://maps.google.com/?cid=16364579753219565063","price":"Aprox. 6€ tour guiado · Exterior gratis","time":"45–60 min tour","hours":"","rating":"","desc":"El edificio del aeropuerto, uno de los mayores del mundo cuando fue construido por los nazis en 1939, rodea el campo en un arco de 1.2 km. Los tours dan acceso a salas de embarque originales y la historia del puente aéreo de Berlín.","desc_en":"The airport building, one of the largest in the world when built by the Nazis in 1939, surrounds the field in a 1.2km arc. Tours give access to original boarding halls and the history of the Berlin Airlift.","tip":"","tip_en":"","lines":"","price_en":"Aprox. 6€ tour guiado · Exterior gratis","time_en":"45–60 min tour","hours_en":"","search":"Aeropuerto de Tempelhof (edificio)","search_en":"Tempelhof Airport (building)"},{"day":"d3","name":"LLEGADA D3: S+U Tempelhof","name_en":"END D3: S+U Tempelhof","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.4709979,"lng":13.3843975,"maps":"https://maps.google.com/?cid=13703948744774825394","price":"","time":"","hours":"","rating":"","desc":"U6 norte: Mehringdamm · Yorckstraße · S41/S42 anillo completo","desc_en":"U6 north: Mehringdamm · S41/S42 full ring","tip":"","tip_en":"","lines":"U6 · S41 · S42","price_en":"","time_en":"","hours_en":"","search":"LLEGADA D3: S+U Tempelhof","search_en":"END D3: S+U Tempelhof"},{"day":"d4","name":"SALIDA D4: S+U Hackescher Markt","name_en":"START D4: S+U Hackescher Markt","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.5226613,"lng":13.4022971,"maps":"https://maps.google.com/?cid=7727645945779319757","price":"","time":"","hours":"","rating":"","desc":"5 min a pie hasta la Isla de los Museos","desc_en":"5 min walk to Museum Island","tip":"","tip_en":"","lines":"S3 · S5 · S7 · S75 · U8","price_en":"","time_en":"","hours_en":"","search":"SALIDA D4: S+U Hackescher Markt","search_en":"START D4: S+U Hackescher Markt"},{"day":"d4","name":"Lustgarten","name_en":"Lustgarten","type":"spot","intensity":2,"isFriki":false,"icon":"1580","lat":52.5187,"lng":13.3992,"maps":"https://maps.google.com/?cid=11958687786904800522","price":"Gratis","time":"15–20 min","hours":"","rating":"","desc":"La plaza frente al Berliner Dom y el Altes Museum. Geométrica, despejada. Los nazis la usaron para concentraciones masivas — hoy es el punto de partida natural para la Isla de los Museos.","desc_en":"The square in front of the Berliner Dom and the Altes Museum. Geometric, open. The Nazis used it for mass rallies — today it's the natural starting point for Museum Island.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"15–20 min","hours_en":"","search":"Lustgarten","search_en":"Lustgarten"},{"day":"d4","name":"Altes Museum","name_en":"Altes Museum","type":"spot","intensity":1,"isFriki":false,"icon":"1636","lat":52.5194665,"lng":13.3987445,"maps":"https://maps.google.com/?cid=13123015454665211323","price":"10€","time":"1.5–2h","hours":"Mar–Dom 10:00–18:00 · Cerrado lunes","rating":"","desc":"El primer museo público de Berlín (1830). La rotonda central — inspirada en el Panteón de Roma — es uno de los espacios más bellos del neoclasicismo alemán. Colección de arte griego y romano. Sin reserva previa.","desc_en":"Berlin's first public museum (1830). The central rotunda — inspired by the Pantheon in Rome — is one of the most beautiful spaces of German neoclassicism. Collection of Greek and Roman art. No advance booking needed.","tip":"","tip_en":"","lines":"","price_en":"10€","time_en":"1.5–2h","hours_en":"Mar–Dom 10:00–18:00 · Cerrado lunes","search":"Altes Museum","search_en":"Altes Museum"},{"day":"d4","name":"Neues Museum","name_en":"Neues Museum","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5201349,"lng":13.3976462,"maps":"https://maps.google.com/?cid=10177987776063843125","price":"12€ · Reservar con antelación","time":"2h","hours":"Mar–Dom 10:00–18:00 (jue hasta 20:00) · Cerrado lunes","rating":"","desc":"El busto de Nefertiti es el motivo principal, pero el edificio es igualmente extraordinario: las cicatrices de la guerra integradas en la restauración de Chipperfield en lugar de ocultadas.","desc_en":"The Nefertiti bust is the main draw, but the building is equally extraordinary: the scars of war integrated into Chipperfield's restoration rather than hidden.","tip":"El busto de Nefertiti no se puede fotografiar — el derecho de imagen pertenece al museo. Guarda la cámara y simplemente míralo.","tip_en":"The Nefertiti bust cannot be photographed — the image rights belong to the museum. Put the camera away and simply look at it.","lines":"","price_en":"12€ · Reservar con antelación","time_en":"2h","hours_en":"Mar–Dom 10:00–18:00 (jue hasta 20:00) · Cerrado lunes","search":"Neues Museum","search_en":"Neues Museum"},{"day":"d4","name":"Berliner Dom","name_en":"Berliner Dom","type":"spot","intensity":1,"isFriki":false,"icon":"1706","lat":52.5190608,"lng":13.401078,"maps":"https://maps.google.com/?cid=8650967201218530044","price":"9€ (incluye cúpula)","time":"45–60 min","hours":"Lun–Sáb 10:00–18:00 · Dom 12:00–18:00","rating":"","desc":"La catedral protestante de Berlín (1894–1905), mausoleo de la dinastía Hohenzollern. La cúpula (270 escalones) da las mejores vistas sobre la Isla de los Museos. La cripta con 90 sarcófagos imperiales es el espacio más inquietante.","desc_en":"Berlin's Protestant cathedral (1894–1905), mausoleum of the Hohenzollern dynasty. The dome (270 steps) gives the best views over Museum Island. The crypt with 90 imperial sarcophagi is the most unsettling space.","tip":"","tip_en":"","lines":"","price_en":"9€ (incluye cúpula)","time_en":"45–60 min","hours_en":"Lun–Sáb 10:00–18:00 · Dom 12:00–18:00","search":"Berliner Dom","search_en":"Berliner Dom"},{"day":"d4","name":"World Time Clock","name_en":"World Time Clock","type":"spot","intensity":2,"isFriki":false,"icon":"1599","lat":52.5211743,"lng":13.413297,"maps":"https://maps.google.com/?cid=17404699169139791896","price":"Gratis","time":"5–10 min","hours":"","rating":"","desc":"La Weltzeituhr (Reloj Mundial) de 1969, diseñada por Erich John. Muestra la hora en 148 ciudades del mundo. Punto de encuentro clásico de Berlín desde la era de la RDA.","desc_en":"The Weltzeituhr (World Time Clock) from 1969, designed by Erich John. Shows the time in 148 cities worldwide. Berlin's classic meeting point since the GDR era.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"5–10 min","hours_en":"","search":"World Time Clock","search_en":"World Time Clock"},{"day":"d4","name":"Haus des Lehrers","name_en":"Haus des Lehrers","type":"spot","intensity":2,"isFriki":false,"icon":"1535","lat":52.5211536,"lng":13.4161377,"maps":"https://maps.google.com/?cid=8961295786117511652","price":"Gratis exterior","time":"10–15 min","hours":"","rating":"","desc":"Bloque de 12 plantas con friso mural de mosaico de 125 metros que rodea todo el edificio — uno de los ejemplos más espectaculares del muralismo socialista realista de la RDA (1964).","desc_en":"12-storey block with a 125-metre mosaic mural frieze running around the entire building — one of the most spectacular examples of GDR socialist realist muralism (1964).","tip":"","tip_en":"","lines":"","price_en":"Gratis exterior","time_en":"10–15 min","hours_en":"","search":"Haus des Lehrers","search_en":"Haus des Lehrers"},{"day":"d4","name":"Alexanderplatz","name_en":"Alexanderplatz","type":"spot","intensity":2,"isFriki":false,"icon":"1580","lat":52.5219814,"lng":13.413306,"maps":"https://maps.google.com/?cid=3529698146708100718","price":"Torre TV 23€ (reservar online)","time":"30–45 min plaza · 1h torre","hours":"Torre diario 9:00–24:00","rating":"","desc":"La gran plaza de la Berlín Oriental: la Weltzeituhr (1969), la Torre de TV (368m, el edificio más alto de Alemania). La Torre fue apodada \"la venganza del Papa\" — al sol aparece una cruz en la esfera.","desc_en":"The great East Berlin square: the Weltzeituhr (1969), the TV Tower (368m, Germany's tallest building). The Tower was nicknamed \"the Pope's revenge\" — in sunlight a cross appears on the sphere.","tip":"Reservar la Torre online para evitar colas de 1–2h. Salida correcta del metro: cualquier salida lleva a la plaza.","tip_en":"Book the Tower online to avoid 1–2h queues. Any metro exit leads to the square.","lines":"","price_en":"Torre TV 23€ (reservar online)","time_en":"30–45 min plaza · 1h torre","hours_en":"Torre diario 9:00–24:00","search":"Alexanderplatz","search_en":"Alexanderplatz"},{"day":"d4","name":"TRANSBORDO: Mitte → Kreuzberg","name_en":"TRANSFER: Mitte → Kreuzberg","type":"transport","intensity":1,"isFriki":false,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=1354297054809486968","price":"","time":"","hours":"","rating":"","desc":"Dirección Herrmannstraße → U Kottbusser Tor · 25 min","desc_en":"Direction Herrmannstraße → U Kottbusser Tor · 25 min","tip":"","tip_en":"","lines":"U8 desde Alexanderplatz","price_en":"","time_en":"","hours_en":"","search":"TRANSBORDO: Mitte → Kreuzberg","search_en":"TRANSFER: Mitte → Kreuzberg"},{"day":"d4","name":"Mural Cosmonauta — RAW","name_en":"Cosmonaut Mural — RAW","type":"spot","intensity":3,"isFriki":true,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=11872852261414932739","price":"Gratis","time":"10–15 min","hours":"","rating":"","desc":"El mural más emblemático de Kreuzberg — cosmonauta de 17 metros del artista Victor Ash (2007). Uno de los pocos street art de Berlín que resiste la gentrificación.","desc_en":"Kreuzberg's most iconic mural — 17-metre cosmonaut by artist Victor Ash (2007). One of the few Berlin street arts that resists gentrification.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"10–15 min","hours_en":"","search":"Mural Cosmonauta — RAW","search_en":"Cosmonaut Mural — RAW"},{"day":"d4","name":"KÖNIG GALERIE","name_en":"KÖNIG GALERIE","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5006336,"lng":13.4009082,"maps":"https://maps.google.com/?cid=5254278311125542990","price":"Gratis","time":"30–45 min","hours":"Mar–Sáb 11:00–18:00 · Cerrado Dom–Lun","rating":"","desc":"Una de las galerías de arte contemporáneo más relevantes de Berlín, en una antigua iglesia brutalista de los años 60. El contraste entre el espacio sagrado y el arte más irreverente es deliberado. Programación de primer nivel.","desc_en":"One of Berlin's most relevant contemporary art galleries, in a former 1960s Brutalist church. The contrast between the sacred space and the most irreverent art is deliberate. Top-level programming.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"Mar–Sáb 11:00–18:00 · Cerrado Dom–Lun","search":"KÖNIG GALERIE","search_en":"KÖNIG GALERIE"},{"day":"d4","name":"Oranienstrasse","name_en":"Oranienstraße","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.5034127,"lng":13.4115769,"maps":"https://maps.google.com/?q=Oranienstra%C3%9Fe,+10+Berlin-Bezirk+Friedrichshain-Kreuzberg,+Deutschland&ftid=0x47a84e2df22c1655:0x57505771a33e43df","price":"Gratis","time":"30–45 min","hours":"24h · Bares desde mediodía","rating":"","desc":"La calle principal del Kreuzberg más político y multicultural. Döner, activismo, bares que llevan décadas sin cambiar y grafiti de calidad en cada fachada. La mezcla de comunidad turca, alternativa de izquierdas y arte callejero es el ADN de Kreuzberg sin filtrar.","desc_en":"The main street of the most political and multicultural Kreuzberg. Döner, activism, bars that haven't changed in decades and quality graffiti on every facade. The mix of Turkish community, left-wing alternative and street art is Kreuzberg's DNA unfiltered.","tip":"El döner de Berlín no tiene nada que ver con el de otras ciudades. Busca los puestos con más berlineses en la cola.","tip_en":"Berlin döner has nothing to do with the ones in other cities. Look for the stalls with the most Berliners in the queue.","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"24h · Bares desde mediodía","search":"Oranienstrasse","search_en":"Oranienstraße"},{"day":"d4","name":"Baerwaldbrücke — Canal Landwehr","name_en":"Baerwaldbrücke — Landwehr Canal","type":"spot","intensity":2,"isFriki":false,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=7849696750480667127","price":"Gratis","time":"20–30 min","hours":"","rating":"","desc":"Paseo por el Landwehrkanal en la parte norte de Kreuzberg. Los canales de Berlín tienen una escala completamente diferente — más lenta, más tranquila. En verano los berlineses se sientan en las orillas.","desc_en":"Walk along the Landwehrkanal in the north of Kreuzberg. Berlin's canals have a completely different scale — slower, quieter. In summer Berliners sit on the banks.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20–30 min","hours_en":"","search":"Baerwaldbrücke — Canal Landwehr","search_en":"Baerwaldbrücke — Landwehr Canal"},{"day":"d4","name":"Görlitzer Park","name_en":"Görlitzer Park","type":"spot","intensity":2,"isFriki":false,"icon":"1720","lat":52.4965928,"lng":13.4374489,"maps":"https://maps.google.com/?cid=17127123756642488859","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"Parque construido sobre las vías de la antigua estación de Görlitz. La arquitectura de la estación desaparecida sigue visible en la topografía del terreno. Ir de día.","desc_en":"Park built on the tracks of the former Görlitz station. The architecture of the vanished station is still visible in the topography of the ground. Go during the day.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Görlitzer Park","search_en":"Görlitzer Park"},{"day":"d4","name":"Paul-Lincke-Ufer","name_en":"Paul-Lincke-Ufer","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.4938964,"lng":13.428662,"maps":"https://maps.google.com/?q=Paul-Lincke-Ufer,+10999+Berlin-Bezirk+Friedrichshain-Kreuzberg,+Deutschland&ftid=0x47a84fb456b4bb5b:0xe388583f8433bc8","price":"Gratis","time":"30 min","hours":"","rating":"","desc":"Paseo arbolado a lo largo del Landwehrkanal en Kreuzberg. Menos concurrido que el Bergmannkiez, con terrazas al borde del canal. La escala doméstica que se necesita al final de un día largo.","desc_en":"Tree-lined walk along the Landwehrkanal in Kreuzberg. Less crowded than Bergmannkiez, with terraces on the canal edge. The domestic scale you need at the end of a long day.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30 min","hours_en":"","search":"Paul-Lincke-Ufer","search_en":"Paul-Lincke-Ufer"},{"day":"d4","name":"Madame Claude","name_en":"Madame Claude","type":"spot","intensity":3,"isFriki":false,"icon":"1535","lat":52.4995184,"lng":13.4372086,"maps":"https://maps.google.com/?cid=1055836003454879016","price":"Consumición desde 4€","time":"Variable","hours":"Desde 19:00 · Mejor tarde","rating":"","desc":"Bar en un antiguo burdel con los muebles en el techo — literalmente. Sillas, mesas y lámparas cuelgan sobre los clientes. Conciertos casi cada noche. El lugar correcto para terminar el día 4.","desc_en":"Bar in a former brothel with the furniture on the ceiling — literally. Chairs, tables and lamps hang above customers. Live music almost every night. The right place to end Day 4.","tip":"","tip_en":"","lines":"","price_en":"Consumición desde 4€","time_en":"Variable","hours_en":"Desde 19:00 · Mejor tarde","search":"Madame Claude","search_en":"Madame Claude"},{"day":"d4","name":"Puente Oberbaum","name_en":"Oberbaumbrücke","type":"spot","intensity":1,"isFriki":false,"icon":"1528","lat":52.502269,"lng":13.4463443,"maps":"https://maps.google.com/?q=Oberbaumbr%C3%BCcke,+10243+Berlin-Bezirk+Friedrichshain-Kreuzberg,+Deutschland&ftid=0x47a84e51c01b3a27:0x1fb2cf9485c491ba","price":"Gratis","time":"20 min","hours":"","rating":"","desc":"Puente de doble nivel sobre el Spree con torres neogóticas de ladrillo rojo. Conectaba Friedrichshain con Kreuzberg — durante la división era frontera entre los dos barrios. Cruzarlo tiene su propio peso histórico.","desc_en":"Double-deck bridge over the Spree with neo-Gothic red brick towers. It connected Friedrichshain and Kreuzberg — during the division it was the border between the two neighbourhoods. Crossing it carries its own historical weight.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"20 min","hours_en":"","search":"Puente Oberbaum","search_en":"Oberbaumbrücke"},{"day":"d4","name":"East Side Gallery","name_en":"East Side Gallery","type":"spot","intensity":2,"isFriki":false,"icon":"1873","lat":52.5050224,"lng":13.4396953,"maps":"https://maps.google.com/?cid=16040671213551429656","price":"Gratis","time":"45–60 min recorrido completo","hours":"","rating":"","desc":"El tramo más largo del Muro conservado — 1.3 km a lo largo del Spree — con murales de artistas de 21 países (1990). \"My God, Help Me to Survive This Deadly Love\" y \"Test the Rest\" son los más famosos.","desc_en":"The longest surviving Wall stretch — 1.3km along the Spree — with murals by artists from 21 countries (1990). \"My God, Help Me to Survive This Deadly Love\" and \"Test the Rest\" are the most famous.","tip":"Los murales fueron repintados en 2009 por los artistas originales — no son los de 1990. Algunos cambiaron su mensaje radicalmente.","tip_en":"The murals were repainted in 2009 by the original artists — they are not the 1990 ones. Some changed their message radically.","lines":"","price_en":"Gratis","time_en":"45–60 min recorrido completo","hours_en":"","search":"East Side Gallery","search_en":"East Side Gallery"},{"day":"d4","name":"RAW-Gelände","name_en":"RAW-Gelände","type":"spot","intensity":3,"isFriki":false,"icon":"1873","lat":52.5076567,"lng":13.452028,"maps":"https://maps.google.com/?cid=5002856006054467230","price":"Gratis recinto · Clubs de pago","time":"30–45 min","hours":"","rating":"","desc":"Antiguo taller ferroviario de la RDA reconvertido en espacio cultural autogestionado. Clubs, skate, escalada, bares y mercadillo de pulgas los fines de semana. El ejemplo más claro de la Berlín que se resiste a convertirse en otra cosa.","desc_en":"Former GDR railway workshop converted into a self-managed cultural space. Clubs, skate, climbing, bars and a flea market at weekends. The clearest example of the Berlin that resists becoming something else.","tip":"","tip_en":"","lines":"","price_en":"Gratis recinto · Clubs de pago","time_en":"30–45 min","hours_en":"","search":"RAW-Gelände","search_en":"RAW-Gelände"},{"day":"d4","name":"LLEGADA D4: Warschauer Straße","name_en":"END D4: Warschauer Straße","type":"transport","intensity":1,"isFriki":false,"icon":"1626","lat":52.5064379,"lng":13.4500663,"maps":"https://maps.google.com/?cid=2878627803550951524","price":"","time":"","hours":"","rating":"","desc":"East Side Gallery a 200m al oeste · RAW-Gelände a 5 min al norte","desc_en":"East Side Gallery 200m west · RAW-Gelände 5 min north","tip":"","tip_en":"","lines":"U1 · S3 · S5 · S7 · S9","price_en":"","time_en":"","hours_en":"","search":"LLEGADA D4: Warschauer Straße","search_en":"END D4: Warschauer Straße"},{"day":"opt","name":"Treptower Park — Memorial soviético","name_en":"Treptower Park — Soviet Memorial","type":"spot","intensity":2,"isFriki":false,"icon":"1598","lat":52.4861394,"lng":13.4719577,"maps":"https://maps.google.com/?cid=206260230201420864","price":"Gratis","time":"45–60 min","hours":"","rating":"","desc":"El mayor monumento a los caídos soviéticos en Europa: un soldado de 12 metros sosteniendo a un niño alemán y aplastando una esvástica. Aquí están enterrados 7.000 soldados del Ejército Rojo. La escala y el silencio son completamente diferentes al memorial del Tiergarten.","desc_en":"The largest monument to fallen Soviet soldiers in Europe: a 12-metre soldier holding a German child and crushing a swastika. 7,000 Red Army soldiers are buried here. The scale and silence are completely different to the Tiergarten memorial.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"45–60 min","hours_en":"","search":"Treptower Park — Memorial soviético","search_en":"Treptower Park — Soviet Memorial"},{"day":"opt","name":"David Hasselhoff Museum","name_en":"David Hasselhoff Museum","type":"spot","intensity":2,"isFriki":false,"icon":"1636","lat":52.5301333,"lng":13.401922,"maps":"https://maps.google.com/?cid=5512815429596227913","price":"Pequeña entrada","time":"20–30 min","hours":"","rating":"","desc":"Museo dedicado al papel de The Hoff en la caída del Muro. Actuó en el Muro en Nochevieja de 1989 y su \"Looking for Freedom\" era el himno del momento en Alemania. El museo es pequeño, irónico y perfectamente autoconsciente de su absurdidad.","desc_en":"Museum dedicated to The Hoff's role in the fall of the Wall. He performed on the Wall on New Year's Eve 1989 and his \"Looking for Freedom\" was the anthem of the moment in Germany. The museum is small, ironic and perfectly self-aware of its own absurdity.","tip":"","tip_en":"","lines":"","price_en":"Pequeña entrada","time_en":"20–30 min","hours_en":"","search":"David Hasselhoff Museum","search_en":"David Hasselhoff Museum"},{"day":"opt","name":"Teufelsberg — estación espía","name_en":"Teufelsberg — Spy Station","type":"spot","intensity":2,"isFriki":false,"icon":"1535","lat":52.4972222,"lng":13.2411111,"maps":"https://maps.google.com/?cid=4584605150754309357","price":"Aprox. 10–12€","time":"2–3h","hours":"","rating":"","desc":"Colina artificial de 120 metros construida sobre los escombros de guerra de Berlín y una escuela de la Wehrmacht que no pudo ser demolida. En la cima, la NSA y la CIA instalaron una estación de escucha durante la Guerra Fría. Las cúpulas blancas aún están en pie.","desc_en":"120-metre artificial hill built on Berlin's war rubble and a Wehrmacht school that couldn't be demolished. At the top, the NSA and CIA installed a listening station during the Cold War. The white domes are still standing.","tip":"Lejos del transporte público. Llevar agua y comida — no hay restaurante en la cima.","tip_en":"Far from public transport. Bring water and food — no restaurant at the top.","lines":"","price_en":"Aprox. 10–12€","time_en":"2–3h","hours_en":"","search":"Teufelsberg — estación espía","search_en":"Teufelsberg — Spy Station"},{"day":"opt","name":"Friedhof Grunewald-Forst","name_en":"Friedhof Grunewald-Forst","type":"spot","intensity":2,"isFriki":false,"icon":"1542","lat":52.4926992,"lng":13.2108029,"maps":"https://maps.google.com/?cid=12529327997626263102","price":"Gratis","time":"30–45 min","hours":"","rating":"","desc":"El cementerio de los suicidas: enterraba exclusivamente a personas que se habían quitado la vida. Panteones del XIX con esculturas de mármol de Carrara cubiertas de musgo. Atmósfera de bosque silencioso y denso.","desc_en":"The suicide cemetery: it buried exclusively people who had taken their own lives. 19th-century vaults with Carrara marble sculptures covered in moss. Silent, dense forest atmosphere.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"30–45 min","hours_en":"","search":"Friedhof Grunewald-Forst","search_en":"Friedhof Grunewald-Forst"},{"day":"opt","name":"Jardines del Mundo (Marzahn)","name_en":"Gardens of the World (Marzahn)","type":"spot","intensity":2,"isFriki":false,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=1565971157985297126","price":"Aprox. 6€","time":"2–3h","hours":"Diario desde 9:00","rating":"","desc":"El segundo jardín botánico más grande de Berlín: jardines de 14 culturas distintas — chino, japonés, balinés, italiano, coreano. En los bloques de pisos de la periferia de la RDA. El contraste entre la arquitectura soviética y los jardines es único.","desc_en":"Berlin's second largest botanical garden: gardens from 14 different cultures — Chinese, Japanese, Balinese, Italian, Korean. Among the housing blocks of the GDR periphery. The contrast between Soviet architecture and the gardens is unique.","tip":"","tip_en":"","lines":"","price_en":"Aprox. 6€","time_en":"2–3h","hours_en":"Diario desde 9:00","search":"Jardines del Mundo (Marzahn)","search_en":"Gardens of the World (Marzahn)"},{"day":"opt","name":"Weißensee Cemetery","name_en":"Weißensee Cemetery","type":"spot","intensity":2,"isFriki":false,"icon":"","lat":"","lng":"","maps":"https://maps.google.com/?cid=7819966748949613956","price":"Gratis","time":"1h","hours":"Lun–Jue 8:00–17:00 · Vie 8:00–15:00 · Dom 8:00–17:00 · Cerrado sábados","rating":"","desc":"El cementerio judío más grande de Europa, con 115.000 tumbas. Sobrevivió intacto a la guerra — los nazis no lo destruyeron. Las tumbas de finales del XIX con esculturas Art Nouveau son de una belleza excepcional.","desc_en":"Europe's largest Jewish cemetery, with 115,000 graves. It survived the war intact — the Nazis didn't destroy it. The late-19th-century graves with Art Nouveau sculptures are of exceptional beauty.","tip":"","tip_en":"","lines":"","price_en":"Gratis","time_en":"1h","hours_en":"Lun–Jue 8:00–17:00 · Vie 8:00–15:00 · Dom 8:00–17:00 · Cerrado sábados","search":"Weißensee Cemetery","search_en":"Weißensee Cemetery"}]};window
