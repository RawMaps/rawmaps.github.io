<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141512" id="tc">
<script>(function(){var t;try{t=localStorage.getItem("rm-theme")}catch(e){}if(!t)t=matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RawMaps">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>RawMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Modo paseo: mapa MyMaps bloqueado arriba, ficha abajo con tres alturas, navegación en la zona del pulgar.
   Estilo: design-tokens.json (Stillo): negro oliva, crema, salvia. Una sola fuente, DM Sans. */
:root{
  --bg:#141512; --surface:#1e1f1b; --raised:#2a2b26; --line:rgba(236,232,218,.09); --line2:rgba(236,232,218,.16);
  --ink:#ece8da; --ink2:#b4b0a3; --ink3:#7e7b71;
  --cream:#e4e2d3; --on-cream:#141512; --sage:#a4af6b; --sage-soft:rgba(164,175,107,.16);
  --warn:#e0a458; --warn-soft:rgba(224,164,88,.13); --rain:#8db8c4; --rain-soft:rgba(141,184,196,.13);
  --f:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f0e8; --surface:#fbfaf6; --raised:#e6e3d8; --line:rgba(28,29,25,.09); --line2:rgba(28,29,25,.18);
  --ink:#1c1d19; --ink2:#55564d; --ink3:#8a897e;
  --cream:#23251f; --on-cream:#f2f0e8; --sage:#6b7836; --sage-soft:rgba(107,120,54,.13);
  --warn:#b0601a; --warn-soft:rgba(176,96,26,.10); --rain:#3a7787; --rain-soft:rgba(58,119,135,.10);
  color-scheme:light;
}
:root[data-theme="light"] body{background:#e4e1d6}
:root[data-theme="light"] .here,:root[data-theme="light"] .mcb{background:rgba(251,250,246,.9)}
:root[data-theme="light"] .hero .ct{background:rgba(251,250,246,.85)}
:root[data-theme="light"] #sheet{box-shadow:0 -10px 30px rgba(28,29,25,.12)}
:root[data-theme="light"] .go{box-shadow:0 8px 22px rgba(28,29,25,.25)}
:root[data-theme="light"] .rainplan,:root[data-theme="light"] .rain{border-color:rgba(58,119,135,.22)}
:root[data-theme="light"] .stat.ed{border-color:rgba(107,120,54,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none} *::-webkit-scrollbar{display:none} [hidden]{display:none!important}
html,body{height:100%;margin:0} body{background:#0c0d0b;color:var(--ink);font:400 15px/1.5 var(--f);font-feature-settings:"tnum" 1;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit} button{cursor:pointer;border:0;background:none;padding:0} a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
svg{flex:0 0 auto}

#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* cabecera */
#hd{flex:0 0 auto;padding:calc(var(--st) + 12px) 16px 0;background:var(--bg);z-index:20}
.hrow{display:flex;align-items:center;gap:8px;height:42px}
.brand{flex:1;min-width:0}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.trip{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.cb svg{width:18px;height:18px}
.cb[aria-pressed="true"]{background:var(--rain-soft);border-color:var(--rain);color:var(--rain)}
#days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;margin:0 -16px}
.dc{flex:0 0 auto;height:38px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.dc b{font-weight:700;color:var(--ink)}
.dc[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--sage)} .dc[aria-pressed="true"] b{color:var(--sage)}
.dc .fl{width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* escenario: mapa */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--surface)}
#mframe{position:absolute;left:0;right:0;width:100%;border:0;opacity:0;transition:opacity .35s}
#mframe.vis{opacity:1}
#lock{position:absolute;inset:0;z-index:2;cursor:pointer}
.mtop{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:flex;align-items:center;gap:8px;pointer-events:none}
.mtop>*{pointer-events:auto}
.here{flex:1;min-width:0;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 6px;border-radius:999px;background:rgba(20,21,18,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.here .n{flex:0 0 auto;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--sage);color:var(--on-cream);font-size:12.5px;font-weight:700}
.here .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcb{width:42px;height:42px;border-radius:50%;background:rgba(20,21,18,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.mcb svg{width:18px;height:18px}
.go{position:absolute;right:12px;z-index:4;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 16px;border-radius:999px;background:var(--cream);color:var(--on-cream);font-weight:700;font-size:14.5px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.go svg{width:17px;height:17px}
.noMap{position:absolute;left:0;right:0;top:64px;display:grid;place-items:center;padding:16px 28px;text-align:center;color:var(--ink2);font-size:13.5px}
.noMap b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}

/* ficha */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--line);box-shadow:0 -12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;height:var(--sh,56%);transition:height .22s ease}
#sheet.drag{transition:none}
.grip{flex:0 0 auto;padding:10px 0 4px;touch-action:none;cursor:grab}
.grip i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto}
.nav{flex:0 0 auto;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px;padding:4px 16px 12px}
.nb{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.nb.nx{background:var(--cream);color:var(--on-cream);border-color:var(--cream)}
.nb svg{width:22px;height:22px} .nb:disabled{opacity:.3}
.prog{position:relative;height:46px;touch-action:none;cursor:pointer}
.prog .ln{position:absolute;left:12px;right:12px;top:16px;height:4px;border-radius:2px;background:var(--raised)}
.prog .fill{position:absolute;left:12px;top:16px;height:4px;border-radius:2px;background:var(--sage)}
.prog .dots{position:absolute;left:12px;right:12px;top:0;height:36px}
.prog .dt{position:absolute;top:13px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--raised);border:2px solid var(--bg)}
.prog .dt.done{background:var(--sage)}
.prog .dt.cur{top:7px;width:22px;height:22px;margin-left:-11px;background:var(--sage);border:5px solid var(--sage-soft);background-clip:padding-box}
.prog .ct{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink3)}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px calc(var(--sb) + 28px)}

/* piezas comunes */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--sage)}
h2{font-weight:700;font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 12px;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-size:12.5px;font-weight:600}
.tag.w{background:var(--warn-soft);color:var(--warn)} .tag.n{background:var(--surface);color:var(--ink2)}
.tag svg{width:13px;height:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.srow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:0 0 14px;padding:14px 4px}
.srow>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:0 6px;border-left:1px solid var(--line)}
.srow>div:first-child{border-left:0}
.srow svg{width:18px;height:18px;color:var(--ink3)}
.srow b{font-size:14.5px;font-weight:700;line-height:1.2}
.srow span{font-size:11.5px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 10px}
.stat{padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.stat .k svg{width:14px;height:14px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}
.stat.ed{background:var(--sage-soft);border-color:rgba(164,175,107,.35)} .stat.ed .k{color:var(--sage)}
.stat select{appearance:none;-webkit-appearance:none;width:100%;background:transparent;border:0;color:var(--ink);font:700 24px/1.1 var(--f);letter-spacing:-.02em;padding:0;cursor:pointer}
.stat select option{background:var(--surface);font-size:16px}
.stat.ed small{color:var(--sage)}
.rnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:0 0 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.rnote svg{width:17px;height:17px;color:var(--ink3);margin-top:1px}
.rnote b{color:var(--ink);font-weight:600}
.alerts{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.alerts li{display:flex;gap:10px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--ink2)}
.alerts li svg{width:17px;height:17px;margin-top:1px;color:var(--ink3)}
.alerts li.w{background:var(--warn-soft);border-color:rgba(224,164,88,.25);color:var(--ink)} .alerts li.w svg{color:var(--warn)}
.alerts b{font-weight:600;color:var(--ink)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);gap:4px;margin:0 0 14px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--on-cream)}
.seg .rn[aria-pressed="true"]{background:var(--rain);color:var(--on-cream)}
.rainplan{margin:0 0 14px;border-radius:20px;background:var(--rain-soft);border:1px solid rgba(141,184,196,.25);overflow:hidden}
.rainplan summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:600;font-size:14px;color:var(--rain);cursor:pointer}
.rainplan summary::-webkit-details-marker{display:none}
.rainplan summary svg{width:17px;height:17px} .rainplan summary .ch{margin-left:auto;transition:transform .2s}
.rainplan[open] summary .ch{transform:rotate(90deg)}
.rainplan ul{margin:0;padding:0 16px 14px 43px;display:grid;gap:8px;font-size:13.5px;color:var(--ink)}
.rainplan li b{font-weight:600}
.sect{display:flex;align-items:baseline;justify-content:space-between;font-size:16px;font-weight:700;margin:20px 0 10px}
.sect span{font-size:12.5px;font-weight:500;color:var(--ink3)}
/* línea de tiempo */
.tl{position:relative;display:grid;gap:0}
.tl .row{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:0 0 4px;text-align:left;width:100%}
.tl .row::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:2px;background:var(--raised)}
.tl .row:last-child::before{display:none}
.tl .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);font-size:13px;font-weight:700;z-index:1}
.tl .num.meal{background:var(--raised);color:var(--ink2)} .tl .num svg{width:14px;height:14px}
.tl .num.home{background:var(--raised);color:var(--ink2)}
.tl .bx{padding:4px 0 14px;min-width:0}
.tl .t{font-size:12.5px;font-weight:600;color:var(--sage)}
.tl .t .w{color:var(--warn)}
.tl .nm{display:block;font-weight:600;font-size:15px;line-height:1.3;margin-top:1px}
.tl .s{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.tl .leg{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;margin-top:6px}
.tl .leg svg{width:13px;height:13px}
.tl .row.end .nm{color:var(--ink2);font-weight:500}
/* ficha de parada */
.hero{position:relative;display:block;width:100%;aspect-ratio:16/11;border-radius:24px;overflow:hidden;background:var(--surface);margin:0 0 12px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ld{display:grid;place-items:center;height:100%;color:var(--ink3);font-size:13px}
.hero .ct{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);background:rgba(20,21,18,.75);backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px}
.hero .ct svg{width:13px;height:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px}
.thumbs button{flex:0 0 72px;height:72px;border-radius:16px;overflow:hidden;background:var(--surface);border:2px solid transparent;opacity:.6;transition:opacity .15s}
.thumbs button.on{border-color:var(--sage);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.meta{font-size:13px;font-weight:600;color:var(--sage)} .meta .w{color:var(--warn)}
p.why{margin:0 0 14px;font-size:15.5px;line-height:1.6;color:var(--ink)}
.rain{display:flex;gap:10px;margin:0 0 14px;padding:14px 16px;border-radius:20px;background:var(--rain-soft);border:1px solid rgba(141,184,196,.25);font-size:14px;color:var(--ink)}
.rain svg{width:18px;height:18px;color:var(--rain);margin-top:2px}
.rain b{color:var(--rain);font-weight:600}
.body{display:flex;flex-direction:column} .rainon .body .rain{order:-1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);margin:0 0 10px}
.btn svg{width:17px;height:17px}
.next{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:13px;color:var(--ink3)}
.next b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin-top:2px}
.next .ar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--on-cream);display:grid;place-items:center}
.next .ar svg{width:18px;height:18px}

/* capas */
.ov{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ovh{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 12px) 16px 10px}
.ovh .t{flex:1;font-weight:700;font-size:17px;text-align:center;margin-right:54px}
.ovb{flex:1;min-height:0;overflow-y:auto;padding:4px 16px calc(var(--sb) + 30px)}
#fullmap{flex:1;border:0;width:100%}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.drow .d{font-size:22px;font-weight:700;text-align:center;line-height:1} .drow .d small{display:block;font-size:11.5px;font-weight:500;color:var(--ink3);margin-top:3px}
.drow .nm{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.drow .s{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.drow svg{width:18px;height:18px;color:var(--ink3)}
.drow.on{border-color:var(--sage)}
.vw{position:fixed;inset:0;z-index:2000;background:#0c0d0b;color:var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.vw .top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 12px) 16px 10px;gap:10px;font-size:13.5px;font-weight:600}
.vw .stg{position:relative;min-height:0;overflow:hidden}
.vw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vw .cap{padding:10px 16px calc(var(--sb) + 16px);text-align:center;font-size:12px;color:var(--ink3)}
.vw .cap a{color:var(--ink3)}
.vw .ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,21,18,.7);color:var(--ink);display:grid;place-items:center}
.vw .ar svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- home ---------- */
#home{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 32px);z-index:30}
.hhd{display:flex;align-items:center;gap:8px;height:42px}
.hhd .logo{flex:1}
.hello{margin:18px 0 18px}
.hello .eyebrow{color:var(--ink3);font-weight:500}
.hello h1{font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px}
.hello p{margin:0;color:var(--ink2);font-size:15px}
.feat{position:relative;display:block;width:100%;text-align:left;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin:0 0 26px;color:#f2efe4}
.feat .ph{position:relative;aspect-ratio:4/3.6;background:linear-gradient(160deg,#3a3d2c,#1b1c18)}
.feat .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,11,.15) 0%,rgba(12,13,11,0) 30%,rgba(12,13,11,.55) 62%,rgba(12,13,11,.92) 100%)}
.feat .top{position:absolute;top:14px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:rgba(20,21,18,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;font-weight:600;color:#f2efe4;border:1px solid rgba(242,239,228,.14)}
.pill.sage{background:rgba(164,175,107,.9);color:#141512;border-color:transparent}
.pill svg{width:13px;height:13px}
.feat .bot{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.feat .kick{font-size:12.5px;font-weight:600;color:#c9d08f}
.feat h3{margin:4px 0 2px;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.feat .sub{font-size:14px;color:rgba(242,239,228,.78)}

sáb 8-14h · confirma el 31", "rating": "", "text": "Mercado de hierro y cristal de principios del siglo XX. La mañana del 31 se llena de gente del barrio comprando para la cena: ambiente de verdad, no de turistas.", "tip": "", "rain": "Cubierto.", "tags": ["ver"], "opt": false, "close": "", "nightOk": false, "name_en": "Mercado de la Esperanza", "when_en": "", "price_en": "Free", "hours_en": "Mon-Sat 8-14h · check on the 31st", "text_en": "An iron-and-glass market from the early 20th century. On the morning of the 31st it fills with locals shopping for dinner: the real thing, not a tourist show.", "tip_en": "", "rain_en": "Covered."}, {"id": "botin", "name": "Jardines de Pereda y Centro Botín", "ll": [43.4608, -3.8058], "q": "Jardines de Pereda Santander", "when": "", "meal": false, "min": 40, "price": "Jardines y exterior gratis", "hours": "Al aire libre · con luz", "rating": "", "text": "Los jardines frente a la bahía y, pegado a ellos, el edificio de Renzo Piano volado sobre el agua, con pasarelas públicas por fuera. De ahí, por el paseo de Pereda hasta Puertochico.", "tip": "Las pasarelas de fuera son gratis: no hace falta entrar.", "rain": "Soportales del paseo de Pereda.", "tags": [], "opt": false, "close": "", "nightOk": false, "name_en": "Pereda Gardens and Centro Botín", "when_en": "", "price_en": "Gardens and outside free", "hours_en": "Outdoors · in daylight", "text_en": "The gardens facing the bay and, right next to them, Renzo Piano's building cantilevered over the water, with public walkways outside. From there, along Paseo de Pereda to Puertochico.", "tip_en": "The outside walkways are free: no need to go in.", "rain_en": "The arcades of Paseo de Pereda."}, {"id": "m31bombi", "name": "Comida en La Bombi (Santander)", "ll": [43.4645, -3.804], "q": "La Bombi Santander", "when": "Comida · 14:00", "meal": true, "min": 120, "price": "Verificar (reseñas: buena calidad-precio)", "hours": "", "rating": "", "text": "Marisco y pescado clásico de Santander. Call ry with no frost. If it freezes, move it to the 28th."}, {"t": "🌙 Dark by ~17:50-17:55", "d": "Do the outdoor things first. The caves don't depend on daylight."}, {"t": "📅 Monday 28 · wildcard", "d": "Caves and museums are closed: today is the source of the Asón and Santillana, all outdoors. If the 25th or 27th was frosty, use the 28th for that day."}, {"t": "🎄 Holidays 24, 25, 31 and 1", "d": "Special opening hours everywhere: check each place the day before."}, {"t": "🌡 Caves at 9-14 ºC", "d": "Bring a layer even if it's nice outside."}, {"t": "⛽ Fuel", "d": "~2,010 km over the whole trip, about €209 (6.5 L/100 · €1.60/L)."}]}, {"h": "🍽️ EATING IN CANTABRIA", "rows": [{"t": "🍲 Cocido montañés (mountain stew)", "d": "White beans, cabbage and cured meats. The inland dish: Bárcena Mayor is a good place for it."}, {"t": "🐟 Anchovies and rabas", "d": "Santoña anchovies and battered squid: the coastal stuff."}, {"t": "🧈 Sobaos and quesada pasiega", "d": "Sweets from the Pas valley. For breakfast or the picnic on the 25th."}]}], "when": 2026.12, "year": 2026}, {"id": "oporto", "kind": "city", "title": "Oporto", "sub": "Fachadas, río y vino", "country": "Portugal", "coverQ": "Ribeira Porto Douro", "status": "done", "datesLabel": "Miércoles a domingo · 5 días", "mid": "1T91dxWMKfBNhKL8dihiWo-6d2MBhRmY", "mid_en": "1-eB4uc-XJ1D5V9i7kp4GPfkoaHSoaEI", "title_en": "Porto", "sub_en": "Facades, river and wine", "country_en": "Portugal", "datesLabel_en": "Wednesday to Sunday · 5 days", "antes_en": [{"h": "📋 TICKETS TO BOOK SH", "rows": [{"t": "🍷 Quinta do Crasto / Ramos Pinto / any winery in Vila Nova de Gaia", "d": "Book online several days ahead, especially in high season. → search each winery + \"visit booking\" on Google"}, {"t": "🎵 Casa da Música (if there's a concert during your stay)", "d": "Programme and tickets at casadamusica.com · Price varies by event."}]}, {"h": "🔧 SORT OUT BEFORE", "rows": [{"t": "💳 No-fee card for foreign transactions", "d": "Euro is the official currency, no exchange needed, but avoid your home bank's ATMs if they charge fees."}, {"t": "📱 APPS TO INSTALL", "d": ""}, {"t": "🚇 Andante · Porto", "d": "App from Transportes Intermodais do Porto (TIP), for metro and bus. Alternatively, load your Andante Card directly at the machines."}, {"t": "🗺 Google Maps", "d": "Download offline maps for Porto + Guimarães + Braga before you leave."}]}, {"h": "✈️ GETTING THERE", "rows": [{"t": "Francisco Sá Carneiro Airport (OPO): 11km northeast of the centre.", "d": "Metro line E (purple) → Trindade: ~35 min, direct. The most convenient option. Private cab / taxi: ~20-25 min without traffic, ~25-35€."}]}, {"h": "💡 GOOD TO KNOW", "rows": [{"t": "• Porto is a city of steep hills, break in your shoes before you arrive.", "d": "• The historic centre (Ribeira) has been a UNESCO World Heritage Site since 1996. • Churches close at midday (roughly 13:00-14:30), plan your morning to see them first. • Vila Nova de Gaia is across the Douro River, you cross via the D. Luís I Bridge. • Azulejo tiles are everywhere: facades, churches, São Bento station. Give yourself time to look. • High season: June-September. Crowds in Ribeira and Gaia. Go early or late."}]}, {"h": "🍽️ EATING IN PORTO", "rows": [{"t": "• Francesinha: the hot sandwich with beer and tomato sauce. Heavy. Have it once.", "d": "• Bacalhau (salt cod): in any of its \"365 forms\". Try bacalhau à Brás or à lagareiro. • Pastel de nata: at any bakery, eat it warm. • Douro wines: the reds from the region are excellent. Not just port (the sweet wine). • Mercado do Bolhão: good for breakfast or a midday snack."}]}], "docName": "[ES] Oporto — Fachadas, río y vino de Oporto", "antes": [{"h": "📋 ENTRADAS A RESERVAR", "rows": [{"t": "📚 Livraria Lello · Día 1", "d": "Librería art nouveau de 1906. Entrada 8€ (descontable en compra). Sin reserva no se entra en temporada alta. → lello.pt · Llegar a las 9h si quieres sin cola. [PARA FRIKIS]: J.K. Rowling vivió en Oporto y trabajó de profesora aquí, la escalera inspiró la de Hogwarts."}]}, {"h": "🎯 RESERVAR SI PUEDES", "rows": [{"t": "🍷 Cata de vino en Gaia · Día 3", "d": "Las bodegas se llenan en temporada alta. Reservar online 1-2 días antes en la web de la bodega que elijas. Cada bodega tiene su carácter, comparar precios y horarios antes de elegir."}, {"t": "🎵 Casa da Música · Día 4", "d": "Consultar programa en casadamusica.com la noche anterior. Si hay concierto interesante, comprar online."}]}, {"h": "🔧 GESTIONAR ANTES", "rows": [{"t": "🚗 Alquiler de coche · Día 2", "d": "Reservar coche con antelación para el day trip a Guimarães y Braga. Llevar carnet de conducir. Pedir vía verde para peajes al recoger el coche."}]}, {"h": "📱 APPS A INSTALAR", "rows": [{"t": "🚇 Andante / Porto", "d": "Metro y autobús. Billete único 1.50€ · Día 5.20€. Tarjeta Andante recargable (0.60€ la tarjeta)."}, {"t": "🗺 Google Maps", "d": "Descargar la zona de Oporto offline antes de salir."}]}, {"h": "✈️ LLEGAR", "rows": [{"t": "🛬 OPO → Centro", "d": "Metro línea E (violeta) → Trindade · 35 min · 2€ · Sale cada 30 min. Taxi: 20-25€ · VTC: 12-18€."}]}, {"h": "💡 SABER ANTES", "rows": [{"t": "🌦 Mayo en Oporto", "d": "15-20°C, posibilidad de lluvia. Llevar chubasquero. Los días despejados son perfectos para la Foz y los miradores."}, {"t": "🍺 Superbock, no Sagres", "d": "Superbock es la cerveza de Oporto. Pedir Sagres en un bar portuense levanta suspicacias."}, {"t": "🤝 Propinas", "d": "Restaurante con servicio en mesa: 5-10%. Bares y cafeterías de mostrador: no se espera."}, {"t": "🏚 Azulejos desprendidos", "d": "Los azulejos caídos y las fachadas deterioradas no son descuido, son la estética de la ciudad. Parte del carácter de Oporto es exactamente eso."}, {"t": "💧 Agua del grifo", "d": "Potable y de buena calidad."}]}, {"h": "🍽️ COMER EN OPORTO", "rows": [{"t": "🐟 Bacalhau · variable", "d": "El bacalao es el plato de Portugal. Teóricamente hay 365 formas de prepararlo. Las más habituales: à brás (con huevo y patata paja), com natas (gratinado con nata) y assado (a la brasa)."}, {"t": "🥩 Francesinha · 12-15€", "d": "El sandwich de Oporto: pan tostado, carne, salchicha, jamón, cubierto de queso fundido y salsa de cerveza especiada. Contundente. Original de Oporto, no existe igual en ningún otro lugar."}, {"t": "🐟 Pez a la brasa, Matosinhos · 15-22€", "d": "Dourada, robalo o linguado en brasa de carbón en la Rua Heróis de França. La mejor comida del viaje si se llega con hambre a Matosinhos."}, {"t": "🍷 Vinho Verde · 2-4€ copa", "d": "Vino blanco ligeramente efervescente del norte de Portugal. Fresco, ácido, bajo en alcohol. El acompañamiento natural de cualquier comida en Oporto."}, {"t": "🍷 Porto Tónico · 4-6€", "d": "Vino de Oporto blanco con tónica y hielo. Aperitivo local que los portuenses toman en verano en los bares del río."}]}], "base": null, "days": [{"key": "d1", "big": "1", "small": "mié", "label": "Día 1 · mié", "title": "Llegada · Clérigos · Foz", "zone": "Llegada", "est": "~4–8h", "start": "10:30", "sunset": null, "from": "Iglesia del Carmen y Casa Escondida", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Livraria Lello: 8€ · Reservar online, sin reserva no se entra en temporada alta"]}, {"h": "⏱ ANÁLISIS DE TIEMPO", "lines": ["Día de llegada, diseñado para ser relajado. El núcleo Clérigos cabe en 3-4h. La extensión Foz es 2h más de paseo y transporte."]}, {"h": "🎯 LOS QUE MANDAN", "lines": ["Livraria Lello: llegar en los primeros 30 min de apertura (9h) o habrá cola", "Torre de los Clérigos: mejor mañana, se llena desde las 11h", "Passeio Alegre / Praia do Carneiro: tarde, el atardecer sobre el Atlántico es el cierre del día"]}, {"h": "📋 ELIGE TU INTENSIDAD", "lines": ["Relajado (~4h): Lello → Iglesia del Carmen → Torre Clérigos → Palacio de Cristal → Mirador Bandeirinha", "Normal (~6h): añade Azulejos Vasconcelos, Centro Fotografía, Jardín Chagas, Bombarda, Alfândega", "Intenso (~8h): todo el día con extensión a la Foz (Passeio Alegre + Praia do Carneiro)"]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["9:00h, Livraria Lello (apertura, sin cola)", "9:00h, Torre Clérigos (apertura)", "17:30-19:00h, Passeio Alegre / Praia do Carneiro (atardecer)"]}, {"h": "🍽️ COMIDA", "lines": ["Zona Bombarda-Palacio de Cristal: restaurantes sin turismo masivo. Almorzar entre los dos tramos del día.", "Foz: restaurantes con terraza frente al río para cenar."]}, {"h": "🚌 TRANSPORTE", "lines": ["Vuelta desde la Foz: Bus 500 (Foz → Praça da Liberdade, 20 min) o taxi 8-10€."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Libraria Lello: €8 · Book online, no booking, no entry in high season"]}, {"h": "⏱ TIME BREAKDOWN", "lines": ["Arrival day, designed to be relaxed. The Clérigos core fits in 3-4h. The Foz extension adds 2h of walking and transport."]}, {"h": "🎯 ANCHORS", "lines": ["Livraria Lello: arrive within the first 30 min of opening (9:00) or there will be a queue", "Torre dos Clérigos: best in the morning, gets busy from 11:00", "Passeio Alegre / Praia do Carneiro: late afternoon, the Atlantic sunset is the day's close"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~4h): Lello → Igreja do Carmo → Torre Clérigos → Mirador Bandeirinha", "Normal (~6h): add Vasconcelos tiles, Photography Centre, Chagas Garden, Alfândega", "Full day (~8h): everything plus the Foz extension (Passeio Alegre + Praia do Carneiro)"]}, {"h": "⏰ KEY TIMES", "lines": ["9:00, Livraria Lello (opening, no queue)", "9:00, Torre Clérigos (opening)", "17:30-19:00, Passeio Alegre / Praia do Carneiro (sunset)"]}, {"h": "🍽️ FOOD", "lines": ["Bombarda area: restaurants without the tourist crowd. Lunch between the two halves of the day.", "Foz: riverside terrace restaurants for dinner."]}, {"h": "🚌 GETTING BACK", "lines": ["From Foz: Bus 500 (Foz → Praça da Liberdade, 20 min) or taxi €8-10."]}], "stops": [{"name_en": "Carmo Church & The Hidden House", "text_en": "What looks like one huge church is actually two: the dos Carmelitas (1628, nuns) and the do Carmo (1768, monks). Between them sits a one-metre-wide house, Porto's narrowest, built to keep the nuns and monks from sharing a wall. It was used for secret meetings during the Napoleonic invasion.", "tip_en": "The tiled facade of the Igreja do Carmo (south side) is one of the best in the city. View it from the pavement across the street.", "price_en": "Free exterior · Igreja do Carmo €3", "hours_en": "Exterior 24h · Church Mon-Sat 9:00-18:00", "time_en": "20-30 min", "id": "oporto-d1-0", "name": "Iglesia del Carmen y Casa Escondida", "closed": false, "ll": [41.1473563, -8.6162729], "q": "Iglesia del Carmen y Casa Escondida Porto", "min": 25, "time": "20-30 min", "price": "Gratis exterior · Iglesia do Carmo 3€", "hours": "Exterior 24h · Iglesia Lun-Sáb 9-18h", "rating": "4.7", "web": "", "text": "Lo que parece una sola iglesia enorme son dos: la dos Carmelitas (1628, monjas) y la do Carmo (1768, monjes). Entre ellas hay una casa de 1 metro de ancho, la más estrecha de Oporto, construida para que monjas y monjes no tuvieran pared compartida. Sirvió para reuniones secretas durante la invasión napoleónica.", "tip": "La fachada de azulejos de la Igreja do Carmo (lateral sur) es una de las mejores de la ciudad. Mirarla desde la acera de enfrente.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Tile Panel by Joana Vasconcelos", "text_en": "A large-format contemporary tile panel by Joana Vasconcelos on the facade of the building next to Lello. Public art that updates the Portuguese azulejo tradition. Hard to miss, easy to walk past without knowing who made it.", "tip_en": "Same stop as Lello, look at the facade before joining the queue.", "price_en": "Free · exterior", "hours_en": "24h", "time_en": "5 min", "id": "oporto-d1-1", "name": "Azulejos Painel - Joana Vasconcelos", "closed": false, "ll": [41.1479824, -8.6150086], "q": "Azulejos Painel - Joana Vasconcelos Porto", "min": 5, "time": "5 min", "price": "Gratis · exterior", "hours": "24h", "rating": "", "web": "", "text": "Panel de azulejos contemporáneo de Joana Vasconcelos en la fachada del edificio adyacente a Lello. Arte público de gran formato que actualiza la tradición azulejeira portuguesa. Difícil de no ver pero fácil de pasar sin identificar quién lo hizo.", "tip": "En la misma parada que Lello, mirar la fachada antes de hacer cola.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Livraria Lello (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Lello Bookshop (indoors, ~2 min on foot).", "leg": {"min": 2, "km": 0.1647134064991046, "mode": "walk"}}, {"name_en": "Lello Bookshop", "text_en": "An art nouveau bookshop from 1906: red curved staircase, leaded glass ceiling with the motto 'Decus in Labore'. The interior feels more like a cathedral than a shop. J.K. Rowling lived in Porto 1991-1993 and the Hogwarts connection is popular, though she has denied it.", "tip_en": "Book your ticket in advance, capacity has been controlled since 2017. Arrive in the first 30 min after opening for photos without crowds.", "price_en": "€8 entry (redeemable against a purchase) · Book online", "hours_en": "Mon-Sun 9:00-19:00 · Variable closures, confirm before going", "time_en": "30-45 min", "id": "oporto-d1-2", "name": "Livraria Lello", "closed": false, "ll": [41.1469055, -8.6147746], "q": "Livraria Lello Porto", "min": 40, "time": "30-45 min", "price": "8€ entrada (descontable en compra) · Reservar online", "hours": "Lun-Dom 9-19h · Cierres variables, confirmar", "rating": "4.5", "web": "", "text": "Librería art nouveau de 1906: escalera curva roja, techo de cristal emplomado con el lema 'Decus in Labore'. El interior es más iglesia que tienda. J.K. Rowling vivió en Oporto 1991-1993 y la conexión con Hogwarts es popular aunque ella misma la desmintió.", "tip": "Reservar entrada con antelación, desde 2017 hay control de aforo. Llegar en los primeros 30 min de apertura para fotos sin multitud. Hay cola a todas horas. Se puede ver solo por fuera cuando cierran por la tarde.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 2, "km": 0.15773964675537666, "mode": "walk"}}, {"name_en": "Clérigos Tower", "text_en": "A 76-metre baroque tower (1763) designed by Nicola Nasoni. It was a visual landmark for ships entering the Douro. Climb the 200 steps for the best panoramic view of the historic centre. A great first stop after dropping your luggage, it orients you visually across the whole city.", "tip_en": "Porto's best view for the price. Arrive at 9:00 when it opens, queues build from 11:00. It's a 3-minute walk from Lello.", "price_en": "€8 (includes church and museum)", "hours_en": "Daily 9:00-19:00", "time_en": "45-60 min", "id": "oporto-d1-3", "name": "Torre de los Clérigos", "closed": false, "ll": [41.1456705, -8.6145977], "q": "Torre de los Clérigos Porto", "min": 55, "time": "45-60 min", "price": "8€ (incluye iglesia y museo)", "hours": "Diario 9-19h", "rating": "4.7", "web": "", "text": "Torre barroca de 76 metros (1763) diseñada por Nicola Nasoni. Fue referencia visual para barcos que entraban por el Duero. Subir los 200 escalones para la mejor panorámica del centro histórico. Buen primer punto después de dejar el equipaje, orienta visualmente toda la ciudad desde arriba.", "tip": "La mejor panorámica de Oporto por precio. Llegar a las 9h cuando abre, desde las 11h hay cola. Está a 3 min a pie de Lello.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 2, "km": 0.1795589693896996, "mode": "walk"}}, {"name_en": "Portuguese Centre of Photography", "text_en": "The former Cadeia da Relação (1767-1974): a prison and court of appeal. Ground floor for poor and dangerous inmates, second floor for women, third for wealthy prisoners who could pay for comfort. Camilo Castelo Branco was imprisoned here and wrote 'Amor de Perdição' in his cell. It operated until 1974, the same year Salazar's dictatorship fell. Now a photography museum with the cells as exhibition rooms.", "tip_en": "The spy camera collection, disguised in Pepsi cans and Marlboro packs, is on the 3rd floor. Free and no queues.", "price_en": "Free", "hours_en": "Tue-Fri 10:00-18:00 · Sat-Sun 15:00-19:00 · Closed Monday", "time_en": "45-60 min", "id": "oporto-d1-4", "name": "Centro Portugués de Fotografía", "closed": false, "ll": [41.1445837, -8.615825], "q": "Centro Portugués de Fotografía Porto", "min": 55, "time": "45-60 min", "price": "Gratis", "hours": "Mar-Vie 10-18h · Sáb-Dom 15-19h · Cerrado lunes", "rating": "4.4", "web": "", "text": "La antigua Cadeia da Relação (1767-1974): cárcel y tribunal de apelación. Planta baja para presos pobres y peligrosos, segunda planta mujeres, tercera para ricos que pagaban por comodidad. Camilo Castelo Branco estuvo preso aquí y escribió 'Amor de Perdição' en su celda. Funcionó hasta 1974, el mismo año que cayó la dictadura de Salazar. Hoy museo de fotografía con las celdas como salas.", "tip": "La colección de cámaras espía camufladas (latas de Pepsi, paquetes de Marlboro) está en el 3er piso. Gratis y sin colas.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 3, "km": 0.20622574589734333, "mode": "walk"}}, {"id": "oporto-d1-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [41.1445837, -8.615825], "q": "restaurantes cerca de Centro Portugués de Fotografía Porto", "min": 75, "price": "", "hours": "", "text": "Zona Bombarda-Palacio de Cristal: restaurantes sin turismo masivo. Almorzar entre los dos tramos del día. Foz: restaurantes con terraza frente al río para cenar.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Bombarda area: restaurants without the tourist crowd. Lunch between the two halves of the day. Foz: riverside terrace restaurants for dinner.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "João Chagas Garden", "text_en": "A garden with century-old plane trees and permanently installed contemporary sculptures. The oldest tree is over 200 years old. It surrounds the Centro Português de Fotografia, the former prison.", "tip_en": "A good break between the Clérigos core and the walk towards Bombarda. Shaded benches.", "price_en": "Free", "hours_en": "Daily 8:00-21:00 (until 22:00 in summer)", "time_en": "15 min", "id": "oporto-d1-5", "name": "Jardín de João Chagas", "closed": false, "ll": [41.1459873, -8.6167545], "q": "Jardín de João Chagas Porto", "min": 15, "time": "15 min", "price": "Gratis", "hours": "Diario 8-21h (verano hasta 22h)", "rating": "4.3", "web": "", "text": "Jardín con plátanos centenarios y esculturas de arte contemporáneo instaladas permanentemente. El árbol más antiguo tiene más de 200 años. Rodea el Centro Português de Fotografia, la antigua cárcel.", "tip": "Buena pausa entre el núcleo Clérigos y el paseo hacia Bombarda. Bancos a la sombra.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Carmo Church & The Hidden House (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.2267244727771375, "mode": "walk"}}, {"name_en": "Saúde Viewpoint", "text_en": "An elevated viewpoint over the Douro with views towards the Atlantic estuary. Less crowded than the city centre lookouts. Best at sunset with the light on the river.", "tip_en": "The transition point between the centre and the walk to Foz. From here the riverside path to Passeio Alegre starts, about 4 km.", "price_en": "Free", "hours_en": "24h", "time_en": "15 min", "id": "oporto-d1-6", "name": "Mirador Bandeirinha da Saúde", "closed": false, "ll": [41.1444187, -8.6220592], "q": "Mirador Bandeirinha da Saúde Porto", "min": 15, "time": "15 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Mirador elevado sobre el Duero con vista hacia la desembocadura en el Atlántico. Menos concurrido que los miradores del centro. Mejor al atardecer con la luz sobre el río.", "tip": "Punto de transición entre el centro y el paseo a la Foz. Desde aquí arranca el paseo por la orilla hacia Passeio Alegre, unos 4 km.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Centro Portugués de Fotografía (a cubierto, ~9 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Portuguese Centre of Photography (indoors, ~9 min on foot).", "leg": {"min": 8, "km": 0.6203671795909866, "mode": "walk"}}, {"name_en": "Alfândega · tram stop", "text_en": "🚃 Historic Tram Line 1 (STCP) Direction: Passeio Alegre (towards Foz) · €3.50 · Pay the driver · Cash only · Apr-Sep: 9:00-20:43 · Oct-Mar: 9:30-18:00 · Every 20 min · Alfândega → Passeio Alegre: ~10 min · 4 stops 📍 Passeio Alegre (terminus) is 4 km west, following the river. 🔗 Connections from Alfândega: ➡️ Tram to Foz: Passeio Alegre (4 stops, ~10 min) ⬅️ On foot along the riverside path: Passeio Alegre (4 km, ~50 min, just as nice)", "tip_en": "The tram leaves Infante packed with tourists, it's often full by the time it reaches Alfândega. If there's no space, wait for the next one (20 min) or walk.", "price_en": "", "hours_en": "", "time_en": "", "id": "oporto-d1-7", "name": "Alfândega · parada del eléctrico", "closed": false, "ll": [41.1438776, -8.6220817], "q": "Alfândega — parada del eléctrico Porto", "min": 30, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚃 Tranvía Eléctrico Línea 1 (STCP) Dirección: Passeio Alegre (sentido Foz) · 3.50€ · Se compra al conductor · Solo efectivo · Abr-Sep: 9:00-20:43h · Oct-Mar: 9:30-18:00h · Cada 20 min · Alfândega → Passeio Alegre: ~10 min · 4 paradas 📍 Passeio Alegre (terminal) está a 4 km hacia el oeste siguiendo el río. 🔗 Conexiones desde Alfândega: ➡️ Tranvía hacia Foz: Passeio Alegre (4 paradas, ~10 min) ⬅️ A pie por el paseo fluvial: Passeio Alegre (4 km, ~50 min, igual de bonito)", "tip": "El tranvía sale de Infante lleno de turistas, cuando llega a Alfândega no siempre hay sitio. Si no entra, esperar el siguiente (20 min) o ir caminando.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Centro Portugués de Fotografía (a cubierto, ~9 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Portuguese Centre of Photography (indoors, ~9 min on foot).", "leg": {"min": 0, "km": 0.07825618571229742, "mode": "walk"}}, {"name_en": "Passeio Alegre · tram terminal", "text_en": "🚃 Historic Tram Line 1 (STCP), Terminus Return direction: Infante (towards city centre) · €3.50 · Pay the driver · Cash only · Apr-Sep: 9:00-20:43 · Oct-Mar: 9:30-18:00 · Last tram: ~20:10 · Every 20 min · Passeio Alegre → Infante: ~23 min · 13 stops 📍 A historic garden at the mouth of the Douro. Atlantic waves break on the rocky shore just metres away. End the day here watching the sunset before catching the tram back. 🔗 Connections from Passeio Alegre: ➡️ Tram to city centre: Infante (13 stops, ~23 min) 🚌 Bus 500: Praça da Liberdade (20 min, faster alternative)", "tip_en": "The terminus always has space, minimal queue compared to Infante.", "price_en": "", "hours_en": "", "time_en": "", "id": "oporto-d1-8", "name": "Passeio Alegre · terminal del eléctrico", "closed": false, "ll": [41.1476856, -8.6676701], "q": "Passeio Alegre — terminal del eléctrico Porto", "min": 30, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚃 Tranvía Eléctrico Línea 1 (STCP), Terminal Dirección vuelta: Infante (sentido centro) · 3.50€ · Se compra al conductor · Solo efectivo · Abr-Sep: 9:00-20:43h · Oct-Mar: 9:30-18:00h · Último: ~20:10h · Cada 20 min · Passeio Alegre → Infante: ~23 min · 13 paradas 📍 Jardín histórico en la desembocadura del Duero. Las olas del Atlántico rompen en la costa rocosa a pocos metros. Terminar el día aquí viendo el atardecer antes de coger el tranvía de vuelta. 🔗 Conexiones desde Passeio Alegre: ➡️ Tranvía hacia centro: Infante (13 paradas, ~23 min) 🚌 Bus 500: Praça da Liberdade (20 min, alternativa rápida)", "tip": "Desde el terminal siempre hay sitio, cola mínima comparada con la de Infante.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~75 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Carmo Church & The Hidden House (indoors, ~75 min on foot).", "leg": {"min": 27, "km": 4.992924544279137, "mode": "transit"}}, {"name_en": "Carneiro Beach", "text_en": "An urban beach at the mouth of the Douro. In May the water is cold, but the seafront walk, the lighthouse and the Atlantic waves breaking on the rocks at sunset make it worth the trip.", "tip_en": "Last stop of the day, have dinner at the Foz riverside restaurants before heading back to the centre (Bus 500 direct).", "price_en": "Free", "hours_en": "24h", "time_en": "30-45 min", "id": "oporto-d1-9", "name": "Praia do Carneiro", "closed": false, "ll": [41.1486625, -8.6759133], "q": "Praia do Carneiro Porto", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "Playa urbana en la desembocadura del Duero. En mayo el agua está fría pero el paseo marítimo, el faro y las olas del Atlántico rompiendo en las rocas al atardecer son el punto fotográfico. El tramo de costa desde aquí hacia el norte tiene pocas playas en toda Portugal del norte.", "tip": "Último punto del día, cenar en los restaurantes de la Foz que dan al río antes de volver al centro (bus 500 directo).", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~87 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Carmo Church & The Hidden House (indoors, ~87 min on foot).", "leg": {"min": 12, "km": 0.9083183907234406, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 1 · Wed", "small_en": "Wed", "title_en": "Arrival · Clérigos · Foz"}, {"key": "d2", "big": "2", "small": "jue", "label": "Día 2 · jue", "title": "Sé · Ribeira · Gaia", "zone": "Sé", "est": "~7–9h", "start": "10:30", "sunset": null, "from": "Rua das Flores", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Cata de vino en Gaia: reservar online con 1-2 días de antelación en temporada alta. Graham's tiene mejor terraza, Taylor's mejor tour."]}, {"h": "⏱ ANÁLISIS DE TIEMPO", "lines": ["Día completo y caminado. La zona Sé-Puente-Gaia-Ribeira son ~4 km de recorrido con subidas. Calcular mínimo 7h de visita útil."]}, {"h": "🎯 LOS QUE MANDAN", "lines": ["Catedral: llegar antes de las 10h para el claustro sin grupos", "Cata de vino: hora fija si se reserva con guía → encajar entre las 12h-14h", "Mirador de la Victoria: mejor al atardecer, último punto antes del Passeio das Virtudes"]}, {"h": "📋 ELIGE TU INTENSIDAD", "lines": ["Relajado (~5h): Rua das Flores → Catedral → Puente nivel superior → Gaia miradores → Cais da Ribeira → San Francisco → Mirador Victoria", "Normal (~7h): añade Bolsa, Escadas do Codeçal, cata de vino, Teleférico", "Intenso (~9h): todos los puntos del día"]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["9:00h, Rua das Flores (sin comercios abiertos, solo luz y azulejos)", "9:30h, Catedral (claustro antes de grupos)", "12:00-13:00h, Cata de vino en Gaia (incluye el tour más fresco del día)", "17:30h, Mirador de la Victoria (luz del atardecer sobre el puente)"]}, {"h": "🍽️ COMIDA", "lines": ["Evitar los restaurantes del Cais da Ribeira, precios turísticos. Subir 2 calles por Barredo o Mercadores para encontrar precios locales.", "Gaia: las bodegas tienen cafetería incluida después de la cata."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Wine tasting in Gaia: book online 1-2 days in advance in high season. Graham's has the best terrace, Taylor's the best tour."]}, {"h": "⏱ TIME BREAKDOWN", "lines": ["A full day on foot. The Sé-Bridge-Gaia-Ribeira loop is ~4 km with significant elevation. Allow at least 7 usable hours."]}, {"h": "🎯 ANCHORS", "lines": ["Cathedral: arrive before 10:00 for the cloister without tour groups", "Wine tasting: fixed time if booked with a guide → slot between 12:00-14:00", "Mirador da Vitória: best at sunset"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~5h): Rua das Flores → Cathedral → Bridge upper level → Gaia viewpoints → Cais da Ribeira → São Francisco → Mirador Vitória", "Normal (~7h): add the Bolsa, Escadas do Codeçal, wine tasting, cable car", "Full day (~9h): all points"]}, {"h": "⏰ KEY TIMES", "lines": ["9:00, Rua das Flores (no shops open, just light and tiles)", "9:30, Cathedral (cloister before tour groups)", "12:00-13:00, Wine tasting in Gaia", "17:30, Mirador da Vitória (sunset light on the bridge)"]}, {"h": "🍽️ FOOD", "lines": ["Avoid the Cais da Ribeira restaurants, tourist prices. Walk 2 streets up via Barredo or Mercadores for local prices.", "Gaia: the wineries have a café included after the tasting."]}], "stops": [{"name_en": "Rua das Flores (Flowers Street)", "text_en": "The street in the historic centre with the highest density of tiled facades. Civil architecture from the 18th and 19th centuries in various states of conservation. Best photographed early in the morning before the shops open.", "tip_en": "Enter from the northern end (near São Bento) and head south towards the Ribeira. At 9:00 it's just baristas and locals.", "price_en": "Free", "hours_en": "24h · Shops 10:00-19:00", "time_en": "20-30 min · walk", "id": "oporto-d2-0", "name": "Rua das Flores", "closed": false, "ll": [41.144418, -8.6128125], "q": "Rua das Flores Porto", "min": 25, "time": "20-30 min · paseo", "price": "Gratis", "hours": "24h · Comercios 10-19h", "rating": "4.5", "web": "", "text": "Calle del centro histórico con mayor densidad de azulejos en las fachadas. La arquitectura civil del XVIII y XIX en distintos estados de conservación. Mejor fotografiarla a primera hora de la mañana antes de que abran los comercios.", "tip": "Entrar por el extremo norte (junto a São Bento) y avanzar hacia el sur hacia la Ribeira. A las 9h solo están los baristas y los locales.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~4 min on foot).", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Pena Ventosa Square", "text_en": "A small square in the Sé neighbourhood: narrow streets of Porto's oldest district. Crumbling tiled facades, laundry hanging between windows and local life without tourists, that's the atmosphere.", "tip_en": "The Sé district is unrestored Porto, more authentic and more uncomfortable than the Ribeira. Watch out for wet cobblestones.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min", "id": "oporto-d2-1", "name": "Largo da Pena Ventosa", "closed": false, "ll": [41.1427648, -8.6130808], "q": "Largo da Pena Ventosa Porto", "min": 10, "time": "10 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Plaza pequeña en el barrio de la Sé: calles estrechas del barrio más antiguo de Oporto. Las fachadas con azulejos desprendidos, la ropa tendida entre ventanas y la vida local sin turismo son la atmósfera.", "tip": "El barrio de la Sé es el Oporto sin restaurar, más auténtico y más incómodo que la Ribeira. Cuidado con el pavimento mojado.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.24075382145943583, "mode": "walk"}}, {"name_en": "Aldas Street Viewpoint", "text_en": "A lesser-known viewpoint over the Douro and the Ribeira from the Sé neighbourhood. The view includes the Vila Nova de Gaia wine lodges in the background. Without the crowds of Mirador da Vitória.", "tip_en": "Walk 5 minutes up Rua das Aldas from the Ribeira for a different angle with no queues.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min", "id": "oporto-d2-2", "name": "Mirador de la Rua das Aldas", "closed": false, "ll": [41.1424459, -8.6125828], "q": "Mirador de la Rua das Aldas Porto", "min": 10, "time": "10 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Mirador menos conocido sobre el Duero y la Ribeira desde el barrio de la Sé. La vista incluye las bodegas de Vila Nova de Gaia al fondo. Sin la saturación del Mirador da Vitória.", "tip": "Subir 5 minutos por la Rua das Aldas desde la Ribeira para una perspectiva diferente sin colas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~2 min on foot).", "leg": {"min": 0, "km": 0.07116161407424292, "mode": "walk"}}, {"name_en": "Porto Cathedral", "text_en": "A 12th-century Romanesque cathedral with a 14th-century Gothic cloister covered in 18th-century tiles depicting Ovid's Metamorphoses. The cathedral terrace has the best view of the Sé neighbourhood towards the river. The cloister is worth €3, the tiles are exceptionally well executed.", "tip_en": "Arrive before 10:00 for the cloister without tour groups. The terrace view is free.", "price_en": "Free exterior · Cloister €3", "hours_en": "Mon-Sat 9:00-18:30 · Sun 9:00-12:30 and 14:30-18:30", "time_en": "45-60 min", "id": "oporto-d2-3", "name": "Catedral de Oporto", "closed": false, "ll": [41.1428531, -8.6111165], "q": "Catedral de Oporto Porto", "min": 55, "time": "45-60 min", "price": "Gratis exterior · Claustro 3€", "hours": "Lun-Sáb 9-18:30h · Dom 9-12:30h y 14:30-18:30h", "rating": "4.5", "web": "", "text": "Catedral románica del siglo XII con el claustro gótico del XIV cubierto de azulejos del siglo XVIII que narran Las Metamorfosis de Ovidio. La terraza de la catedral tiene la mejor vista del barrio de la Sé mirando hacia el río. El claustro vale los 3€, los azulejos son de calidad excepcional.", "tip": "Llegar antes de las 10h para el claustro sin grupos. La vista desde la terraza es gratuita.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 2, "km": 0.17012778537290646, "mode": "walk"}}, {"name_en": "Codeçal Stairs", "text_en": "A medieval stairway with tiled houses on both sides, descending from the Sé towards the Ribeira. The most photographed stretch of Porto's oldest neighbourhood. One of the most characterful ways down to the river.", "tip_en": "Morning light hits the stairway from the east. Take it slow, wet cobblestones are slippery.", "price_en": "Free", "hours_en": "24h", "time_en": "10-15 min · descent", "id": "oporto-d2-4", "name": "Escadas do Codeçal", "closed": false, "ll": [41.141952, -8.6097886], "q": "Escadas do Codeçal Porto", "min": 15, "time": "10-15 min · bajada", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "Escalera medieval con casas de azulejo a ambos lados bajando desde la Sé hacia la Ribeira. El tramo más fotografiado del barrio más antiguo de Oporto. Una de las rutas de bajada con más carácter al río.", "tip": "La luz de la mañana ilumina la escalera desde el este. Bajar despacio, el pavimento mojado resbala.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.19458425415837477, "mode": "walk"}}, {"name_en": "Dom Luís I Bridge · upper level", "text_en": "An 1886 iron bridge designed by Théophile Seyrig, a collaborator of Gustave Eiffel. The upper level (45 metres above the river) is for pedestrians and metro. The view over the Douro from the centre of the bridge in both directions is the most complete panorama of the city.", "tip_en": "Walk across to Gaia on the upper level. Return via the lower level (8 metres) after finishing in Gaia, a completely different experience of the same bridge.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min · crossing", "id": "oporto-d2-5", "name": "Puente Don Luis I · nivel superior", "closed": false, "ll": [41.1399589, -8.6094485], "q": "Puente Don Luis I — nivel superior Porto", "min": 20, "time": "15-20 min · cruce", "price": "Gratis", "hours": "24h", "rating": "4.7", "web": "", "text": "El puente de hierro de 1886 diseñado por el colaborador de Gustave Eiffel, Téophile Seyrig. El nivel superior (45 metros sobre el río) es para peatones y metro. La vista sobre el Duero desde el centro del puente en ambas direcciones es la panorámica más completa de la ciudad.", "tip": "Cruzar a pie hacia Gaia por el nivel superior. Volver por el nivel inferior (8 metros) al terminar en Gaia, diferente experiencia del mismo puente.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~6 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~6 min on foot).", "leg": {"min": 4, "km": 0.2904785709683743, "mode": "walk"}}, {"name_en": "Serra do Pilar Monastery & Viewpoint", "text_en": "The circular rotunda of this 16th-century Augustinian monastery is an architectural rarity: both floors, church and cloister, are fully circular. The views from the esplanade over the Ribeira and the Dom Luís I Bridge are the best opposite angle to the Mirador da Vitória.", "tip_en": "The esplanade is Porto's best viewpoint for photographing the bridge with the Ribeira below. No queue, no charge.", "price_en": "Exterior free · Interior €3", "hours_en": "Exterior always open · Visits Tue-Sat 10:00-17:00", "time_en": "30-45 min", "id": "oporto-d2-6", "name": "Monasterio de la Serra do Pilar · mirador", "closed": false, "ll": [41.138298, -8.6075262], "q": "Monasterio de la Serra do Pilar — mirador Porto", "min": 40, "time": "30-45 min", "price": "Exterior gratis · Interior 3€", "hours": "Exterior siempre · Visitas Mar-Sáb 10-17h", "rating": "4.7", "web": "", "text": "La rotonda circular del monasterio agustino del siglo XVI es una rareza arquitectónica: las dos plantas son circulares completas, iglesia y claustro. Las vistas desde la explanada sobre la Ribeira y el Puente Don Luis I son la mejor perspectiva opuesta a la del Mirador da Vitória.", "tip": "La explanada es el mejor mirador de Oporto para fotografiar el puente con la Ribeira al fondo. Sin cola, sin precio.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~7 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~7 min on foot).", "leg": {"min": 4, "km": 0.31849211352176043, "mode": "walk"}}, {"id": "oporto-d2-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [41.138298, -8.6075262], "q": "restaurantes cerca de Monasterio de la Serra do Pilar — mirador Porto", "min": 75, "price": "", "hours": "", "text": "Evitar los restaurantes del Cais da Ribeira, precios turísticos. Subir 2 calles por Barredo o Mercadores para encontrar precios locales. Gaia: las bodegas tienen cafetería incluida después de la cata.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Avoid the Cais da Ribeira restaurants, tourist prices. Walk 2 streets up via Barredo or Mercadores for local prices. Gaia: the wineries have a café included after the tasting.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "Morro Garden Viewpoint", "text_en": "The garden on the Gaia hillside with direct views over the Ribeira. Next to the Monastery. Best at sunset when the light falls on Porto's facades.", "tip_en": "This is where the Gaia cable car starts, if you'd rather descend to the river level without walking.", "price_en": "Free", "hours_en": "24h", "time_en": "20 min", "id": "oporto-d2-7", "name": "Jardim do Morro · mirador", "closed": false, "ll": [41.1371459, -8.6092935], "q": "Jardim do Morro — mirador Porto", "min": 20, "time": "20 min", "price": "Gratis", "hours": "24h", "rating": "4.6", "web": "", "text": "El jardín en la ladera de Gaia con vistas directas a la Ribeira. Junto al Monasterio. Mejor al atardecer cuando la luz cae sobre las fachadas de Oporto.", "tip": "Aquí arranca el Teleférico de Gaia, si se quiere bajar al nivel del río sin andar.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~5 min on foot).", "leg": {"min": 3, "km": 0.2544679943358652, "mode": "walk"}}, {"name_en": "Gaia Cable Car", "text_en": "The cable car descends from the Jardim do Morro esplanade to the Gaia riverside in 5 minutes, passing directly over Porto's wine lodges. The views over the Douro and the bridge during the descent are unique.", "tip_en": "Take it one way down (€6), walk back up if the weather is good. Avoids the steep downhill on foot.", "price_en": "€6 one way · €9 return", "hours_en": "Daily 10:00-20:00 (May-Sep until 22:00)", "time_en": "5 min · ride", "id": "oporto-d2-8", "name": "Teleférico de Gaia", "closed": false, "ll": [41.138002, -8.6095865], "q": "Teleférico de Gaia Porto", "min": 5, "time": "5 min · trayecto", "price": "6€ ida · 9€ ida y vuelta", "hours": "Diario 10-20h (may-sep hasta 22h)", "rating": "4.4", "web": "", "text": "El teleférico baja desde la explanada del Jardim do Morro hasta el borde del río en Gaia en 5 minutos, pasando sobre las bodegas de vino de Oporto. Las vistas sobre el Duero y el puente durante el descenso son únicas.", "tip": "Tomar solo de bajada (6€), subir andando si hace buen tiempo. Evita la bajada a pie por la cuesta empinada. El trayecto de vuelta desde el río es a pie por el nivel inferior del puente.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~4 min on foot).", "leg": {"min": 0, "km": 0.12779710129158528, "mode": "walk"}}, {"name_en": "Vila Nova de Gaia · views, wineries & riverside walk", "text_en": "The south bank of the Douro: Porto's wine lodges line up from the bridge westward. The 'Vila Nova de Gaia' signs on the lodge walls (Sandeman, Graham's, Taylor's, Ramos Pinto) form the city's recognisable skyline as seen from the Ribeira. Wine tasting at the lodges: Main lodges: Graham's (1820), Sandeman (1790), Taylor's (1692). All offer a guided cellar tour with a 2-3 wine tasting included. Port wine is produced in the Douro Valley but aged here, in stone cellars at constant temperature.", "tip_en": "This is where to do the Port wine tasting. The riverside walk from the cable car to the lodges is a 5-minute stroll. Graham's has the best terrace views. Taylor's has the most complete tour. Sandeman is the most famous but the least authentic of the three.", "price_en": "€15-25 depending on lodge and tasting", "hours_en": "Daily 10:00-18:00 · Book ahead in high season", "time_en": "1-1.5h", "id": "oporto-d2-9", "name": "Vila Nova de Gaia · vistas, bodegas y paseo", "closed": false, "ll": [41.1379278, -8.6123656], "q": "Vila Nova de Gaia — vistas, bodegas y paseo Porto", "min": 75, "time": "1-1.5h", "price": "15-25€ según bodega y cata", "hours": "Diario 10-18h · Reservar con antelación en temporada alta", "rating": "4.6 (Graham's) · 4.5 (Sandeman) · 4.7 (Taylor's)", "web": "", "text": "La orilla sur del Duero: las bodegas de vino de Oporto se alinean desde el puente hacia el oeste. El nombre 'Vila Nova de Gaia' en los laterales de las bodegas (Sandeman, Graham's, Taylor's, Ramos Pinto) es el skyline reconocible de la ciudad desde la Ribeira. Cata en las bodegas: Las bodegas principales con cata en Vila Nova de Gaia: Graham's (1820), Sandeman (1790), Taylor's (1692). Todas ofrecen visita guiada por la bodega histórica con cata de 2-3 vinos incluida. El vino de Oporto se produce en el Douro pero envejece aquí, en bodegas de piedra que mantienen temperatura constante.", "tip": "Zona para la cata de vino portugués. El paseo fluvial desde el teleférico hasta las bodegas son 5 minutos a pie. Reservar online la cata básica (la más corta). Graham's tiene las mejores vistas desde su terraza. Taylor's tiene el tour más completo. Sandeman es la más conocida pero la menos auténtica de las tres.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 4, "km": 0.30274280030123174, "mode": "walk"}}, {"name_en": "Half Rabbit (public art installation)", "text_en": "Public sculpture in Vila Nova de Gaia: a giant rabbit cut in half, installed on the riverside promenade. Immediate visual impact in an unexpected setting. The name says it all.", "tip_en": "On the riverside walk between the wine lodges and the bridge. Impossible to miss.", "price_en": "Free", "hours_en": "24h", "time_en": "5 min", "id": "oporto-d2-10", "name": "Mitad de Conejo (instalación Gaia)", "closed": false, "ll": [41.1368792, -8.6150485], "q": "Mitad de Conejo (instalación Gaia) Porto", "min": 5, "time": "5 min", "price": "Gratis", "hours": "24h", "rating": "4.1", "web": "", "text": "Escultura pública en Vila Nova de Gaia: un conejo gigante cortado por la mitad, instalado en el paseo del río. Arte público de impacto visual inmediato en un contexto inesperado. El nombre lo dice todo.", "tip": "En el paseo del río entre las bodegas y el puente. Imposible de perder.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~4 min on foot).", "leg": {"min": 4, "km": 0.3290716082346966, "mode": "walk"}}, {"name_en": "Dom Luís I Bridge · lower level", "text_en": "🚶 On foot, Lower bridge level · 8 m above the river Cross back to Porto on the lower level, a completely different perspective of the same bridge. Closer to the water, more intimate than the 45-metre upper level. The lower level is shared with road traffic but has a pedestrian pavement.", "tip_en": "Return to Porto this way after finishing in Gaia, the contrast with the upper level's height is immediate.", "price_en": "", "hours_en": "", "time_en": "", "id": "oporto-d2-11", "name": "Puente Don Luis I", "closed": false, "ll": [41.1393428, -8.6092769], "q": "Puente Don Luis I Porto", "min": 30, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚶 A pie, Nivel inferior del puente · 8 m sobre el río Cruzar de vuelta hacia Oporto por el nivel inferior, diferente perspectiva del mismo puente. Más cerca del agua, más íntimo que los 45 metros del nivel superior. El nivel inferior es compartido con el tráfico rodado pero tiene acera peatonal.", "tip": "Volver a Oporto por aquí después de terminar en Gaia, el contraste con la altura del nivel superior es inmediato.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Vila Nova de Gaia (indoors, ~5 min on foot).", "leg": {"min": 10, "km": 0.7222390565550696, "mode": "walk"}}, {"name_en": "Ribeira Waterfront", "text_en": "The riverside front: four and five-storey buildings with tiled facades in various states of decay above the Ribeira. The stretch between the Dom Luís I Bridge and the Arrábida Bridge at sunset has the colour that appears in every photo of Porto.", "tip_en": "Walk along the Cais looking towards Gaia, the reverse perspective (from the river towards the houses) is the most photogenic. Avoid the riverside restaurants, expensive and aimed at tourists.", "price_en": "Free", "hours_en": "24h", "time_en": "20-30 min · walk", "id": "oporto-d2-12", "name": "Cais da Ribeira", "closed": false, "ll": [41.140665, -8.611057], "q": "Cais da Ribeira Porto", "min": 25, "time": "20-30 min · paseo", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "El frente del río: casas de cuatro y cinco pisos con fachadas de azulejos en diferentes estados de deterioro sobre la Ribeira. El tramo entre el Puente Don Luis I y el Puente de la Arrábida al atardecer tiene el color que aparece en todas las fotos de Oporto.", "tip": "Caminar por el Cais mirando hacia Gaia, la perspectiva inversa (desde el río hacia las casas) es la más fotogénica. Evitar los restaurantes del frente del río, caros y para turistas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~4 min on foot).", "leg": {"min": 4, "km": 0.27218386787089033, "mode": "walk"}}, {"name_en": "Barredo Street", "text_en": "One of the narrowest and steepest streets between the Ribeira and the Sé: stairs, crumbling tiles, laundry hanging out, smell of damp. The neighbourhood that Porto's own residents call 'the real Porto'. No major renovation in recent years.", "tip_en": "The slope climbs towards the Sé, go up to the highest point to see the difference in scale between the street and the river.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min · exploring", "id": "oporto-d2-13", "name": "Rua do Barredo", "closed": false, "ll": [41.14103, -8.6122548], "q": "Rua do Barredo Porto", "min": 10, "time": "10 min · callejeo", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Una de las calles más estrechas y verticales entre la Ribeira y la Sé: escaleras, azulejos deteriorados, ropa tendida, olor a humedad. El barrio que los propios portuenses llaman 'Oporto de verdad'. Sin reformas masivas recientes.", "tip": "La pendiente sube hacia la Sé, subir hasta el punto más alto para ver la diferencia de escala entre la calle y el río.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~4 min on foot).", "leg": {"min": 0, "km": 0.14066548087066416, "mode": "walk"}}, {"name_en": "Mercadores Street", "text_en": "Running parallel to Rua do Barredo: stairs, crumbling tiles, laundry hanging between windows. Porto's oldest neighbourhood without the gentrification of the lower Ribeira.", "tip_en": "Walk both streets in parallel (Barredo and Mercadores) for the contrast with the riverside promenade just 200 metres away.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min · exploring", "id": "oporto-d2-14", "name": "Rua dos Mercadores", "closed": false, "ll": [41.1415164, -8.6130286], "q": "Rua dos Mercadores Porto", "min": 10, "time": "10 min · callejeo", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Paralela a Rua do Barredo: escaleras, azulejos deteriorados, ropa tendida entre ventanas. El barrio más antiguo de Oporto sin la gentrificación de la Ribeira baja.", "tip": "Recorrer ambas calles en paralelo (Barredo y Mercadores) por su contraste con el paseo del río, a 200 metros de distancia.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Cathedral (indoors, ~4 min on foot).", "leg": {"min": 0, "km": 0.10972467750021532, "mode": "walk"}}, {"name_en": "São Francisco Church", "text_en": "A Gothic interior covered with 400 kg of 18th-century Brazilian gold leaf, the 'Tree of Jesse' is the most elaborate carved piece in Portugal. The catacombs: glass floors reveal layers of friars' bones accumulated over centuries. The side niches have headstones; those who couldn't afford a niche go under the wooden floorboards.", "tip_en": "Don't skip the catacombs, they're included in the ticket price and almost nobody goes down. The contrast with the gold interior is striking.", "price_en": "€9", "hours_en": "Daily 9:00-18:00 (until 19:00 in summer)", "time_en": "45-60 min", "id": "oporto-d2-15", "name": "Iglesia de San Francisco", "closed": false, "ll": [41.1410065, -8.616031], "q": "Iglesia de San Francisco Porto", "min": 55, "time": "45-60 min", "price": "9€", "hours": "Diario 9-18h (verano hasta 19h)", "rating": "4.7", "web": "", "text": "El interior gótico cubierto con 400 kg de pan de oro brasileño del siglo XVIII, el 'árbol de Jesé' es la talla más elaborada de Portugal. Las catacumbas: los suelos de cristal muestran la acumulación de huesos de los frailes enterrados en capas sucesivas. Los nichos laterales tienen lápidas; quienes no tenían dinero para nicho van bajo el suelo de madera.", "tip": "No saltarse las catacumbas, están incluidas en la entrada y casi nadie baja. El contraste con el oro del interior es llamativo.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 4, "km": 0.33505428166107426, "mode": "walk"}}, {"name_en": "Porto Stock Exchange Palace", "text_en": "A 19th-century Arab Room: walls and ceiling covered in gilded and polychrome Moorish-style stucco. Arabic inscriptions on the doors of a neoclassical building owned by merchants who had never been to Morocco. The contrast between the sober exterior and the interior is the whole point.", "tip_en": "Only accessible on a 30-min guided tour, sign up on arrival and wait for the next one. Worth it exclusively for the Arab Room.", "price_en": "€13.50 · Guided tour only", "hours_en": "Daily 9:00-18:30 · Tours every 30 min", "time_en": "30-45 min", "id": "oporto-d2-16", "name": "Palacio de la Bolsa de Oporto", "closed": false, "ll": [41.1413772, -8.6156725], "q": "Palacio de la Bolsa de Oporto Porto", "min": 40, "time": "30-45 min", "price": "13.50€ · Solo visita guiada", "hours": "Diario 9-18:30h · Tours cada 30 min", "rating": "4.6", "web": "", "text": "Sala árabe del siglo XIX: paredes y techo cubiertos de estuco dorado y policromado en estilo morisco. Inscripciones en árabe en las puertas de un edificio neoclásico de comerciantes que nunca habían estado en Marruecos. El contraste entre el exterior sobrio y el interior es el dato.", "tip": "Solo accesible con tour guiado de 30 min, apuntarse al llegar y esperar el siguiente. Vale la pena exclusivamente por la Sala Árabe.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.06629145651218273, "mode": "walk"}}, {"name_en": "Victoria Viewpoint", "text_en": "The best city-centre viewpoint over the Dom Luís I Bridge and the Douro. Technically private (a building's rooftop terrace) but kept open to visitors. The view over the bridge's upper level with the Gaia wine lodges behind is Porto's most recognised photograph.", "tip_en": "Porto's classic shot is taken from here. Best at sunset, the western light hits the bridge and the lodges.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min", "id": "oporto-d2-17", "name": "Mirador de la Victoria", "closed": false, "ll": [41.1430829, -8.6158324], "q": "Mirador de la Victoria Porto", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "24h", "rating": "4.6", "web": "", "text": "El mejor mirador del centro sobre el Puente Don Luis I y el río Duero. Técnicamente privado (terraza de un edificio) pero lo mantienen abierto a turistas. La perspectiva sobre el nivel superior del puente y las bodegas de Gaia al fondo es la fotografía de Oporto más reconocible.", "tip": "La foto clásica de Oporto se toma desde aquí. Mejor al atardecer, la luz del oeste ilumina el puente y las bodegas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palacio de la Bolsa de Oporto (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Stock Exchange Palace (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.24717840987440012, "mode": "walk"}}, {"name_en": "Virtudes Promenade", "text_en": "A riverside lookout used by locals: university students, couples, neighbours with dogs. The river view is lateral, not the frontal view of Mirador da Vitória, but the local atmosphere is irreplaceable. Street musicians appear at sunset.", "tip_en": "The perfect end to the day, bring something to drink and sit by the river. The stalls along the promenade sell wine and beer from €2.", "price_en": "Free", "hours_en": "24h", "time_en": "20-30 min", "id": "oporto-d2-18", "name": "Passeio das Virtudes", "closed": false, "ll": [41.1441145, -8.6183358], "q": "Passeio das Virtudes Porto", "min": 25, "time": "20-30 min", "price": "Gr
