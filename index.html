y the French Cathedral, the German Cathedral and the Konzerthaus.", "tip_en": "Spectacular at night when lit. Excellent Christmas market in December.", "price_en": "Square free · French Cathedral tower €3", "hours_en": "Tower Tue-Sun 10:00-18:00", "time_en": "30-45 min", "id": "berlin-d1-7", "name": "Gendarmenmarkt", "closed": false, "ll": [52.5131523, 13.3915191], "q": "Gendarmenmarkt Berlin", "min": 40, "time": "30-45 min", "price": "Plaza gratis · Torre Catedral Francesa 3€", "hours": "Torre Mar-Dom 10:00-18:00", "rating": "4.7", "web": "", "text": "La plaza más elegante de Berlín, enmarcada por la Catedral Francesa, la Catedral Alemana y el Konzerthaus.", "tip": "Espectacular de noche cuando está iluminada. Mercado navideño muy bueno en diciembre.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral Alemana (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up German Cathedral (indoors, ~1 min on foot).", "leg": {"min": 0, "km": 0.10998022751548531, "mode": "walk"}}, {"name_en": "St Hedwig's Cathedral", "text_en": "Berlin's oldest Catholic cathedral, built in 1773, modelled on the Pantheon in Rome. Frederick the Great built it for Silesian Catholics after conquering Silesia.", "tip_en": "Check opening status before visiting.", "price_en": "Free", "hours_en": "", "time_en": "20-30 min", "id": "berlin-d1-8", "name": "Catedral de Santa Eduvigis", "closed": false, "ll": [52.5159214, 13.3946271], "q": "Catedral de Santa Eduvigis Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "", "rating": "4.4", "web": "", "text": "La catedral católica más antigua de Berlín, construida en 1773, modelada sobre el Panteón de Roma. Federico el Grande la construyó para los católicos silesianos tras conquistar Silesia.", "tip": "Comprobar estado de apertura antes de visitar.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 6, "km": 0.4847461543874843, "mode": "walk"}}, {"name_en": "Bebelplatz", "text_en": "The square where the Nazis burned 20,000 books on 10 May 1933. Look for the glass panel set into the cobblestones: beneath it is an underground library with empty white shelves.", "tip_en": "The glass panel is in the centre of the square, easy to miss. At night it's lit and more striking.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min", "id": "berlin-d1-9", "name": "Bebelplatz", "closed": false, "ll": [52.5168703, 13.3956217], "q": "Bebelplatz Berlin", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "24h", "rating": "4.6", "web": "", "text": "La plaza donde los nazis quemaron 20.000 libros el 10 de mayo de 1933. Busca el panel de cristal empotrado en los adoquines: debajo hay una biblioteca subterránea vacía con estantes en blanco.", "tip": "El panel de cristal está en el centro de la plaza, es fácil de no verlo. De noche está iluminado y es más impactante.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Staatsoper Unter den Linden (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Staatsoper Unter den Linden (indoors, ~1 min on foot).", "leg": {"min": 2, "km": 0.16269398702594476, "mode": "walk"}}, {"name_en": "Staatsoper Unter den Linden", "text_en": "One of Europe's oldest opera houses, built in 1742 by Frederick the Great.", "tip_en": "Standing tickets available 90 min before curtain. Even without a performance, the exterior and Bebelplatz are worth the stop.", "price_en": "Standing tickets from €10", "hours_en": "", "time_en": "30-45 min if there's a performance", "id": "berlin-d1-10", "name": "Staatsoper Unter den Linden", "closed": false, "ll": [52.5171049, 13.394703], "q": "Staatsoper Unter den Linden Berlin", "min": 40, "time": "30-45 min si hay función", "price": "Localidades de pie desde 10€", "hours": "", "rating": "4.6", "web": "https://www.staatsoper-berlin.de", "text": "Una de las óperas más antiguas de Europa, construida en 1742 por Federico el Grande.", "tip": "Localidades de pie disponibles 90 min antes del comienzo. Incluso sin función, el exterior y Bebelplatz merecen la parada.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.0876400743808631, "mode": "walk"}}, {"name_en": "Alte Bibliothek", "text_en": "The Old Library, nicknamed \"the Commode\" for its curved Baroque façade. Built in 1775, now the law faculty of Humboldt University.", "tip_en": "Exterior only. The curved façade at Bebelplatz is one of Berlin's most elegant.", "price_en": "Free (exterior only)", "hours_en": "Visible 24h", "time_en": "10 min", "id": "berlin-d1-11", "name": "Alte Bibliothek", "closed": false, "ll": [52.5170077, 13.3932369], "q": "Alte Bibliothek Berlin", "min": 10, "time": "10 min", "price": "Gratis (solo exterior)", "hours": "Visible 24h", "rating": "", "web": "", "text": "La Biblioteca Antigua, apodada el Cómoda por su fachada curva barroca. Construida en 1775, hoy es la facultad de derecho de la Humboldt-Universität.", "tip": "Solo exterior. La fachada curva en Bebelplatz es una de las más elegantes de Berlín.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.1297277401656886, "mode": "walk"}}, {"name_en": "Equestrian Statue of Frederick II", "text_en": "Frederick the Great on horseback in the centre of Unter den Linden. Removed by the GDR in 1950, returned to its original location in 1980.", "tip_en": "Frederick asked to be buried next to his greyhounds at Sanssouci. The Nazis buried him in a church. His remains didn't arrive at Sanssouci until 1991, 205 years after his death.", "price_en": "Free", "hours_en": "24h", "time_en": "5-10 min", "id": "berlin-d1-12", "name": "Estatua ecuestre de Federico II", "closed": false, "ll": [52.5172695, 13.3927528], "q": "Estatua ecuestre de Federico II Berlin", "min": 10, "time": "5-10 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Federico el Grande a caballo en el centro de Unter den Linden. Retirada por la RDA en 1950 por demasiado prusiana, devuelta a su emplazamiento original en 1980.", "tip": "Federico pidió ser enterrado junto a sus galgos en Sanssouci. Los nazis lo enterraron en una iglesia. Sus restos no llegaron a Sanssouci hasta 1991, 205 años después de su muerte. Por fin donde quería.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Alte Bibliothek (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Alte Bibliothek (indoors, ~1 min on foot).", "leg": {"min": 0, "km": 0.05696953167050616, "mode": "walk"}}, {"name_en": "Berlin State Library", "text_en": "One of Europe's largest research libraries. The historic lobby and the courtyard café are open without a library card.", "tip_en": "Good coffee stop. Clean free toilets.", "price_en": "Free for visitors", "hours_en": "Mon-Fri 9:00-21:00 · Sat 10:00-19:00", "time_en": "20-30 min", "id": "berlin-d1-13", "name": "Biblioteca Estatal de Berlín", "closed": false, "ll": [52.5175461, 13.3917624], "q": "Biblioteca Estatal de Berlín Berlin", "min": 25, "time": "20-30 min", "price": "Gratis para visitantes", "hours": "Lun-Vie 9:00-21:00 · Sáb 10:00-19:00", "rating": "4.5", "web": "https://staatsbibliothek-berlin.de", "text": "Una de las bibliotecas de investigación más grandes de Europa. El vestíbulo histórico y la cafetería del patio interior están abiertos sin carnet.", "tip": "Buena parada para un café. Baños limpios y gratuitos.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.0958563495602197, "mode": "walk"}}, {"name_en": "Unter den Linden", "text_en": "The whole street. Berlin's main historic boulevard, 1.4km from the Brandenburg Gate to Museum Island. Every building tells a layer of history: Prussian, Nazi, GDR, reunified.", "tip_en": "Walk west to east. The stretch between Friedrichstraße and Bebelplatz is the richest.", "price_en": "Free", "hours_en": "24h", "time_en": "20-30 min (full walk)", "id": "berlin-d1-14", "name": "Unter den Linden", "closed": false, "ll": [52.517171, 13.3891129], "q": "Unter den Linden Berlin", "min": 25, "time": "20-30 min (paseo completo)", "price": "Gratis", "hours": "24h", "rating": "4.7", "web": "", "text": "El bulevar histórico principal de Berlín, 1.4km desde la Puerta de Brandeburgo hasta la Isla de los Museos. Cada edificio cuenta una capa de la historia: prusiana, nazi, RDA, reunificada.", "tip": "Caminar de oeste a este. El tramo entre Friedrichstrasse y Bebelplatz es el más rico.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Biblioteca Estatal de Berlín (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berlin State Library (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.23928437891550206, "mode": "walk"}}, {"name_en": "Holocaust Memorial", "text_en": "2,711 concrete stelae of varying heights, designed to disorient. The underground information centre is one of the best Holocaust exhibitions in Europe.", "tip_en": "On this route you arrive around 15:00-16:00, good time, midday queues have dropped. Don't skip the underground information centre.", "price_en": "Free", "hours_en": "Field 24h · Info centre Tue-Sun 10:00-20:00", "time_en": "1-1.5h", "id": "berlin-d1-15", "name": "Holocaust Memorial", "closed": false, "ll": [52.5139474, 13.3787126], "q": "Holocaust Memorial Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis", "hours": "Campo 24h · Centro info Mar-Dom 10:00-20:00", "rating": "4.7", "web": "https://www.stiftung-denkmal.de", "text": "2.711 estelas de hormigón de alturas variables, diseñadas para desorientar. El centro de información subterráneo es una de las mejores exposiciones sobre el Holocausto en Europa.", "tip": "No te saltes el centro subterráneo. Colas más cortas antes de las 11h o después de las 15h.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta [PARA FRIKIS] Führerbunker (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up [NERD PICK] Führerbunker (indoors, ~4 min on foot).", "leg": {"min": 14, "km": 1.026722087375654, "mode": "walk"}}, {"name_en": "[NERD PICK] Führerbunker", "text_en": "Interesting but it's just a car park. The place where Hitler committed suicide on 30 April 1945 lies under a deliberately anonymous car park to prevent pilgrimage. An information sign in the car park marks the exact location. The GDR demolished the structures in the 1980s and covered them with earth.", "tip_en": "No entry possible. The value is in the context: you're literally standing above the place where the Third Reich ended.", "price_en": "Free", "hours_en": "24h (public car park)", "time_en": "10-15 min", "id": "berlin-d1-16", "name": "[PARA FRIKIS] Führerbunker", "closed": false, "ll": [52.5125237, 13.3809755], "q": "[PARA FRIKIS] Führerbunker Berlin", "min": 15, "time": "10-15 min", "price": "Gratis", "hours": "24h (aparcamiento público)", "rating": "", "web": "", "text": "Interesante pero es solo un parking. El lugar donde Hitler se suicidó el 30 de abril de 1945 está bajo un aparcamiento deliberadamente anónimo para evitar peregrinaciones. Un cartel informativo en el parking indica la localización exacta. La RDA demolió las estructuras en los 80 y lo cubrió de tierra.", "tip": "Sin entrada posible. El valor está en el contexto: estás literalmente encima del lugar donde terminó el Tercer Reich.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 4, "km": 0.28632770802479046, "mode": "walk"}}, {"name_en": "Brandenburger Tor", "text_en": "El símbolo más icónico de Berlín, construido en 1788. La Quadriga fue llevada por Napoleón a París en 1806 y devuelta en 1814. Fue el punto exacto de división entre Este y Oeste durante la Guerra Fría.", "tip_en": "Para fotografiarlo sin multitudes: amanecer o después de las 21h. Mejor ángulo desde el este mirando al oeste.", "price_en": "Gratis", "hours_en": "24h", "time_en": "20-30 min", "id": "berlin-d1-17", "name": "Brandenburger Tor", "closed": false, "ll": [52.5162746, 13.377704], "q": "Brandenburger Tor Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "24h", "rating": "4.8", "web": "", "text": "El símbolo más icónico de Berlín, construido en 1788. La Quadriga fue llevada por Napoleón a París en 1806 y devuelta en 1814. Fue el punto exacto de división entre Este y Oeste durante la Guerra Fría.", "tip": "Para fotografiarlo sin multitudes: amanecer o después de las 21h. Mejor ángulo desde el este mirando al oeste.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Reichstag (indoors, ~5 min on foot).", "leg": {"min": 8, "km": 0.6138496732981392, "mode": "walk"}}, {"name_en": "Reichstag", "text_en": "Las paredes del Parlamento alemán conservan grafitti del Ejército Rojo con nombres de soldados soviéticos de 1945, deliberadamente conservados en el interior. La cúpula de cristal de Norman Foster permite subir por la rampa hasta la azotea con vistas al centro histórico.", "tip_en": "Reservar con 2-4 semanas de antelación. Llevar pasaporte. Mejor hora: primera entrada o última del día.", "price_en": "Gratis con reserva obligatoria", "hours_en": "Diario 8:00-24:00 (última entrada 22:00)", "time_en": "1-1.5h", "id": "berlin-d1-18", "name": "Reichstag", "closed": false, "ll": [52.5186202, 13.3761871], "q": "Reichstag Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis con reserva obligatoria", "hours": "Diario 8:00-24:00 (última entrada 22:00)", "rating": "4.7", "web": "Reservar (obligatorio): https://www.bundestag.de/besuche", "text": "Las paredes del Parlamento alemán conservan grafitti del Ejército Rojo con nombres de soldados soviéticos de 1945, deliberadamente conservados en el interior. La cúpula de cristal de Norman Foster permite subir por la rampa hasta la azotea con vistas al centro histórico.", "tip": "Reservar con 2-4 semanas de antelación. Llevar pasaporte. Mejor hora: primera entrada o última del día.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 5, "km": 0.36437454764844407, "mode": "walk"}}, {"name_en": "Soviet Memorial · Tiergarten", "text_en": "Soviet monument, smaller and less known, in the heart of the Tiergarten. Two original T-34 tanks flank the entrance. Built in 1945 with marble from the demolished Reich Chancellery. Predates the city's major memorials by years.", "tip_en": "Almost nobody visits this. The tanks are originals from 1945, not replicas.", "price_en": "Free", "hours_en": "24h", "time_en": "20-30 min", "id": "berlin-d1-19", "name": "Memorial soviético · Tiergarten", "closed": false, "ll": [52.5166259, 13.3719287], "q": "Memorial soviético — Tiergarten Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Monumento soviético, más pequeño y menos conocido, en el corazón del Tiergarten. Dos tanques T-34 originales flanquean el acceso. Construido en 1945 con mármol de la Cancillería del Reich demolida. Anterior a los grandes memoriales de la ciudad por años.", "tip": "Casi nadie lo visita. Los tanques son los originales de 1945, no réplicas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~6 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Reichstag (indoors, ~6 min on foot).", "leg": {"min": 6, "km": 0.4726724398142542, "mode": "walk"}}, {"name_en": "Victory Column", "text_en": "The 67-metre column with the golden winged Victory at the top, inaugurated in 1873 to commemorate three unification wars. Hitler moved it 2km from its original position to extend the east-west axis of Berlin. 285 steps for 360° views over the Tiergarten.", "tip_en": "This is the LAST POINT of the day, ideal: the Goldene Else glows at sunset. 285 steps, if you have energy left, worth it. If not, the exterior alone is a fine close.", "price_en": "€3.50 to climb / Free exterior", "hours_en": "Mon-Fri 9:30-18:30 · Sat-Sun 9:30-19:00", "time_en": "45-60 min", "id": "berlin-d1-20", "name": "Victory Column", "closed": false, "ll": [52.5145229, 13.3501085], "q": "Victory Column Berlin", "min": 55, "time": "45-60 min", "price": "3.50€ subida / Gratis exterior", "hours": "Lun-Vie 9:30-18:30 · Sáb-Dom 9:30-19:00", "rating": "4.7", "web": "https://www.visitberlin.de/en/victory-column", "text": "La columna de 67 metros con la Victoria alada dorada en la cima, inaugurada en 1873 para conmemorar tres guerras de unificación alemana. Hitler la trasladó 2 km de su posición original para ampliar el eje este-oeste de Berlín. 285 escalones para vistas 360° sobre el Tiergarten.", "tip": "Este es el ÚLTIMO PUNTO del día, ideal: la Goldene Else brilla con la luz del atardecer. 285 escalones, si queda energía, compensa. Si no, el exterior ya vale el cierre del día.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~32 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Reichstag (indoors, ~32 min on foot).", "leg": {"min": 26, "km": 1.943389010771127, "mode": "walk"}}, {"name_en": "END D1: S Tiergarten", "text_en": "🚉 S-Bahn stop: S Tiergarten Lines: S5 · S7 · S75 🔗 Connections: 🚉 S Hauptbahnhof (2 stops west) 🚉 S+U Zoologischer Garten (2 stops east): U2 · U9 🚌 Bus 100/200: stop Großer Stern (5 min walk)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d1-21", "name": "LLEGADA D1: S Tiergarten", "closed": false, "ll": [52.513956, 13.3362716], "q": "S Tiergarten Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚉 Parada S-Bahn: S Tiergarten Líneas: S5 · S7 · S75 🔗 Conexiones: 🚉 S Hauptbahnhof (2 paradas al oeste) 🚉 S+U Zoologischer Garten (2 paradas al este): U2 · U9 🚌 Bus 100/200: parada Großer Stern (5 min a pie)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 16, "km": 1.219987886285751, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 1 · Thu", "small_en": "Thu", "title_en": "Checkpoint Charlie · Historic axis · Victory Column"}, {"key": "d2", "big": "2", "small": "vie", "label": "Día 2 · vie", "title": "Naturkundemuseum · Museum Island · Prenzlauer Berg", "zone": "Naturkundemuseum", "est": "~6–8h", "start": "10:30", "sunset": null, "from": "U Naturkundemuseum", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Berlin Underworld (tours búnker): aprox 16€ · https://www.berliner-unterwelten.de · Tour guiado, hora fija"]}, {"h": "⚠️ IMPORTANTE", "lines": ["Este día va de norte a sur: empezar en Wedding y terminar en Mitte.", "Mauerpark: el Flohmarkt solo abre los domingos. El parque y el Jüdischer Friedhof son accesibles cualquier día.", "Jüdischer Friedhof: cerrado sábados. Ropa modesta.", "Museo de la Kulturbrauerei: gratuito."]}, {"h": "🍽️ COMIDA", "lines": ["Hackescher Markt: street food y cafés bajo los arcos del S-Bahn.", "Kulturbrauerei: bares y cafés dentro del complejo."]}, {"h": "🚇 TRANSPORTE", "lines": ["Inicio: S+U Gesundbrunnen (para Berlin Underworld) o U6 Naturkundemuseum (para el museo de dinosaurios).", "Final: S+U Hackescher Markt (S3 · S5 · S7 · S75)."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Berlin Underworld: approx. €16 · https://www.berliner-unterwelten.de · Guided tour, fixed time → book MORNING slot (10:00-11:00)"]}, {"h": "⏱ TIME ANALYSIS", "lines": ["If you do all points: ~12h 52min (including ~50 min walking and ~50 min for lunch).", "Too much for one day, choose your pace."]}, {"h": "🎯 THE NON-NEGOTIABLES", "lines": ["Berlin Underworld: guided tour at fixed time → book morning slot to fit the day", "Bernauer Straße: if you only do one Wall site, make it this one", "Mauerpark Flea Market: SUNDAYS ONLY · go in the first 2h", "Jüdischer Friedhof: closed Saturdays"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~5h): Natural History Museum → Bernauer Straße → Kulturbrauerei → Hackesche Höfe → Hackescher Markt", "Normal (~7h): add Berlin Underworld, Flea Market (if Sunday), Jüdischer Friedhof, Wasserturm", "Intense (~12h): all points of the day"]}, {"h": "⏰ KEY TIMES", "lines": ["9:30, Natural History Museum (arrive before school groups)", "10:00-11:00, Berlin Underworld (booked slot)", "If Sunday: Mauerpark Flea Market 9:00-11:00 first"]}, {"h": "🍽️ FOOD", "lines": ["Kulturbrauerei: bars and cafés inside the complex, good midday stop.", "Hackescher Markt: street food under the S-Bahn arches."]}, {"h": "🚇 TRANSPORT", "lines": ["Start: U6 Naturkundemuseum → 2 min walk to museum.", "End: S+U Hackescher Markt (S3 · S5 · S7 · S75)."]}], "stops": [{"name_en": "START D2: U Naturkundemuseum", "text_en": "🚇 U-Bahn stop: U Naturkundemuseum Line: U6 📍 Exit Invalidenstrasse. Museum is 2 min walk. 🔗 Nearby (on foot): 🚉 S Nordbahnhof (8 min east): S1 · S2 · S25 🚌 Bus 245: stop Museum für Naturkunde (at the door)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d2-0", "name": "SALIDA D2: U Naturkundemuseum", "closed": false, "ll": [52.5312674, 13.3822153], "q": "U Naturkundemuseum Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 Parada U-Bahn: U Naturkundemuseum Línea: U6 📍 Salir por la salida Invalidenstrasse. El museo está a 2 min a pie. 🔗 Cerca (a pie): 🚉 S Nordbahnhof (8 min al este): S1 · S2 · S25 🚌 Bus 245: parada Museum für Naturkunde (en la puerta)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Natural History Museum", "text_en": "The lobby Brachiosaurus stands 13.27m, the largest mounted dinosaur in the world. The original Archaeopteryx fossil is also here.", "tip_en": "Arrive at 13:00 when school groups are at lunch. Spend at least 45 min in the fossil halls.", "price_en": "€10 adults · €5 concession", "hours_en": "Tue-Fri 9:30-18:00 · Sat-Sun 10:00-18:00 · Closed Mondays", "time_en": "1.5-2h", "id": "berlin-d2-1", "name": "Museo de Historia Natural", "closed": false, "ll": [52.5305726, 13.3791755], "q": "Museo de Historia Natural Berlin", "min": 105, "time": "1.5-2h", "price": "10€ adultos · 5€ reducida", "hours": "Mar-Vie 9:30-18:00 · Sáb-Dom 10:00-18:00 · Cerrado lunes", "rating": "4.5", "web": "https://www.museumfuernaturkunde.berlin", "text": "El Brachiosaurus del vestíbulo mide 13.27m, el dinosaurio montado más grande del mundo. El fósil original de Archaeopteryx también está aquí.", "tip": "Llegar a las 13h cuando los grupos escolares están comiendo. Dedica al menos 45 min al hall de dinosaurios.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 4, "km": 0.28555533969639996, "mode": "walk"}}, {"name_en": "Invalidenfriedhof Cemetery", "text_en": "18th-century military cemetery where Prussian generals and Nazi leaders are buried, some tombstones deliberately destroyed by the Allies (though the bodies remain). In the 1960s the GDR built the Wall literally through part of the cemetery.", "tip_en": "One of Berlin's most disturbing cemeteries for its layered history.", "price_en": "Free", "hours_en": "Hours vary by season", "time_en": "30-45 min", "id": "berlin-d2-2", "name": "Cementerio de los Inválidos", "closed": false, "ll": [52.5319164, 13.3708928], "q": "Cementerio de los Inválidos Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Horarios variables según temporada", "rating": "", "web": "", "text": "Cementerio militar del siglo XVIII donde están enterrados generales prusianos y jerarcas nazis cuyas tumbas fueron deliberadamente destruidas por los aliados (aunque los cuerpos siguen ahí). En los años 60 la RDA construyó el Muro literalmente sobre parte del cementerio.", "tip": "Uno de los cementerios más perturbadores de Berlín por su historia en capas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Museo de Historia Natural (a cubierto, ~10 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Natural History Museum (indoors, ~10 min on foot).", "leg": {"min": 10, "km": 0.7538058887953252, "mode": "walk"}}, {"id": "berlin-d2-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [52.5319164, 13.3708928], "q": "restaurantes cerca de Cementerio de los Inválidos Berlin", "min": 75, "price": "", "hours": "", "text": "Hackescher Markt: street food y cafés bajo los arcos del S-Bahn. Kulturbrauerei: bares y cafés dentro del complejo.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Kulturbrauerei: bars and cafés inside the complex, good midday stop. Hackescher Markt: street food under the S-Bahn arches.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "Berlin Underworld", "text_en": "Berlin's most important organisation for the historic underground. \"Tour A\" goes through a WWII bunker converted into a museum, with original equipment. One of the city's most authentic experiences.", "tip_en": "Book online in advance. English and German tours at fixed times.", "price_en": "Approx. €16 adult", "hours_en": "Book time slot online in advance", "time_en": "1.5-2h (guided tour)", "id": "berlin-d2-3", "name": "Berlin Underworld", "closed": false, "ll": [52.5477911, 13.3889929], "q": "Berlin Underworld Berlin", "min": 105, "time": "1.5-2h (tour guiado)", "price": "Aprox. 16€ adulto", "hours": "Reservar horario online con antelación", "rating": "4.6", "web": "https://www.berliner-unterwelten.de", "text": "La organización más importante de Berlín para el subsuelo histórico. La \"Tour A\" lleva por un búnker de la Segunda Guerra Mundial convertido en museo, con equipamiento original. Una de las experiencias más auténticas de la ciudad.", "tip": "Reservar online con antelación. Los tours en inglés y alemán salen a horas fijas.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 19, "km": 2.792525260263077, "mode": "transit"}}, {"name_en": "Flakturm Humboldthain", "text_en": "One of six anti-aircraft towers built by Hitler to defend Berlin. Partially blown up by the Allies but so solid the demolition was incomplete. The remains form an artificial hill you can climb with views north.", "tip_en": "The hill on top offers surprising views. The interior tours are among the best in the city.", "price_en": "Free (exterior) · Guided tours approx. €10", "hours_en": "Exterior always accessible · Tours: check berliner-unterwelten.de", "time_en": "30-45 min", "id": "berlin-d2-4", "name": "Flakturm Humboldthain", "closed": false, "ll": [52.5474939, 13.3850835], "q": "Flakturm Humboldthain Berlin", "min": 40, "time": "30-45 min", "price": "Gratis (exterior) · Tours guiados aprox. 10€", "hours": "Exterior accesible siempre · Tours: consultar berliner-unterwelten.de", "rating": "", "web": "", "text": "Una de las seis torres antiaéreas construidas por Hitler para proteger Berlín. Fue volada parcialmente por los aliados, pero era tan sólida que la demolición quedó incompleta. Los restos están cubiertos de vegetación y son una colina artificial que puedes subir con vistas al norte de Berlín.", "tip": "La colina encima de la torre ofrece vistas sorprendentes. Los tours del interior son los mejores de la ciudad.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Underworld (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berlin Underworld (indoors, ~5 min on foot).", "leg": {"min": 5, "km": 0.34632355479337557, "mode": "walk"}}, {"name_en": "Bernauer Straße · Wall Memorial", "text_en": "The most fully documented Wall stretch in the city: here the border ran literally through building facades, and residents escaped by jumping from windows. Installations along the street show the original double Wall, the death strip and individual escape stories.", "tip_en": "One of Berlin's most powerful sites about the division. Far more honest than Checkpoint Charlie.", "price_en": "Free", "hours_en": "Daily 8:00-22:00 (visitor centre: Tue-Sun 10:00-18:00)", "time_en": "1-1.5h", "id": "berlin-d2-5", "name": "Bernauer Straße · Memorial del Muro", "closed": false, "ll": [52.5375414, 13.393641], "q": "Bernauer Straße — Memorial del Muro Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis", "hours": "Diario 8:00-22:00 (centro de visitantes: Mar-Dom 10:00-18:00)", "rating": "4.6", "web": "https://www.berliner-mauer-gedenkstaette.de", "text": "El tramo del Muro en Bernauer Straße es el mejor documentado de la ciudad: aquí la frontera pasaba literalmente por la fachada de los edificios, y los residentes escapaban saltando por las ventanas. Las instalaciones a lo largo de la calle muestran el doble muro original, la franja de la muerte y las historias individuales de los intentos de huida.", "tip": "Uno de los lugares más impactantes de Berlín sobre la división. Mucho más honesto que Checkpoint Charlie.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Underworld (a cubierto, ~20 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berlin Underworld (indoors, ~20 min on foot).", "leg": {"min": 22, "km": 1.6234989399081676, "mode": "walk"}}, {"name_en": "Mauerpark Flea Market", "text_en": "SUNDAY MORNINGS ONLY. Berlin's most famous Sunday flea market along the Wall corridor: vintage clothing, records, antiques, craft and food. The Wall fragment in the park is original.", "tip_en": "Sundays only. Go in the first 2 hours for the best finds.", "price_en": "Free (entry)", "hours_en": "Sundays only 9:00-18:00", "time_en": "1.5-2h", "id": "berlin-d2-6", "name": "Flohmarkt im Mauerpark", "closed": false, "ll": [52.5413884, 13.4023657], "q": "Flohmarkt im Mauerpark Berlin", "min": 105, "time": "1.5-2h", "price": "Gratis (entrada)", "hours": "Solo domingos 9:00-18:00", "rating": "4.5", "web": "", "text": "El mercadillo más famoso de Berlín, a lo largo del antiguo corredor de la muerte del Muro. El parque tiene fragmentos originales del Muro. Lo que encontrarás: Ropa vintage y vinilos Antigüedades y artesanía Puestos de comida de todo tipo Karaoke al aire libre en el anfiteatro desde las 15h", "tip": "Las primeras 2 horas son las mejores antes de las masas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~14 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Kulturbrauerei (indoors, ~14 min on foot).", "leg": {"min": 13, "km": 0.947439949712797, "mode": "walk"}}, {"name_en": "Kulturbrauerei Museum", "text_en": "Free museum about everyday life in East Berlin. Interesting not for the recreation but for the real objects: Trabant cars, period furniture, uniforms, banners, all with the flat, unpretentious aesthetic of GDR design.", "tip_en": "One of Berlin's most interesting free museums. Never crowded.", "price_en": "Free", "hours_en": "Tue-Sun 10:00-18:00 · Closed Mondays", "time_en": "1-1.5h", "id": "berlin-d2-7", "name": "Museo de la Kulturbrauerei", "closed": false, "ll": [52.540383, 13.414097], "q": "Museo de la Kulturbrauerei Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis", "hours": "Mar-Dom 10:00-18:00 · Cerrado lunes", "rating": "4.3", "web": "", "text": "Museo gratuito sobre la vida cotidiana en Berlín Oriental. Interesante no por la recreación sino por los objetos reales: coches Trabant, muebles de época, uniformes, pancartas, todo con la estética mate y sin pretensiones del diseño de la RDA.", "tip": "Uno de los museos gratuitos más interesantes de Berlín. Sin aglomeraciones.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 14, "km": 1.0415662961386438, "mode": "walk"}}, {"name_en": "Kulturbrauerei", "text_en": "Former Schultheiss brewery from the late 19th century converted into a cultural space: cinemas, bars, museums, concert halls. The neo-Gothic red brick complex looks like a small industrial city. The December Christmas market is one of Berlin's best.", "tip_en": "The Kulturbrauerei Museum (next point) is free and inside the complex.", "price_en": "Free (complex) · Museums and events ticketed", "hours_en": "", "time_en": "30-45 min (exploring the complex)", "id": "berlin-d2-8", "name": "Kulturbrauerei", "closed": false, "ll": [52.5382032, 13.4127133], "q": "Kulturbrauerei Berlin", "min": 40, "time": "30-45 min (paseo por el complejo)", "price": "Gratis (complejo) · Museos y eventos de pago", "hours": "", "rating": "", "web": "", "text": "Antigua fábrica de cerveza Schultheiss de finales del XIX reconvertida en espacio cultural: cines, bares, museos, salas de conciertos. El complejo de edificios de ladrillo rojo neogótico tiene aspecto de pequeña ciudad industrial. El mercado navideño de diciembre es uno de los mejores de Berlín.", "tip": "El Museo de la Kulturbrauerei (ver siguiente punto) es gratuito y está dentro del complejo.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 5, "km": 0.3377666547055882, "mode": "walk"}}, {"name_en": "Jüdischer Friedhof Schönhauser Allee", "text_en": "🚫 Closed Saturdays and Jewish holidays 📍 Schönhauser Allee 23-25 Jewish cemetery closed since 1827, covered in ivy with headstones half-buried in vegetation. Enchanted forest atmosphere. Only a few tombs remain visible at the back. Final resting place of composer Giacomo Meyerbeer and painter Max Liebermann.", "tip_en": "Modest clothing required. Closed Saturdays (Shabbat).", "price_en": "Free", "hours_en": "Mon-Thu 9:00-16:00 · Fri 9:00-13:00 · Sun 10:00-16:00", "time_en": "30-45 min", "id": "berlin-d2-9", "name": "Jüdischer Friedhof Schönhauser Allee", "closed": false, "ll": [52.5343731, 13.4130453], "q": "Jüdischer Friedhof Schönhauser Allee Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Lun-Jue 9:00-16:00 · Vie 9:00-13:00 · Dom 10:00-16:00", "rating": "4.5", "web": "", "text": "🚫 Cerrado sábados y festivos judíos 📍 Schönhauser Allee 23-25 Cementerio judío cerrado desde 1827, cubierto de hiedra y con lápidas medio enterradas en la vegetación. Atmósfera de bosque encantado. Solo quedan unas pocas tumbas visibles al fondo. Última morada del compositor Giacomo Meyerbeer y el pintor Max Liebermann.", "tip": "Ropa modesta requerida. Cerrado los sábados (Shabat).", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~7 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Kulturbrauerei (indoors, ~7 min on foot).", "leg": {"min": 7, "km": 0.5544230188078482, "mode": "walk"}}, {"name_en": "Wasserturm Prenzlauer Berg", "text_en": "Brick water tower from 1877, Berlin's oldest until 1914. In its basement the Nazis set up one of the first improvised concentration camps in 1933, where they tortured and murdered political opponents before building the formal camps.", "tip_en": "The contrast between the domestic red brick appearance and its history is disturbing. A small plaque at the base documents it.", "price_en": "Free (exterior)", "hours_en": "", "time_en": "10-15 min (exterior)", "id": "berlin-d2-10", "name": "Wasserturm Prenzlauer Berg", "closed": false, "ll": [52.5341937, 13.4186129], "q": "Wasserturm Prenzlauer Berg Berlin", "min": 15, "time": "10-15 min (exterior)", "price": "Gratis (exterior)", "hours": "", "rating": "", "web": "", "text": "Torre de agua de ladrillo de 1877, la más antigua de Berlín hasta 1914. En el sótano los nazis instalaron uno de los primeros campos de concentración improvisados en 1933, donde torturaron y asesinaron a opositores políticos antes de construir los campos formales.", "tip": "El contraste entre la apariencia doméstica de ladrillo rojo y su historia es perturbador. Una placa pequeña en la base lo documenta.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~10 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Kulturbrauerei (indoors, ~10 min on foot).", "leg": {"min": 7, "km": 0.4902448909834407, "mode": "walk"}}, {"name_en": "[NERD PICK] Graffiti Courtyard", "text_en": "Hidden passage in the heart of Mitte: walls covered in constantly changing graffiti, artist shops, indie cinema (Kino Central), and the free Otto Weidt Museum inside. Weidt was a broom-maker who hid 30 blind and deaf Jewish employees during the Holocaust.", "tip_en": "The Otto Weidt Museum is one of Berlin's most moving museums and almost nobody knows it. Free with donation.", "price_en": "Free · Otto Weidt Museum: donation", "hours_en": "Accessible during the day", "time_en": "30-45 min", "id": "berlin-d2-11", "name": "[PARA FRIKIS] Patio grafitero", "closed": false, "ll": [52.524261, 13.4026214], "q": "[PARA FRIKIS] Patio grafitero Berlin", "min": 40, "time": "30-45 min", "price": "Gratis · Museo Otto Weidt: donativo", "hours": "Accesible durante el día", "rating": "4.5", "web": "", "text": "Pasaje oculto en pleno Mitte: paredes cubiertas de graffiti, arte callejero en constante cambio, tiendas de artistas, cine indie (Kino Central), y el museo gratuito Otto Weidt en el interior. Weidt era un fabricante de escobas que escondió a 30 empleados judíos ciegos y sordos durante el Holocausto.", "tip": "El Museo Otto Weidt es uno de los museos más conmovedores de Berlín y casi nadie lo conoce. Gratis con donativo.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~29 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Kulturbrauerei (indoors, ~29 min on foot).", "leg": {"min": 27, "km": 2.0097754685868536, "mode": "walk"}}, {"name_en": "Hackesche Höfe", "text_en": "Complex of eight interconnected Art Nouveau courtyards from 1907. The first courtyard has a Meissen tile façade. Particularly photogenic at sunrise or sunset. Walk through all eight in sequence, enter from Rosenthaler Str 40-41.", "tip_en": "The last courtyards are the most authentic and least touristy.", "price_en": "Free", "hours_en": "Approx. 10:00-20:00", "time_en": "20-30 min", "id": "berlin-d2-12", "name": "Hackesche Höfe", "closed": false, "ll": [52.5240221, 13.4024126], "q": "Hackesche Höfe Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "Aprox 10:00-20:00", "rating": "4.5", "web": "", "text": "Complejo de ocho patios interiores Art Nouveau de 1907 conectados entre sí. El primer patio tiene fachada de azulejos de Meissen con figuras. Pasaje fotográfico especialmente bueno al amanecer o al atardecer. Recorre los ocho en secuencia, entrar desde Rosenthaler Str 40-41.", "tip": "Los últimos patios son los más auténticos y menos turísticos.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~30 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Kulturbrauerei (indoors, ~30 min on foot).", "leg": {"min": 0, "km": 0.039112920420609196, "mode": "walk"}}, {"name_en": "Hackescher Markt", "text_en": "The brick arches under the elevated S-Bahn at Hackescher Markt house bars and shops. Street food, independent stores and cafés. Better at weekends.", "tip_en": "The S-Bahn arches have bars with good value for central Berlin.", "price_en": "Free", "hours_en": "", "time_en": "30-45 min", "id": "berlin-d2-13", "name": "Hackescher Markt", "closed": false, "ll": [52.5237159, 13.4022679], "q": "Hackescher Markt Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "", "rating": "4.4", "web": "", "text": "Los arcos de ladrillo bajo la línea elevada del S-Bahn en la zona de Hackescher Markt albergan bares y tiendas. Street food, tiendas independientes y cafés. Mejor en fin de semana.", "tip": "Los arcos del S-Bahn tienen bares con buena relación calidad-precio para el centro.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Museo de Historia Natural (a cubierto, ~30 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Natural History Museum (indoors, ~30 min on foot).", "leg": {"min": 0, "km": 0.04605551149605302, "mode": "walk"}}, {"name_en": "END D2: S+U Hackescher Markt", "text_en": "🚉 S-Bahn stop: S+U Hackescher Markt Lines: S3 · S5 · S7 · S75 ➡️ S3/S5/S7 east: Ostbahnhof · Ostkreuz (S41 · S42 · U5) ⬅️ S5/S7 west: Alexanderplatz (1 stop) · Hauptbahnhof 🔗 Nearby (on foot): 🚌 Bus M1: stop Hackescher Markt (towards Prenzlauer Berg) 🚇 U8 Weinmeisterstrasse (3 min walk)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "be
