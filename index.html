atis", "hours": "24h", "rating": "4.5", "web": "", "text": "Mirador sobre el Duero utilizado por los locales: estudiantes universitarios, parejas, vecinos con perros. La vista al río es lateral, no la vista frontal del Mirador da Vitória, pero la atmósfera local es irreproducible. Al atardecer hay músicos.", "tip": "Cierre perfecto del día, traer algo de beber y sentarse a ver el río. Los puestos del paseo tienen vino y cerveza desde 2€.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palacio de la Bolsa de Oporto (a cubierto, ~7 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto Stock Exchange Palace (indoors, ~7 min on foot).", "leg": {"min": 4, "km": 0.3106467355115692, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 2 · Thu", "small_en": "Thu", "title_en": "Sé · Ribeira · Gaia"}, {"key": "d3", "big": "3", "small": "vie", "label": "Día 3 · vie", "title": "Day Trip: Guimarães → Braga", "zone": "Day Trip: Guimarães → Braga", "est": "~9h", "start": "10:30", "sunset": null, "from": "Sanctuary of Penha", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 ANTES DE SALIR", "lines": ["Recoger el coche a las 9:00h, Europcar R. Gonçalo Cristóvão 67. Llevar carnet de conducir. Activar via verde para autopistas de peaje al recoger."]}, {"h": "⏱ ANÁLISIS DE TIEMPO", "lines": ["Conducción total: ~2h (Oporto→Guimarães 45min + Guimarães→Braga 20min + Braga→Oporto 45min)", "Guimarães: ~2.5h (la mayoría son exteriores rápidos)", "Bom Jesus + Sameiro: ~1h", "Braga centro: ~2.5h", "Total: ~8h, con salida a las 9h y vuelta a las 19-20h hay margen suficiente para todo."]}, {"h": "🎯 LOS QUE MANDAN", "lines": ["Guimarães: llegar entre 9:30-10h, el centro medieval se llena desde las 11h", "Bom Jesus: la foto desde abajo requiere buena luz, antes de las 15h", "Jardín de Santa Bárbara (Braga): las rosas están en su mejor momento en mayo"]}, {"h": "⚠️ LA ÚINICA ELECCIÓN REAL", "lines": ["Si entras al Paço dos Duques (45-60 min) Y a la Catedral de Braga (30-45 min), el día queda justo pero factible. Si prefieres ritmo más relajado, elige uno de los dos."]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["9:00h, Recoger coche", "9:45-10:00h, Llegada a Guimarães", "12:30-13:00h, Bom Jesus (luz de mediodía)", "13:30h, Entrada a Braga centro"]}, {"h": "🍽️ COMIDA", "lines": ["Guimarães: comer en el centro medieval, el bacalhau à Braga es el plato regional.", "Braga: café y toucinho do céu en Rua do Souto."]}, {"h": "🚗 CONDUCCIÓN", "lines": ["A3 desde Oporto: autopista de peaje. Llevar tarjeta o activar via verde al recoger el coche."]}], "brief_en": [{"h": "🔔 BEFORE YOU LEAVE", "lines": ["Pick up the car at 9:00, Europcar R. Gonçalo Cristóvão 67. Bring your driving licence. Activate via verde for toll motorways when picking up."]}, {"h": "⏱ TIME BREAKDOWN", "lines": ["Total driving: ~2h (Porto→Guimarães 45min + Guimarães→Braga 20min + Braga→Porto 45min)", "Guimarães: ~2.5h (most are quick exteriors)", "Bom Jesus + Sameiro: ~1h", "Braga city centre: ~2.5h", "Total: ~8h, leaving at 9:00 and returning at 19:00-20:00 leaves enough margin for everything."]}, {"h": "🎯 ANCHORS", "lines": ["Guimarães: arrive between 9:30-10:00, the medieval centre fills up from 11:00", "Bom Jesus: the shot from below needs good light, before 15:00", "Santa Bárbara Garden (Braga): the roses are at their best in May"]}, {"h": "⚠️ THE ONE REAL CHOICE", "lines": ["If you go inside the Paço dos Duques (45-60 min) AND Braga Cathedral (30-45 min), the day is tight but doable. If you prefer a more relaxed pace, pick one."]}, {"h": "⏰ KEY TIMES", "lines": ["9:00, Pick up car", "9:45-10:00, Arrive in Guimarães", "12:30-13:00, Bom Jesus (midday light)", "13:30, Enter Braga city centre"]}, {"h": "🍽️ FOOD", "lines": ["Guimarães: eat in the medieval centre, bacalhau à Braga is the regional dish.", "Braga: coffee and toucinho do céu on Rua do Souto."]}, {"h": "🚗 DRIVING", "lines": ["A3 from Porto: toll motorway. Use a card or activate via verde when picking up the car."]}], "stops": [{"name_en": "Penha Sanctuary", "text_en": "A 613m hill covered in pine trees with giant granite formations supporting the church. The cable car leaves from Guimarães city centre. The views over the valley and the medieval town are the main photographic draw.", "tip_en": "Combine with the Castle on foot, both are on the same hill. Drive up if you have the car, saves time for the medieval centre.", "price_en": "Cable car: €5 return · By car: free", "hours_en": "Daily 8:00-18:00 (cable car hours vary)", "time_en": "45-60 min", "id": "oporto-d3-0", "name": "Sanctuary of Penha", "closed": false, "ll": [41.4318214, -8.2700348], "q": "Sanctuary of Penha Porto", "min": 55, "time": "45-60 min", "price": "Teleférico: 5€ ida y vuelta · Coche: gratis", "hours": "Diario 8-18h (teleférico variable)", "rating": "4.6", "web": "", "text": "Monte de 613m cubierto de pinos con formaciones de granito gigantes entre las que se apoya la iglesia. El teleférico parte desde el centro de Guimarães. Las vistas sobre el valle y la ciudad medieval son el punto fotográfico principal.", "tip": "Combinar con el Castillo a pie, ambos están en el mismo monte. Subir en coche si se tiene, deja tiempo para el centro medieval.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~33 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Santos Passos Church (indoors, ~33 min on foot).", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Guimarães Castle", "text_en": "A 10th-century castle where Afonso Henriques, Portugal's first king, was born in 1109. The medieval battlements and keep are well preserved. Better photographed from the slope below the Dukes' Palace, the view from below is more powerful than from inside.", "tip_en": "Climbing the battlements is worth €2. Direct view over the Paço dos Duques and the medieval centre.", "price_en": "€2", "hours_en": "Daily 10:00-18:00", "time_en": "30-45 min", "id": "oporto-d3-1", "name": "Castillo de Guimarães", "closed": false, "ll": [41.4478935, -8.2903191], "q": "Castillo de Guimarães Porto", "min": 40, "time": "30-45 min", "price": "2€", "hours": "Diario 10-18h", "rating": "4.5", "web": "", "text": "Castillo del siglo X donde nació Afonso Henriques, primer rey de Portugal en 1109. Las almenas medievales y la torre del homenaje están en buen estado. Mejor fotografiarlo desde la cuesta del palacio de los Duques, la perspectiva desde abajo es más potente que desde dentro.", "tip": "La subida a las almenas vale los 2€. Vista directa al Paço dos Duques y al centro medieval.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Palace of the Dukes of Braganza (indoors, ~3 min on foot).", "leg": {"min": 21, "km": 3.198320991055137, "mode": "transit"}}, {"name_en": "Palace of the Dukes of Braganza", "text_en": "A 15th-century palace with cylindrical towers and brick chimneys reminiscent of Burgundy. Radically restored in the 1940s by Salazar as a symbol of national identity. The contrast between the medieval exterior and the ideologically motivated restoration inside is the main point of interest.", "tip_en": "Go inside only if time allows, the exterior and historical context are the most interesting part.", "price_en": "€5", "hours_en": "Daily 9:30-18:00", "time_en": "45-60 min", "id": "oporto-d3-2", "name": "Paço dos Duques de Bragança", "closed": false, "ll": [41.4465409, -8.2911855], "q": "Paço dos Duques de Bragança Porto", "min": 55, "time": "45-60 min", "price": "5€", "hours": "Diario 9:30-18h", "rating": "4.5", "web": "", "text": "Palacio del siglo XV con torres cilíndricas y chimeneas de ladrillo que recuerdan a Borgoña. Restaurado radicalmente en los años 40 por Salazar como símbolo de la identidad nacional. El contraste entre el exterior medieval y el interior restaurado con criterio ideológico es el dato.", "tip": "Entrar solo si el tiempo lo permite, el exterior y el contexto histórico son lo más interesante.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 3, "km": 0.21689168174251278, "mode": "walk"}}, {"id": "oporto-d3-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [41.4465409, -8.2911855], "q": "restaurantes cerca de Paço dos Duques de Bragança Porto", "min": 75, "price": "", "hours": "", "text": "Guimarães: comer en el centro medieval, el bacalhau à Braga es el plato regional. Braga: café y toucinho do céu en Rua do Souto.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Guimarães: eat in the medieval centre, bacalhau à Braga is the regional dish. Braga: coffee and toucinho do céu on Rua do Souto.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "Santa Maria Street", "text_en": "The most photographed medieval street in Guimarães: 14th-century granite houses with wooden balconies. The cobbled surface, the narrowness and the human scale make it one of the best-preserved medieval streets in northern Portugal.", "tip_en": "Best first thing in the morning, before the tour groups. Have breakfast at one of the bakeries at the top of the street.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min", "id": "oporto-d3-3", "name": "Rua de Santa Maria", "closed": false, "ll": [41.4441176, -8.2927654], "q": "Rua de Santa Maria Porto", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "24h", "rating": "4.6", "web": "", "text": "La calle medieval más fotografiada de Guimarães: casas de granito del siglo XIV con balcones de madera. El pavimento empedrado, la estrechez y la escala humana la hacen una de las calles medievales mejor conservadas del norte de Portugal.", "tip": "Mejor a primera hora de la mañana, antes de los grupos de turistas. Desayunar en una de las panaderías del principio de la calle.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Palace of the Dukes of Braganza (indoors, ~5 min on foot).", "leg": {"min": 5, "km": 0.3898894110331435, "mode": "walk"}}, {"name_en": "São Tiago Square", "text_en": "The smallest and most authentic Romanesque square in the centre: medieval cobblestones, 13th-century granite houses, the church of São Miguel da Castelo where Afonso Henriques was baptised. The midday atmosphere with locals having coffee is more genuine than the tourist-heavy Largo da Oliveira.", "tip_en": "The most photogenic square in the medieval centre. Cafés with wooden chairs outside.", "price_en": "Free", "hours_en": "24h", "time_en": "15 min", "id": "oporto-d3-4", "name": "Praça de São Tiago", "closed": false, "ll": [41.4434742, -8.2932111], "q": "Praça de São Tiago Porto", "min": 15, "time": "15 min", "price": "Gratis", "hours": "24h", "rating": "4.7", "web": "", "text": "La plaza románica más pequeña y auténtica del centro: adoquines medievales, casas de granito del XIII, la iglesia de São Miguel da Castelo donde bautizaron a Afonso Henriques. El ambiente al mediodía con los locales tomando café es más genuino que el turístico Largo da Oliveira.", "tip": "La más fotogénica del centro medieval. Los cafés con sillas de madera en el exterior.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~7 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Palace of the Dukes of Braganza (indoors, ~7 min on foot).", "leg": {"min": 0, "km": 0.10479730768902325, "mode": "walk"}}, {"name_en": "Oliveira Square + Battle of Salado Monument", "text_en": "The Padrão do Salado is a 14th-century Gothic monument erected in 1340 to commemorate the battle where Portugal and Castile defeated the Sultan of Morocco. The olive tree in the centre of the square is another medieval survivor.", "tip_en": "The Paços do Concelho building (medieval town hall) behind the Padrão has well-preserved 14th-century arcades.", "price_en": "Free", "hours_en": "24h", "time_en": "15 min", "id": "oporto-d3-5", "name": "Largo da Oliveira + Padrão do Salado", "closed": false, "ll": [41.442849, -8.2927935], "q": "Largo da Oliveira + Padrão do Salado Porto", "min": 15, "time": "15 min", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "El Padrão do Salado es un monumento gótico del siglo XIV levantado en 1340 para conmemorar la batalla donde Portugal y Castilla derrotaron al sultán de Marruecos. El olivo del centro de la plaza es otro de los supervivientes medievales.", "tip": "El edificio de los Paços do Concelho (ayuntamiento medieval) detrás del Padrão tiene soportales del siglo XIV bien conservados.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~6 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Santos Passos Church (indoors, ~6 min on foot).", "leg": {"min": 0, "km": 0.10107043286463153, "mode": "walk"}}, {"name_en": "República do Brasil Square", "text_en": "A modernist square with the Post Office building and the Pombinhos garden. The contrast between the early-20th-century eclectic style and the surrounding medieval granite is more striking than the name suggests.", "tip_en": "Reference point for getting back to the car and heading to Braga.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min", "id": "oporto-d3-6", "name": "Largo da República do Brasil", "closed": false, "ll": [41.4418299, -8.2908218], "q": "Largo da República do Brasil Porto", "min": 10, "time": "10 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Plaza modernista con el edificio de Correos y el jardín de los Pombinhos. El contraste entre el estilo ecléctico de principios del XX y el granito medieval del entorno es más llamativo de lo que sugiere el nombre.", "tip": "Punto de referencia para salir hacia el coche y continuar a Braga.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Santos Passos Church (indoors, ~2 min on foot).", "leg": {"min": 3, "km": 0.2595181587547576, "mode": "walk"}}, {"name_en": "Santos Passos Church", "text_en": "An 18th-century baroque church with a granite facade and a stepped perspective stairway framing the street. One of Guimarães' most photogenic buildings from the outside.", "tip_en": "Exterior only if time is tight. The stairway is the photographic draw.", "price_en": "Free exterior", "hours_en": "24h exterior", "time_en": "10 min · exterior only", "id": "oporto-d3-7", "name": "Igreja de Santos Passos", "closed": false, "ll": [41.4409037, -8.2897289], "q": "Igreja de Santos Passos Porto", "min": 10, "time": "10 min · exterior", "price": "Gratis exterior", "hours": "24h exterior", "rating": "4.6", "web": "", "text": "Iglesia barroca del siglo XVIII con fachada de granito y la escalinata en perspectiva que enmarca la calle. Uno de los edificios más fotogénicos de Guimarães desde el exterior.", "tip": "Solo exterior si el tiempo apremia. La escalinata es el punto fotográfico.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 2, "km": 0.17874757179775894, "mode": "walk"}}, {"name_en": "Bom Jesus do Monte · baroque staircase", "text_en": "A baroque stairway 116 metres tall with 581 zigzag steps, fountains and chapels at each landing. The photographic perspective from below looking up is the most internationally used image of Portugal after Lisbon. The 1882 funicular climbs in 3 minutes.", "tip_en": "The shot from below looking towards the top is the classic take. Walk up the stairway and take the funicular down (or the reverse). Stop here on the way from Guimarães to Braga.", "price_en": "Free · Funicular €2 up", "hours_en": "Daily · Funicular 8:00-20:00", "time_en": "45-60 min", "id": "oporto-d3-8", "name": "Bom Jesus do Monte · escalinata barroca", "closed": false, "ll": [41.5547347, -8.3770546], "q": "Bom Jesus do Monte — escalinata barroca Porto", "min": 55, "time": "45-60 min", "price": "Gratis · Funicular 2€ subida", "hours": "Diario · Funicular 8-20h", "rating": "4.7", "web": "", "text": "Escalinata barroca de 116 metros de altura con 581 peldaños en zigzag, fuentes y capillas en cada tramo. La perspectiva fotográfica desde abajo mirando hacia arriba es la imagen de Portugal más usada internacionalmente después de Lisboa. El funicular de 1882 sube en 3 minutos.", "tip": "La foto desde abajo mirando hacia la cima es la toma clásica. Subir por la escalinata y bajar en funicular (o al revés). Parada en el camino desde Guimarães hacia Braga.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~72 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Episcopal Palace (indoors, ~72 min on foot).", "leg": {"min": 21, "km": 18.977468868122706, "mode": "car"}}, {"name_en": "Sameiro Sanctuary", "text_en": "A neoclassical basilica on a 566m hilltop. The views over the Minho valley and towards Guimarães are among the best in the region. Less visited than Bom Jesus though it's actually closer to Braga.", "tip_en": "A quick stop before descending into Braga city centre. The views justify the 10 minutes. Walk down the steps to see the full extent of the view and the scale of the location.", "price_en": "Free", "hours_en": "Daily 8:00-18:00", "time_en": "20 min", "id": "oporto-d3-9", "name": "Santuario de Nuestra Señora del Sameiro", "closed": false, "ll": [41.5418253, -8.3698136], "q": "Santuario de Nuestra Señora del Sameiro Porto", "min": 20, "time": "20 min", "price": "Gratis", "hours": "Diario 8-18h", "rating": "4.5", "web": "", "text": "Basílica neoclásica en la cima de un monte a 566m. Las vistas sobre el valle del Minho y hacia Guimarães son de las mejores de la región. Menos visitado que el Bom Jesus aunque está más cerca de Braga.", "tip": "Parada rápida antes de bajar al centro de Braga. Las vistas justifican los 10 minutos. Bajar las escaleras para ver las vistas al fondo y la magnitud de la localización.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~84 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Episcopal Palace (indoors, ~84 min on foot).", "leg": {"min": 27, "km": 2.023849486025472, "mode": "walk"}}, {"name_en": "Casa do Raio (baroque palace)", "text_en": "An 18th-century baroque palace covered in blue tiles on the facade, one of the most photogenic civic baroque buildings in northern Portugal. Currently home to the District Archive. The facade from the street takes no more than 10 minutes.", "tip_en": "The entry point to Braga's historic centre. The blue tiles in full daylight are very striking.", "price_en": "Free exterior", "hours_en": "24h exterior", "time_en": "5-10 min · exterior only", "id": "oporto-d3-10", "name": "Casa do Raio", "closed": false, "ll": [41.5483836, -8.4225933], "q": "Casa do Raio Porto", "min": 10, "time": "5-10 min · solo exterior", "price": "Gratis exterior", "hours": "24h exterior", "rating": "4.5", "web": "", "text": "Palacete barroco del siglo XVIII cubierto de azulejos azules en la fachada, uno de los edificios civiles barrocos más fotogénicos del norte de Portugal. Actualmente es sede del Archivo Distrital. La fachada desde la calle no requiere más de 10 minutos.", "tip": "La entrada al centro histórico de Braga. El azul de los azulejos a plena luz es muy potente.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~7 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Cathedral (indoors, ~7 min on foot).", "leg": {"min": 29, "km": 5.7883275327300145, "mode": "transit"}}, {"name_en": "Braga historic centre · main axis", "text_en": "Braga's medieval axis: Rua do Souto and Rua Dom Diogo de Sousa. The city is known as the 'Portuguese Rome' for its density of baroque churches. The contrast between the 18th-century ecclesiastical architecture and the current shops has more character than Lisbon's equivalent.", "tip_en": "Walk the axis from north to south, the concentration of baroque buildings increases as you approach the Cathedral.", "price_en": "Free", "hours_en": "24h", "time_en": "30-45 min · walk", "id": "oporto-d3-11", "name": "Centro histórico de Braga · eje principal", "closed": false, "ll": [41.5488998, -8.4217243], "q": "Centro histórico de Braga — eje principal Porto", "min": 40, "time": "30-45 min · paseo", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "El eje medieval de Braga: Rua do Souto y Rua Dom Diogo de Sousa. La ciudad es conocida como la 'Roma portuguesa' por la densidad de iglesias barrocas. El contraste entre la arquitectura eclesiástica del XVIII y las tiendas actuales tiene más carácter que Lisboa.", "tip": "Recorrer el eje de norte a sur, la concentración de edificios barrocos aumenta hacia la Catedral.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~8 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Cathedral (indoors, ~8 min on foot).", "leg": {"min": 0, "km": 0.12002477670942664, "mode": "walk"}}, {"name_en": "República Square Fountain", "text_en": "An 18th-century octagonal fountain at the centre of Braga's main square, surrounded by terrace cafés. The square has the liveliest atmosphere in the historic centre, locals have been sitting here for generations.", "tip_en": "Best stop for a coffee before heading to the church axis. The arcade cafés have the cheapest terrace in the centre.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min · square", "id": "oporto-d3-12", "name": "Chafariz da Praça da República", "closed": false, "ll": [41.551394, -8.4230942], "q": "Chafariz da Praça da República Porto", "min": 20, "time": "15-20 min · plaza", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "Fuente octogonal del XVIII en el centro de la plaza principal de Braga, rodeada de cafés con terraza. El ambiente de la plaza es el más vivo del centro histórico, los locales llevan generaciones sentándose aquí.", "tip": "Mejor parada para un café antes de seguir al eje de iglesias. Los cafés de los soportales tienen la terraza más barata del centro.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Episcopal Palace (indoors, ~5 min on foot).", "leg": {"min": 5, "km": 0.3898138679251615, "mode": "walk"}}, {"name_en": "Santa Bárbara Garden", "text_en": "A formal 17th-century garden next to the Episcopal Palace: trimmed box hedge maze, fountains and roses. The archbishop's palace backdrop frames the garden from the street. One of Braga's most picturesque photographs without entering a single building.", "tip_en": "The roses are at their best in May. The classic shot is from the exterior gate with the palace in the background.", "price_en": "Free", "hours_en": "Daily dawn-dusk", "time_en": "15-20 min", "id": "oporto-d3-13", "name": "Jardim de Santa Bárbara", "closed": false, "ll": [41.5513604, -8.4259038], "q": "Jardim de Santa Bárbara Porto", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "Diario amanecer-anochecer", "rating": "4.7", "web": "", "text": "Jardín formal del siglo XVII junto al Palacio Episcopal: laberinto de boj recortado, fuentes y rosas. El fondo del palacio del arzobispo enmarca el jardín desde la calle. Una de las fotografías más pintorescas de Braga sin entrar a ningún edificio.", "tip": "Las rosas están en su mejor momento en mayo. La foto clásica es desde la reja exterior con el palacio al fondo.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Episcopal Palace (indoors, ~1 min on foot).", "leg": {"min": 4, "km": 0.30397618132214155, "mode": "walk"}}, {"name_en": "Braga Episcopal Palace", "text_en": "A 14th-century building extended in the 17th and 18th centuries: one of the largest episcopal residences in Portugal. The facade faces the Santa Bárbara Garden.", "tip_en": "Visit alongside the garden, they are physically adjacent.", "price_en": "Free exterior", "hours_en": "24h exterior", "time_en": "10 min · exterior", "id": "oporto-d3-14", "name": "Palácio Episcopal Braga", "closed": false, "ll": [41.5509529, -8.4264201], "q": "Palácio Episcopal Braga Porto", "min": 10, "time": "10 min · exterior", "price": "Gratis exterior", "hours": "24h exterior", "rating": "4.4", "web": "", "text": "Edificio del siglo XIV ampliado en el XVII y XVIII: una de las residencias episcopales más grandes de Portugal. La fachada da al Jardim de Santa Bárbara.", "tip": "Visitar junto al jardín, están físicamente pegados.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.08117493353336275, "mode": "walk"}}, {"name_en": "Braga Cathedral", "text_en": "Portugal's oldest cathedral (started 1070, completed 1509). The facade is a layered mix of Romanesque, Gothic, Manueline and Baroque accumulated over 500 years. The exterior is more interesting than the interior, walk around the whole building to see all the architectural styles stacked up.", "tip_en": "The cathedral treasury holds Saint Gerald's chalice and the best-preserved medieval vestments in northern Portugal. Worth €5 if that interests you.", "price_en": "Free exterior · Interior €5", "hours_en": "Daily 8:30-18:30", "time_en": "30-45 min", "id": "oporto-d3-15", "name": "Catedral de Braga", "closed": false, "ll": [41.5499885, -8.4269012], "q": "Catedral de Braga Porto", "min": 40, "time": "30-45 min", "price": "Exterior gratis · Interior 5€", "hours": "Diario 8:30-18:30h", "rating": "4.6", "web": "", "text": "La catedral más antigua de Portugal (iniciada en 1070, terminada en 1509). La fachada es una mezcla de románico, gótico, manuelino y barroco acumulados durante 500 años. El exterior es más interesante que el interior, rodear el edificio para ver todos los estilos estratificados.", "tip": "El tesoro de la catedral tiene el cáliz de San Geraldo y los ornamentos medievales mejor conservados del norte de Portugal. Vale los 5€ si te interesan.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.14880559074757552, "mode": "walk"}}, {"name_en": "Porta Nova Arch", "text_en": "An 18th-century archway that marked the entrance to the medieval walled city. One of the few remaining sections of Braga's old walls. The standard photographic angle is from inside the arch looking out towards the street.", "tip_en": "Reference point for leaving the centre and getting back to the car for the drive to Porto.", "price_en": "Free", "hours_en": "24h", "time_en": "5 min", "id": "oporto-d3-16", "name": "Arco de la Puerta Nueva", "closed": false, "ll": [41.5502644, -8.4293422], "q": "Arco de la Puerta Nueva Porto", "min": 5, "time": "5 min", "price": "Gratis", "hours": "24h", "rating": "4.5", "web": "", "text": "Arco del siglo XVIII que marcaba la entrada a la ciudad amurallada medieval. Uno de los pocos restos de la muralla de Braga. La perspectiva fotográfica desde dentro del arco mirando a la calle es la habitual.", "tip": "Punto de referencia para salir del centro y volver al coche hacia Oporto.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~4 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Braga Cathedral (indoors, ~4 min on foot).", "leg": {"min": 4, "km": 0.2670627491888702, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 3 · Fri", "small_en": "Fri", "title_en": "Day trip: Guimarães → Braga"}, {"key": "d4", "big": "4", "small": "sáb", "label": "Día 4 · sáb", "title": "Aliados · Bolhão · Matosinhos", "zone": "Aliados", "est": "~7–9h", "start": "10:30", "sunset": null, "from": "Estação de São Bento", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Casa da Música: consultar programa en casadamusica.com si hay concierto."]}, {"h": "⏱ ANÁLISIS DE TIEMPO", "lines": ["Mañana compacta, todos los puntos del centro caben en 3.5h arrancando a las 8:30h. A las 12-12:30h libre para coger el metro a Matosinhos.", "Matosinhos: toda la tarde hasta las 18-19h."]}, {"h": "🎯 LOS QUE MANDAN", "lines": ["São Bento: llegar antes de las 9h, los grupos turísticos llenan el atrio desde las 10h", "Mercado Bolhão: llegar antes de las 10h para el ambiente de mercado real · Cerrado domingos", "Matosinhos: salir de Aliados antes de las 12:30h para comer allí"]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["8:30-9:00h, São Bento (sin grupos, luz de la mañana)", "9:00-10:00h, Mercado Bolhão", "12:30h, Metro desde Trindade a Matosinhos-Sul (25 min, 1.50€)", "13:00-14:30h, Comer en Rua Heróis de França", "14:30-18:30h, Playa, Parque da Cidade, Puerto Leixões"]}, {"h": "🚗 TRANSPORTE VUELTA", "lines": ["Metro Matosinhos-Sul → Trindade: 25 min, 1.50€. O taxi/Uber directo al hotel: 15 min, 12-15€."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Casa da Música: check the programme at casadamusica.com for concerts."]}, {"h": "⏱ TIME BREAKDOWN", "lines": ["Compact morning, all city centre points fit in 3.5h starting at 8:30. Free by 12:00-12:30 to take the metro to Matosinhos.", "Matosinhos: the whole afternoon until 18:00-19:00."]}, {"h": "🎯 ANCHORS", "lines": ["São Bento: arrive before 9:00, tour groups fill the atrium from 10:00", "Mercado do Bolhão: arrive before 10:00 for the real market atmosphere · Closed Sundays", "Matosinhos: leave Aliados before 12:30 to have lunch there"]}, {"h": "⏰ KEY TIMES", "lines": ["8:30-9:00, São Bento (no groups, morning light)", "9:00-10:00, Mercado do Bolhão", "12:30, Metro from Trindade to Matosinhos-Sul (25 min, €1.50)", "13:00-14:30, Lunch on Rua Heróis de França", "14:30-18:30, Beach, Parque da Cidade, Leixões port"]}, {"h": "🚗 GETTING BACK", "lines": ["Metro Matosinhos-Sul → Trindade: 25 min, €1.50. Or direct taxi to the hotel: 15 min, €12-15."]}], "stops": [{"name_en": "São Bento Railway Station", "text_en": "A 1916 train station with 20,000 hand-painted tiles in the central atrium: medieval battles, rural scenes from northern Portugal, the arrival of the first train in Porto. The contrast between the everyday function (people catching commuter trains) and the decorative scale of the atrium is the whole point.", "tip_en": "FIRST STOP OF THE DAY, go before 9:00. Tour groups fill the atrium from 10:00 onwards. The tiles are best seen from the far end, looking back towards the entrance.", "price_en": "Free", "hours_en": "Daily 8:00-23:00 (atrium always open)", "time_en": "20-30 min", "id": "oporto-d4-0", "name": "Estação de São Bento", "closed": false, "ll": [41.1456094, -8.6103747], "q": "Estação de São Bento Porto", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "Diario 8-23h (atrio siempre abierto)", "rating": "4.8", "web": "", "text": "Estación de tren de 1916 con 20.000 azulejos pintados a mano en el atrio central: batallas medievales, escenas rurales del norte de Portugal, la llegada del primer tren a Oporto. El contraste entre la función cotidiana (gente cogiendo trenes de cercanías) y la escala decorativa del atrio es el dato.", "tip": "PRIMER PUNTO DEL DÍA, ir antes de las 9h. A partir de las 10h los grupos turísticos llenan el atrio. Los azulejos se ven mejor desde el fondo mirando hacia la entrada.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Rua de 31 de Janeiro", "text_en": "The street connecting São Bento to Bolhão: 19th-century houses with tiles in various states of decay, old-school local shops, without the gentrification of Rua das Flores.", "tip_en": "The contrast with Rua das Flores (more restored, more touristy) is striking given that they run parallel. This street has more local life.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min · walk", "id": "oporto-d4-1", "name": "Rua de 31 de Janeiro", "closed": false, "ll": [41.1461287, -8.6102151], "q": "Rua de 31 de Janeiro Porto", "min": 10, "time": "10 min · paseo", "price": "Gratis", "hours": "24h", "rating": "4.3", "web": "", "text": "Calle que conecta São Bento con Bolhão: casas del siglo XIX con azulejos en diferentes estados de deterioro, pequeños comercios de toda la vida, sin la gentrificación de Rua das Flores.", "tip": "El contraste con Rua das Flores (más restaurada, más turística) es llamativo siendo paralelas. Esta calle tiene más vida local.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Estação de São Bento (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up São Bento Railway Station (indoors, ~1 min on foot).", "leg": {"min": 0, "km": 0.07705074096374005, "mode": "walk"}}, {"name_en": "Santo Ildefonso Church · facade with 11,000 tiles", "text_en": "The main facade covered with 11,000 blue and white tiles (1932) depicting biblical and mythological scenes. The Praça da Batalha in front was a cemetery, the bodies are still under the pedestrian square.", "tip_en": "The best perspective is from the far end of Praça da Batalha, at about 80 metres the entire facade fits in frame.", "price_en": "Free exterior · Interior €3", "hours_en": "Mon-Fri 8:00-12:30 and 15:00-18:30 · Sat 9:00-12:30 · Sun 10:00-12:30 and 15:00-18:30", "time_en": "15-20 min", "id": "oporto-d4-2", "name": "Iglesia de San Ildefonso · fachada 11.000 azulejos", "closed": false, "ll": [41.1460999, -8.6066989], "q": "Iglesia de San Ildefonso — fachada 11.000 azulejos Porto", "min": 20, "time": "15-20 min", "price": "Gratis exterior · Interior 3€", "hours": "Lun-Vie 8-12:30h y 15-18:30h · Sáb 9-12:30h · Dom 10-12:30h y 15-18:30h", "rating": "4.7", "web": "", "text": "La fachada principal cubierta con 11.000 azulejos azules y blancos (1932) narrando escenas bíblicas y mitológicas. La Praça da Batalha delante fue un cementerio, los cuerpos siguen bajo la plaza peatonal.", "tip": "La mejor perspectiva es desde el extremo opuesto de la Praça da Batalha, a unos 80 metros la fachada entera entra en el encuadre.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 5, "km": 0.3827738004587916, "mode": "walk"}}, {"name_en": "Batalha Square · former cemetery", "text_en": "The largest square in the centre was a cemetery from the reign of Alfonso III until the late 19th century. The iron railings in front of the church mark the perimeter of the old graveyard. The bodies are still under the pedestrian square.", "tip_en": "The full image of São Ildefonso is best seen from here. The cemetery history is not signposted, most visitors don't know they're walking over it.", "price_en": "Free", "hours_en": "24h", "time_en": "10 min", "id": "oporto-d4-3", "name": "Praça da Batalha · antiguo cementerio", "closed": false, "ll": [41.1454898, -8.6074304], "q": "Praça da Batalha — antiguo cementerio Porto", "min": 10, "time": "10 min", "price": "Gratis", "hours": "24h", "rating": "4.2", "web": "", "text": "La plaza más grande del centro fue un cementerio desde el reinado de Alfonso III hasta finales del siglo XIX. Las vallas de hierro frente a la iglesia marcan el perímetro del antiguo camposanto. Los cuerpos siguen bajo la plaza peatonal.", "tip": "La imagen completa de San Ildefonso se ve mejor desde aquí. La historia del cementerio no está señalizada, la mayoría de visitantes no sabe que está caminando sobre él.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia de San Ildefonso (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Santo Ildefonso Church (indoors, ~2 min on foot).", "leg": {"min": 0, "km": 0.11882030801955899, "mode": "walk"}}, {"name_en": "Liberdade Square + McDonald's in a palace", "text_en": "Praça da Liberdade marks the start of Avenida dos Aliados. The fact: McDonald's occupies a restored 19th-century neoclassical palace, marble, stucco and gilded mouldings inside, genuinely incongruous. The coffee at this McDonald's is served in the most elegant room in the chain.", "tip_en": "Go in just to see the interior, nobody is forcing you to order anything. The contrast is the whole point.", "price_en": "Free · McDonald's standard price", "hours_en": "24h · McDonald's from 8:00", "time_en": "10-15 min", "id": "oporto-d4-4", "name": "Liberdade Square + McDonald's palacete", "closed": false, "ll": [41.1466469, -8.6115366], "q": "Liberdade Square + McDonald's palacete Porto", "min": 15, "time": "10-15 min", "price": "Gratis · McDonald's precio estándar", "hours": "24h · McDonald's desde 8h", "rating": "4.4", "web": "", "text": "La Praça da Liberdade marca el inicio de la Avenida dos Aliados. El dato: el McDonald's ocupa un palacete neoclásico restaurado del siglo XIX, interior con mármoles, estucos y molduras doradas genuinamente incongruente. El café de McDonald's aquí tiene la sala más elegante de la cadena.", "tip": "Entrar aunque sea a ver el interior, nadie lo obliga a pedir nada. El contraste es lo que vale.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Estação de São Bento (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up São Bento Railway Station (indoors, ~3 min on foot).", "leg": {"min": 6, "km": 0.47724583090095163, "mode": "walk"}}, {"name_en": "Aliados Avenue", "text_en": "Porto's central axis: eclectic early-20th-century buildings with the City Hall at the far end. The scale of the avenue, the granite-faced bank buildings and the statue of King Dom João I at the centre.", "tip_en": "Walk from south to north so the City Hall sits at the end as a visual destination. The perspective from the centre of the avenue is the best.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min · walk", "id": "oporto-d4-5", "name": "Avenida dos Aliados", "closed": false, "ll": [41.1483096, -8.6108148], "q": "Avenida dos Aliados Porto", "min": 20, "time": "15-20 min · paseo", "price": "Gratis", "hours": "24h", "rating": "4.6", "web": "", "text": "El eje central de Oporto: edificios eclécticos del siglo XX con el Ayuntamiento al fondo. La escala de la avenida, los edificios bancarios con fachadas de granito y la estatua del rey Dom João I en el centro.", "tip": "Caminar de sur a norte para que el Ayuntamiento quede al fondo como destino visual. La perspectiva desde el centro de la avenida es la mejor.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto City Hall (indoors, ~3 min on foot).", "leg": {"min": 3, "km": 0.25286496627713473, "mode": "walk"}}, {"name_en": "Porto City Hall", "text_en": "A 19th-century neoclassical building at the northern end of the Aliados. The clock tower and columned portico are Porto's official tourist image. Best photographed from the middle of the avenue with perspective.", "tip_en": "The view from 200 metres down the Aliados is better than from directly in front of the building.", "price_en": "Free exterior", "hours_en": "24h exterior", "time_en": "10-15 min · exterior", "id": "oporto-d4-6", "name": "Ayuntamiento de Oporto", "closed": false, "ll": [41.1499084, -8.6107023], "q": "Ayuntamiento de Oporto Porto", "min": 15, "time": "10-15 min · exterior", "price": "Gratis exterior", "hours": "24h exterior", "rating": "4.4", "web": "", "text": "Edificio neoclásico del siglo XIX en el extremo norte de los Aliados. La fachada con el reloj y el pórtico de columnas es la imagen oficial de Oporto que aparece en documentos turísticos. Mejor fotografiado desde el centro de la avenida en perspectiva.", "tip": "La perspectiva desde 200 metros más abajo en los Aliados es mejor que desde delante del edificio.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 3, "km": 0.2314361693804433, "mode": "walk"}}, {"name_en": "Bolhão Market", "text_en": "A covered 1914 market with a two-storey iron structure: balconies with flower, fish, fruit and lace stalls. Reopened in 2022 after 4 years of restoration. The atmosphere at 9:00 with locals buying bacalhau is the authentic one.", "tip_en": "Arrive before 10:00 for the real market atmosphere. The flower stalls on the ground floor are the most photogenic. Closed Sundays.", "price_en": "Free entry · Products vary", "hours_en": "Mon-Fri 8:00-20:00 · Sat 8:00-17:00 · Closed Sunday", "time_en": "30-45 min", "id": "oporto-d4-7", "name": "Mercado de Bolhão", "closed": false, "ll": [41.1493855, -8.6071175], "q": "Mercado de Bolhão Porto", "min": 40, "time": "30-45 min", "price": "Gratis entrada · Productos variable", "hours": "Lun-Vie 8-20h · Sáb 8-17h · Cerrado Dom", "rating": "4.5", "web": "", "text": "Mercado cubierto de 1914 con estructura de hierro en dos pisos: balcones con puestos de flores, pescado, frutas, encajes. Reabierto en 2022 después de 4 años de restauración. El ambiente a las 9h con los locales comprando bacalao es el auténtico.", "tip": "Llegar antes de las 10h para el ambiente de mercado real. Los puestos de flores en la planta baja son los más fotogénicos. Cerrado los domingos.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 5, "km": 0.39745122598630783, "mode": "walk"}}, {"id": "oporto-d4-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [41.1493855, -8.6071175], "q": "restaurantes cerca de Mercado de Bolhão Porto", "min": 75, "price": "", "hours": "", "text": "Come por la zona: busca calidad-precio fuera de lo más turístico.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Eat around here: good value, away from the most touristy spots.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "Chapel of Souls", "text_en": "The exterior facade with 15,947 blue and white tiles is one of Portugal's largest figurative tile ensembles: scenes from the lives of St Francis of Assisi and St Catherine across both facades. The building is on a corner, best seen from the Rua Fernando Tomás side.", "tip_en": "The side facade (Fernando Tomás) gives the full perspective of the tile ensemble. From Rua de Santa Catarina you only see one side.", "price_en": "Free", "hours_en": "Mon-Sat 8:00-19:00 · Sun 9:00-13:00 and 17:00-20:00", "time_en": "15-20 min", "id": "oporto-d4-8", "name": "Capilla de las Almas", "closed": false, "ll": [41.1498821, -8.6056554], "q": "Capilla de las Almas Porto", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "Lun-Sáb 8-19h · Dom 9-13h y 17-20h", "rating": "4.6", "web": "", "text": "La fachada exterior con 15.947 azulejos azules y blancos es uno de los conjuntos de azulejos figurativos más grandes de Portugal: escenas de la vida de San Francisco de Asís y Santa Catalina en las dos fachadas. El edificio hace esquina, mejor desde el lado de la calle Fernando Tomás.", "tip": "La fachada lateral (Fernando Tomás) tiene la perspectiva completa del conjunto de azulejos. En la Rua de Santa Catarina solo se ve un lado.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Mercado de Bolhão (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Bolhão Market (indoors, ~2 min on foot).", "leg": {"min": 2, "km": 0.1745871760814211, "mode": "walk"}}, {"name_en": "Metro Trindade → Matosinhos-Sul", "text_en": "🚇 Metro, Líneas A / B / C / E Dirección: Matosinhos-Sul · 1.50€ billete andante · Tarjeta recargable en la máquina · Cada 5-10 min · Trayecto: ~25 min 📍 Salida desde Trindade (5 min a pie desde los Aliados). Matosinhos-Sul es la última parada, no hay confusión posible. Salir por la salida ‘Praia’, el mar está a 200m. 🔗 Conexiones desde Trindade: ➡️ Líneas A/B/C/E dirección Matosinhos-Sul (~25 min) 🚌 Bus alternativo: no recomendado, el metro es más rápido y directo", "tip_en": "Salir de los Aliados hacia las 12-12:30h para llegar a Matosinhos a la 1h.", "price_en": "", "hours_en": "", "time_en": "", "id": "oporto-d4-9", "name": "Metro Trindade → Matosinhos-Sul", "closed": false, "ll": [41.152277, -8.609299], "q": "Metro Trindade → Matosinhos-Sul Porto", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 Metro, Líneas A / B / C / E Dirección: Matosinhos-Sul · 1.50€ billete andante · Tarjeta recargable en la máquina · Cada 5-10 min · Trayecto: ~25 min 📍 Salida desde Trindade (5 min a pie desde los Aliados). Matosinhos-Sul es la última parada, no hay confusión posible. Salir por la salida ‘Praia’, el mar está a 200m. 🔗 Conexiones desde Trindade: ➡️ Líneas A/B/C/E dirección Matosinhos-Sul (~25 min) 🚌 Bus alternativo: no recomendado, el metro es más rápido y directo", "tip": "Salir de los Aliados hacia las 12-12:30h para llegar a Matosinhos a la 1h.", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 7, "km": 0.5264323992590061, "mode": "walk"}}, {"name_en": "Matosinhos Sul → Metro Trindade", "text_en": "🚇 Metro, Lines A / B / C Direction: Trindade (towards city centre) · €1.50 · Use the same card from the outbound trip · Every 5-10 min · Journey: ~25 min 📍 Get off at Trindade, the city centre stop. 5-min walk to the hotel or any point in the historic centre.", "tip_en": "Alternative if carrying luggage or tired: taxi from Matosinhos to the hotel, ~15 min, €12-15.", "price_en": "", "hours_en": "", "time_en": "", "id": "oporto-d4-10", "name": "Matosinhos Sul → Metro Trindade", "closed": false, "ll": [41.180171, -8.688553], "q": "Matosinhos Sul → Metro Trindade Porto", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 Metro, Líneas A / B / C Dirección: Trindade (sentido centro) · 1.50€ · Usar la misma tarjeta del viaje de ida · Cada 5-10 min · Trayecto: ~25 min 📍 Bajar en Trindade, parada del centro. 5 min a pie al hotel o a cualquier punto del centro histórico. 🔗 Conexiones desde Matosinhos-Sul: ➡️ Líneas A/B/C dirección Estádio do Dragão, bajar en Trindade (~25 min)", "tip": "Alternativa si se lleva equipaje o se está cansado: Uber desde Matosinhos al hotel, ~15 min, 12-15€.", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 42, "km": 9.520471123231605, "mode": "transit"}}, {"name_en": "Rua Heróis de França · eat in Matosinhos", "text_en": "Portugal's charcoal fish street. A dozen restaurants side by side all doing the same thing: sea bream, sea bass, sole, bacalhau on charcoal. No elaborate menu, no organised tourism. Porto locals have been coming here on Sundays for generations. Go into whichever one has the most locals inside, that's the only criterion. Order the whole sea bream on charcoal with potatoes and salad.", "tip_en": "", "price_en": "€15-22 per person", "hours_en": "Daily 12:00-16:00 and 19:00-23:00", "time_en": "1-1.5h", "id": "oporto-d4-11", "name": "Rua Heróis de França · comida en Matosinhos", "closed": false, "ll": [41.1811952, -8.693121], "q": "Rua Heróis de França — comida en Matosinhos Porto", "min": 75, "time": "1-1.5h", "price": "15-22€ por persona", "hours": "Diario 12-16h y 19-23h", "rating": "", "web": "", "text": "La calle del pescado a la brasa de Portugal. Una docena de restaurantes uno al lado del otro haciendo lo mismo: dourada, robalo, linguado, bacalhau en brasa de carbón. Sin carta elaborada, sin turismo organizado. Los portuenses llevan generaciones viniendo aquí los domingos. Entrar al que tenga más locales dentro, es el único criterio necesario. Pedir la dourada entera a la brasa con patatas y ensalada.", "tip": "", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~134 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto City Hall (indoors, ~134 min on foot).", "leg": {"min": 7, "km": 0.518564920004232, "mode": "walk"}}, {"name_en": "Matosinhos Beach", "text_en": "A 2 km urban Atlantic beach 20 minutes from Porto's centre. In May the water is cold but the promenade is full of families, runners and people sunbathing on the rocks. The Atlantic waves are visible from the restaurants on Rua Heróis de França. Parque da Cidade starts right behind the beach, the two are best covered together.", "tip_en": "", "price_en": "Free", "hours_en": "24h", "time_en": "30-45 min", "id": "oporto-d4-12", "name": "Praia de Matosinhos", "closed": false, "ll": [41.1763702, -8.6926763], "q": "Praia de Matosinhos Porto", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Playa atántica urbana de 2 km a 20 min del centro de Oporto. En mayo el agua está fría pero el paseo está lleno de familias, corredores y gente tomando el sol en las rocas. Las olas del Atlántico son visibles desde los restaurantes de la Rua Heróis de França. El Parque da Cidade empieza justo detrás de la playa, los dos se recorren juntos.", "tip": "", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~129 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto City Hall (indoors, ~129 min on foot).", "leg": {"min": 9, "km": 0.6991463162689664, "mode": "walk"}}, {"name_en": "Fort of São Francisco Xavier", "text_en": "A 17th-century Atlantic fortress at the boundary between Matosinhos beach and Leixões port. The granite walls darkened by salt spray sit on the rocky shoreline. The interior is closed to the public, but the perimeter walk has the best views of the industrial port from sea level.", "tip_en": "Five minutes between the beach and Parque da Cidade. The angle from the rocky shore south of the fort, with the fortress in the background and the port to the north, is the shot.", "price_en": "Free exterior", "hours_en": "24h exterior", "time_en": "15 min", "id": "oporto-d4-13", "name": "Fuerte de San Francisco Javier", "closed": false, "ll": [41.1685772, -8.6899213], "q": "Fuerte de San Francisco Javier Porto", "min": 15, "time": "15 min", "price": "Gratis exterior", "hours": "24h exterior", "rating": "", "web": "", "text": "Fortaleza atlántica del siglo XVII en el límite entre la playa de Matosinhos y el puerto de Leixões. Los muros de granito oscurecido por el salitre se asientan sobre el litoral rocoso. Interior cerrado al público, pero el paseo por el perímetro tiene las mejores vistas del puerto industrial desde el nivel del mar.", "tip": "Cinco minutos entre la playa y el Parque da Cidade. El ángulo desde el litoral rocoso al sur del fuerte, con la fortaleza de fondo y el puerto al norte, es el plano.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~120 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto City Hall (indoors, ~120 min on foot).", "leg": {"min": 16, "km": 1.1657081810778673, "mode": "walk"}}, {"name_en": "City Park", "text_en": "Portugal's largest urban park: 83 hectares of meadows, lakes and woodland reaching the Atlantic edge. At weekends it's full of Porto families, couples, dogs and picnics. The central lake has ducks and rowing boats. The southern entrance leads directly to Matosinhos beach. The perfect end to the trip, green, open, local. Enter from the northern gate (next to the beach) and exit south towards Foz if you want to extend the walk.", "tip_en": "", "price_en": "Free", "hours_en": "Daily 8:00-21:00", "time_en": "45-60 min", "id": "oporto-d4-14", "name": "Parque da Cidade", "closed": false, "ll": [41.1686739, -8.6788358], "q": "Parque da Cidade Porto", "min": 55, "time": "45-60 min", "price": "Gratis", "hours": "Diario 8-21h", "rating": "", "web": "", "text": "El parque urbano más grande de Portugal: 83 hectáreas de praderas, lagos y bosque que llegan hasta el borde del Atlántico. Los fines de semana está lleno de familias portuenses, parejas, perros y picnics. El lago central tiene patos y barcas de remos. El acceso sur da directamente a la playa de Matosinhos. El cierre perfecto del viaje, verde, abierto, local. Entrar por la puerta norte (junto a la playa) y salir por el sur hacia la Foz si se quiere alargar el paseo.", "tip": "", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~105 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Porto City Hall (indoors, ~105 min on foot).", "leg": {"min": 16, "km": 1.2063636304542669, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 4 · Sat", "small_en": "Sat", "title_en": "Aliados · Bolhão · Matosinhos"}, {"key": "opt", "big": "+", "small": "extra", "label": "Si tienes tiempo", "title": "Si tienes tiempo", "zone": "Si tienes tiempo", "est": "", "start": "10:30", "sunset": null, "from": "Rua de Santa Catarina", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [], "brief_en": [], "stops": [{"name_en": "Santa Catarina Street · if you still have energy", "text_en": "The longest pedestrianised shopping street in Porto's centre. Café Majestic (1921, Art Nouveau) is worth a look even just from outside, expensive terrace but the interior is extraordinary.", "tip_en": "The Capilla das Almas at number 428 has 15,000 tiles on the facade.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min · walk on the way back", "id": "oporto-opt-0", "name": "Rua de Santa Catarina · si el cuerpo aguanta", "closed": false, "ll": [41.1534763, -8.6047487], "q": "Rua de Santa Catarina — si el cuerpo aguanta Porto", "min": 20, "time": "15-20 min · paseo de vuelta", "price": "Gratis", "hours": "24h", "rating": "4.4", "web": "", "text": "La calle comercial peatonal más larga del centro de Oporto. Parada de vuelta al devolver el coche o al llegar en taxi. El Café Majestic (1921, Art Nouveau) vale la parada aunque solo sea para verlo desde fuera, terraza cara pero el interior es extraordinario.", "tip": "La Capilla de las Almas en el número 428 tiene 15.000 azulejos en la fachada, el comienzo del Día 4 sin tener que volver.", "transport": false, "tags": [], "rain": "Al aire libre: con lluvia, visita rápida.", "rain_en": "Outdoors: if it rains, keep it short.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Casa da Música concert hall · if you still have energy", "text_en": "A 2005 concert hall designed by Rem Koolhaas: a concrete and glass polyhedron in the middle of a roundabout. The building's logic only makes sense from inside, the foyer has a direct view of the Douro through the stage. Home to the Porto Symphony Orchestra.", "tip_en": "Get there by metro (lines B/C/E/F, Casa da Música station, €1.50) or taxi from the centre (10 min, €8-10). If the symphony orchestra is playing, basic tickets are €5-10.", "price_en": "Guided visit: €10 · Concerts from €5-10 (orchestra) to €40", "hours_en": "Visits: Mon-Sat 11:00, 13:00 and 16:00 · Sun 11:00, 15:00 and 16:00 · Concerts: check programme", "time_en": "45-60 min (architectural visit) · Variable if there's a concert", "id": "oporto-opt-1", "name": "Casa de la Música · si el cuerpo aguanta", "closed": false, "ll": [41.1588467, -8.630737], "q": "Casa de la Música — si el cuerpo aguanta Porto", "min": 55, "time": "45-60 min (visita arquitectónica) · Variable si hay concierto", "price": "Visita guiada: 10€ · Conciertos desde 5-10€ (orquesta) hasta 40€", "hours": "Visitas: Lun-Sáb 11, 13 y 16h · Dom 11, 15 y 16h · Conciertos: consultar programa", "rating": "4.5", "web": "", "text": "Sala de conciertos de 2005 diseñada por Rem Koolhaas: poliedro de hormigón y cristal en medio de una rotonda. La lógica del edificio se ve solo desde dentro, el foyer tiene vista directa al Duero a través del escenario. Programación de la Orquestra Sinfónica do Porto.", "tip": "ÚLTIMO PUNTO DEL DÍA, hay que ir en metro (línea B/C/E/F, estación Casa da Música, 1.50€) o taxi desde el centro (10 min, 8-10€). Si hay concierto de la orquesta sinfonía, las entradas básicas están entre 5-10€. La visita guiada del edificio vale la pena aunque no haya concierto.", "transport": false, "tags": [], "rain": "Al aire libre: con lluvia, visita rápida.", "rain_en": "Outdoors: if it rains, keep it short.", "leg": {"min": 20, "km": 2.933086771274395, "mode": "transit"}}], "endLbl_en": "Finish", "label_en": "If you have time", "small_en": "extra", "title_en": "If you have time"}], "places": 61, "city": "Porto", "when": 2026.0, "year": 2026}, {"id": "berlin", "kind": "city", "title": "Berlín", "sub": "Historia, Kiez y buena cerveza", "country": "Alemania", "coverQ": "Oberbaumbrücke Berlin", "status": "done", "datesLabel": "Jueves a domingo · 4 días", "mid": "1t_bZZbt8rhQ1D41kmdim7c-4Z0CQE4E", "mid_en": "1j1F-g_t5b2FCYlG4tJliVuVaNy31sE8", "title_en": "Berlin", "sub_en": "History, Kiez and good beer", "country_en": "Germany", "datesLabel_en": "Thursday to Sunday · 4 days", "antes_en": [{"h": "📋 TICKETS TO BOOK", "rows": [{"t": "🏛 Reichstag, dome", "d": "Free entry, reservation required. Bring your passport. Request a LATE slot (4-6pm) to fit Day 1's route. → bundestag.de/besuche"}]}, {"h": "🎯 BOOK IF YOU CAN", "rows": [{"t": "🏺 Neues Museum, Nefertiti bust · Day 4", "d": "Summer queues can be long. Book online 1-2 weeks ahead. 12€. → smb.museum"}, {"t": "🗼 TV Tower, Alexanderplatz · Day 4", "d": "Without reservation: 1-2h queue. With reservation: direct entry. 23€. → tv-turm.de"}]}, {"h": "🔧 SORT BEFORE YOU GO", "rows": [{"t": "🚇 Transport pass", "d": "Zone AB covers the whole city. For 4 days, the 7-day pass (36€) is the best value. Buy at metro machines or in the BVG Fahrinfo app."}, {"t": "💵 Cash", "d": "Berlin is still a cash-heavy city. Many bars, markets and street food stalls don't accept cards. Withdraw at local ATMs (Sparkasse, Deutsche Bank). Avoid exchange booths and airport ATMs."}]}, {"h": "📱 APPS TO INSTALL", "rows": [{"t": "🚇 BVG Fahrinfo · Berlin", "d": "Metro, train, tram and bus. Buy tickets directly in the app."}, {"t": "🗺 Google Maps", "d": "Offline navigation. Download the Berlin area before you leave."}]}, {"h": "✈️ GETTING IN", "rows": [{"t": "🛬 BER → City centre", "d": "Best option: FEX (Flughafen Express) · direct train · 23 min · 5€ · every 15 min. S-Bahn S9 or S45: slower (40-50 min), same fare. Taxi: 50-80€. Private hire: similar. ⚠️ Validate your ticket BEFORE boarding. 60€ fine if not."}]}, {"h": "💡 GOOD TO KNOW", "rows": [{"t": "🍺 Drinking in the street", "d": "Completely legal and culturally normal. Spätis (24h corner shops) are a core part of local life."}, {"t": "🚲 Bike lanes on pavements", "d": "Marked in red. Don't walk in them. Classic tourist mistake."}, {"t": "♻️ Pfand system", "d": "Plastic bottles and some cans have a 0.25€ deposit. Return at supermarket machines. If you don't want to carry an empty bottle, leave it by a bin."}, {"t": "🤝 Tipping", "d": "Restaurant with table service: 5-10%. Say the total you want to pay: \"Mach es 25\" (make it 25€). Stimmt so = keep the change. Street food and counter service: nothing expected."}, {"t": "💧 Tap water", "d": "Excellent quality. No need to buy bottled."}]}, {"h": "🍽️ EAT IN BERLIN", "rows": [{"t": "🌭 Currywurst · 3-5€", "d": "The most Berlin thing you can eat. Sausage with spiced ketchup and curry powder. From a street Imbiss. Non-negotiable."}, {"t": "🥙 Döner Kebab · 5-7€", "d": "The best döner outside Turkey. Berlin's Turkish community invented the modern format."}, {"t": "🍖 Schnitzel", "d": "Breaded cutlet. Order it at a Gasthaus, not a tourist spot."}, {"t": "🍺 Berliner Weisse", "d": "Slightly sour wheat beer, served with raspberry (red) or woodruff (green) syrup."}, {"t": "🫓 Flammkuchen", "d": "Thin-crust flatbread with crème fraîche, onion and bacon. Very different from Italian pizza."}, {"t": "🧉 Club Mate", "d": "The Berlin club scene's drink. Mate-based, caffeinated."}, {"t": "🍩 Pfannkuchen", "d": "Jam-filled doughnut. In Berlin it's not called a berliner."}]}], "docName": "[ES] Berlín Salvaje — Historia, Kiez y buena cerveza", "antes": [{"h": "📋 ENTRADAS A RESERVAR", "rows": [{"t": "🏛 Reichstag, cúpula", "d": "Entrada gratuita con reserva obligatoria. Llevar pasaporte. Pedir slot de TARDE (16-18h) para que encaje con el recorrido del Día 1. → bundestag.de/besuche"}]}, {"h": "🎯 RESERVAR SI PUEDES", "rows": [{"t": "🏺 Neues Museum, busto de Nefertiti · Día 4", "d": "Las colas en verano son largas. Reservar online 1-2 semanas antes. 12€. → smb.museum"}, {"t": "🗼 Torre de TV, Alexanderplatz · Día 4", "d": "Sin reserva: cola de 1-2h. Con reserva: entrada directa. 23€. → tv-turm.de"}]}, {"h": "🔧 GESTIONAR ANTES", "rows": [{"t": "🚇 Billete de transporte", "d": "Zona AB cubre toda la ciudad. Para 4 días, el billete de 7 días (36€) es lo más económico. Comprar en máquinas del metro o en la app BVG Fahrinfo."}, {"t": "💵 Efectivo", "d": "Berlín sigue siendo ciudad de efectivo. Muchos bares, mercados y street food no aceptan tarjeta. Retirar en cajeros locales (Sparkasse, Deutsche Bank). Evitar casas de cambio y cajeros del aeropuerto."}]}, {"h": "📱 APPS A INSTALAR", "rows": [{"t": "🚇 BVG Fahrinfo · Berlin", "d": "Metro, tren, tranvía y autobús. Comprar billete directamente en la app."}, {"t": "🗺 Google Maps", "d": "Navegación offline. Descargar la zona de Berlín antes de salir."}]}, {"h": "✈️ LLEGAR", "rows": [{"t": "🛬 BER → Centro", "d": "Mejor opción: FEX (Flughafen Express) · tren directo · 23 min · 5€ · sale cada 15 min. S-Bahn S9 o S45: más lento (40-50 min), misma tarifa. Taxi: 50-80€. VTC: similar. ⚠️ Validar el billete ANTES de subir al tren. Multa 60€."}]}, {"h": "💡 SABER ANTES", "rows": [{"t": "🍺 Alcohol en la calle", "d": "Completamente legal y culturalmente normal. Los Spätis (tiendas 24h) son parte esencial de la cultura local."}, {"t": "🚲 Carriles bici en las aceras", "d": "Marcados en rojo. No caminar por ellos. Es un error habitual del turista."}, {"t": "♻️ Sistema Pfand", "d": "Envases de plástico y algunas latas tienen depósito de 0,25€. Se devuelven en máquinas de supermercado. Si no quieres llevarte la botella, déjala junto a una papelera."}, {"t": "🤝 Propinas", "d": "Restaurante con servicio: 5-10%. Decir el total deseado al pagar: \"Mach es 25\" (ponlo en 25€). Stimmt so = quédese con el cambio. Street food y cafeterías de mostrador: no se espera."}, {"t": "💧 Agua del grifo", "d": "Excelente calidad. No hace falta comprar embotellada."}]}, {"h": "🍽️ COMER EN BERLÍN", "rows": [{"t": "🌭 Currywurst · 3-5€", "d": "Lo más berlinés. Salchicha con ketchup especiado y curry en polvo. En cualquier Imbiss (puesto de calle). Obligatorio."}, {"t": "🥙 Döner Kebab · 5-7€", "d": "El mejor döner fuera de Turquía. La comunidad turca de Kreuzberg creó el formato moderno."}, {"t": "🍖 Schnitzel", "d": "Filete empanado. Pedir en un Gasthaus, no en sitios turísticos."}, {"t": "🍺 Berliner Weisse", "d": "Cerveza de trigo ligeramente ácida. Se sirve con sirope de frambuesa (rojo) o aspérula (verde)."}, {"t": "🫓 Flammkuchen", "d": "Pizza fina con crème fraîche, cebolla y bacon. Muy diferente a la pizza italiana."}, {"t": "🧉 Club Mate", "d": "La bebida de los clubs de Berlín. Base de mate, con cafeína."}, {"t": "🍩 Pfannkuchen", "d": "El donut relleno de mermelada. Aquí no se llama berliner."}]}], "base": null, "days": [{"key": "d1", "big": "1", "small": "jue", "label": "Día 1 · jue", "title": "Checkpoint Charlie · Eje histórico · Victory Column", "zone": "Checkpoint Charlie", "est": "~6–8h", "start": "10:30", "sunset": null, "from": "U Kochstraße", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Reichstag (cúpula): gratis · https://www.bundestag.de/besuche · Llevar pasaporte · Reservar con 2-4 semanas de antelación, pedir SLOT DE TARDE (16-18h) para coincidir con la ruta"]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["9:00h, Checkpoint Charlie (antes de que lleguen las masas)", "10:00h, Topografía del Terror (abre, llegar a la apertura = sin grupos escolares)", "15:00-16:00h, Holocaust Memorial (colas de mediodía ya han bajado)", "16:00-18:00h, Reichstag (slot de tarde reservado)", "18:30-19:30h, Victory Column (luz del atardecer sobre la Goldene Else)"]}, {"h": "⚠️ IMPORTANTE", "lines": ["La ruta va de este a oeste. Avanzas siempre hacia el atardecer.", "Los dos puntos que mandan son Topografía (10h apertura) y Reichstag (slot fijo).", "El rest encaja entre medias."]}, {"h": "🍽️ COMIDA", "lines": ["Zona Gendarmenmarkt: menú de almuerzo lunes-viernes antes de 13h.", "Evitar el pico 13:30-14:30 en toda la zona central."]}, {"h": "🚇 TRANSPORTE", "lines": ["Inicio: U6 Kochstraße (Checkpoint Charlie a 5 min a pie).", "Final: S Tiergarten (S5 · S7), justo en la puerta de Victory Column."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Reichstag dome: free · https://www.bundestag.de/besuche · Passport required · Book AFTERNOON slot (16:00-18:00)"]}, {"h": "⏱ TIME ANALYSIS", "lines": ["If you do all points: ~12h 44min (including ~60 min walking and ~50 min for lunch).", "Too much for one normal day.", "🎯 THE NON-NEGOTIABLES (plan everything else around these)", "Topography of Terror (opens 10:00 → arrive at opening)", "Holocaust Memorial (~15:00-16:00 → midday queues down)", "Reichstag (fixed afternoon slot → book 2-4 weeks ahead)", "Victory Column (sunset → last point of the day)"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~6h): Checkpoint Charlie → Topography → Gendarmenmarkt → Holocaust Memorial → Brandenburg Gate → Reichstag → Victory Column", "Normal (~8h): add German Cathedral, Bebelplatz, Unter den Linden, Führerbunker, Soviet Memorial", "Intense (~12h): all points of the day"]}, {"h": "⏰ KEY TIMES", "lines": ["9:00, Checkpoint Charlie (before the crowds)", "10:00, Topography of Terror (opening, no school groups)", "15:00-16:00, Holocaust Memorial (queues down)", "16:00-18:00, Reichstag (booked slot)", "18:30-19:30, Victory Column (sunset)"]}, {"h": "🍽️ FOOD", "lines": ["Gendarmenmarkt area: weekday lunch menu before 13:00.", "Avoid the 13:30-14:30 rush across the whole central area."]}, {"h": "🚇 TRANSPORT", "lines": ["Start: U6 Kochstraße → 5 min walk north to Checkpoint Charlie.", "End: S Tiergarten (S5 · S7), right at Victory Column."]}], "stops": [{"name_en": "START D1: U Kochstraße", "text_en": "🚇 U-Bahn stop: U Kochstraße Line: U6 📍 Checkpoint Charlie is 5 min walk north. 🔗 Connections: ⬇️ U6 south: Mehringdamm (2 stops) ⬆️ U6 north: Stadtmitte → U2 (1 stop) 🚌 Bus M29: stop Checkpoint Charlie (2 min)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d1-0", "name": "SALIDA D1: U Kochstraße", "closed": false, "ll": [52.5064603, 13.3905482], "q": "U Kochstraße Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 Parada U-Bahn: U Kochstraße Línea: U6 📍 Checkpoint Charlie está a 5 min a pie hacia el norte. 🔗 Conexiones: ⬇️ U6 sur: Mehringdamm (2 paradas) ⬆️ U6 norte: Stadtmitte → U2 (1 parada) 🚌 Bus M29: parada Checkpoint Charlie (2 min)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Checkpoint Charlie", "text_en": "The checkpoint booth is a tourist replica from the 90s, but the photographic context is interesting: giant historical photos of soldiers, the surrounding buildings. The paid museum isn't worth the price. The outdoor information panels tell the story just as well.", "tip_en": "First point of the day, you arrive before the selfie-stick crowds. The outdoor panels tell the story just as well as the paid museum.", "price_en": "Free exterior · Museum €14.50 (not recommended)", "hours_en": "24h exterior", "time_en": "20-30 min (area to explore)", "id": "berlin-d1-1", "name": "Checkpoint Charlie", "closed": false, "ll": [52.5074434, 13.3903913], "q": "Checkpoint Charlie Berlin", "min": 25, "time": "20-30 min", "price": "Gratis exterior · Museo 14.50€ (no recomendado)", "hours": "24h exterior", "rating": "4.2", "web": "", "text": "El famoso punto de cruce entre los sectores americano y soviético. Los guardias uniformados son actores. El punto histórico real está marcado en el suelo.", "tip": "Los paneles gratuitos del exterior cuentan la historia igual de bien que el museo de pago. Evita el Mauermuseum.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Topografía del Terror (a cubierto, ~8 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Topography of Terror (indoors, ~8 min on foot).", "leg": {"min": 0, "km": 0.14277938487292902, "mode": "walk"}}, {"name_en": "Topography of Terror", "text_en": "Germany's most visited museum after the Pergamon. Built on the exact site of the SS and Gestapo headquarters. The excavated basements are visible from inside. The outdoor section along Wall fragments is always accessible.", "tip_en": "Don't skip this. On this route you arrive at 10:00 opening, ideal: school groups haven't arrived yet. If you're late, come back after 17:00 when they've gone.", "price_en": "Free", "hours_en": "Daily 10:00-20:00", "time_en": "1.5-2h", "id": "berlin-d1-2", "name": "Topografía del Terror", "closed": false, "ll": [52.506747, 13.3837099], "q": "Topografía del Terror Berlin", "min": 105, "time": "1.5-2h", "price": "Gratis", "hours": "Diario 10:00-20:00", "rating": "4.7", "web": "https://www.topographie.de", "text": "El museo más visitado de Alemania tras el Pergamon. Construida sobre el emplazamiento exacto de la sede de las SS y la Gestapo. La excavación de los sótanos es visible desde el interior. La sección exterior a lo largo de fragmentos del Muro es siempre accesible.", "tip": "No te saltes esto. En esta ruta llegas a las 10h de apertura, ideal: los grupos escolares aún no han llegado. Si te retrasas, vuelve a entrar después de las 17h cuando se van.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 8, "km": 0.5964155433008178, "mode": "walk"}}, {"name_en": "Anhalter Bahnhof (ruin)", "text_en": "What remains of Europe's largest train station before the war: a fragment of crumbling brick façade standing alone in a vacant lot. Next to the ruin, a square has information panels about the deportation of Jews from this station.", "tip_en": "One of Berlin's most photogenic ruins. Right next to the Berlin Story Bunker.", "price_en": "Free", "hours_en": "24h (exterior)", "time_en": "15-20 min", "id": "berlin-d1-3", "name": "Estación de Anhalt (ruina)", "closed": false, "ll": [52.5036889, 13.3824896], "q": "Estación de Anhalt (ruina) Berlin", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "24h (exterior)", "rating": "", "web": "", "text": "Lo que queda de la mayor estación de trenes de Europa antes de la guerra: un fragmento de fachada de ladrillo desconchado que se sostiene solo en medio de un solar. Junto a la ruina hay una plaza con paneles informativos sobre la deportación de judíos desde esta estación.", "tip": "Una de las ruinas más fotogénicas de Berlín. Junto al Berlin Story Bunker.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Story Bunker (a cubierto, ~3 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berlin Story Bunker (indoors, ~3 min on foot).", "leg": {"min": 6, "km": 0.45491171844555567, "mode": "walk"}}, {"id": "berlin-d1-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [52.5036889, 13.3824896], "q": "restaurantes cerca de Estación de Anhalt (ruina) Berlin", "min": 75, "price": "", "hours": "", "text": "Zona Gendarmenmarkt: menú de almuerzo lunes-viernes antes de 13h. Evitar el pico 13:30-14:30 en toda la zona central.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Gendarmenmarkt area: weekday lunch menu before 13:00. Avoid the 13:30-14:30 rush across the whole central area.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "Berlin Story Bunker", "text_en": "The 5-storey anti-aircraft bunker next to the Anhalter Bahnhof ruin, with 3.8 metres of concrete ceiling. Houses the \"Berlin Story\", a comprehensive exhibition on the rise and fall of the Third Reich, alongside the bunker itself.", "tip_en": "Combine with the Anhalter Bahnhof ruin right next door.", "price_en": "Entry fee (approx. €15)", "hours_en": "Daily 10:00-19:00", "time_en": "1-1.5h", "id": "berlin-d1-4", "name": "Berlin Story Bunker", "closed": false, "ll": [52.5029008, 13.3803901], "q": "Berlin Story Bunker Berlin", "min": 75, "time": "1-1.5h", "price": "Entrada de pago (aprox. 15€)", "hours": "Diario 10:00-19:00", "rating": "4.5", "web": "", "text": "El búnker antiaéreo de 5 plantas junto a la ruina de la estación de Anhalt, con 3,8 metros de grosor en el techo. Alberga la \"Berlin Story\" con una exposición completa sobre el ascenso y caída del Tercer Reich, junto con el bunker en sí.", "tip": "Combinar con la visita a la ruina de la Anhalter Bahnhof, justo al lado.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 3, "km": 0.21704117883339613, "mode": "walk"}}, {"name_en": "[NERD PICK] Hansa Studios", "text_en": "📍 Nansen-Strasse 28, Tiergarten The studio where these were recorded: David Bowie: Heroes (1977), Low, Lodger Iggy Pop: The Idiot, Lust for Life U2: Achtung Baby (1991) Nick Cave: The First Born is Dead Active studio, not visitable. No plaque. No sign outside.", "tip_en": "The value is in the context. Pass by on the way to Schwerbelastungskörper.", "price_en": "Free (exterior only)", "hours_en": "No public access — active studio", "time_en": "10 min", "id": "berlin-d1-5", "name": "[PARA FRIKIS] Hansa Studios", "closed": false, "ll": [52.5062615, 13.3769934], "q": "[PARA FRIKIS] Hansa Studios Berlin", "min": 10, "time": "10 min", "price": "
