ße.", "Para Schwerbelastungskörper: S1 Julius-Leber-Brücke o Bus 104 Kolonnenbrücke.", "Final: S+U Tempelhof (U6 · S41 · S42) o U Kottbusser Tor si terminas en Kreuzberg."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Fichtebunker (guided tour): approx. €17 · https://www.berliner-unterwelten.de · Guided tour only, fixed time", "Schwerbelastungskörper: opens April-October · https://www.schwerbelastungskoerper.de"]}, {"h": "⏱ TIME ANALYSIS", "lines": ["If you do all points: ~11h 38min (including ~55 min walking and ~50 min for lunch).", "This day has many scattered points. Choose by energy."]}, {"h": "🎯 THE NON-NEGOTIABLES", "lines": ["Winterfeldtplatz Market: arrive before 10:00, first 2h are best", "Schwerbelastungskörper: opens at 13:00 (Apr-Oct) → fits well mid-afternoon", "Tempelhofer Feld: best from 16:00, last point of the day"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~5h): Market → Rathaus Schöneberg → Viktoria Park → Tempelhofer Feld → Airport", "Normal (~7h): add Urban Nation, Bowie, Schwerbelastungskörper, Bergmannkiez", "Intense (~11h): all points (requires pre-booked Fichtebunker)"]}, {"h": "⏰ KEY TIMES", "lines": ["8:30, Winterfeldtplatz Market (arrive at opening, Saturdays far better)", "13:00, Schwerbelastungskörper (opens at 13:00)", "16:00, Tempelhofer Feld (best from here)"]}, {"h": "🍽️ FOOD", "lines": ["Winterfeldtplatz Market: market breakfast, €5-8.", "Bergmannkiez: Marheineke covered market, good midday stop."]}, {"h": "🚇 TRANSPORT", "lines": ["Start: U4 Viktoria-Luise-Platz or Bus M19/M29 stop Winterfeldtstraße.", "For Schwerbelastungskörper: S1 Julius-Leber-Brücke or Bus 104 Kolonnenbrücke.", "End: S+U Tempelhof (U6 · S41 · S42)."]}], "stops": [{"name_en": "START D3: Winterfeldtplatz", "text_en": "📍 No direct stop. Options to get there: 🚇 U4: U Viktoria-Luise-Platz (5 min walk north) 🚇 U7: U Eisenacher Str (5 min walk east) 🚌 Bus M19 · M29: stop Winterfeldtstraße (at the square)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d3-0", "name": "SALIDA D3: Winterfeldtplatz", "closed": false, "ll": [52.4957378, 13.3544831], "q": "Winterfeldtplatz Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "📍 Sin parada propia. Opciones para llegar: 🚇 U4: U Viktoria-Luise-Platz (5 min a pie hacia el norte) 🚇 U7: U Eisenacher Str (5 min a pie hacia el este) 🚌 Bus M19 · M29: parada Winterfeldtstraße (en la propia plaza)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Winterfeldtplatz Market", "text_en": "Schöneberg's most popular neighbourhood market: flowers, local cheeses, clothing and street food. Saturday is far better for atmosphere. Turkish bread, olives, organic produce, grilled sausages and antiques on Saturdays.", "tip_en": "First 2 hours for the best. Saturday is far better than Wednesday.", "price_en": "Free (entry) · Products €3-15", "hours_en": "Wed 8:00-14:00 · Sat 8:00-16:00", "time_en": "1-1.5h", "id": "berlin-d3-1", "name": "Mercado Winterfeldtplatz", "closed": false, "ll": [52.4968074, 13.3542667], "q": "Mercado Winterfeldtplatz Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis (entrada) · Productos 3-15€", "hours": "Miér 8:00-14:00 · Sáb 8:00-16:00", "rating": "4.5", "web": "", "text": "El mercado de barrio más popular de Schöneberg: mezcla de puesto de flores, quesos locales, ropa y comida callejera. El sábado es el mejor para ambiente. Pan turco, aceitunas, productos ecológicos, salchichas a la parrilla y antigüedades los sábados.", "tip": "Primeras 2 horas para lo mejor. El sábado es mucho mejor que el miércoles.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~26 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~26 min on foot).", "leg": {"min": 2, "km": 0.15578280182394383, "mode": "walk"}}, {"name_en": "Deportation Memorial Stone", "text_en": "Commemorative plaque for homosexuals deported and killed in Nazi concentration camps. In the neighbourhood where Christopher Isherwood, David Bowie and Iggy Pop lived. The plaque is small and easy to miss, though the historical context is very significant.", "tip_en": "Schöneberg was the centre of Berlin's gay life in the 1920s and again in the 1970s. This plaque marks the cost of that.", "price_en": "Free", "hours_en": "24h", "time_en": "5 min", "id": "berlin-d3-2", "name": "Gedenkstein · placa deportados", "closed": false, "ll": [52.4994609, 13.3534745], "q": "Gedenkstein — placa deportados Berlin", "min": 5, "time": "5 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Placa conmemorativa de los homosexuales deportados y exterminados en campos de concentración nazis. En el barrio donde vivieron Christopher Isherwood, David Bowie e Iggy Pop. La placa es pequeña y fácil de no verla, aunque el contexto histórico es muy significativo.", "tip": "El barrio de Schöneberg era el centro de la vida gay de Berlín en los años 20 y en los 70. Esta placa recuerda el coste de eso.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~30 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~30 min on foot).", "leg": {"min": 5, "km": 0.3898564715528549, "mode": "walk"}}, {"name_en": "Urban Nation", "text_en": "Germany's first museum dedicated exclusively to urban art, opened in 2017. The exterior murals on Bülowstraße change frequently. Interior exhibitions mix emerging and established global street art artists.", "tip_en": "The exterior façade is visitable free 24h even when the museum is closed.", "price_en": "Free", "hours_en": "Tue-Sun 10:00-18:00 · Closed Mondays", "time_en": "1-1.5h", "id": "berlin-d3-3", "name": "Urban Nation", "closed": false, "ll": [52.4987058, 13.3565036], "q": "Urban Nation Berlin", "min": 75, "time": "1-1.5h", "price": "Gratis", "hours": "Mar-Dom 10:00-18:00 · Cerrado lunes", "rating": "4.4", "web": "https://urban-nation.com", "text": "Primer museo dedicado exclusivamente al arte urbano en Alemania, inaugurado en 2017. Los murales de la fachada exterior en Bülowstraße cambian con frecuencia. Las exposiciones interiores mezclan artistas emergentes y consolidados del street art global.", "tip": "La fachada exterior es visitable gratis 24h aunque el museo esté cerrado.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~30 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~30 min on foot).", "leg": {"min": 4, "km": 0.28804423270063234, "mode": "walk"}}, {"id": "berlin-d3-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [52.4987058, 13.3565036], "q": "restaurantes cerca de Urban Nation Berlin", "min": 75, "price": "", "hours": "", "text": "Mercado Winterfeldtplatz: desayuno de mercado, 5-8€. Bergmannkiez: mercado Marheineke cubierto, buen street food.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Winterfeldtplatz Market: market breakfast, €5-8. Bergmannkiez: Marheineke covered market, good midday stop.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "[NERD PICK] Café Neues Ufer", "text_en": "The gay bar where David Bowie had breakfast almost every morning during his Berlin years (1976-1978), two doors from his apartment. One of Berlin's oldest gay bars, barely changed inside since the 1980s. The interest isn't the coffee, it's the historical continuity of the place.", "tip_en": "The value isn't the café itself. It's following Bowie's footsteps in a place unchanged since he was here.", "price_en": "Coffee €3-4 · Breakfast €7-12", "hours_en": "Daily from 9:00", "time_en": "30-45 min", "id": "berlin-d3-4", "name": "[PARA FRIKIS] Café Neues Ufer", "closed": false, "ll": [52.489544, 13.3598607], "q": "[PARA FRIKIS] Café Neues Ufer Berlin", "min": 40, "time": "30-45 min", "price": "Café 3-4€ · Desayuno 7-12€", "hours": "Diario desde 9:00", "rating": "4.3", "web": "", "text": "El bar gay donde David Bowie desayunaba casi cada mañana durante sus años berlineses (1976-1978), dos portales más allá del apartamento. Uno de los bares gay más veteranos de Berlín, sin cambios significativos en el interior desde los 80. El interés no es el café sino la continuidad histórica del lugar.", "tip": "El valor no es el café en sí. Es que sigues los pasos de Bowie en un local que no ha cambiado desde que él lo frecuentaba.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~20 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~20 min on foot).", "leg": {"min": 18, "km": 1.3569268576441151, "mode": "walk"}}, {"name_en": "[NERD PICK] David Bowie's Apartment", "text_en": "The commemorative plaque is on the façade of the Altbau where Bowie lived from 1976 to 1978, with Iggy Pop in the back flat. No entry. Bowie recorded his Berlin Trilogy here: Heroes (1977) Low (1977) Lodger (1979) The plaque is discreet and most people walk past without seeing it.", "tip_en": "Stop on the pavement, look at the building, take the photo. The café at no. 157 next door was his daily local.", "price_en": "Free", "hours_en": "Exterior 24h", "time_en": "5-10 min", "id": "berlin-d3-5", "name": "[PARA FRIKIS] Apartamento de David Bowie", "closed": false, "ll": [52.4891614, 13.3596174], "q": "[PARA FRIKIS] Apartamento de David Bowie Berlin", "min": 10, "time": "5-10 min", "price": "Gratis", "hours": "Exterior 24h", "rating": "", "web": "", "text": "La placa conmemorativa está en la fachada del Altbau donde Bowie vivió de 1976 a 1978 con Iggy Pop en el piso de atrás. No se puede entrar. Bowie grabó aquí su Trilogía de Berlín: Heroes (1977) Low (1977) Lodger (1979) La placa es discreta y la mayoría pasa sin verla.", "tip": "Para en la acera, mira el edificio, saca la foto. El café del nº 157 de al lado era su local de cada día.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~20 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~20 min on foot).", "leg": {"min": 0, "km": 0.05930750651301113, "mode": "walk"}}, {"name_en": "Rathaus Schöneberg", "text_en": "The town hall from whose window JFK delivered his \"Ich bin ein Berliner\" speech on 26 June 1963, before 400,000 people. The plaque on the façade marks the exact window.", "tip_en": "Kennedy's steps are accessible. The JFK-Platz in front has a market on Fridays.", "price_en": "Free", "hours_en": "Exterior 24h", "time_en": "20-30 min", "id": "berlin-d3-6", "name": "Rathaus Schöneberg", "closed": false, "ll": [52.4849484, 13.3441669], "q": "Rathaus Schöneberg Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "Exterior 24h", "rating": "4.4", "web": "", "text": "El ayuntamiento desde cuya ventana JFK pronunció el \"Ich bin ein Berliner\" el 26 de junio de 1963 ante 400.000 personas. La placa en la fachada indica la ventana exacta.", "tip": "Los escalones donde habló Kennedy son accesibles. La JFK-Platz delante tiene mercado los viernes.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 20, "km": 1.4901490719440442, "mode": "walk"}}, {"name_en": "John-F.-Kennedy-Platz", "text_en": "The square in front of Rathaus Schöneberg, renamed after Kennedy the day after his assassination in November 1963.", "tip_en": "The square sign is a good photo point.", "price_en": "Free", "hours_en": "24h · Market Fri 10:00-18:00", "time_en": "10-15 min", "id": "berlin-d3-7", "name": "John-F.-Kennedy-Platz", "closed": false, "ll": [52.4847485, 13.3450178], "q": "John-F.-Kennedy-Platz Berlin", "min": 15, "time": "10-15 min", "price": "Gratis", "hours": "24h · Mercado Vie 10:00-18:00", "rating": "", "web": "", "text": "La plaza frente al Rathaus Schöneberg, renombrada tras Kennedy el día después del asesinato en noviembre de 1963.", "tip": "El letrero de la plaza es un buen punto fotográfico.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~1 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~1 min on foot).", "leg": {"min": 0, "km": 0.08028427493310049, "mode": "walk"}}, {"name_en": "Rudolph-Wilde-Park", "text_en": "Green park in central Schöneberg. Good rest point between the market and the southern points.", "tip_en": "Pause to sit and regroup.", "price_en": "Free", "hours_en": "Dawn-dusk", "time_en": "20 min (rest stop)", "id": "berlin-d3-8", "name": "Rudolph-Wilde-Park", "closed": false, "ll": [52.4828472, 13.3411489], "q": "Rudolph-Wilde-Park Berlin", "min": 20, "time": "20 min (descanso)", "price": "Gratis", "hours": "Amanecer-anochecer", "rating": "", "web": "", "text": "Parque verde en el centro de Schöneberg. Buen punto de descanso entre el mercado y los puntos más al sur.", "tip": "Pausa para sentarse y reagruparse antes de la parte sur del día.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~5 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~5 min on foot).", "leg": {"min": 6, "km": 0.4376453650294203, "mode": "walk"}}, {"name_en": "[NERD PICK] Schwerbelastungskörper", "text_en": "A 12,650-tonne concrete cylinder built by Albert Speer in 1941 to test whether Berlin's ground could support the weight of the planned triumphal arch for \"Welthauptstadt Germania\". 14 metres in diameter, 18 metres tall. The result: It sank 18cm in 3 years. Project Germania was abandoned. The cylinder is still here. Still sinking. Almost nobody knows it exists. How to get there: S1 to Julius-Leber-Brücke, or Bus 104 stop Kolonnenbrücke. Corner of General-Pape-Str and Loewenhardtdamm.", "tip_en": "Absolutely worth the detour.", "price_en": "Free", "hours_en": "Tue-Sun 13:00-18:00 (April-October) · Exterior always accessible", "time_en": "30-45 min", "id": "berlin-d3-9", "name": "[PARA FRIKIS] Schwerbelastungskörper", "closed": false, "ll": [52.484045, 13.3716044], "q": "[PARA FRIKIS] Schwerbelastungskörper Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Mar-Dom 13:00-18:00 (abril-octubre) · Exterior siempre accesible", "rating": "4.4", "web": "https://www.schwerbelastungskoerper.de", "text": "Cilindro de hormigón de 12.650 toneladas construido por Albert Speer en 1941 para probar si el suelo de Berlín aguantaría el peso del arco de triunfo previsto para la \"Welthauptstadt Germania\". 14 metros de diámetro, 18 metros de altura. El resultado: Se hundió 18cm en 3 años. El proyecto Germania se abandonó. El cilindro sigue aquí. Todavía hundiéndose. Casi nadie sabe que existe. Cómo llegar: S1 hasta Julius-Leber-Brücke, o Bus 104 parada Kolonnenbrücke. Esquina General-Pape-Str y Loewenhardtdamm.", "tip": "Vale absolutamente la pena el desvío.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~32 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Rathaus Schöneberg (indoors, ~32 min on foot).", "leg": {"min": 19, "km": 2.686633623536952, "mode": "transit"}}, {"name_en": "Viktoria Park", "text_en": "66-metre hill in Kreuzberg with a neo-Gothic obelisk dedicated to the Napoleonic Wars. The viewpoint at the top gives views over south Berlin. About 10 min climb from the main entrance. In summer there's a small waterfall and a brewery at the base.", "tip_en": "Best panoramic view over south Berlin. The brewery at the foot of the hill is a good late afternoon stop.", "price_en": "Free", "hours_en": "Dawn-dusk", "time_en": "30-45 min", "id": "berlin-d3-10", "name": "Viktoria Park", "closed": false, "ll": [52.488227, 13.3800144], "q": "Viktoria Park Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Amanecer-anochecer", "rating": "4.5", "web": "", "text": "Colina de 66 metros en Kreuzberg con un obelisco neogótico dedicado a las guerras napoleónicas. El mirador desde lo alto da vistas sobre el sur de Berlín. Subida de unos 10 minutos desde la entrada principal. En verano hay una pequeña cascada artificial y una cervecería en la base.", "tip": "La mejor vista panorámica del sur de Berlín. La cervecería a los pies de la colina es un buen final de tarde.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~39 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Fichtebunker (indoors, ~39 min on foot).", "leg": {"min": 13, "km": 0.9557682268173427, "mode": "walk"}}, {"name_en": "Bergmannkiez · Bergmannstraße", "text_en": "The most representative street of non-touristy Kreuzberg: vintage shops, neighbourhood bars, Marheineke market, a neighbourhood that hasn't lost its character despite surrounding gentrification. The zone between Baerwaldstrasse and Marheinekeplatz is the most authentic.", "tip_en": "The Marheineke covered market has good neighbourhood street food. Less packed than the central markets.", "price_en": "Free", "hours_en": "24h", "time_en": "30-45 min", "id": "berlin-d3-11", "name": "Bergmannkiez", "closed": false, "ll": [52.4888995, 13.397023], "q": "Bergmannkiez Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "La calle más representativa del Kreuzberg no turístico: tiendas vintage, bares de barrio, mercado Marheineke, aspecto de barrio que no ha perdido el carácter a pesar de la gentrificación de los alrededores. La zona entre Baerwaldstrasse y Marheinekeplatz es la más auténtica.", "tip": "El mercado Marheineke (cubierto) tiene buen street food de barrio. Menos masificado que los mercados del centro.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~19 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Fichtebunker (indoors, ~19 min on foot).", "leg": {"min": 20, "km": 1.5002740447912468, "mode": "walk"}}, {"name_en": "Fichtebunker", "text_en": "130-year-old gasometer converted into a bunker during WWII. 9 floors. Berliner Unterwelten calls it a \"time machine\": it preserves elements from its different eras (gasometer, bunker, GDR fruit warehouse).", "tip_en": "Book online in advance. Only accessible on guided tours.", "price_en": "Approx. €17", "hours_en": "Guided tours: check times online", "time_en": "1.5h (guided tour)", "id": "berlin-d3-12", "name": "Fichtebunker", "closed": false, "ll": [52.4903547, 13.4129079], "q": "Fichtebunker Berlin", "min": 90, "time": "1.5h (tour guiado)", "price": "Aprox. 17€", "hours": "Tours guiados: consultar horarios online", "rating": "", "web": "https://www.berliner-unterwelten.de", "text": "Gasómetro de 130 años reconvertido en búnker durante la Segunda Guerra Mundial. Tiene 9 plantas. Berliner Unterwelten lo llama \"la máquina del tiempo\": conserva elementos de sus distintas épocas (gasómetro, búnker, almacén de frutas de la RDA).", "tip": "Reservar online con antelación. Solo accesible con tour guiado.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 19, "km": 1.4139129576647265, "mode": "walk"}}, {"name_en": "Körnerpark", "text_en": "An early 20th-century formal garden with stone staircases, Baroque fountains and granite terraces excavated from a quarry. Entirely surrounded by Neukölln façades. The contrast between the garden's formality and the urban surroundings is the most photogenic element.", "tip_en": "One of Berlin's most unknown and photogenic corners. Almost no tourists know it.", "price_en": "Free", "hours_en": "Dawn-dusk", "time_en": "20-30 min", "id": "berlin-d3-13", "name": "Körnerpark", "closed": false, "ll": [52.471517, 13.4382048], "q": "Körnerpark Berlin", "min": 25, "time": "20-30 min", "price": "Gratis", "hours": "Amanecer-anochecer", "rating": "4.6", "web": "", "text": "Un jardín formal de principios del siglo XX con escalinatas de piedra, fuentes barrocas y terrazas de granito excavado en una cantera. Enteramente rodeado de fachadas de Neukölln. El contraste entre la formalidad del jardín y el entorno urbano es el elemento más fotogénico.", "tip": "Uno de los rincones más desconocidos y fotogénicos de Berlín. Casi ningún turista lo conoce.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~47 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Fichtebunker (indoors, ~47 min on foot).", "leg": {"min": 22, "km": 3.5177829022871396, "mode": "transit"}}, {"name_en": "Tempelhofer Feld", "text_en": "The airport closed in 2008 converted into Berlin's most surreal public space: 386 hectares of abandoned runways where Berliners fly kites, rollerskate and picnic. The original runways are intact. The horizon without buildings is unique in Berlin.", "tip_en": "Best from 16:00 in summer. Bring something to eat. The 1941 airport building is one of the largest in the world.", "price_en": "Free", "hours_en": "Daily from 6:00 until dusk", "time_en": "1.5-2h", "id": "berlin-d3-14", "name": "Tempelhofer Feld", "closed": false, "ll": [52.4748569, 13.4005926], "q": "Tempelhofer Feld Berlin", "min": 105, "time": "1.5-2h", "price": "Gratis", "hours": "Diario desde las 6:00 hasta el atardecer", "rating": "4.7", "web": "https://tempelhoferfreiheit.de", "text": "El aeropuerto cerrado en 2008 convertido en el espacio público más surreal de Berlín: 386 hectáreas de pistas de aterrizaje abandonadas donde los berlineses hacen kite, rollerski y picnic. Las pistas originales están intactas. El horizonte sin edificios es único en Berlín.", "tip": "Mejor desde las 16h en verano. Llevar algo de comer. El edificio del aeropuerto de 1941 es uno de los más grandes del mundo.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~33 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Fichtebunker (indoors, ~33 min on foot).", "leg": {"min": 21, "km": 3.3468422001801947, "mode": "transit"}}, {"name_en": "Tempelhof Airport (building)", "text_en": "The airport building is one of the largest in the world and the largest Nazi-era building to survive: eagle-shaped footprint, 1.2km façade, massive 1930s concrete. Interior tours show the aircraft ramps and the history of the 1948 Berlin Airlift.", "tip_en": "The exterior is already impressive for free. The interior tour is worth it if you have energy left.", "price_en": "Approx. €6 (guided tour) · Free exterior", "hours_en": "Tours: check times on website", "time_en": "45-60 min (interior tour)", "id": "berlin-d3-15", "name": "Aeropuerto de Tempelhof (edificio)", "closed": false, "ll": [52.4824974, 13.38914], "q": "Aeropuerto de Tempelhof (edificio) Berlin", "min": 55, "time": "45-60 min (tour interior)", "price": "Aprox. 6€ (tour guiado) · Exterior gratis", "hours": "Tours: consultar horarios en web", "rating": "4.4", "web": "https://www.thf-berlin.de", "text": "El edificio del aeropuerto es uno de los mayores edificios del mundo y el mayor de la era nazi que sobrevivió: planta en forma de águila (literalmente), 1,2 km de fachada, hormigón masivo de los años 30. Los tours interiores muestran las rampas de acceso a los aviones y la historia del puente aéreo de 1948.", "tip": "El exterior ya es impresionante sin pagar. El tour interior merece la pena si te queda energía.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~32 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Fichtebunker (indoors, ~32 min on foot).", "leg": {"min": 20, "km": 1.4954942167064977, "mode": "walk"}}, {"name_en": "END D3: S+U Tempelhof", "text_en": "🚇 U-Bahn: U6 🚉 S-Bahn: S41 · S42 ⬆️ U6 north: Mehringdamm (1 stop) · Yorckstraße · Kleistpark 🔄 S41/S42: Ring line in both directions 🔗 Nearby (on foot): 🚌 Bus M46: stop U Tempelhof (at the station entrance)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d3-16", "name": "LLEGADA D3: S+U Tempelhof", "closed": false, "ll": [52.4709979, 13.3843975], "q": "S+U Tempelhof Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 U-Bahn: U6 🚉 S-Bahn: S41 · S42 ⬆️ U6 norte: Mehringdamm (1 parada) · Yorckstraße · Kleistpark 🔄 S41/S42: línea circular del Ring en ambas direcciones 🔗 Cerca (a pie): 🚌 Bus M46: parada U Tempelhof (en la entrada de la estación)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 23, "km": 1.7139327332706968, "mode": "walk"}}], "endLbl_en": "Finish", "label_en": "Day 3 · Sat", "small_en": "Sat", "title_en": "Schöneberg → Tempelhof"}, {"key": "d4", "big": "4", "small": "dom", "label": "Día 4 · dom", "title": "Prenzlauer Berg · Friedrichshain · Kreuzberg", "zone": "Prenzlauer Berg", "est": "~6–8h", "start": "10:30", "sunset": null, "from": "S+U Hackescher Markt", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [{"h": "🔔 RESERVAR ANTES", "lines": ["Neues Museum (busto de Nefertiti): 12€ · https://www.smb.museum · Reservar con antelación en verano", "Torre de TV Alexanderplatz (opcional): 23€ · https://tv-turm.de"]}, {"h": "⏱ ANÁLISIS DE TIEMPO", "lines": ["Este día tiene demasiados museos para hacerlos todos. Elige 1 museo grande o 1 grande + 1 pequeño como máximo.", "Con 1 museo grande: ~10h 17min", "Con 2 museos: ~11h 57min (ya es un día completo)", "🎯 LOS MUSEOS, ELIGE", "GRANDE (elige 1, llegar a las 13h para evitar colas):", "Neues Museum: busto de Nefertiti, arquitectura de Chipperfield con ruinas integradas. 2h · 12€ · Reservar online", "Altes Museum: antigüedades griegas y romanas, Rotonda espectacular. 1.5-2h · 10€", "Pérgamo: CERRADO hasta 2027. Solo ver exterior.", "PEQUEÑO (opcional, combinar con el grande):", "Berliner Dom: cripta con 90 sarcófagos prusianos, cúpula con vistas. 45-60 min · 9€", "(El Lustgarten y el exterior de la Isla valen de por sí, aunque no entres a ningún museo)"]}, {"h": "📋 ELIGE TU INTENSIDAD", "lines": ["Relajado (~6h): Lustgarten → 1 museo → Berliner Dom (exterior) → Alexanderplatz → East Side Gallery → Oberbaum → Oranienstrasse", "Normal (~10h): añade Haus des Lehrers, Mural Cosmonauta, KÖNIG GALERIE, Baerwaldbrücke", "Intenso (~11h): 2 museos + todos los puntos (día muy largo)"]}, {"h": "⏰ HORARIOS CLAVE", "lines": ["10:00h, Museo (llegar a la apertura o a las 13h cuando los grupos comen)", "16:00-17:00h, East Side Gallery (luz del oeste ilumina los murales)", "Noche, Madame Claude y Oranienstrasse para cerrar el día"]}, {"h": "🍽️ COMIDA", "lines": ["Hackescher Markt: a 5 min de la Isla de los Museos, buena parada antes o después del museo.", "Oranienstrasse y Görlitzer Park: múltiples opciones para cenar al final del día."]}, {"h": "🚇 TRANSPORTE", "lines": ["Inicio: S+U Hackescher Markt → 5 min a pie hasta la Isla de los Museos.", "De Oberbaum a Kreuzberg: U1 desde Warschauer Str hasta Schlesisches Tor/Kottbusser Tor.", "Final: U Kottbusser Tor (U1 · U8)."]}], "brief_en": [{"h": "🔔 BOOK AHEAD", "lines": ["Neues Museum (Nefertiti bust): €12 · https://www.smb.museum · Book in advance in summer", "TV Tower Alexanderplatz (optional): €23 · https://tv-turm.de"]}, {"h": "⏱ TIME ANALYSIS", "lines": ["This day has too many museums to do all of them. Choose 1 large museum or 1 large + 1 small maximum.", "With 1 large museum: ~10h 17min", "With 2 museums: ~11h 57min (already a full day)", "🎯 THE MUSEUMS, CHOOSE", "LARGE (choose 1, arrive at 13:00 to avoid queues):", "Neues Museum: Nefertiti bust, Chipperfield architecture with integrated ruins. 2h · €12 · Book online", "Altes Museum: Greek and Roman antiquities, spectacular Rotunda. 1.5-2h · €10", "Pergamon: CLOSED until 2027. Exterior only.", "SMALL (optional, combine with the large):", "Berliner Dom: crypt with 90 Prussian sarcophagi, dome with views. 45-60 min · €9", "(The Lustgarten and Museum Island exterior are worth it even without entering any museum)"]}, {"h": "📋 CHOOSE YOUR PACE", "lines": ["Relaxed (~6h): Lustgarten → 1 museum → Berliner Dom (exterior) → Alexanderplatz → East Side Gallery → Oberbaum → Oranienstraße", "Normal (~10h): add Haus des Lehrers, Cosmonaut Mural, KÖNIG GALERIE, Baerwaldbrücke", "Intense (~11h): 2 museums + all points (very long day)"]}, {"h": "⏰ KEY TIMES", "lines": ["10:00, Museum (arrive at opening or at 13:00 when groups are at lunch)", "16:00-17:00, East Side Gallery (western light hits the murals)", "Evening, Madame Claude and Oranienstraße to close the day"]}, {"h": "🍽️ FOOD", "lines": ["Hackescher Markt: 5 min from Museum Island, good stop before or after the museum.", "Oranienstraße and Görlitzer Park: multiple dinner options at the end of the day."]}, {"h": "🚇 TRANSPORT", "lines": ["Start: S+U Hackescher Markt → 5 min walk to Museum Island.", "From Oberbaum to Kreuzberg: U1 from Warschauer Str to Schlesisches Tor/Kottbusser Tor.", "End: U Kottbusser Tor (U1 · U8)."]}], "stops": [{"name_en": "START D4: S+U Hackescher Markt", "text_en": "🚉 S-Bahn stop: S+U Hackescher Markt Lines: S3 · S5 · S7 · S75 📍 5 min walk to Museum Island crossing Monbijoubrücke. 🔗 Connections: ⬅️ S5/S7 west: Alexanderplatz (1 stop) · Hauptbahnhof 🚇 U8 Weinmeisterstrasse (3 min walk)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d4-0", "name": "SALIDA D4: S+U Hackescher Markt", "closed": false, "ll": [52.5226613, 13.4022971], "q": "S+U Hackescher Markt Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚉 Parada S-Bahn: S+U Hackescher Markt Líneas S-Bahn: S3 · S5 · S7 · S75 📍 5 min a pie hasta la Isla de los Museos cruzando Monbijoubrücke. 🔗 Conexiones: ⬅️ S5/S7 oeste: Alexanderplatz (1 parada) · Hauptbahnhof 🚇 U8 Weinmeisterstrasse (3 min a pie)", "tip": "", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "Lustgarten", "text_en": "The square in front of the Berliner Dom and the Altes Museum. Geometric, open, well-framed. The Altes Museum's colossal neoclassical façade with 18 Ionic columns can only be fully appreciated from here. In summer locals sunbathe on the lawn with the Dom as backdrop.", "tip_en": "Best photographic framing of the Berliner Dom is from here, not from the Spree bank.", "price_en": "Free", "hours_en": "24h", "time_en": "15-20 min", "id": "berlin-d4-1", "name": "Lustgarten", "closed": false, "ll": [52.5187, 13.3992], "q": "Lustgarten Berlin", "min": 20, "time": "15-20 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "La plaza frente al Berliner Dom y el Altes Museum. Geométrica, despejada, bien encuadrada. El edificio del Altes Museum tiene una fachada colosal neoclásica con 18 columnas jónicas que solo se aprecia bien desde aquí. En verano la gente toma el sol en el césped con el Dom de fondo.", "tip": "El mejor encuadre fotográfico del Berliner Dom es desde aquí, no desde la orilla del Spree.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Altes Museum (a cubierto, ~2 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Altes Museum (indoors, ~2 min on foot).", "leg": {"min": 8, "km": 0.6341145830582662, "mode": "walk"}}, {"name_en": "Altes Museum", "text_en": "Berlin's first public museum (1830). Collection of Greek, Etruscan and Roman antiquities. The central Rotunda is one of the city's most impressive rooms. The façade with 18 Ionic columns is visible from the Lustgarten.", "tip_en": "Even without paying, the Altes Museum façade and Museum Island have architectural value from outside.", "price_en": "€10", "hours_en": "Tue-Sun 10:00-18:00 · Closed Mondays", "time_en": "1.5-2h", "id": "berlin-d4-2", "name": "Altes Museum", "closed": false, "ll": [52.5194665, 13.3987445], "q": "Altes Museum Berlin", "min": 105, "time": "1.5-2h", "price": "10€", "hours": "Mar-Dom 10:00-18:00 · Cerrado lunes", "rating": "4.5", "web": "", "text": "El primer museo público de Berlín (1830). Colección de antigüedades griegas, etruscas y romanas. La Rotonda central es una de las salas más impresionantes de la ciudad. La fachada con 18 columnas jónicas es visible desde el Lustgarten.", "tip": "Si no quieres pagar, la fachada del Altes Museum en sí y la Isla de los Museos tienen valor arquitectónico desde el exterior.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.11782172931719842, "mode": "walk"}}, {"name_en": "Neues Museum", "text_en": "Holds the bust of Nefertiti (room 3.10, floor 3). The building was destroyed in the war and rebuilt by David Chipperfield preserving visible ruins: the coexistence of destroyed and new is architecturally unique.", "tip_en": "The Nefertiti bust is small. Arrive at 13:00 to avoid queues.", "price_en": "€12 · Book in advance", "hours_en": "Tue-Sun 10:00-18:00 (Thu until 20:00) · Closed Mondays", "time_en": "2h", "id": "berlin-d4-3", "name": "Neues Museum", "closed": false, "ll": [52.5201349, 13.3976462], "q": "Neues Museum Berlin", "min": 120, "time": "2h", "price": "12€ · Reservar con antelación", "hours": "Mar-Dom 10:00-18:00 (jue hasta 20:00) · Cerrado lunes", "rating": "4.6", "web": "https://www.smb.museum", "text": "Contiene el busto de Nefertiti (sala 3.10, planta 3). El edificio fue destruido en la guerra y reconstruido por David Chipperfield conservando las ruinas visibles: la convivencia entre lo destruido y lo nuevo es arquitectónicamente única.", "tip": "El busto de Nefertiti es pequeño. Llegar a las 13h para evitar colas.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 0, "km": 0.13663053474615797, "mode": "walk"}}, {"id": "berlin-d4-lunch", "name": "Comida", "when": "Comida · 13:30", "meal": true, "ll": [52.5201349, 13.3976462], "q": "restaurantes cerca de Neues Museum Berlin", "min": 75, "price": "", "hours": "", "text": "Hackescher Markt: a 5 min de la Isla de los Museos, buena parada antes o después del museo. Oranienstrasse y Görlitzer Park: múltiples opciones para cenar al final del día.", "name_en": "Lunch", "when_en": "Lunch · 13:30", "text_en": "Hackescher Markt: 5 min from Museum Island, good stop before or after the museum. Oranienstraße and Görlitzer Park: multiple dinner options at the end of the day.", "rain_en": "Indoors: nothing changes.", "tip": "", "rain": "A cubierto: no cambia nada.", "leg": {"min": 0, "mode": "walk", "km": 0}, "tags": ["meal"]}, {"name_en": "TEMPORARILY CLOSED - Pergamon Museum", "text_en": "Germany's most visited museum: the Pergamon Altar (2nd century BC) and the Ishtar Gate of Babylon. Currently closed for renovation. Check smb.museum for partial opening before planning your visit.", "tip_en": "Verify partial opening at smb.museum before planning.", "price_en": "— Check partial opening", "hours_en": "Closed for renovation until 2027", "time_en": "— Closed until 2027", "id": "berlin-d4-4", "name": "CERRADO TEMPORALMENTE - Museo de Pérgamo", "closed": true, "ll": [52.521183, 13.3969], "q": "CERRADO TEMPORALMENTE - Museo de Pérgamo Berlin", "min": 10, "time": "— Cerrado hasta 2027", "price": "— Consultar apertura parcial", "hours": "Cerrado por obras hasta 2027", "rating": "4.6", "web": "https://www.smb.museum", "text": "El museo más visitado de Alemania: el Altar de Pérgamo (siglo II a.C.) y la Puerta de Ishtar de Babilonia están aquí. Actualmente cerrado por renovación. Si no vas a pagar, la fachada del edificio en sí y la Isla de los Museos tienen valor arquitectónico desde el exterior.", "tip": "Verificar si hay apertura parcial en smb.museum antes de planificar la visita.", "transport": false, "tags": ["closed"], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 2, "km": 0.16511199877266286, "mode": "walk"}}, {"name_en": "Berliner Dom", "text_en": "The crypt beneath the cathedral is the largest collection of Prussian sarcophagi in the world: over 90 Hohenzollern dynasty coffins, some with 17th-century bronze reliefs visible up close. The dome (270 steps) offers the best views over Museum Island and the Spree.", "tip_en": "Entry includes the dome and the crypt. Best time for views: afternoon.", "price_en": "€9 (includes dome climb)", "hours_en": "Mon-Sat 10:00-18:00 · Sun 12:00-18:00", "time_en": "45-60 min", "id": "berlin-d4-5", "name": "Berliner Dom", "closed": false, "ll": [52.5190608, 13.401078], "q": "Berliner Dom Berlin", "min": 55, "time": "45-60 min", "price": "9€ (incluye subida a la cúpula)", "hours": "Lun-Sáb 10:00-18:00 · Dom 12:00-18:00", "rating": "4.6", "web": "https://www.berlinerdom.de", "text": "La cripta bajo la catedral es la mayor colección de sarcófagos prusianos en el mundo: más de 90 ataúdes de la dinastía Hohenzollern, algunos con relieves de bronce del siglo XVII visibles de cerca. La cúpula (270 escalones) ofrece las mejores vistas sobre la Isla de los Museos y el Spree.", "tip": "La entrada incluye la cúpula y la cripta. Mejor hora para las vistas: tarde.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 6, "km": 0.4787036585663987, "mode": "walk"}}, {"name_en": "World Time Clock", "text_en": "The Weltzeituhr (World Time Clock) from 1969, designed by Erich John. Shows the time for 148 cities worldwide. A GDR work that has become Berlin's default meeting point.", "tip_en": "Next to the base of the Brunnen der Völkerfreundschaft. The reference point to meet anyone in Berlin.", "price_en": "Free", "hours_en": "24h", "time_en": "5-10 min", "id": "berlin-d4-6", "name": "World Time Clock", "closed": false, "ll": [52.5211743, 13.413297], "q": "World Time Clock Berlin", "min": 10, "time": "5-10 min", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "La Weltzeituhr (Reloj Mundial) de 1969, diseñada por Erich John. Muestra la hora de 148 ciudades del mundo. Obra de la RDA que se ha convertido en el punto de encuentro por excelencia de Berlín.", "tip": "Junto a la base del Brunnen der Völkerfreundschaft. Punto de referencia para quedar en Berlín.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~15 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berliner Dom (indoors, ~15 min on foot).", "leg": {"min": 15, "km": 1.1173414919077045, "mode": "walk"}}, {"name_en": "Haus des Lehrers", "text_en": "12-storey block with a 125-metre mosaic frieze running around the building: motifs of social life in the GDR. The adjacent Kongresshalle dome is equally interesting. Photographically very powerful with side sunlight.", "tip_en": "The 125-metre mosaic is one of Europe's largest. Right next to Alexanderplatz.", "price_en": "Free (exterior)", "hours_en": "", "time_en": "10-15 min (exterior)", "id": "berlin-d4-7", "name": "Haus des Lehrers", "closed": false, "ll": [52.5211536, 13.4161377], "q": "Haus des Lehrers Berlin", "min": 15, "time": "10-15 min (exterior)", "price": "Gratis (exterior)", "hours": "", "rating": "", "web": "", "text": "Bloque de 12 plantas con friso mural de mosaico de 125 metros que rodea el edificio: motivos de la vida social en la RDA. La cúpula del Kongresshalle adjunto es igualmente interesante. Fotográficamente muy potente con sol lateral.", "tip": "El mosaico de 125 metros es uno de los más grandes de Europa. Justo junto a Alexanderplatz.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~18 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berliner Dom (indoors, ~18 min on foot).", "leg": {"min": 3, "km": 0.24987500858471437, "mode": "walk"}}, {"name_en": "Alexanderplatz", "text_en": "The whole square is a set-piece of 1960s-70s socialist architecture: the Weltzeituhr (World Clock, 1969), the Brunnen der Völkerfreundschaft (Fountain of People's Friendship, 1970), the Centrum department store. The 368m TV Tower is the city's best viewpoint.", "tip_en": "Book the TV Tower online to avoid 1-2 hour queues.", "price_en": "TV Tower €23 (book online)", "hours_en": "Tower daily 9:00-24:00", "time_en": "30-45 min", "id": "berlin-d4-8", "name": "Alexanderplatz", "closed": false, "ll": [52.5219814, 13.413306], "q": "Alexanderplatz Berlin", "min": 40, "time": "30-45 min", "price": "Torre TV 23€ (reservar online)", "hours": "Torre diario 9:00-24:00", "rating": "4.4", "web": "Torre de TV: https://tv-turm.de", "text": "La plaza principal del Berlín oriental. La Torre de TV a 368m es el mejor mirador de la ciudad. El Reloj Mundial a nivel de calle es gratuito.", "tip": "Reservar la Torre de TV online para evitar colas de 1-2h.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~15 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up Berliner Dom (indoors, ~15 min on foot).", "leg": {"min": 4, "km": 0.27631739989263643, "mode": "walk"}}, {"name_en": "U Kottbusser Tor", "text_en": "🚇 U-Bahn stop: U Kottbusser Tor Lines: U1 · U8 ⬅️ U1 west: Gleisdreieck (5 stops) → U2 · U7 ➡️ U1 east: Warschauer Str (3 stops) → S-Bahn · Ostbahnhof ⬆️ U8 north: Moritzplatz (1 stop) · Alexanderplatz (4 stops) 🔗 Nearby (on foot): 🚌 Bus M29 · M41: stop Kottbusser Tor 🚇 U Görlitzer Bahnhof (U1, 3 min walk)", "tip_en": "", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d4-9", "name": "U Kottbusser Tor", "closed": false, "ll": [52.4989986, 13.4184263], "q": "U Kottbusser Tor Berlin", "min": 30, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 Parada U-Bahn: U Kottbusser Tor Líneas: U1 · U8 ⬅️ U1 oeste: Gleisdreieck (5 paradas) → U2 · U7 ➡️ U1 este: Warschauer Str (3 paradas) → S-Bahn · Ostbahnhof ⬆️ U8 norte: Moritzplatz (1 parada) · Alexanderplatz (4 paradas) 🔗 Cerca (a pie): 🚌 Bus M29 · M41: parada Kottbusser Tor 🚇 U Görlitzer Bahnhof (U1, 3 min al este)", "tip": "", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~21 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~21 min on foot).", "leg": {"min": 21, "km": 3.3526431792656677, "mode": "transit"}}, {"name_en": "[NERD PICK] Cosmonaut Mural · RAW", "text_en": "Kreuzberg's most iconic mural, by French artist Victor Ash: a giant 20-metre astronaut painted in black and white. One of Europe's first large street art murals (2001). On the exterior façade of the RAW complex (Revaler Str 99).", "tip_en": "The pin is at the specific mural. The full RAW-Gelände complex is worth 30 min of additional exploration.", "price_en": "Free", "hours_en": "Accessible 24h", "time_en": "10-15 min", "id": "berlin-d4-10", "name": "[PARA FRIKIS] Mural Cosmonauta · RAW", "closed": false, "ll": [52.4997346, 13.4229863], "q": "[PARA FRIKIS] Mural Cosmonauta — RAW Berlin", "min": 15, "time": "10-15 min", "price": "Gratis", "hours": "Accesible 24h", "rating": "", "web": "", "text": "El mural más emblemático de Kreuzberg, del artista francés Victor Ash: un astronauta gigante de 20 metros pintado en blanco y negro. Uno de los primeros grandes murales de street art de Europa (2001). Está en la fachada exterior del recinto RAW (Revaler Str 99).", "tip": "El pin está en el mural específico. El RAW-Gelände completo merece 30 min de exploración adicional.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~26 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~26 min on foot).", "leg": {"min": 6, "km": 0.4151433903326438, "mode": "walk"}}, {"name_en": "Oranienstrasse", "text_en": "Kreuzberg's main street for bars, independent shops and local character. At night it's one of Berlin's main nightlife areas. Belgian artist ROA painted hyperrealist animals on some façades in the area (search Google Maps \"ROA Berlin Oranienstraße\").", "tip_en": "More authentic the further east you walk, towards Kottbusser Tor.", "price_en": "Free", "hours_en": "24h · Bars from midday", "time_en": "30-45 min (walk)", "id": "berlin-d4-11", "name": "Oranienstrasse", "closed": false, "ll": [52.5034127, 13.4115769], "q": "Oranienstrasse Berlin", "min": 40, "time": "30-45 min (paseo)", "price": "Gratis", "hours": "24h · Bares desde mediodía", "rating": "4.4", "web": "", "text": "La calle principal de Kreuzberg para bares, tiendas independientes y carácter local. Por la noche es una de las zonas principales de ocio de Berlín. El artista belga ROA pintó animales hiperrealistas en algunas fachadas de la zona (buscar en Google Maps \"ROA Berlin Oranienstraße\").", "tip": "Más auténtica cuanto más camines hacia el este, dirección Kottbusser Tor.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~14 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~14 min on foot).", "leg": {"min": 15, "km": 1.1360680248491646, "mode": "walk"}}, {"name_en": "KÖNIG GALERIE", "text_en": "Brutalist church by Werner Düttmann (1967): windowless concrete exterior with a fortress-like appearance, interior with dramatic zenithal light. Converted into a contemporary art gallery.", "tip_en": "Even if you don't go in, the building from outside is one of Berlin's finest examples of Brutalism.", "price_en": "Free", "hours_en": "Tue-Sat 11:00-18:00 · Closed Sun-Mon", "time_en": "30-45 min", "id": "berlin-d4-12", "name": "KÖNIG GALERIE", "closed": false, "ll": [52.5006336, 13.4009082], "q": "KÖNIG GALERIE Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Mar-Sáb 11:00-18:00 · Cerrado Dom-Lun", "rating": "4.4", "web": "https://www.koeniggalerie.com", "text": "Iglesia brutalista de Werner Düttmann (1967): exterior de hormigón sin ventanas con aspecto de fortaleza, interior con luz cenital dramática. Reconvertida en galería de arte contemporáneo. La fachada exterior es arquitectura brutalista de primer nivel.", "tip": "Aunque no entres, el edificio desde fuera es uno de los mejores ejemplos de brutalismo en Berlín.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 14, "km": 1.021129920952963, "mode": "walk"}}, {"name_en": "Baerwaldbrücke", "text_en": "Walk along the canal. The Landwehrkanal borders the north of Neukölln and south of Kreuzberg. In spring the cherry trees in blossom along the banks turn the walk into one of Berlin's best seasonal photographs.", "tip_en": "The bridge itself is the reference point, but the canal walk in both directions is what's worth it.", "price_en": "Free", "hours_en": "24h", "time_en": "20-30 min (canal walk)", "id": "berlin-d4-13", "name": "Baerwaldbrücke", "closed": false, "ll": [52.4965723, 13.4051844], "q": "Baerwaldbrücke Berlin", "min": 25, "time": "20-30 min (paseo por el canal)", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Paseo por el canal. El Landwehrkanal que bordea el norte de Neukölln y el sur de Kreuzberg. En primavera los cerezos en flor en los márgenes convierten el paseo en una de las mejores fotografías estacionales de Berlín.", "tip": "El puente en sí es el punto de referencia, pero el paseo por el canal en ambas direcciones es lo que vale.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~9 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~9 min on foot).", "leg": {"min": 9, "km": 0.6973284367419608, "mode": "walk"}}, {"name_en": "Görlitzer Park", "text_en": "Park built on the tracks of the former Görlitzer Bahnhof (burned during the 1987 riots). The space preserves the track layout in the ground. Chaotic and non-touristy atmosphere, very representative of Kreuzberg.", "tip_en": "Quieter in the mornings.", "price_en": "Free", "hours_en": "Dawn-dusk", "time_en": "30-45 min", "id": "berlin-d4-14", "name": "Görlitzer Park", "closed": false, "ll": [52.4965928, 13.4374489], "q": "Görlitzer Park Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Amanecer-anochecer", "rating": "4.2", "web": "", "text": "Parque construido sobre las vías de la antigua estación de Görlitzer Bahnhof (quemada en los disturbios de 1987). El espacio conserva la trazada de las vías en el terreno. Atmósfera caótica y poco turística, muy representativa de Kreuzberg.", "tip": "Más tranquilo por las mañanas.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~44 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~44 min on foot).", "leg": {"min": 19, "km": 2.8394510188959616, "mode": "transit"}}, {"name_en": "Madame Claude", "text_en": "Bar in a former brothel whose décor is literally upside down: furniture hangs from the ceiling. Bar with live music and punk/alternative atmosphere. One of Kreuzberg's most original bars.", "tip_en": "For an evening drink, not daytime. The ceiling décor is worth the visit.", "price_en": "Drinks from €4", "hours_en": "From 19:00 · Best late", "time_en": "Variable (evening bar)", "id": "berlin-d4-15", "name": "Madame Claude", "closed": false, "ll": [52.4995184, 13.4372086], "q": "Madame Claude Berlin", "min": 30, "time": "Variable (bar nocturno)", "price": "Consumición desde 4€", "hours": "Desde 19:00 · Mejor tarde", "rating": "", "web": "", "text": "Bar en un antiguo burdel cuya decoración está literalmente al revés: los muebles están colgados del techo. Bar con música en directo y ambiente punk/alternativo. Uno de los bares más originales de Kreuzberg.", "tip": "Para tomar algo por la noche, no de día. La decoración del techo vale la visita.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~43 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~43 min on foot).", "leg": {"min": 6, "km": 0.42343382790537865, "mode": "walk"}}, {"name_en": "Oberbaumbrücke", "text_en": "Double-deck bridge over the Spree with neo-Gothic red brick towers. One of Berlin's best water framings. Cross it on foot and photograph it from both banks. During the Cold War it was one of the few crossing points between East and West.", "tip_en": "Best photos from the Spree banks, 100m east or west of the bridge.", "price_en": "Free", "hours_en": "24h", "time_en": "20 min", "id": "berlin-d4-16", "name": "Puente Oberbaum", "closed": false, "ll": [52.502269, 13.4463443], "q": "Puente Oberbaum Berlin", "min": 20, "time": "20 min", "price": "Gratis", "hours": "24h", "rating": "4.7", "web": "", "text": "Puente de doble nivel sobre el Spree con torres neogóticas de ladrillo rojo. Uno de los mejores encuadres del agua en Berlín. Cruzarlo a pie y fotografiarlo desde ambas orillas. Durante la Guerra Fría fue uno de los pocos puntos de cruce entre Este y Oeste.", "tip": "Las mejores fotos desde las orillas del Spree, 100m al este o al oeste del puente.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~53 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~53 min on foot).", "leg": {"min": 12, "km": 0.8968650546598581, "mode": "walk"}}, {"name_en": "East Side Gallery", "text_en": "The longest surviving Wall stretch (1,316 metres) with murals painted in 1990 by artists from around the world. Not a spot, you need to walk the full gallery end to end. Murals not to miss: The Brezhnev-Honecker kiss: \"My God, help me survive this deadly love.\" Test the Rest: the Trabant breaking through the Wall.", "tip_en": "Best late afternoon, the light hits the murals from the west. Go around to the east (unpainted) side: the original Wall surface.", "price_en": "Free", "hours_en": "Accessible 24h", "time_en": "45-60 min (walk the full gallery)", "id": "berlin-d4-17", "name": "East Side Gallery", "closed": false, "ll": [52.5050224, 13.4396953], "q": "East Side Gallery Berlin", "min": 55, "time": "45-60 min (recorrer toda la galería)", "price": "Gratis", "hours": "Accesible 24h", "rating": "4.6", "web": "", "text": "El tramo más largo del Muro conservado (1.316 metros) con murales pintados en 1990 por artistas de todo el mundo. No es un punto: hay que recorrer toda la galería a pie de extremo a extremo. Murales que no te puedes perder: El beso Brézhnev-Honecker: Señor, ayúdame a sobrevivir este amor mortal. Test the Rest: el Trabant atravesando el Muro.", "tip": "Mejor a última hora de la tarde, la luz ilumina los murales desde el oeste. Rodea hacia el lado este (no pintado): la superficie original del Muro.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~46 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~46 min on foot).", "leg": {"min": 9, "km": 0.7076033609250605, "mode": "walk"}}, {"name_en": "RAW-Gelände", "text_en": "Former railway repair workshop converted into a creative space. The full site has clubs, music venues, art studios, workshops and the cosmonaut mural on the exterior façade. The 20-metre Victor Ash mural (2001) was one of Europe's first large street art murals.", "tip_en": "Explore the whole site, not just the mural. It has a life of its own day and night.", "price_en": "Free (site) · Events and clubs ticketed", "hours_en": "Site accessible during the day", "time_en": "30-45 min (explore the site)", "id": "berlin-d4-18", "name": "RAW-Gelände", "closed": false, "ll": [52.5076567, 13.452028], "q": "RAW-Gelände Berlin", "min": 40, "time": "30-45 min (explorar el recinto)", "price": "Gratis (recinto) · Eventos y clubs de pago", "hours": "Recinto accesible durante el día", "rating": "", "web": "", "text": "Antiguo taller de reparación de trenes reconvertido en espacio creativo. El recinto completo tiene clubs, salas de música, estudios de arte, talleres y el mural del cosmonauta en la fachada exterior. El mural de 20 metros de Victor Ash (2001) fue uno de los primeros grandes murales de street art de Europa.", "tip": "Explorar el recinto entero, no solo el mural. Tiene vida propia de día y de noche.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~61 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~61 min on foot).", "leg": {"min": 15, "km": 1.149980448471835, "mode": "walk"}}, {"name_en": "Paul-Lincke-Ufer", "text_en": "Tree-lined walk along the Landwehrkanal in Kreuzberg. Good cafés and bars with canal views. Turkish Market on Tuesdays and Fridays. In spring the cherry blossom along the banks is one of the year's best photo opportunities.", "tip_en": "Easy to combine with Baerwaldbrücke walking along the canal.", "price_en": "Free", "hours_en": "24h", "time_en": "30 min (canal walk)", "id": "berlin-d4-19", "name": "Paul-Lincke-Ufer", "closed": false, "ll": [52.4938964, 13.428662], "q": "Paul-Lincke-Ufer Berlin", "min": 30, "time": "30 min (paseo por el canal)", "price": "Gratis", "hours": "24h", "rating": "", "web": "", "text": "Paseo arbolado a lo largo del Landwehrkanal en Kreuzberg. Buenos cafés y bares con vistas al canal. Mercado Turco los martes y viernes. En primavera los cerezos en flor en los márgenes son uno de los mejores momentos fotográficos del año.", "tip": "Fácil de combinar con Baerwaldbrücke caminando por el canal.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~35 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up KÖNIG GALERIE (indoors, ~35 min on foot).", "leg": {"min": 20, "km": 2.860806349088861, "mode": "transit"}}, {"name_en": "END D4: Warschauer Straße", "text_en": "🚇 U-Bahn: U1 🚉 S-Bahn: S3 · S5 · S7 · S9 📍 East Side Gallery 200m west. RAW-Gelände 5 min north. 🔗 Connections from Warschauer Straße: ➡️ U1 direction Uhlandstraße (west) ⬅️ U1 direction Schlesisches Tor (1 stop) ⬆️ S3/S5/S7/S9 direction Alexanderplatz (4 min)", "tip_en": "Friedrichshain's main hub. Gateway to the nightlife of the eastern zone. 10 min walk to Boxhagener Platz.", "price_en": "", "hours_en": "", "time_en": "", "id": "berlin-d4-20", "name": "LLEGADA D4: Warschauer Straße", "closed": false, "ll": [52.5064379, 13.4500663], "q": "Warschauer Straße Berlin", "min": 0, "time": "", "price": "", "hours": "", "rating": "", "web": "", "text": "🚇 U-Bahn: U1 🚉 S-Bahn: S3 · S5 · S7 · S9 📍 East Side Gallery a 200m al oeste. RAW-Gelände a 5 min al norte. 🔗 Conexiones desde Warschauer Straße: ➡️ U1 dirección Uhlandstraße (oeste) ⬅️ U1 dirección Schlesisches Tor (1 parada) ⬆️ S3/S5/S7/S9 dirección Alexanderplatz (4 min)", "tip": "Hub principal de Friedrichshain. Nodo de acceso a la vida nocturna de la zona este. Desde aquí a pie a Boxhagener Platz en 10 min.", "transport": true, "tags": [], "rain": "Transporte: no cambia.", "rain_en": "Transport: no change.", "leg": {"min": 19, "km": 2.6142664119425416, "mode": "transit"}}], "endLbl_en": "Finish", "label_en": "Day 4 · Sun", "small_en": "Sun", "title_en": "Prenzlauer Berg · Friedrichshain · Kreuzberg"}, {"key": "opt", "big": "+", "small": "extra", "label": "Si tienes tiempo", "title": "Si tienes tiempo", "zone": "Si tienes tiempo", "est": "", "start": "10:30", "sunset": null, "from": "Treptower Park", "endLbl": "Terminas", "mode": "city", "notes": [], "brief": [], "brief_en": [], "stops": [{"name_en": "Treptower Park · Soviet Memorial", "text_en": "The largest monument to fallen Soviet soldiers in Western Europe: a 12-metre sculpture of a Russian soldier holding a German child and crushing a swastika with his sword. Built in 1949. Monumental and solemn. How to get there: S8 or S9 to Treptower Park. About 15 min from the centre.", "tip_en": "Best extension of Day 4 if you have energy left.", "price_en": "Free", "hours_en": "Dawn-dusk", "time_en": "45-60 min", "id": "berlin-opt-0", "name": "Treptower Park · Memorial soviético", "closed": false, "ll": [52.4861394, 13.4719577], "q": "Treptower Park — Memorial soviético Berlin", "min": 55, "time": "45-60 min", "price": "Gratis", "hours": "Amanecer-anochecer", "rating": "4.7", "web": "", "text": "El mayor monumento a los caídos soviéticos en Europa Occidental: una escultura de 12 metros de un soldado ruso sosteniendo un niño alemán y destrozando una esvástica con la espada. Construido en 1949. Monumental y solemne. Cómo llegar: S8 o S9 hasta Treptower Park. Unos 15 min desde el centro.", "tip": "Mejor extensión del Día 4 si queda energía.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~118 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~118 min on foot).", "leg": {"min": 0, "mode": "walk", "km": 0}}, {"name_en": "[NERD PICK] Dark Matter", "text_en": "📍 Köpenicker Chaussee 46, Lichtenberg Seven rooms of light, space and sound installations in a former industrial factory in Lichtenberg. Created by Christopher Bauder (Whitevoid), the same artist behind LICHTGRENZE, the 8,000 illuminated balloons that marked the 25th anniversary of the fall of the Berlin Wall. Rooms are completely dark. Installations change regularly. How to get there: S-Bahn Rummelsburg, then tram 21 two stops to Gustav-Holzmann-Strasse, or 10-15 min walk.", "tip_en": "Far from the centre, plan the journey. Book in advance: time slots sell out.", "price_en": "Check prices on website · Online booking required", "hours_en": "Wed-Thu 14:00-22:00 · Fri 12:00-23:00 · Sat 11:00-23:00 · Sun 11:00-22:00 · Closed Mon-Tue", "time_en": "1-2h · timed entry", "id": "berlin-opt-1", "name": "[PARA FRIKIS] Dark Matter", "closed": false, "ll": [52.4927414, 13.4926954], "q": "[PARA FRIKIS] Dark Matter Berlin", "min": 90, "time": "1-2h · entrada por franja horaria", "price": "Consultar precio en web · Reserva obligatoria online", "hours": "Mié-Jue 14:00-22:00 · Vie 12:00-23:00 · Sáb 11:00-23:00 · Dom 11:00-22:00 · Cerrado lun-mar", "rating": "", "web": "https://en.darkmatter.berlin", "text": "📍 Köpenicker Chaussee 46, Lichtenberg Siete salas de instalaciones de luz, espacio y sonido en una antigua fábrica industrial en Lichtenberg. Creado por Christopher Bauder (Whitevoid), el mismo artista detrás de LICHTGRENZE, los 8.000 globos que marcaron el 25 aniversario de la caída del Muro. Las salas son completamente negras. Las instalaciones cambian con frecuencia. Cómo llegar: S-Bahn Rummelsburg, luego tranvía 21 dos paradas hasta Gustav-Holzmann-Strasse, o 10-15 min a pie.", "tip": "Lejos del centro, planifica el viaje. Reservar con antelación: las franjas horarias se agotan.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~129 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~129 min on foot).", "leg": {"min": 27, "km": 2.0597526882605908, "mode": "walk"}}, {"name_en": "David Hasselhoff Museum", "text_en": "Museum dedicated to The Hoff's role in the fall of the Wall. He performed \"Looking for Freedom\" on the Wall on New Year's Eve 1989. Near the East Side Gallery.", "tip_en": "Combine with Day 4. The humour of the place is part of the experience.", "price_en": "Small entry fee", "hours_en": "Check current times", "time_en": "20-30 min", "id": "berlin-opt-2", "name": "David Hasselhoff Museum", "closed": false, "ll": [52.5301333, 13.401922], "q": "David Hasselhoff Museum Berlin", "min": 25, "time": "20-30 min", "price": "Pequeña entrada", "hours": "Consultar horarios actuales", "rating": "", "web": "", "text": "Museo dedicado al papel de The Hoff en la caída del Muro. Actuó con Looking for Freedom sobre el Muro la noche de fin de año 1989. Cerca de la East Side Gallery.", "tip": "Combinar con el Día 4. El humor del sitio es parte de la experiencia.", "transport": false, "tags": [], "rain": "A cubierto: buena opción con lluvia.", "rain_en": "Indoors: a good option if it rains.", "leg": {"min": 42, "km": 9.643087745941067, "mode": "transit"}}, {"name_en": "Teufelsberg · Spy Station", "text_en": "Artificial 120-metre hill built with rubble from 400,000 war-destroyed buildings, on top of a Nazi military college they couldn't demolish due to the strength of the concrete. At the summit: an abandoned NSA/CIA spy station with intact radar domes and interior urban art. How to get there: Bus 218 from S Heerstraße. Quite far from the centre.", "tip_en": "One of Berlin's most surreal experiences. Only for those with a spare day.", "price_en": "Approx. €10-12", "hours_en": "Check times on website (seasonal)", "time_en": "2-3h", "id": "berlin-opt-3", "name": "Teufelsberg · estación espía", "closed": false, "ll": [52.4972222, 13.2411111], "q": "Teufelsberg — estación espía Berlin", "min": 150, "time": "2-3h", "price": "Aprox. 10-12€", "hours": "Consultar horarios en web (variable según temporada)", "rating": "4.3", "web": "", "text": "Colina artificial de 120 metros construida con los escombros de 400.000 edificios destruidos en la guerra, sobre un colegio militar nazi que no pudieron demoler por la resistencia del hormigón. En la cima: una estación de espionaje de la NSA/CIA abandonada, con cúpulas de radar intactas y arte urbano interior. Cómo llegar: Bus 218 desde S Heerstraße. Bastante lejos del centro.", "tip": "Una de las experiencias más surrealistas de Berlín. Solo para quien tenga un día extra y quiera algo diferente.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~199 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~199 min on foot).", "leg": {"min": 60, "km": 14.925232468406527, "mode": "transit"}}, {"name_en": "Friedhof Grunewald-Forst", "text_en": "The suicide cemetery: it buried exclusively those who had died \"dishonourably\", mainly suicides who threw themselves into the Havel. The nameless headstones with only a date inscribed are the most disturbing element. In the Grunewald, near the lake.", "tip_en": "For those wanting something completely different. Requires car or specific transport.", "price_en": "Free", "hours_en": "Daily dawn-dusk", "time_en": "30-45 min", "id": "berlin-opt-4", "name": "Friedhof Grunewald-Forst", "closed": false, "ll": [52.4926992, 13.2108029], "q": "Friedhof Grunewald-Forst Berlin", "min": 40, "time": "30-45 min", "price": "Gratis", "hours": "Diario amanecer-anochecer", "rating": "", "web": "", "text": "El cementerio de los suicidas: enterraba exclusivamente a los que habían muerto de forma \"deshonrosa\", principalmente suicidas que se lanzaban al Havel. Las lápidas sin nombre con la inscripción solo de la fecha son lo más perturbador. En el Grunewald, cerca del lago.", "tip": "Para quien quiera algo completamente diferente. Necesita coche o transporte específico.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~236 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~236 min on foot).", "leg": {"min": 19, "km": 2.7463440867353572, "mode": "transit"}}, {"name_en": "Gardens of the World", "text_en": "The world's second largest botanical garden, with gardens recreating traditions from China, Japan, Bali, Korea and the Middle East, framed by Plattenbau blocks all around. The contrast between the gardens and the Soviet urban landscape is unique. How to get there: U5 to Kienberg - Gärten der Welt.", "tip_en": "Only for those who want to explore residential East Berlin. Far from the centre.", "price_en": "Approx. €6 adults", "hours_en": "Daily from 9:00", "time_en": "2-3h", "id": "berlin-opt-5", "name": "Jardines del Mundo", "closed": false, "ll": [52.5379611, 13.5692782], "q": "Jardines del Mundo Berlin", "min": 150, "time": "2-3h", "price": "Aprox. 6€ adultos", "hours": "Diario desde 9:00", "rating": "4.5", "web": "https://www.gaertenderwelt.de", "text": "El segundo jardín botánico más grande del mundo, con jardines que recrean tradiciones de China, Japón, Bali, Corea y Oriente Medio, encuadrado por los bloques de Plattenbau alrededor. El contraste entre los jardines y el paisaje urbano soviético es único. Cómo llegar: U5 hasta Kienberg - Gärten der Welt.", "tip": "Solo para quien quiera explorar el Berlín oriental residencial. Lejos del centro.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~197 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~197 min on foot).", "leg": {"min": 33, "km": 32.2058617176068, "mode": "car"}}, {"name_en": "Weißensee Cemetery · Europe's largest", "text_en": "🚫 Closed Saturdays Europe's largest Jewish cemetery (115,000 graves). The oldest section has 19th-century mausoleums with Carrara marble sculptures covered in moss. Silent, dense forest atmosphere. Quite far from the centre. How to get there: Tram M13 from Alexanderplatz, stop Am Friedhof.", "tip_en": "If you already visit the Schönhauser Allee cemetery (Day 2), that's enough. This one is for those who want to go deeper.", "price_en": "Free", "hours_en": "Mon-Thu 8:00-17:00 · Fri 8:00-15:00 · Sun 8:00-17:00", "time_en": "1h", "id": "berlin-opt-6", "name": "Weißensee Cemetery · el más grande de Europa", "closed": false, "ll": [52.5453629, 13.4583637], "q": "Weißensee Cemetery — el más grande de Europa Berlin", "min": 60, "time": "1h", "price": "Gratis", "hours": "Lun-Jue 8:00-17:00 · Vie 8:00-15:00 · Dom 8:00-17:00", "rating": "", "web": "", "text": "🚫 Cerrado sábados El cementerio judío más grande de Europa (115.000 tumbas). La parte más antigua tiene panteones del XIX con esculturas de mármol de Carrara cubiertas de musgo. Atmosfera de bosque silencioso y denso. Bastante lejos del centro. Cómo llegar: Tram M13 desde Alexanderplatz, parada Am Friedhof.", "tip": "Si ya ves el Jüdischer Friedhof Schönhauser (Día 4) es suficiente. Este es para quien quiera profundizar.", "transport": false, "tags": [], "rain": "Al aire libre. Con lluvia fuerte, visita rápida o adelanta David Hasselhoff Museum (a cubierto, ~72 min a pie).", "rain_en": "Outdoors. If it pours, keep it short or move up David Hasselhoff Museum (indoors, ~72 min on foot).", "leg": {"min": 43, "km": 9.809586943794516, "mode": "transit"}}], "endLbl_en": "Finish", "label_en": "If you have time", "small_en": "extra", "title_en": "If you have time"}], "places": 74, "city": "Berlin", "when": 2024.0, "year": 2024}];

const routeCache={};
function hav2(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

function routeFor(pts,live){
  const key=pts.map(p=>p.join(',')).join(';'); const c=routeCache[key]; if(c&&c.ok) return c;
  if(live&&!c){routeCache[key]={pending:true};
    fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>`${p[1]},${p[0]}`).join(';')}?overview=false`)
      .then(r=>r.ok?r.json():null).then(j=>{const g=j&&j.routes&&j.routes[0]; if(!g)return; routeCache[key]={ok:true,real:true,legs:g.legs.map(l=>l.duration/60),km:g.distance/1000}; if(T&&!$('trip').hidden) refresh(false)}).catch(()=>{});}
  const e=estLegs(pts); return {ok:false,real:false,legs:e.legs,km:e.km};
}

  if(T.kind==='road'){
    pts=[d.route[0],...seq.map(s=>s.ll),d.route[1]]; const R=routeFor(pts,live); km=R.km; real=R.real;
    seq.forEach((s,i)=>{const lg=R.legs[i]||0; drive+=lg; t+=lg; let a=t,wait=0; if(isMeal(s)&&/^Comida/.test(s.when)&&a<810){wait=810-a;a=810} t=a+(s.min||0); if(!isMeal(s)) act+=s.min||0; times[s.id]={arr:a,dep:t,wait,leg:lg,mode:'car'}});
    last=R.legs[seq.length]||0; drive+=last; t+=last;
  } else {
    pts=seq.map(s=>s.ll);
    seq.forEach((s,i)=>{const L=i?s.leg||{min:0,mode:'walk',km:0}:{min:0,mode:'walk',km:0}; drive+=L.min; if(L.mode==='walk') walkKm+=L.km; km+=L.km; t+=L.min; let a=t,wait=0; if(isMeal(s)&&a<810){wait=810-a;a=810} t=a+(s.min||0); if(!isMeal(s)&&!s.transport) act+=s.min||0; times[s.id]={arr:a,dep:t,wait,leg:L.min,mode:L.mode}});
  }
  const sunset=d.sunset?toMin(d.sunset):null;
  return {seq,pts,times,end:t,drive,last,act,km,walkKm,real,sunset,
    night:sunset?seq.filter(s=>!isMeal(s)&&!s.nightOk&&times[s.id].dep>sunset+10):[], late:seq.filter(s=>s.close&&times[s.id].arr>toMin(s.close))};
}

const photoCache={};
const BAD=/(map|mapa|plano|logo|escudo|coat of arms|bandeira|flag|svg|diagram|location|localiza|panel|placa|cartel|altar)/i;
async function commons(params){
  const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1600&'+params); if(!r.ok) return [];
  const j=await r.json(); const pages=j.query?Object.values(j.query.pages):[]; pages.sort((a,b)=>(a.index||0)-(b.index||0));
  const strip=h=>(h||'').replace(/<[^>]+>/g,'').trim();
  return pages.filter(p=>p.imageinfo&&p.imageinfo[0]&&!BAD.test(p.title)&&/\.(jpe?g|webp)$/i.test(p.title)&&(p.imageinfo[0].width||0)>=1200).map(p=>{const ii=p.imageinfo[0],md=ii.extmetadata||{};
    return {src:ii.thumburl||ii.url,page:ii.descriptionurl,title:p.title.replace(/^File:|\.[a-z]+$/gi,''),author:strip(md.Artist&&md.Artist.value).slice(0,80),lic:strip(md.LicenseShortName&&md.LicenseShortName.value)}});
}
function getPhotos(s){
  if(photoCache[s.q]) return photoCache[s.q];

    try{add(await commons('generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(s.q+' incategory:Quality_images')))}catch(e){}
    if(list.length<6){try{add(await commons('generator=search&gsrnamespace=6&gsrlimit=16&gsrsearch='+encodeURIComponent('filetype:bitmap '+s.q)))}catch(e){}}

  const up=()=>{if(y0===null)return; sh.classList.remove('drag'); const f=sh.getBoundingClientRect().height/$('stage').clientHeight; y0=null;
    if(!moved){setSnap(snap==='min'?'mid':snap==='mid'?'max':'min');return}
    setSnap(Object.entries(SNAPS).sort((a,b)=>Math.abs(a[1]-f)-Math.abs(b[1]-f))[0][0])};
  g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);})();
let rl=0; const relayout=()=>{cancelAnimationFrame(rl); rl=requestAnimationFrame(()=>{ if(T&&!$('trip').hidden) setSnap(snap) })};
window.addEventListener('resize',relayout); window.addEventListener('orientationchange',relayout);
if(window.visualViewport) visualViewport.addEventListener('resize',relayout);

/* plan del día */
function renderPlan(){
  const d=D[day]; $('planT').textContent=d.label;
  const extra=d.stops.filter(s=>s.opt);
  $('planB').innerHTML=`<div class="eyebrow">Plan del día</div><h2>${esc(d.title)}</h2>
    <div class="grid2"><div class="stat"><span class="k">${ic('clock')}${T.kind==='road'?'Salida → vuelta':'Inicio → fin'}</span><b>${startOf(d)} – ${hhmm(P.end)}</b></div><div class="stat"><span class="k">${ic(T.kind==='road'?'car':'walk')}${T.kind==='road'?'Coche':'Desplazamientos'}</span><b>${fmtMin(r5(P.drive))}</b><small>${T.kind==='road'?Math.round(P.km)+' km':P.walkKm.toFixed(1).replace('.',',')+' km a pie'}</small></div></div>
    ${briefHtml(d,true)}
    <div class="sect">Itinerario</div>${timeline(d,true)}
    ${extra.length&&!isX(d)?`<div class="sect">Dónde comer y opcionales<span>fuera del horario</span></div><div class="dlist">${extra.map(s=>`<div class="drow"><span class="d">${ic(s.kindOf==='food'||s.kindOf==='bar'?'fork':s.kindOf==='hotel'?'home':'info')}</span><span><span class="nm">${esc(short(s.name))}</span><span class="s">${esc(OPTLBL[s.kindOf]||'Opcional')}${s.price?' · '+esc(s.price):''}</span><span class="s">${esc(s.text)}</span></span><span></span></div>`).join('')}</div>`:''}`;
  $('planB').querySelectorAll('.row[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;$('planOv').hidden=true;refresh(true)});
  tr($('planOv'));
}
$('planBtn').onclick=()=>{$('planOv').hidden=false;renderPlan()}; $('planX').onclick=()=>$('planOv').hidden=true;

/* el viaje: resumen, días y antes de tu viaje */
function renderTrip(){
  let km=0,dr=0,walk=0; const q=D.map(d=>{const p=planDay(d);km+=p.km;dr+=p.drive;walk+=p.walkKm;return p}); const road=T.kind==='road';
  const stats=road?`<div class="stat"><span class="k">${ic('car')}Coche total</span><b>${Math.round(km).toLocaleString('es-ES')} km</b><small>~${fmtMin(r5(dr))}</small></div><div class="stat"><span class="k">${ic('eur')}Gasolina</span><b>~${Math.round(km*T.fuel.l100/100*T.fuel.eur)} €</b><small>${String(T.fuel.l100).replace('.',',')} L/100 · ${String(T.fuel.eur.toFixed(2)).replace('.',',')} €/L</small></div>`
    :`<div class="stat"><span class="k">${ic('pin')}Sitios</span><b>${T.places}</b><small>${D.filter(d=>!isX(d)).length} días</small></div><div class="stat"><span class="k">${ic('walk')}A pie</span><b>~${Math.round(walk)} km</b><small>estimado, en todo el viaje</small></div>`;
  $('tripB').innerHTML=`<div class="eyebrow">${esc(T.country)}</div><h2>${esc(T.title)}</h2>
    <div class="tags"><span class="tag n">${ic('cal')}${esc(T.datesLabel)}</span>${T.base?`<span class="tag">${ic('home')}${esc(T.base.street||T.base.name)}</span>`:''}</div>
    <div class="grid2">${stats}</div>
    <button class="btn" type="button" id="lang2" style="width:100%">${LANG==='en'?'Ver en español':'View in English'}</button>
    ${T.mid?`<a class="btn cream" href="https://www.google.com/maps/d/viewer?mid=${T.mid}" target="_blank" rel="noopener">${ic('exp')}Abrir en MyMaps</a>`:''}
    <div class="sect">Días</div><div class="dlist">${D.map((d,i)=>`<button class="drow ${i===day?'on':''}" type="button" data-i="${i}"><span class="d">${esc(d.big)}<small>${esc(d.small)}</small></span><span><span class="nm">${esc(d.title)}</span><span class="s">${q[i].seq.filter(s=>!isMeal(s)&&!s.transport).length} sitios · ${fmtMin(r5(q[i].drive))||'0 min'} ${road?'de coche':'de desplazamientos'}${d.cond?' · con buen parte':''}</span></span>${ic('r')}</button>`).join('')}</div>
    ${T.antes&&T.antes.length?`<div class="sect">Antes de tu viaje</div>${T.antes.map((a,k)=>`<details class="brief antes" ${k===0?'open':''}><summary>${esc(a.h)}<span class="ch">${ic('r')}</span></summary><div class="bs">${a.rows.map(r=>`<div class="row"><b>${esc(r.t)}</b><span>${esc(r.d)}</span></div>`).join('')}</div></details>`).join('')}`:''}`;
  $('tripB').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{day=+x.dataset.i;idx=0;$('tripOv').hidden=true;refresh(true)});
  $('lang2').onclick=()=>setLang(LANG==='en'?'es':'en'); tr($('tripOv'));
}
$('tripBtn').onclick=()=>{$('tripOv').hidden=false;renderTrip()}; $('tripX').onclick=()=>$('tripOv').hidden=true;

/* visor de fotos */
let VL=[],VI=0,VN='';
function openVw(l,k,n){VL=l;VI=k;VN=n;$('vw').hidden=false;showVw()}
function showVw(){const n=VL.length;if(!n)return;VI=(VI+n)%n;const p=VL[VI];$('vwI').src=p.src;$('vwT').textContent=`${VI+1} / ${n} · ${short(VN)}`;$('vwC').innerHTML=`${esc(p.title)}${p.author?' · '+esc(p.author):''}${p.lic?' · '+esc(p.lic):''} · <a href="${p.page}" target="_blank" rel="noopener">Wikimedia</a>`}
$('vwX').onclick=()=>$('vw').hidden=true; $('vwP').onclick=()=>{VI--;showVw()}; $('vwN').onclick=()=>{VI++;showVw()};
let tx=null; $('vwS').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('vwS').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){VI+=dx<0?1:-1;showVw()}tx=null});
document.addEventListener('keydown',e=>{if(!$('vw').hidden){if(e.key==='Escape')$('vw').hidden=true;if(e.key==='ArrowRight'){VI++;showVw()}if(e.key==='ArrowLeft'){VI--;showVw()}return}
  if(!T||$('trip').hidden) return; if(e.key==='ArrowRight')$('next').click(); if(e.key==='ArrowLeft')$('prev').click()});

/* arranque */
route();
</script>
</body>
