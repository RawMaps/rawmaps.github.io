je, verde, abierto, local. Entrar por la puerta norte (junto a la playa) y salir por el sur hacia la Foz si se quiere alargar el paseo.","tip":"","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~105 min a pie).","leg":{"min":16,"km":1.2063636304542669,"mode":"walk"}}]},{"key":"opt","big":"+","small":"extra","label":"Si tienes tiempo","title":"Si tienes tiempo","zone":"Si tienes tiempo","est":"","start":"10:30","sunset":null,"from":"Rua de Santa Catarina","endLbl":"Terminas","mode":"city","notes":[],"brief":[],"stops":[{"id":"oporto-opt-0","name":"Rua de Santa Catarina · si el cuerpo aguanta","closed":false,"ll":[41.1534763,-8.6047487],"q":"Rua de Santa Catarina — si el cuerpo aguanta Porto","min":20,"time":"15-20 min · paseo de vuelta","price":"Gratis","hours":"24h","rating":"4.4","web":"","text":"La calle comercial peatonal más larga del centro de Oporto. Parada de vuelta al devolver el coche o al llegar en taxi. El Café Majestic (1921, Art Nouveau) vale la parada aunque solo sea para verlo desde fuera, terraza cara pero el interior es extraordinario.","tip":"La Capilla de las Almas en el número 428 tiene 15.000 azulejos en la fachada, el comienzo del Día 4 sin tener que volver.","transport":false,"tags":[],"rain":"Al aire libre: con lluvia, visita rápida.","leg":{"min":0,"mode":"walk","km":0}},{"id":"oporto-opt-1","name":"Casa de la Música · si el cuerpo aguanta","closed":false,"ll":[41.1588467,-8.630737],"q":"Casa de la Música — si el cuerpo aguanta Porto","min":55,"time":"45-60 min (visita arquitectónica) · Variable si hay concierto","price":"Visita guiada: 10€ · Conciertos desde 5-10€ (orquesta) hasta 40€","hours":"Visitas: Lun-Sáb 11, 13 y 16h · Dom 11, 15 y 16h · Conciertos: consultar programa","rating":"4.5","web":"","text":"Sala de conciertos de 2005 diseñada por Rem Koolhaas: poliedro de hormigón y cristal en medio de una rotonda. La lógica del edificio se ve solo desde dentro, el foyer tiene vista directa al Duero a través del escenario. Programación de la Orquestra Sinfónica do Porto.","tip":"ÚLTIMO PUNTO DEL DÍA, hay que ir en metro (línea B/C/E/F, estación Casa da Música, 1.50€) o taxi desde el centro (10 min, 8-10€). Si hay concierto de la orquesta sinfonía, las entradas básicas están entre 5-10€. La visita guiada del edificio vale la pena aunque no haya concierto.","transport":false,"tags":[],"rain":"Al aire libre: con lluvia, visita rápida.","leg":{"min":20,"km":2.933086771274395,"mode":"transit"}}]}],"places":61,"city":"Porto"},{"id":"berlin","kind":"city","title":"Berlín","sub":"Historia, Kiez y buena cerveza","country":"Alemania","coverQ":"Oberbaumbrücke Berlin","status":"done","datesLabel":"Jueves a domingo · 4 días","mid":"1t_bZZbt8rhQ1D41kmdim7c-4Z0CQE4E","docName":"[ES] Berlín Salvaje — Historia, Kiez y buena cerveza","antes":[{"h":"📋 ENTRADAS A RESERVAR","rows":[{"t":"🏛 Reichstag, cúpula","d":"Entrada gratuita con reserva obligatoria. Llevar pasaporte. Pedir slot de TARDE (16-18h) para que encaje con el recorrido del Día 1. → bundestag.de/besuche"}]},{"h":"🎯 RESERVAR SI PUEDES","rows":[{"t":"🏺 Neues Museum, busto de Nefertiti · Día 4","d":"Las colas en verano son largas. Reservar online 1-2 semanas antes. 12€. → smb.museum"},{"t":"🗼 Torre de TV, Alexanderplatz · Día 4","d":"Sin reserva: cola de 1-2h. Con reserva: entrada directa. 23€. → tv-turm.de"}]},{"h":"🔧 GESTIONAR ANTES","rows":[{"t":"🚇 Billete de transporte","d":"Zona AB cubre toda la ciudad. Para 4 días, el billete de 7 días (36€) es lo más económico. Comprar en máquinas del metro o en la app BVG Fahrinfo."},{"t":"💵 Efectivo","d":"Berlín sigue siendo ciudad de efectivo. Muchos bares, mercados y street food no aceptan tarjeta. Retirar en cajeros locales (Sparkasse, Deutsche Bank). Evitar casas de cambio y cajeros del aeropuerto."}]},{"h":"📱 APPS A INSTALAR","rows":[{"t":"🚇 BVG Fahrinfo · Berlin","d":"Metro, tren, tranvía y autobús. Comprar billete directamente en la app."},{"t":"🗺 Google Maps","d":"Navegación offline. Descargar la zona de Berlín antes de salir."}]},{"h":"✈️ LLEGAR","rows":[{"t":"🛬 BER → Centro","d":"Mejor opción: FEX (Flughafen Express) · tren directo · 23 min · 5€ · sale cada 15 min. S-Bahn S9 o S45: más lento (40-50 min), misma tarifa. Taxi: 50-80€. VTC: similar. ⚠️ Validar el billete ANTES de subir al tren. Multa 60€."}]},{"h":"💡 SABER ANTES","rows":[{"t":"🍺 Alcohol en la calle","d":"Completamente legal y culturalmente normal. Los Spätis (tiendas 24h) son parte esencial de la cultura local."},{"t":"🚲 Carriles bici en las aceras","d":"Marcados en rojo. No caminar por ellos. Es un error habitual del turista."},{"t":"♻️ Sistema Pfand","d":"Envases de plástico y algunas latas tienen depósito de 0,25€. Se devuelven en máquinas de supermercado. Si no quieres llevarte la botella, déjala junto a una papelera."},{"t":"🤝 Propinas","d":"Restaurante con servicio: 5-10%. Decir el total deseado al pagar: \"Mach es 25\" (ponlo en 25€). Stimmt so = quédese con el cambio. Street food y cafeterías de mostrador: no se espera."},{"t":"💧 Agua del grifo","d":"Excelente calidad. No hace falta comprar embotellada."}]},{"h":"🍽️ COMER EN BERLÍN","rows":[{"t":"🌭 Currywurst · 3-5€","d":"Lo más berlinés. Salchicha con ketchup especiado y curry en polvo. En cualquier Imbiss (puesto de calle). Obligatorio."},{"t":"🥙 Döner Kebab · 5-7€","d":"El mejor döner fuera de Turquía. La comunidad turca de Kreuzberg creó el formato moderno."},{"t":"🍖 Schnitzel","d":"Filete empanado. Pedir en un Gasthaus, no en sitios turísticos."},{"t":"🍺 Berliner Weisse","d":"Cerveza de trigo ligeramente ácida. Se sirve con sirope de frambuesa (rojo) o aspérula (verde)."},{"t":"🫓 Flammkuchen","d":"Pizza fina con crème fraîche, cebolla y bacon. Muy diferente a la pizza italiana."},{"t":"🧉 Club Mate","d":"La bebida de los clubs de Berlín. Base de mate, con cafeína."},{"t":"🍩 Pfannkuchen","d":"El donut relleno de mermelada. Aquí no se llama berliner."}]}],"base":null,"days":[{"key":"d1","big":"1","small":"jue","label":"Día 1 · jue","title":"Checkpoint Charlie · Eje histórico · Victory Column","zone":"Checkpoint Charlie","est":"~6–8h","start":"10:30","sunset":null,"from":"U Kochstraße","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Reichstag (cúpula): gratis · https://www.bundestag.de/besuche · Llevar pasaporte · Reservar con 2-4 semanas de antelación, pedir SLOT DE TARDE (16-18h) para coincidir con la ruta"]},{"h":"⏰ HORARIOS CLAVE","lines":["9:00h, Checkpoint Charlie (antes de que lleguen las masas)","10:00h, Topografía del Terror (abre, llegar a la apertura = sin grupos escolares)","15:00-16:00h, Holocaust Memorial (colas de mediodía ya han bajado)","16:00-18:00h, Reichstag (slot de tarde reservado)","18:30-19:30h, Victory Column (luz del atardecer sobre la Goldene Else)"]},{"h":"⚠️ IMPORTANTE","lines":["La ruta va de este a oeste. Avanzas siempre hacia el atardecer.","Los dos puntos que mandan son Topografía (10h apertura) y Reichstag (slot fijo).","El rest encaja entre medias."]},{"h":"🍽️ COMIDA","lines":["Zona Gendarmenmarkt: menú de almuerzo lunes-viernes antes de 13h.","Evitar el pico 13:30-14:30 en toda la zona central."]},{"h":"🚇 TRANSPORTE","lines":["Inicio: U6 Kochstraße (Checkpoint Charlie a 5 min a pie).","Final: S Tiergarten (S5 · S7), justo en la puerta de Victory Column."]}],"stops":[{"id":"berlin-d1-0","name":"SALIDA D1: U Kochstraße","closed":false,"ll":[52.5064603,13.3905482],"q":"U Kochstraße Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 Parada U-Bahn: U Kochstraße Línea: U6 📍 Checkpoint Charlie está a 5 min a pie hacia el norte. 🔗 Conexiones: ⬇️ U6 sur: Mehringdamm (2 paradas) ⬆️ U6 norte: Stadtmitte → U2 (1 parada) 🚌 Bus M29: parada Checkpoint Charlie (2 min)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"berlin-d1-1","name":"Checkpoint Charlie","closed":false,"ll":[52.5074434,13.3903913],"q":"Checkpoint Charlie Berlin","min":25,"time":"20-30 min","price":"Gratis exterior · Museo 14.50€ (no recomendado)","hours":"24h exterior","rating":"4.2","web":"","text":"El famoso punto de cruce entre los sectores americano y soviético. Los guardias uniformados son actores. El punto histórico real está marcado en el suelo.","tip":"Los paneles gratuitos del exterior cuentan la historia igual de bien que el museo de pago. Evita el Mauermuseum.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Topografía del Terror (a cubierto, ~8 min a pie).","leg":{"min":0,"km":0.14277938487292902,"mode":"walk"}},{"id":"berlin-d1-2","name":"Topografía del Terror","closed":false,"ll":[52.506747,13.3837099],"q":"Topografía del Terror Berlin","min":105,"time":"1.5-2h","price":"Gratis","hours":"Diario 10:00-20:00","rating":"4.7","web":"https://www.topographie.de","text":"El museo más visitado de Alemania tras el Pergamon. Construida sobre el emplazamiento exacto de la sede de las SS y la Gestapo. La excavación de los sótanos es visible desde el interior. La sección exterior a lo largo de fragmentos del Muro es siempre accesible.","tip":"No te saltes esto. En esta ruta llegas a las 10h de apertura, ideal: los grupos escolares aún no han llegado. Si te retrasas, vuelve a entrar después de las 17h cuando se van.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":8,"km":0.5964155433008178,"mode":"walk"}},{"id":"berlin-d1-3","name":"Estación de Anhalt (ruina)","closed":false,"ll":[52.5036889,13.3824896],"q":"Estación de Anhalt (ruina) Berlin","min":20,"time":"15-20 min","price":"Gratis","hours":"24h (exterior)","rating":"","web":"","text":"Lo que queda de la mayor estación de trenes de Europa antes de la guerra: un fragmento de fachada de ladrillo desconchado que se sostiene solo en medio de un solar. Junto a la ruina hay una plaza con paneles informativos sobre la deportación de judíos desde esta estación.","tip":"Una de las ruinas más fotogénicas de Berlín. Junto al Berlin Story Bunker.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Story Bunker (a cubierto, ~3 min a pie).","leg":{"min":6,"km":0.45491171844555567,"mode":"walk"}},{"id":"berlin-d1-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[52.5036889,13.3824896],"q":"restaurantes cerca de Estación de Anhalt (ruina) Berlin","min":75,"price":"","hours":"","text":"Zona Gendarmenmarkt: menú de almuerzo lunes-viernes antes de 13h. Evitar el pico 13:30-14:30 en toda la zona central.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"berlin-d1-4","name":"Berlin Story Bunker","closed":false,"ll":[52.5029008,13.3803901],"q":"Berlin Story Bunker Berlin","min":75,"time":"1-1.5h","price":"Entrada de pago (aprox. 15€)","hours":"Diario 10:00-19:00","rating":"4.5","web":"","text":"El búnker antiaéreo de 5 plantas junto a la ruina de la estación de Anhalt, con 3,8 metros de grosor en el techo. Alberga la \"Berlin Story\" con una exposición completa sobre el ascenso y caída del Tercer Reich, junto con el bunker en sí.","tip":"Combinar con la visita a la ruina de la Anhalter Bahnhof, justo al lado.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":3,"km":0.21704117883339613,"mode":"walk"}},{"id":"berlin-d1-5","name":"[PARA FRIKIS] Hansa Studios","closed":false,"ll":[52.5062615,13.3769934],"q":"[PARA FRIKIS] Hansa Studios Berlin","min":10,"time":"10 min","price":"Gratis (solo exterior)","hours":"Sin acceso público, estudio activo","rating":"","web":"","text":"📍 Nansen-Strasse 28, Tiergarten El estudio donde se grabaron: David Bowie: Heroes (1977), Low, Lodger Iggy Pop: The Idiot, Lust for Life U2: Achtung Baby (1991) Nick Cave: The First Born is Dead Estudio activo, no visitable. Sin placa. Sin señal en el exterior.","tip":"El valor está en el contexto. Pasar de camino al Schwerbelastungskörper.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Story Bunker (a cubierto, ~8 min a pie).","leg":{"min":8,"km":0.5703749718489496,"mode":"walk"}},{"id":"berlin-d1-6","name":"Catedral Alemana · exposición gratuita","closed":false,"ll":[52.5127168,13.3925442],"q":"Catedral Alemana — exposición gratuita Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Mar-Dom 10:00-19:00 (verano hasta 20:00) · Cerrado lunes","rating":"4.5","web":"","text":"Exposición permanente gratuita sobre la historia parlamentaria alemana. No es una iglesia activa, es un espacio expositivo del Bundestag.","tip":"Cerrado los lunes. Una de las mejores exposiciones gratuitas del centro.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":22,"km":1.6560744719694676,"mode":"walk"}},{"id":"berlin-d1-7","name":"Gendarmenmarkt","closed":false,"ll":[52.5131523,13.3915191],"q":"Gendarmenmarkt Berlin","min":40,"time":"30-45 min","price":"Plaza gratis · Torre Catedral Francesa 3€","hours":"Torre Mar-Dom 10:00-18:00","rating":"4.7","web":"","text":"La plaza más elegante de Berlín, enmarcada por la Catedral Francesa, la Catedral Alemana y el Konzerthaus.","tip":"Espectacular de noche cuando está iluminada. Mercado navideño muy bueno en diciembre.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral Alemana (a cubierto, ~1 min a pie).","leg":{"min":0,"km":0.10998022751548531,"mode":"walk"}},{"id":"berlin-d1-8","name":"Catedral de Santa Eduvigis","closed":false,"ll":[52.5159214,13.3946271],"q":"Catedral de Santa Eduvigis Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"","rating":"4.4","web":"","text":"La catedral católica más antigua de Berlín, construida en 1773, modelada sobre el Panteón de Roma. Federico el Grande la construyó para los católicos silesianos tras conquistar Silesia.","tip":"Comprobar estado de apertura antes de visitar.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":6,"km":0.4847461543874843,"mode":"walk"}},{"id":"berlin-d1-9","name":"Bebelplatz","closed":false,"ll":[52.5168703,13.3956217],"q":"Bebelplatz Berlin","min":20,"time":"15-20 min","price":"Gratis","hours":"24h","rating":"4.6","web":"","text":"La plaza donde los nazis quemaron 20.000 libros el 10 de mayo de 1933. Busca el panel de cristal empotrado en los adoquines: debajo hay una biblioteca subterránea vacía con estantes en blanco.","tip":"El panel de cristal está en el centro de la plaza, es fácil de no verlo. De noche está iluminado y es más impactante.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Staatsoper Unter den Linden (a cubierto, ~1 min a pie).","leg":{"min":2,"km":0.16269398702594476,"mode":"walk"}},{"id":"berlin-d1-10","name":"Staatsoper Unter den Linden","closed":false,"ll":[52.5171049,13.394703],"q":"Staatsoper Unter den Linden Berlin","min":40,"time":"30-45 min si hay función","price":"Localidades de pie desde 10€","hours":"","rating":"4.6","web":"https://www.staatsoper-berlin.de","text":"Una de las óperas más antiguas de Europa, construida en 1742 por Federico el Grande.","tip":"Localidades de pie disponibles 90 min antes del comienzo. Incluso sin función, el exterior y Bebelplatz merecen la parada.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.0876400743808631,"mode":"walk"}},{"id":"berlin-d1-11","name":"Alte Bibliothek","closed":false,"ll":[52.5170077,13.3932369],"q":"Alte Bibliothek Berlin","min":10,"time":"10 min","price":"Gratis (solo exterior)","hours":"Visible 24h","rating":"","web":"","text":"La Biblioteca Antigua, apodada el Cómoda por su fachada curva barroca. Construida en 1775, hoy es la facultad de derecho de la Humboldt-Universität.","tip":"Solo exterior. La fachada curva en Bebelplatz es una de las más elegantes de Berlín.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.1297277401656886,"mode":"walk"}},{"id":"berlin-d1-12","name":"Estatua ecuestre de Federico II","closed":false,"ll":[52.5172695,13.3927528],"q":"Estatua ecuestre de Federico II Berlin","min":10,"time":"5-10 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Federico el Grande a caballo en el centro de Unter den Linden. Retirada por la RDA en 1950 por demasiado prusiana, devuelta a su emplazamiento original en 1980.","tip":"Federico pidió ser enterrado junto a sus galgos en Sanssouci. Los nazis lo enterraron en una iglesia. Sus restos no llegaron a Sanssouci hasta 1991, 205 años después de su muerte. Por fin donde quería.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Alte Bibliothek (a cubierto, ~1 min a pie).","leg":{"min":0,"km":0.05696953167050616,"mode":"walk"}},{"id":"berlin-d1-13","name":"Biblioteca Estatal de Berlín","closed":false,"ll":[52.5175461,13.3917624],"q":"Biblioteca Estatal de Berlín Berlin","min":25,"time":"20-30 min","price":"Gratis para visitantes","hours":"Lun-Vie 9:00-21:00 · Sáb 10:00-19:00","rating":"4.5","web":"https://staatsbibliothek-berlin.de","text":"Una de las bibliotecas de investigación más grandes de Europa. El vestíbulo histórico y la cafetería del patio interior están abiertos sin carnet.","tip":"Buena parada para un café. Baños limpios y gratuitos.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.0958563495602197,"mode":"walk"}},{"id":"berlin-d1-14","name":"Unter den Linden","closed":false,"ll":[52.517171,13.3891129],"q":"Unter den Linden Berlin","min":25,"time":"20-30 min (paseo completo)","price":"Gratis","hours":"24h","rating":"4.7","web":"","text":"El bulevar histórico principal de Berlín, 1.4km desde la Puerta de Brandeburgo hasta la Isla de los Museos. Cada edificio cuenta una capa de la historia: prusiana, nazi, RDA, reunificada.","tip":"Caminar de oeste a este. El tramo entre Friedrichstrasse y Bebelplatz es el más rico.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Biblioteca Estatal de Berlín (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.23928437891550206,"mode":"walk"}},{"id":"berlin-d1-15","name":"Holocaust Memorial","closed":false,"ll":[52.5139474,13.3787126],"q":"Holocaust Memorial Berlin","min":75,"time":"1-1.5h","price":"Gratis","hours":"Campo 24h · Centro info Mar-Dom 10:00-20:00","rating":"4.7","web":"https://www.stiftung-denkmal.de","text":"2.711 estelas de hormigón de alturas variables, diseñadas para desorientar. El centro de información subterráneo es una de las mejores exposiciones sobre el Holocausto en Europa.","tip":"No te saltes el centro subterráneo. Colas más cortas antes de las 11h o después de las 15h.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta [PARA FRIKIS] Führerbunker (a cubierto, ~4 min a pie).","leg":{"min":14,"km":1.026722087375654,"mode":"walk"}},{"id":"berlin-d1-16","name":"[PARA FRIKIS] Führerbunker","closed":false,"ll":[52.5125237,13.3809755],"q":"[PARA FRIKIS] Führerbunker Berlin","min":15,"time":"10-15 min","price":"Gratis","hours":"24h (aparcamiento público)","rating":"","web":"","text":"Interesante pero es solo un parking. El lugar donde Hitler se suicidó el 30 de abril de 1945 está bajo un aparcamiento deliberadamente anónimo para evitar peregrinaciones. Un cartel informativo en el parking indica la localización exacta. La RDA demolió las estructuras en los 80 y lo cubrió de tierra.","tip":"Sin entrada posible. El valor está en el contexto: estás literalmente encima del lugar donde terminó el Tercer Reich.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":4,"km":0.28632770802479046,"mode":"walk"}},{"id":"berlin-d1-17","name":"Brandenburger Tor","closed":false,"ll":[52.5162746,13.377704],"q":"Brandenburger Tor Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"24h","rating":"4.8","web":"","text":"El símbolo más icónico de Berlín, construido en 1788. La Quadriga fue llevada por Napoleón a París en 1806 y devuelta en 1814. Fue el punto exacto de división entre Este y Oeste durante la Guerra Fría.","tip":"Para fotografiarlo sin multitudes: amanecer o después de las 21h. Mejor ángulo desde el este mirando al oeste.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~5 min a pie).","leg":{"min":8,"km":0.6138496732981392,"mode":"walk"}},{"id":"berlin-d1-18","name":"Reichstag","closed":false,"ll":[52.5186202,13.3761871],"q":"Reichstag Berlin","min":75,"time":"1-1.5h","price":"Gratis con reserva obligatoria","hours":"Diario 8:00-24:00 (última entrada 22:00)","rating":"4.7","web":"Reservar (obligatorio): https://www.bundestag.de/besuche","text":"Las paredes del Parlamento alemán conservan grafitti del Ejército Rojo con nombres de soldados soviéticos de 1945, deliberadamente conservados en el interior. La cúpula de cristal de Norman Foster permite subir por la rampa hasta la azotea con vistas al centro histórico.","tip":"Reservar con 2-4 semanas de antelación. Llevar pasaporte. Mejor hora: primera entrada o última del día.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":5,"km":0.36437454764844407,"mode":"walk"}},{"id":"berlin-d1-19","name":"Memorial soviético · Tiergarten","closed":false,"ll":[52.5166259,13.3719287],"q":"Memorial soviético — Tiergarten Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Monumento soviético, más pequeño y menos conocido, en el corazón del Tiergarten. Dos tanques T-34 originales flanquean el acceso. Construido en 1945 con mármol de la Cancillería del Reich demolida. Anterior a los grandes memoriales de la ciudad por años.","tip":"Casi nadie lo visita. Los tanques son los originales de 1945, no réplicas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~6 min a pie).","leg":{"min":6,"km":0.4726724398142542,"mode":"walk"}},{"id":"berlin-d1-20","name":"Victory Column","closed":false,"ll":[52.5145229,13.3501085],"q":"Victory Column Berlin","min":55,"time":"45-60 min","price":"3.50€ subida / Gratis exterior","hours":"Lun-Vie 9:30-18:30 · Sáb-Dom 9:30-19:00","rating":"4.7","web":"https://www.visitberlin.de/en/victory-column","text":"La columna de 67 metros con la Victoria alada dorada en la cima, inaugurada en 1873 para conmemorar tres guerras de unificación alemana. Hitler la trasladó 2 km de su posición original para ampliar el eje este-oeste de Berlín. 285 escalones para vistas 360° sobre el Tiergarten.","tip":"Este es el ÚLTIMO PUNTO del día, ideal: la Goldene Else brilla con la luz del atardecer. 285 escalones, si queda energía, compensa. Si no, el exterior ya vale el cierre del día.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Reichstag (a cubierto, ~32 min a pie).","leg":{"min":26,"km":1.943389010771127,"mode":"walk"}},{"id":"berlin-d1-21","name":"LLEGADA D1: S Tiergarten","closed":false,"ll":[52.513956,13.3362716],"q":"S Tiergarten Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚉 Parada S-Bahn: S Tiergarten Líneas: S5 · S7 · S75 🔗 Conexiones: 🚉 S Hauptbahnhof (2 paradas al oeste) 🚉 S+U Zoologischer Garten (2 paradas al este): U2 · U9 🚌 Bus 100/200: parada Großer Stern (5 min a pie)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":16,"km":1.219987886285751,"mode":"walk"}}]},{"key":"d2","big":"2","small":"vie","label":"Día 2 · vie","title":"Naturkundemuseum · Museum Island · Prenzlauer Berg","zone":"Naturkundemuseum","est":"~6–8h","start":"10:30","sunset":null,"from":"U Naturkundemuseum","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Berlin Underworld (tours búnker): aprox 16€ · https://www.berliner-unterwelten.de · Tour guiado, hora fija"]},{"h":"⚠️ IMPORTANTE","lines":["Este día va de norte a sur: empezar en Wedding y terminar en Mitte.","Mauerpark: el Flohmarkt solo abre los domingos. El parque y el Jüdischer Friedhof son accesibles cualquier día.","Jüdischer Friedhof: cerrado sábados. Ropa modesta.","Museo de la Kulturbrauerei: gratuito."]},{"h":"🍽️ COMIDA","lines":["Hackescher Markt: street food y cafés bajo los arcos del S-Bahn.","Kulturbrauerei: bares y cafés dentro del complejo."]},{"h":"🚇 TRANSPORTE","lines":["Inicio: S+U Gesundbrunnen (para Berlin Underworld) o U6 Naturkundemuseum (para el museo de dinosaurios).","Final: S+U Hackescher Markt (S3 · S5 · S7 · S75)."]}],"stops":[{"id":"berlin-d2-0","name":"SALIDA D2: U Naturkundemuseum","closed":false,"ll":[52.5312674,13.3822153],"q":"U Naturkundemuseum Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 Parada U-Bahn: U Naturkundemuseum Línea: U6 📍 Salir por la salida Invalidenstrasse. El museo está a 2 min a pie. 🔗 Cerca (a pie): 🚉 S Nordbahnhof (8 min al este): S1 · S2 · S25 🚌 Bus 245: parada Museum für Naturkunde (en la puerta)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"berlin-d2-1","name":"Museo de Historia Natural","closed":false,"ll":[52.5305726,13.3791755],"q":"Museo de Historia Natural Berlin","min":105,"time":"1.5-2h","price":"10€ adultos · 5€ reducida","hours":"Mar-Vie 9:30-18:00 · Sáb-Dom 10:00-18:00 · Cerrado lunes","rating":"4.5","web":"https://www.museumfuernaturkunde.berlin","text":"El Brachiosaurus del vestíbulo mide 13.27m, el dinosaurio montado más grande del mundo. El fósil original de Archaeopteryx también está aquí.","tip":"Llegar a las 13h cuando los grupos escolares están comiendo. Dedica al menos 45 min al hall de dinosaurios.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":4,"km":0.28555533969639996,"mode":"walk"}},{"id":"berlin-d2-2","name":"Cementerio de los Inválidos","closed":false,"ll":[52.5319164,13.3708928],"q":"Cementerio de los Inválidos Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Horarios variables según temporada","rating":"","web":"","text":"Cementerio militar del siglo XVIII donde están enterrados generales prusianos y jerarcas nazis cuyas tumbas fueron deliberadamente destruidas por los aliados (aunque los cuerpos siguen ahí). En los años 60 la RDA construyó el Muro literalmente sobre parte del cementerio.","tip":"Uno de los cementerios más perturbadores de Berlín por su historia en capas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Museo de Historia Natural (a cubierto, ~10 min a pie).","leg":{"min":10,"km":0.7538058887953252,"mode":"walk"}},{"id":"berlin-d2-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[52.5319164,13.3708928],"q":"restaurantes cerca de Cementerio de los Inválidos Berlin","min":75,"price":"","hours":"","text":"Hackescher Markt: street food y cafés bajo los arcos del S-Bahn. Kulturbrauerei: bares y cafés dentro del complejo.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"berlin-d2-3","name":"Berlin Underworld","closed":false,"ll":[52.5477911,13.3889929],"q":"Berlin Underworld Berlin","min":105,"time":"1.5-2h (tour guiado)","price":"Aprox. 16€ adulto","hours":"Reservar horario online con antelación","rating":"4.6","web":"https://www.berliner-unterwelten.de","text":"La organización más importante de Berlín para el subsuelo histórico. La \"Tour A\" lleva por un búnker de la Segunda Guerra Mundial convertido en museo, con equipamiento original. Una de las experiencias más auténticas de la ciudad.","tip":"Reservar online con antelación. Los tours en inglés y alemán salen a horas fijas.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":19,"km":2.792525260263077,"mode":"transit"}},{"id":"berlin-d2-4","name":"Flakturm Humboldthain","closed":false,"ll":[52.5474939,13.3850835],"q":"Flakturm Humboldthain Berlin","min":40,"time":"30-45 min","price":"Gratis (exterior) · Tours guiados aprox. 10€","hours":"Exterior accesible siempre · Tours: consultar berliner-unterwelten.de","rating":"","web":"","text":"Una de las seis torres antiaéreas construidas por Hitler para proteger Berlín. Fue volada parcialmente por los aliados, pero era tan sólida que la demolición quedó incompleta. Los restos están cubiertos de vegetación y son una colina artificial que puedes subir con vistas al norte de Berlín.","tip":"La colina encima de la torre ofrece vistas sorprendentes. Los tours del interior son los mejores de la ciudad.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Underworld (a cubierto, ~5 min a pie).","leg":{"min":5,"km":0.34632355479337557,"mode":"walk"}},{"id":"berlin-d2-5","name":"Bernauer Straße · Memorial del Muro","closed":false,"ll":[52.5375414,13.393641],"q":"Bernauer Straße — Memorial del Muro Berlin","min":75,"time":"1-1.5h","price":"Gratis","hours":"Diario 8:00-22:00 (centro de visitantes: Mar-Dom 10:00-18:00)","rating":"4.6","web":"https://www.berliner-mauer-gedenkstaette.de","text":"El tramo del Muro en Bernauer Straße es el mejor documentado de la ciudad: aquí la frontera pasaba literalmente por la fachada de los edificios, y los residentes escapaban saltando por las ventanas. Las instalaciones a lo largo de la calle muestran el doble muro original, la franja de la muerte y las historias individuales de los intentos de huida.","tip":"Uno de los lugares más impactantes de Berlín sobre la división. Mucho más honesto que Checkpoint Charlie.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berlin Underworld (a cubierto, ~20 min a pie).","leg":{"min":22,"km":1.6234989399081676,"mode":"walk"}},{"id":"berlin-d2-6","name":"Flohmarkt im Mauerpark","closed":false,"ll":[52.5413884,13.4023657],"q":"Flohmarkt im Mauerpark Berlin","min":105,"time":"1.5-2h","price":"Gratis (entrada)","hours":"Solo domingos 9:00-18:00","rating":"4.5","web":"","text":"El mercadillo más famoso de Berlín, a lo largo del antiguo corredor de la muerte del Muro. El parque tiene fragmentos originales del Muro. Lo que encontrarás: Ropa vintage y vinilos Antigüedades y artesanía Puestos de comida de todo tipo Karaoke al aire libre en el anfiteatro desde las 15h","tip":"Las primeras 2 horas son las mejores antes de las masas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~14 min a pie).","leg":{"min":13,"km":0.947439949712797,"mode":"walk"}},{"id":"berlin-d2-7","name":"Museo de la Kulturbrauerei","closed":false,"ll":[52.540383,13.414097],"q":"Museo de la Kulturbrauerei Berlin","min":75,"time":"1-1.5h","price":"Gratis","hours":"Mar-Dom 10:00-18:00 · Cerrado lunes","rating":"4.3","web":"","text":"Museo gratuito sobre la vida cotidiana en Berlín Oriental. Interesante no por la recreación sino por los objetos reales: coches Trabant, muebles de época, uniformes, pancartas, todo con la estética mate y sin pretensiones del diseño de la RDA.","tip":"Uno de los museos gratuitos más interesantes de Berlín. Sin aglomeraciones.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":14,"km":1.0415662961386438,"mode":"walk"}},{"id":"berlin-d2-8","name":"Kulturbrauerei","closed":false,"ll":[52.5382032,13.4127133],"q":"Kulturbrauerei Berlin","min":40,"time":"30-45 min (paseo por el complejo)","price":"Gratis (complejo) · Museos y eventos de pago","hours":"","rating":"","web":"","text":"Antigua fábrica de cerveza Schultheiss de finales del XIX reconvertida en espacio cultural: cines, bares, museos, salas de conciertos. El complejo de edificios de ladrillo rojo neogótico tiene aspecto de pequeña ciudad industrial. El mercado navideño de diciembre es uno de los mejores de Berlín.","tip":"El Museo de la Kulturbrauerei (ver siguiente punto) es gratuito y está dentro del complejo.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":5,"km":0.3377666547055882,"mode":"walk"}},{"id":"berlin-d2-9","name":"Jüdischer Friedhof Schönhauser Allee","closed":false,"ll":[52.5343731,13.4130453],"q":"Jüdischer Friedhof Schönhauser Allee Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Lun-Jue 9:00-16:00 · Vie 9:00-13:00 · Dom 10:00-16:00","rating":"4.5","web":"","text":"🚫 Cerrado sábados y festivos judíos 📍 Schönhauser Allee 23-25 Cementerio judío cerrado desde 1827, cubierto de hiedra y con lápidas medio enterradas en la vegetación. Atmósfera de bosque encantado. Solo quedan unas pocas tumbas visibles al fondo. Última morada del compositor Giacomo Meyerbeer y el pintor Max Liebermann.","tip":"Ropa modesta requerida. Cerrado los sábados (Shabat).","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~7 min a pie).","leg":{"min":7,"km":0.5544230188078482,"mode":"walk"}},{"id":"berlin-d2-10","name":"Wasserturm Prenzlauer Berg","closed":false,"ll":[52.5341937,13.4186129],"q":"Wasserturm Prenzlauer Berg Berlin","min":15,"time":"10-15 min (exterior)","price":"Gratis (exterior)","hours":"","rating":"","web":"","text":"Torre de agua de ladrillo de 1877, la más antigua de Berlín hasta 1914. En el sótano los nazis instalaron uno de los primeros campos de concentración improvisados en 1933, donde torturaron y asesinaron a opositores políticos antes de construir los campos formales.","tip":"El contraste entre la apariencia doméstica de ladrillo rojo y su historia es perturbador. Una placa pequeña en la base lo documenta.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~10 min a pie).","leg":{"min":7,"km":0.4902448909834407,"mode":"walk"}},{"id":"berlin-d2-11","name":"[PARA FRIKIS] Patio grafitero","closed":false,"ll":[52.524261,13.4026214],"q":"[PARA FRIKIS] Patio grafitero Berlin","min":40,"time":"30-45 min","price":"Gratis · Museo Otto Weidt: donativo","hours":"Accesible durante el día","rating":"4.5","web":"","text":"Pasaje oculto en pleno Mitte: paredes cubiertas de graffiti, arte callejero en constante cambio, tiendas de artistas, cine indie (Kino Central), y el museo gratuito Otto Weidt en el interior. Weidt era un fabricante de escobas que escondió a 30 empleados judíos ciegos y sordos durante el Holocausto.","tip":"El Museo Otto Weidt es uno de los museos más conmovedores de Berlín y casi nadie lo conoce. Gratis con donativo.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~29 min a pie).","leg":{"min":27,"km":2.0097754685868536,"mode":"walk"}},{"id":"berlin-d2-12","name":"Hackesche Höfe","closed":false,"ll":[52.5240221,13.4024126],"q":"Hackesche Höfe Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"Aprox 10:00-20:00","rating":"4.5","web":"","text":"Complejo de ocho patios interiores Art Nouveau de 1907 conectados entre sí. El primer patio tiene fachada de azulejos de Meissen con figuras. Pasaje fotográfico especialmente bueno al amanecer o al atardecer. Recorre los ocho en secuencia, entrar desde Rosenthaler Str 40-41.","tip":"Los últimos patios son los más auténticos y menos turísticos.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Kulturbrauerei (a cubierto, ~30 min a pie).","leg":{"min":0,"km":0.039112920420609196,"mode":"walk"}},{"id":"berlin-d2-13","name":"Hackescher Markt","closed":false,"ll":[52.5237159,13.4022679],"q":"Hackescher Markt Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"","rating":"4.4","web":"","text":"Los arcos de ladrillo bajo la línea elevada del S-Bahn en la zona de Hackescher Markt albergan bares y tiendas. Street food, tiendas independientes y cafés. Mejor en fin de semana.","tip":"Los arcos del S-Bahn tienen bares con buena relación calidad-precio para el centro.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Museo de Historia Natural (a cubierto, ~30 min a pie).","leg":{"min":0,"km":0.04605551149605302,"mode":"walk"}},{"id":"berlin-d2-14","name":"LLEGADA D2: S+U Hackescher Markt","closed":false,"ll":[52.5226613,13.4022971],"q":"S+U Hackescher Markt Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚉 Parada S-Bahn: S+U Hackescher Markt Líneas S-Bahn: S3 · S5 · S7 · S75 ➡️ S3/S5/S7 este: Ostbahnhof · Ostkreuz (conexión S41 · S42 · U5) ⬅️ S5/S7 oeste: Alexanderplatz (1 parada) · Hauptbahnhof · Zoologischer Garten 🔗 Cerca (a pie): 🚌 Bus M1: parada Hackescher Markt (dirección Prenzlauer Berg) 🚇 U8 Weinmeisterstrasse (3 min a pie)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":2,"km":0.15246765176937876,"mode":"walk"}}]},{"key":"d3","big":"3","small":"sáb","label":"Día 3 · sáb","title":"Schöneberg → Tempelhof","zone":"Schöneberg → Tempelhof","est":"~6–8h","start":"10:30","sunset":null,"from":"Winterfeldtplatz","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Fichtebunker (tour guiado): aprox 17€ · https://www.berliner-unterwelten.de","Verificar Schwerbelastungskörper fuera de temporada: https://www.schwerbelastungskoerper.de"]},{"h":"⚠️ IMPORTANTE","lines":["El día va de Schöneberg (suroeste) hacia Kreuzberg y Tempelhof (sur/sureste). Lógica geográfica de oeste a este.","Mercado: llegar antes de las 10h para lo mejor (sábados: mucho mejor que miércoles).","Schwerbelastungskörper: abre a las 13h (abr-oct). El exterior siempre accesible.","Körnerpark: está en Neukölln, al sur de Görlitzer. Añade 30 min."]},{"h":"🍽️ COMIDA","lines":["Mercado Winterfeldtplatz: desayuno de mercado, 5-8€.","Bergmannkiez: mercado Marheineke cubierto, buen street food."]},{"h":"🚇 TRANSPORTE","lines":["Inicio: U4 Viktoria-Luise-Platz o Bus M19/M29 parada Winterfeldtstraße.","Para Schwerbelastungskörper: S1 Julius-Leber-Brücke o Bus 104 Kolonnenbrücke.","Final: S+U Tempelhof (U6 · S41 · S42) o U Kottbusser Tor si terminas en Kreuzberg."]}],"stops":[{"id":"berlin-d3-0","name":"SALIDA D3: Winterfeldtplatz","closed":false,"ll":[52.4957378,13.3544831],"q":"Winterfeldtplatz Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"📍 Sin parada propia. Opciones para llegar: 🚇 U4: U Viktoria-Luise-Platz (5 min a pie hacia el norte) 🚇 U7: U Eisenacher Str (5 min a pie hacia el este) 🚌 Bus M19 · M29: parada Winterfeldtstraße (en la propia plaza)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"berlin-d3-1","name":"Mercado Winterfeldtplatz","closed":false,"ll":[52.4968074,13.3542667],"q":"Mercado Winterfeldtplatz Berlin","min":75,"time":"1-1.5h","price":"Gratis (entrada) · Productos 3-15€","hours":"Miér 8:00-14:00 · Sáb 8:00-16:00","rating":"4.5","web":"","text":"El mercado de barrio más popular de Schöneberg: mezcla de puesto de flores, quesos locales, ropa y comida callejera. El sábado es el mejor para ambiente. Pan turco, aceitunas, productos ecológicos, salchichas a la parrilla y antigüedades los sábados.","tip":"Primeras 2 horas para lo mejor. El sábado es mucho mejor que el miércoles.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~26 min a pie).","leg":{"min":2,"km":0.15578280182394383,"mode":"walk"}},{"id":"berlin-d3-2","name":"Gedenkstein · placa deportados","closed":false,"ll":[52.4994609,13.3534745],"q":"Gedenkstein — placa deportados Berlin","min":5,"time":"5 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Placa conmemorativa de los homosexuales deportados y exterminados en campos de concentración nazis. En el barrio donde vivieron Christopher Isherwood, David Bowie e Iggy Pop. La placa es pequeña y fácil de no verla, aunque el contexto histórico es muy significativo.","tip":"El barrio de Schöneberg era el centro de la vida gay de Berlín en los años 20 y en los 70. Esta placa recuerda el coste de eso.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~30 min a pie).","leg":{"min":5,"km":0.3898564715528549,"mode":"walk"}},{"id":"berlin-d3-3","name":"Urban Nation","closed":false,"ll":[52.4987058,13.3565036],"q":"Urban Nation Berlin","min":75,"time":"1-1.5h","price":"Gratis","hours":"Mar-Dom 10:00-18:00 · Cerrado lunes","rating":"4.4","web":"https://urban-nation.com","text":"Primer museo dedicado exclusivamente al arte urbano en Alemania, inaugurado en 2017. Los murales de la fachada exterior en Bülowstraße cambian con frecuencia. Las exposiciones interiores mezclan artistas emergentes y consolidados del street art global.","tip":"La fachada exterior es visitable gratis 24h aunque el museo esté cerrado.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~30 min a pie).","leg":{"min":4,"km":0.28804423270063234,"mode":"walk"}},{"id":"berlin-d3-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[52.4987058,13.3565036],"q":"restaurantes cerca de Urban Nation Berlin","min":75,"price":"","hours":"","text":"Mercado Winterfeldtplatz: desayuno de mercado, 5-8€. Bergmannkiez: mercado Marheineke cubierto, buen street food.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"berlin-d3-4","name":"[PARA FRIKIS] Café Neues Ufer","closed":false,"ll":[52.489544,13.3598607],"q":"[PARA FRIKIS] Café Neues Ufer Berlin","min":40,"time":"30-45 min","price":"Café 3-4€ · Desayuno 7-12€","hours":"Diario desde 9:00","rating":"4.3","web":"","text":"El bar gay donde David Bowie desayunaba casi cada mañana durante sus años berlineses (1976-1978), dos portales más allá del apartamento. Uno de los bares gay más veteranos de Berlín, sin cambios significativos en el interior desde los 80. El interés no es el café sino la continuidad histórica del lugar.","tip":"El valor no es el café en sí. Es que sigues los pasos de Bowie en un local que no ha cambiado desde que él lo frecuentaba.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~20 min a pie).","leg":{"min":18,"km":1.3569268576441151,"mode":"walk"}},{"id":"berlin-d3-5","name":"[PARA FRIKIS] Apartamento de David Bowie","closed":false,"ll":[52.4891614,13.3596174],"q":"[PARA FRIKIS] Apartamento de David Bowie Berlin","min":10,"time":"5-10 min","price":"Gratis","hours":"Exterior 24h","rating":"","web":"","text":"La placa conmemorativa está en la fachada del Altbau donde Bowie vivió de 1976 a 1978 con Iggy Pop en el piso de atrás. No se puede entrar. Bowie grabó aquí su Trilogía de Berlín: Heroes (1977) Low (1977) Lodger (1979) La placa es discreta y la mayoría pasa sin verla.","tip":"Para en la acera, mira el edificio, saca la foto. El café del nº 157 de al lado era su local de cada día.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~20 min a pie).","leg":{"min":0,"km":0.05930750651301113,"mode":"walk"}},{"id":"berlin-d3-6","name":"Rathaus Schöneberg","closed":false,"ll":[52.4849484,13.3441669],"q":"Rathaus Schöneberg Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"Exterior 24h","rating":"4.4","web":"","text":"El ayuntamiento desde cuya ventana JFK pronunció el \"Ich bin ein Berliner\" el 26 de junio de 1963 ante 400.000 personas. La placa en la fachada indica la ventana exacta.","tip":"Los escalones donde habló Kennedy son accesibles. La JFK-Platz delante tiene mercado los viernes.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":20,"km":1.4901490719440442,"mode":"walk"}},{"id":"berlin-d3-7","name":"John-F.-Kennedy-Platz","closed":false,"ll":[52.4847485,13.3450178],"q":"John-F.-Kennedy-Platz Berlin","min":15,"time":"10-15 min","price":"Gratis","hours":"24h · Mercado Vie 10:00-18:00","rating":"","web":"","text":"La plaza frente al Rathaus Schöneberg, renombrada tras Kennedy el día después del asesinato en noviembre de 1963.","tip":"El letrero de la plaza es un buen punto fotográfico.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~1 min a pie).","leg":{"min":0,"km":0.08028427493310049,"mode":"walk"}},{"id":"berlin-d3-8","name":"Rudolph-Wilde-Park","closed":false,"ll":[52.4828472,13.3411489],"q":"Rudolph-Wilde-Park Berlin","min":20,"time":"20 min (descanso)","price":"Gratis","hours":"Amanecer-anochecer","rating":"","web":"","text":"Parque verde en el centro de Schöneberg. Buen punto de descanso entre el mercado y los puntos más al sur.","tip":"Pausa para sentarse y reagruparse antes de la parte sur del día.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~5 min a pie).","leg":{"min":6,"km":0.4376453650294203,"mode":"walk"}},{"id":"berlin-d3-9","name":"[PARA FRIKIS] Schwerbelastungskörper","closed":false,"ll":[52.484045,13.3716044],"q":"[PARA FRIKIS] Schwerbelastungskörper Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Mar-Dom 13:00-18:00 (abril-octubre) · Exterior siempre accesible","rating":"4.4","web":"https://www.schwerbelastungskoerper.de","text":"Cilindro de hormigón de 12.650 toneladas construido por Albert Speer en 1941 para probar si el suelo de Berlín aguantaría el peso del arco de triunfo previsto para la \"Welthauptstadt Germania\". 14 metros de diámetro, 18 metros de altura. El resultado: Se hundió 18cm en 3 años. El proyecto Germania se abandonó. El cilindro sigue aquí. Todavía hundiéndose. Casi nadie sabe que existe. Cómo llegar: S1 hasta Julius-Leber-Brücke, o Bus 104 parada Kolonnenbrücke. Esquina General-Pape-Str y Loewenhardtdamm.","tip":"Vale absolutamente la pena el desvío.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Rathaus Schöneberg (a cubierto, ~32 min a pie).","leg":{"min":19,"km":2.686633623536952,"mode":"transit"}},{"id":"berlin-d3-10","name":"Viktoria Park","closed":false,"ll":[52.488227,13.3800144],"q":"Viktoria Park Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Amanecer-anochecer","rating":"4.5","web":"","text":"Colina de 66 metros en Kreuzberg con un obelisco neogótico dedicado a las guerras napoleónicas. El mirador desde lo alto da vistas sobre el sur de Berlín. Subida de unos 10 minutos desde la entrada principal. En verano hay una pequeña cascada artificial y una cervecería en la base.","tip":"La mejor vista panorámica del sur de Berlín. La cervecería a los pies de la colina es un buen final de tarde.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~39 min a pie).","leg":{"min":13,"km":0.9557682268173427,"mode":"walk"}},{"id":"berlin-d3-11","name":"Bergmannkiez","closed":false,"ll":[52.4888995,13.397023],"q":"Bergmannkiez Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"La calle más representativa del Kreuzberg no turístico: tiendas vintage, bares de barrio, mercado Marheineke, aspecto de barrio que no ha perdido el carácter a pesar de la gentrificación de los alrededores. La zona entre Baerwaldstrasse y Marheinekeplatz es la más auténtica.","tip":"El mercado Marheineke (cubierto) tiene buen street food de barrio. Menos masificado que los mercados del centro.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~19 min a pie).","leg":{"min":20,"km":1.5002740447912468,"mode":"walk"}},{"id":"berlin-d3-12","name":"Fichtebunker","closed":false,"ll":[52.4903547,13.4129079],"q":"Fichtebunker Berlin","min":90,"time":"1.5h (tour guiado)","price":"Aprox. 17€","hours":"Tours guiados: consultar horarios online","rating":"","web":"https://www.berliner-unterwelten.de","text":"Gasómetro de 130 años reconvertido en búnker durante la Segunda Guerra Mundial. Tiene 9 plantas. Berliner Unterwelten lo llama \"la máquina del tiempo\": conserva elementos de sus distintas épocas (gasómetro, búnker, almacén de frutas de la RDA).","tip":"Reservar online con antelación. Solo accesible con tour guiado.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":19,"km":1.4139129576647265,"mode":"walk"}},{"id":"berlin-d3-13","name":"Körnerpark","closed":false,"ll":[52.471517,13.4382048],"q":"Körnerpark Berlin","min":25,"time":"20-30 min","price":"Gratis","hours":"Amanecer-anochecer","rating":"4.6","web":"","text":"Un jardín formal de principios del siglo XX con escalinatas de piedra, fuentes barrocas y terrazas de granito excavado en una cantera. Enteramente rodeado de fachadas de Neukölln. El contraste entre la formalidad del jardín y el entorno urbano es el elemento más fotogénico.","tip":"Uno de los rincones más desconocidos y fotogénicos de Berlín. Casi ningún turista lo conoce.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~47 min a pie).","leg":{"min":22,"km":3.5177829022871396,"mode":"transit"}},{"id":"berlin-d3-14","name":"Tempelhofer Feld","closed":false,"ll":[52.4748569,13.4005926],"q":"Tempelhofer Feld Berlin","min":105,"time":"1.5-2h","price":"Gratis","hours":"Diario desde las 6:00 hasta el atardecer","rating":"4.7","web":"https://tempelhoferfreiheit.de","text":"El aeropuerto cerrado en 2008 convertido en el espacio público más surreal de Berlín: 386 hectáreas de pistas de aterrizaje abandonadas donde los berlineses hacen kite, rollerski y picnic. Las pistas originales están intactas. El horizonte sin edificios es único en Berlín.","tip":"Mejor desde las 16h en verano. Llevar algo de comer. El edificio del aeropuerto de 1941 es uno de los más grandes del mundo.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~33 min a pie).","leg":{"min":21,"km":3.3468422001801947,"mode":"transit"}},{"id":"berlin-d3-15","name":"Aeropuerto de Tempelhof (edificio)","closed":false,"ll":[52.4824974,13.38914],"q":"Aeropuerto de Tempelhof (edificio) Berlin","min":55,"time":"45-60 min (tour interior)","price":"Aprox. 6€ (tour guiado) · Exterior gratis","hours":"Tours: consultar horarios en web","rating":"4.4","web":"https://www.thf-berlin.de","text":"El edificio del aeropuerto es uno de los mayores edificios del mundo y el mayor de la era nazi que sobrevivió: planta en forma de águila (literalmente), 1,2 km de fachada, hormigón masivo de los años 30. Los tours interiores muestran las rampas de acceso a los aviones y la historia del puente aéreo de 1948.","tip":"El exterior ya es impresionante sin pagar. El tour interior merece la pena si te queda energía.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Fichtebunker (a cubierto, ~32 min a pie).","leg":{"min":20,"km":1.4954942167064977,"mode":"walk"}},{"id":"berlin-d3-16","name":"LLEGADA D3: S+U Tempelhof","closed":false,"ll":[52.4709979,13.3843975],"q":"S+U Tempelhof Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 U-Bahn: U6 🚉 S-Bahn: S41 · S42 ⬆️ U6 norte: Mehringdamm (1 parada) · Yorckstraße · Kleistpark 🔄 S41/S42: línea circular del Ring en ambas direcciones 🔗 Cerca (a pie): 🚌 Bus M46: parada U Tempelhof (en la entrada de la estación)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":23,"km":1.7139327332706968,"mode":"walk"}}]},{"key":"d4","big":"4","small":"dom","label":"Día 4 · dom","title":"Prenzlauer Berg · Friedrichshain · Kreuzberg","zone":"Prenzlauer Berg","est":"~6–8h","start":"10:30","sunset":null,"from":"S+U Hackescher Markt","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Neues Museum (busto de Nefertiti): 12€ · https://www.smb.museum · Reservar con antelación en verano","Torre de TV Alexanderplatz (opcional): 23€ · https://tv-turm.de"]},{"h":"⏱ ANÁLISIS DE TIEMPO","lines":["Este día tiene demasiados museos para hacerlos todos. Elige 1 museo grande o 1 grande + 1 pequeño como máximo.","Con 1 museo grande: ~10h 17min","Con 2 museos: ~11h 57min (ya es un día completo)","🎯 LOS MUSEOS, ELIGE","GRANDE (elige 1, llegar a las 13h para evitar colas):","Neues Museum: busto de Nefertiti, arquitectura de Chipperfield con ruinas integradas. 2h · 12€ · Reservar online","Altes Museum: antigüedades griegas y romanas, Rotonda espectacular. 1.5-2h · 10€","Pérgamo: CERRADO hasta 2027. Solo ver exterior.","PEQUEÑO (opcional, combinar con el grande):","Berliner Dom: cripta con 90 sarcófagos prusianos, cúpula con vistas. 45-60 min · 9€","(El Lustgarten y el exterior de la Isla valen de por sí, aunque no entres a ningún museo)"]},{"h":"📋 ELIGE TU INTENSIDAD","lines":["Relajado (~6h): Lustgarten → 1 museo → Berliner Dom (exterior) → Alexanderplatz → East Side Gallery → Oberbaum → Oranienstrasse","Normal (~10h): añade Haus des Lehrers, Mural Cosmonauta, KÖNIG GALERIE, Baerwaldbrücke","Intenso (~11h): 2 museos + todos los puntos (día muy largo)"]},{"h":"⏰ HORARIOS CLAVE","lines":["10:00h, Museo (llegar a la apertura o a las 13h cuando los grupos comen)","16:00-17:00h, East Side Gallery (luz del oeste ilumina los murales)","Noche, Madame Claude y Oranienstrasse para cerrar el día"]},{"h":"🍽️ COMIDA","lines":["Hackescher Markt: a 5 min de la Isla de los Museos, buena parada antes o después del museo.","Oranienstrasse y Görlitzer Park: múltiples opciones para cenar al final del día."]},{"h":"🚇 TRANSPORTE","lines":["Inicio: S+U Hackescher Markt → 5 min a pie hasta la Isla de los Museos.","De Oberbaum a Kreuzberg: U1 desde Warschauer Str hasta Schlesisches Tor/Kottbusser Tor.","Final: U Kottbusser Tor (U1 · U8)."]}],"stops":[{"id":"berlin-d4-0","name":"SALIDA D4: S+U Hackescher Markt","closed":false,"ll":[52.5226613,13.4022971],"q":"S+U Hackescher Markt Berlin","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚉 Parada S-Bahn: S+U Hackescher Markt Líneas S-Bahn: S3 · S5 · S7 · S75 📍 5 min a pie hasta la Isla de los Museos cruzando Monbijoubrücke. 🔗 Conexiones: ⬅️ S5/S7 oeste: Alexanderplatz (1 parada) · Hauptbahnhof 🚇 U8 Weinmeisterstrasse (3 min a pie)","tip":"","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"berlin-d4-1","name":"Lustgarten","closed":false,"ll":[52.5187,13.3992],"q":"Lustgarten Berlin","min":20,"time":"15-20 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"La plaza frente al Berliner Dom y el Altes Museum. Geométrica, despejada, bien encuadrada. El edificio del Altes Museum tiene una fachada colosal neoclásica con 18 columnas jónicas que solo se aprecia bien desde aquí. En verano la gente toma el sol en el césped con el Dom de fondo.","tip":"El mejor encuadre fotográfico del Berliner Dom es desde aquí, no desde la orilla del Spree.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Altes Museum (a cubierto, ~2 min a pie).","leg":{"min":8,"km":0.6341145830582662,"mode":"walk"}},{"id":"berlin-d4-2","name":"Altes Museum","closed":false,"ll":[52.5194665,13.3987445],"q":"Altes Museum Berlin","min":105,"time":"1.5-2h","price":"10€","hours":"Mar-Dom 10:00-18:00 · Cerrado lunes","rating":"4.5","web":"","text":"El primer museo público de Berlín (1830). Colección de antigüedades griegas, etruscas y romanas. La Rotonda central es una de las salas más impresionantes de la ciudad. La fachada con 18 columnas jónicas es visible desde el Lustgarten.","tip":"Si no quieres pagar, la fachada del Altes Museum en sí y la Isla de los Museos tienen valor arquitectónico desde el exterior.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.11782172931719842,"mode":"walk"}},{"id":"berlin-d4-3","name":"Neues Museum","closed":false,"ll":[52.5201349,13.3976462],"q":"Neues Museum Berlin","min":120,"time":"2h","price":"12€ · Reservar con antelación","hours":"Mar-Dom 10:00-18:00 (jue hasta 20:00) · Cerrado lunes","rating":"4.6","web":"https://www.smb.museum","text":"Contiene el busto de Nefertiti (sala 3.10, planta 3). El edificio fue destruido en la guerra y reconstruido por David Chipperfield conservando las ruinas visibles: la convivencia entre lo destruido y lo nuevo es arquitectónicamente única.","tip":"El busto de Nefertiti es pequeño. Llegar a las 13h para evitar colas.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.13663053474615797,"mode":"walk"}},{"id":"berlin-d4-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[52.5201349,13.3976462],"q":"restaurantes cerca de Neues Museum Berlin","min":75,"price":"","hours":"","text":"Hackescher Markt: a 5 min de la Isla de los Museos, buena parada antes o después del museo. Oranienstrasse y Görlitzer Park: múltiples opciones para cenar al final del día.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"berlin-d4-4","name":"CERRADO TEMPORALMENTE - Museo de Pérgamo","closed":true,"ll":[52.521183,13.3969],"q":"CERRADO TEMPORALMENTE - Museo de Pérgamo Berlin","min":10,"time":"— Cerrado hasta 2027","price":"— Consultar apertura parcial","hours":"Cerrado por obras hasta 2027","rating":"4.6","web":"https://www.smb.museum","text":"El museo más visitado de Alemania: el Altar de Pérgamo (siglo II a.C.) y la Puerta de Ishtar de Babilonia están aquí. Actualmente cerrado por renovación. Si no vas a pagar, la fachada del edificio en sí y la Isla de los Museos tienen valor arquitectónico desde el exterior.","tip":"Verificar si hay apertura parcial en smb.museum antes de planificar la visita.","transport":false,"tags":["closed"],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":2,"km":0.16511199877266286,"mode":"walk"}},{"id":"berlin-d4-5","name":"Berliner Dom","closed":false,"ll":[52.5190608,13.401078],"q":"Berliner Dom Berlin","min":55,"time":"45-60 min","price":"9€ (incluye subida a la cúpula)","hours":"Lun-Sáb 10:00-18:00 · Dom 12:00-18:00","rating":"4.6","web":"https://www.berlinerdom.de","text":"La cripta bajo la catedral es la mayor colección de sarcófagos prusianos en el mundo: más de 90 ataúdes de la dinastía Hohenzollern, algunos con relieves de bronce del siglo XVII visibles de cerca. La cúpula (270 escalones) ofrece las mejores vistas sobre la Isla de los Museos y el Spree.","tip":"La entrada incluye la cúpula y la cripta. Mejor hora para las vistas: tarde.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":6,"km":0.4787036585663987,"mode":"walk"}},{"id":"berlin-d4-6","name":"World Time Clock","closed":false,"ll":[52.5211743,13.413297],"q":"World Time Clock Berlin","min":10,"time":"5-10 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"La Weltzeituhr (Reloj Mundial) de 1969, diseñada por Erich John. Muestra la hora de 148 ciudades del mundo. Obra de la RDA que se ha convertido en el punto de encuentro por excelencia de Berlín.","tip":"Junto a la base del Brunnen der Völkerfreundschaft. Punto de referencia para quedar en Berlín.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~15 min a pie).","leg":{"min":15,"km":1.1173414919077045,"mode":"walk"}},{"id":"berlin-d4-7","name":"Haus des Lehrers","closed":false,"ll":[52.5211536,13.4161377],"q":"Haus des Lehrers Berlin","min":15,"time":"10-15 min (exterior)","price":"Gratis (exterior)","hours":"","rating":"","web":"","text":"Bloque de 12 plantas con friso mural de mosaico de 125 metros que rodea el edificio: motivos de la vida social en la RDA. La cúpula del Kongresshalle adjunto es igualmente interesante. Fotográficamente muy potente con sol lateral.","tip":"El mosaico de 125 metros es uno de los más grandes de Europa. Justo junto a Alexanderplatz.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~18 min a pie).","leg":{"min":3,"km":0.24987500858471437,"mode":"walk"}},{"id":"berlin-d4-8","name":"Alexanderplatz","closed":false,"ll":[52.5219814,13.413306],"q":"Alexanderplatz Berlin","min":40,"time":"30-45 min","price":"Torre TV 23€ (reservar online)","hours":"Torre diario 9:00-24:00","rating":"4.4","web":"Torre de TV: https://tv-turm.de","text":"La plaza principal del Berlín oriental. La Torre de TV a 368m es el mejor mirador de la ciudad. El Reloj Mundial a nivel de calle es gratuito.","tip":"Reservar la Torre de TV online para evitar colas de 1-2h.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Berliner Dom (a cubierto, ~15 min a pie).","leg":{"min":4,"km":0.27631739989263643,"mode":"walk"}},{"id":"berlin-d4-9","name":"U Kottbusser Tor","closed":false,"ll":[52.4989986,13.4184263],"q":"U Kottbusser Tor Berlin","min":30,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 Parada U-Bahn: U Kottbusser Tor Líneas: U1 · U8 ⬅️ U1 oeste: Gleisdreieck (5 paradas) → U2 · U7 ➡️ U1 este: Warschauer Str (3 paradas) → S-Bahn · Ostbahnhof ⬆️ U8 norte: Moritzplatz (1 parada) · Alexanderplatz (4 paradas) 🔗 Cerca (a pie): 🚌 Bus M29 · M41: parada Kottbusser Tor 🚇 U Görlitzer Bahnhof (U1, 3 min al este)","tip":"","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~21 min a pie).","leg":{"min":21,"km":3.3526431792656677,"mode":"transit"}},{"id":"berlin-d4-10","name":"[PARA FRIKIS] Mural Cosmonauta · RAW","closed":false,"ll":[52.4997346,13.4229863],"q":"[PARA FRIKIS] Mural Cosmonauta — RAW Berlin","min":15,"time":"10-15 min","price":"Gratis","hours":"Accesible 24h","rating":"","web":"","text":"El mural más emblemático de Kreuzberg, del artista francés Victor Ash: un astronauta gigante de 20 metros pintado en blanco y negro. Uno de los primeros grandes murales de street art de Europa (2001). Está en la fachada exterior del recinto RAW (Revaler Str 99).","tip":"El pin está en el mural específico. El RAW-Gelände completo merece 30 min de exploración adicional.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~26 min a pie).","leg":{"min":6,"km":0.4151433903326438,"mode":"walk"}},{"id":"berlin-d4-11","name":"Oranienstrasse","closed":false,"ll":[52.5034127,13.4115769],"q":"Oranienstrasse Berlin","min":40,"time":"30-45 min (paseo)","price":"Gratis","hours":"24h · Bares desde mediodía","rating":"4.4","web":"","text":"La calle principal de Kreuzberg para bares, tiendas independientes y carácter local. Por la noche es una de las zonas principales de ocio de Berlín. El artista belga ROA pintó animales hiperrealistas en algunas fachadas de la zona (buscar en Google Maps \"ROA Berlin Oranienstraße\").","tip":"Más auténtica cuanto más camines hacia el este, dirección Kottbusser Tor.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~14 min a pie).","leg":{"min":15,"km":1.1360680248491646,"mode":"walk"}},{"id":"berlin-d4-12","name":"KÖNIG GALERIE","closed":false,"ll":[52.5006336,13.4009082],"q":"KÖNIG GALERIE Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Mar-Sáb 11:00-18:00 · Cerrado Dom-Lun","rating":"4.4","web":"https://www.koeniggalerie.com","text":"Iglesia brutalista de Werner Düttmann (1967): exterior de hormigón sin ventanas con aspecto de fortaleza, interior con luz cenital dramática. Reconvertida en galería de arte contemporáneo. La fachada exterior es arquitectura brutalista de primer nivel.","tip":"Aunque no entres, el edificio desde fuera es uno de los mejores ejemplos de brutalismo en Berlín.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":14,"km":1.021129920952963,"mode":"walk"}},{"id":"berlin-d4-13","name":"Baerwaldbrücke","closed":false,"ll":[52.4965723,13.4051844],"q":"Baerwaldbrücke Berlin","min":25,"time":"20-30 min (paseo por el canal)","price":"Gratis","hours":"24h","rating":"","web":"","text":"Paseo por el canal. El Landwehrkanal que bordea el norte de Neukölln y el sur de Kreuzberg. En primavera los cerezos en flor en los márgenes convierten el paseo en una de las mejores fotografías estacionales de Berlín.","tip":"El puente en sí es el punto de referencia, pero el paseo por el canal en ambas direcciones es lo que vale.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~9 min a pie).","leg":{"min":9,"km":0.6973284367419608,"mode":"walk"}},{"id":"berlin-d4-14","name":"Görlitzer Park","closed":false,"ll":[52.4965928,13.4374489],"q":"Görlitzer Park Berlin","min":40,"time":"30-45 min","price":"Gratis","hours":"Amanecer-anochecer","rating":"4.2","web":"","text":"Parque construido sobre las vías de la antigua estación de Görlitzer Bahnhof (quemada en los disturbios de 1987). El espacio conserva la trazada de las vías en el terreno. Atmósfera caótica y poco turística, muy representativa de Kreuzberg.","tip":"Más tranquilo por las mañanas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~44 min a pie).","leg":{"min":19,"km":2.8394510188959616,"mode":"transit"}},{"id":"berlin-d4-15","name":"Madame Claude","closed":false,"ll":[52.4995184,13.4372086],"q":"Madame Claude Berlin","min":30,"time":"Variable (bar nocturno)","price":"Consumición desde 4€","hours":"Desde 19:00 · Mejor tarde","rating":"","web":"","text":"Bar en un antiguo burdel cuya decoración está literalmente al revés: los muebles están colgados del techo. Bar con música en directo y ambiente punk/alternativo. Uno de los bares más originales de Kreuzberg.","tip":"Para tomar algo por la noche, no de día. La decoración del techo vale la visita.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~43 min a pie).","leg":{"min":6,"km":0.42343382790537865,"mode":"walk"}},{"id":"berlin-d4-16","name":"Puente Oberbaum","closed":false,"ll":[52.502269,13.4463443],"q":"Puente Oberbaum Berlin","min":20,"time":"20 min","price":"Gratis","hours":"24h","rating":"4.7","web":"","text":"Puente de doble nivel sobre el Spree con torres neogóticas de ladrillo rojo. Uno de los mejores encuadres del agua en Berlín. Cruzarlo a pie y fotografiarlo desde ambas orillas. Durante la Guerra Fría fue uno de los pocos puntos de cruce entre Este y Oeste.","tip":"Las mejores fotos desde las orillas del Spree, 100m al este o al oeste del puente.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta KÖNIG GALERIE (a cubierto, ~53 min a pie).","leg":{"min":12,"km":0.8968650546598581,"mode":"walk"}},{"id":"berlin-d4-17","name":"East Side Gallery","closed":false,"ll":[52.5050224,13.4396953],"q":"East Side Gallery Berlin","min":55,"time":"45-60 min (recorrer toda la galería)","price":"Gratis","hours":"Accesible 24h","rating":"4.6","web":"","text":"El tramo más largo del Muro conservado (1.316 metros) con murales pintados en 1990 por artistas de todo el mundo. No es un punto: hay que recorrer toda la galería a pie de extremo a extremo. Murales que no te puedes perder: El beso Brézhnev-Honecker: Señor, ayúdame a sobrevivir este amor mortal. Test the Rest: el Trabant atravesando el Muro.","tip":"Mejor a última hora de la tarde, la luz ilumina los murales desde function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const hhmm=m=>{m=Math.round(m);return `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
function fmtMin(m){m=Math.round(m);if(!m)return'';const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?String(r).padStart(2,'0'):''}`:`${r} min`}
const r5=m=>Math.max(5,Math.round(m/5)*5);
const short=n=>String(n).split(' · ')[0].replace(/^(SALIDA|LLEGADA) D\d+:\s*/,'');
const isMeal=s=>!!s.meal;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const gmSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
let T=null, D=[];
const mode=()=>T.kind==='road'?'driving':'walking';
const gmTo=ll=>`https://www.google.com/maps/dir/?api=1&destination=${ll[0]},${ll[1]}&travelmode=${mode()}`;
function gmapsDir(pts){pts=pts.slice(0,10);const p=pts.map(x=>x.join(',')); const w=p.slice(1,-1).join('|'); return `https://www.google.com/maps/dir/?api=1&origin=${p[0]}&destination=${p[p.length-1]}${w?`&waypoints=${encodeURIComponent(w)}`:''}&travelmode=${mode()}`}
const LEGTXT={car:'en coche',walk:'a pie',transit:'en transporte'}, LEGIC={car:'car',walk:'walk',transit:'route'};
let rainMode=store.get('rm-rain',false);

/* desplazamientos: coche con OSRM en directo (o estimación); ciudad con tramos estimados */
const routeCache={};
function hav2(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function estLegs(pts){const legs=[];let km=0;for(let i=0;i<pts.length-1;i++){const k=hav2(pts[i],pts[i+1])*1.3;km+=k;legs.push(k<0.3?0:k/(k>100?95:k>30?70:50)*60+5)}return{legs,km}}
function routeFor(pts,live){
  const key=pts.map(p=>p.join(',')).join(';'); const c=routeCache[key]; if(c&&c.ok) return c;
  if(live&&!c){routeCache[key]={pending:true};
    fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>`${p[1]},${p[0]}`).join(';')}?overview=false`)
      .then(r=>r.ok?r.json():null).then(j=>{const g=j&&j.routes&&j.routes[0]; if(!g)return; routeCache[key]={ok:true,real:true,legs:g.legs.map(l=>l.duration/60),km:g.distance/1000}; if(T&&!$('trip').hidden) refresh(false)}).catch(()=>{});}
  const e=estLegs(pts); return {ok:false,real:false,legs:e.legs,km:e.km};
}
function startOf(d){return (store.get(`rm5-${T.id}-start`,{})[d.key])||d.start||'10:30'}
function planDay(d,live=true){
  const seq=d.stops.filter(s=>!s.opt); const times={}; let t=toMin(startOf(d)), drive=0, act=0, walkKm=0, km=0, last=0, real=false, pts;
  if(T.kind==='road'){
    pts=[d.route[0],...seq.map(s=>s.ll),d.route[1]]; const R=routeFor(pts,live); km=R.km; real=R.real;
    seq.forEach((s,i)=>{const lg=R.legs[i]||0; drive+=lg; t+=lg; let a=t,wait=0; if(isMeal(s)&&/^Comida/.test(s.when)&&a<810){wait=810-a;a=810} t=a+(s.min||0); if(!isMeal(s)) act+=s.min||0; times[s.id]={arr:a,dep:t,wait,leg:lg,mode:'car'}});
    last=R.legs[seq.length]||0; drive+=last; t+=last;
  } else {
    pts=seq.map(s=>s.ll);
    seq.forEach((s,i)=>{const L=i?s.leg||{min:0,mode:'walk',km:0}:{min:0,mode:'walk',km:0}; drive+=L.min; if(L.mode==='walk') walkKm+=L.km; km+=L.km; t+=L.min; let a=t,wait=0; if(isMeal(s)&&a<810){wait=810-a;a=810} t=a+(s.min||0); if(!isMeal(s)&&!s.transport) act+=s.min||0; times[s.id]={arr:a,dep:t,wait,leg:L.min,mode:L.mode}});
  }
  const sunset=d.sunset?toMin(d.sunset):null;
  return {seq,pts,times,end:t,drive,last,act,km,walkKm,real,sunset,
    night:sunset?seq.filter(s=>!isMeal(s)&&!s.nightOk&&times[s.id].dep>sunset+10):[], late:seq.filter(s=>s.close&&times[s.id].arr>toMin(s.close))};
}

/* fotos (Wikimedia, primero las de calidad) */
const photoCache={};
const BAD=/(map|mapa|plano|logo|escudo|coat of arms|bandeira|flag|svg|diagram|location|localiza|panel|placa|cartel|altar)/i;
async function commons(params){
  const r=await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1600&'+params); if(!r.ok) return [];
  const j=await r.json(); const pages=j.query?Object.values(j.query.pages):[]; pages.sort((a,b)=>(a.index||0)-(b.index||0));
  const strip=h=>(h||'').replace(/<[^>]+>/g,'').trim();
  return pages.filter(p=>p.imageinfo&&p.imageinfo[0]&&!BAD.test(p.title)&&/\.(jpe?g|webp)$/i.test(p.title)&&(p.imageinfo[0].width||0)>=1200).map(p=>{const ii=p.imageinfo[0],md=ii.extmetadata||{};
    return {src:ii.thumburl||ii.url,page:ii.descriptionurl,title:p.title.replace(/^File:|\.[a-z]+$/gi,''),author:strip(md.Artist&&md.Artist.value).slice(0,80),lic:strip(md.LicenseShortName&&md.LicenseShortName.value)}});
}
function getPhotos(s){
  if(photoCache[s.q]) return photoCache[s.q];
  return photoCache[s.q]=(async()=>{const seen=new Set(),list=[]; const add=a=>a.forEach(x=>{if(!seen.has(x.page)){seen.add(x.page);list.push(x)}});
    try{add(await commons('generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(s.q+' incategory:Quality_images')))}catch(e){}
    if(list.length<6){try{add(await commons('generator=search&gsrnamespace=6&gsrlimit=16&gsrsearch='+encodeURIComponent('filetype:bitmap '+s.q)))}catch(e){}}
    if(list.length<4&&s.ll){try{add(await commons(`generator=geosearch&ggsnamespace=6&ggslimit=16&ggsradius=1500&ggscoord=${s.ll[0]}|${s.ll[1]}`))}catch(e){}}
    return list.slice(0,12)})();
}

const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function tripStats(t){
  const days=t.days.filter(d=>d.key!=='opt'&&d.stops.length).length; let km=0;
  if(t.kind==='road'){const keep=T; T=t; t.days.forEach(d=>{km+=planDay(d,false).km}); T=keep}
  return {days:t.days.filter(d=>d.key!=='opt').length, active:days, places:t.places, km:Math.round(km/10)*10};
}
function countdown(t){if(!t.start)return null; const now=new Date(); now.setHours(0,0,0,0); const s=new Date(t.start+'T00:00:00'), e=new Date((t.end||t.start)+'T00:00:00'); const dd=Math.round((s-now)/864e5); if(dd>1)return `En ${dd} días`; if(dd===1)return 'Mañana'; if(now<=e)return 'En marcha'; return 'Hecho'}
function coverOf(t,img){getPhotos({q:t.coverQ}).then(l=>{if(l[0]&&img){img.src=l[0].src;img.hidden=false}})}
function renderHome(){

    $('featWrap').innerHTML=`<button class="feat" type="button" data-t="${next.id}"><div class="ph"><img alt="" hidden id="fImg"><div class="top"><span class="pill sage">${ic('cal')}${esc(countdown(next)||'Próximo')}</span><span class="pill">${esc(next.datesLabel.split(' · ')[0])}</span></div>
      <div class="bot"><div class="kick">Próximo viaje · ${esc(next.country)}</div><h3>${esc(next.title)}</h3><div class="sub">${esc(next.sub)}</div>
      <div class="row3"><div><b>${st.days}</b><span>días</span></div><div><b>${st.places}</b><span>sitios</span></div><div><b>${st.km?'~'+st.km.toLocaleString('es-ES'):'—'}</b><span>km en coche</span></div></div>
      <div class="open">Abrir mapa ${ic('r')}</div></div></div></button>`;
    coverOf(next,$('fImg'));
  } else $('featWrap').innerHTML='';
  $('mapsCt').textContent=`${TRIPS.length} mapas`;

    <div class="sect">Itinerario</div>${timeline(d,true)}
    ${extra.length?`<div class="sect">Opcionales<span>fuera del horario</span></div><div class="dlist">${extra.map(s=>`<div class="drow"><span class="d">${ic('info')}</span><span><span class="nm">${esc(short(s.name))}</span><span class="s">${s.min?fmtMin(s.min):''}${s.price?' · '+esc(s.price):''}</span><span class="s">${esc(s.text)}</span></span><span></span></div>`).join('')}</div>`:''}`;
  $('planB').querySelectorAll('.row[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;$('planOv').hidden=true;refresh(true)});
}
$('planBtn').onclick=()=>{$('planOv').hidden=false;renderPlan()}; $('planX').onclick=()=>$('planOv').hidden=true;

/* el viaje: resumen, días y antes de tu viaje */
function renderTrip(){
  let km=0,dr=0,walk=0; const q=D.map(d=>{const p=planDay(d);km+=p.km;dr+=p.drive;walk+=p.walkKm;return p}); const road=T.kind==='road';
  const stats=road?`<div class="stat"><span class="k">${ic('car')}Coche total</span><b>${Math.round(km).toLocaleString('es-ES')} km</b><small>~${fmtMin(r5(dr))}</small></div><div class="stat"><span class="k">${ic('eur')}Gasolina</span><b>~${Math.round(km*T.fuel.l100/100*T.fuel.eur)} €</b><small>${String(T.fuel.l100).replace('.',',')} L/100 · ${String(T.fuel.eur.toFixed(2)).replace('.',',')} €/L</small></div>`
    :`<div class="stat"><span class="k">${ic('pin')}Sitios</span><b>${T.places}</b><small>${D.filter(d=>d.key!=='opt').length} días</small></div><div class="stat"><span class="k">${ic('walk')}A pie</span><b>~${Math.round(walk)} km</b><small>estimado, en todo el viaje</small></div>`;
  $('tripB').innerHTML=`<div class="eyebrow">${esc(T.country)}</div><h2>${esc(T.title)}</h2>
    <div class="tags"><span class="tag n">${ic('cal')}${esc(T.datesLabel)}</span>${T.base?`<span class="tag">${ic('home')}${esc(T.base.addr?T.base.addr+', ':'')}${esc(T.base.name)}</span>`:''}</div>
    <div class="grid2">${stats}</div>
    ${T.mid?`<a class="btn cream" href="https://www.google.com/maps/d/viewer?mid=${T.mid}" target="_blank" rel="noopener">${ic('exp')}Abrir en MyMaps</a>`:''}
    <div class="sect">Días</div><div class="dlist">${D.map((d,i)=>`<button class="drow ${i===day?'on':''}" type="button" data-i="${i}"><span class="d">${esc(d.big)}<small>${esc(d.small)}</small></span><span><span class="nm">${esc(d.title)}</span><span class="s">${q[i].seq.filter(s=>!isMeal(s)&&!s.transport).length} sitios · ${fmtMin(r5(q[i].drive))||'0 min'} ${road?'de coche':'de desplazamientos'}${d.cond?' · con buen parte':''}</span></span>${ic('r')}</button>`).join('')}</div>
    ${T.antes&&T.antes.length?`<div class="sect">Antes de tu viaje</div>${T.antes.map((a,k)=>`<details class="brief antes" ${k===0?'open':''}><summary>${esc(a.h)}<span class="ch">${ic('r')}</span></summary><div class="bs">${a.rows.map(r=>`<div class="row"><b>${esc(r.t)}</b><span>${esc(r.d)}</span></div>`).join('')}</div></details>`).join('')}`:''}`;
  $('tripB').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{day=+x.dataset.i;idx=0;$('tripOv').hidden=true;refresh(true)});
}
$('tripBtn').onclick=()=>{$('tripOv').hidden=false;renderTrip()}; $('tripX').onclick=()=>$('tripOv').hidden=true;

/* visor de fotos */
let VL=[],VI=0,VN='';
function openVw(l,k,n){VL=l;VI=k;VN=n;$('vw').hidden=false;showVw()}
function showVw(){const n=VL.length;if(!n)return;VI=(VI+n)%n;const p=VL[VI];$('vwI').src=p.src;$('vwT').textContent=`${VI+1} / ${n} · ${short(VN)}`;$('vwC').innerHTML=`${esc(p.title)}${p.author?' · '+esc(p.author):''}${p.lic?' · '+esc(p.lic):''} · <a href="${p.page}" target="_blank" rel="noopener">Wikimedia</a>`}
$('vwX').onclick=()=>$('vw').hidden=true; $('vwP').onclick=()=>{VI--;showVw()}; $('vwN').onclick=()=>{VI++;showVw()};
let tx=null; $('vwS').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('vwS').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){VI+=dx<0?1:-1;showVw()}tx=null});
document.addEventListener('keydown',e=>{if(!$('vw').hidden){if(e.key==='Escape')$('vw').hidden=true;if(e.key==='ArrowRight'){VI++;showVw()}if(e.key==='ArrowLeft'){VI--;showVw()}return}
  if(!T||$('trip').hidden) return; if(e.key==='ArrowRight')$('next').click(); if(e.key==='ArrowLeft')$('prev').click()});

/* arranque */
route();
</script>
</body>
</html>
