<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141512" id="tc">
<script>(function(){var t;try{t=localStorage.getItem("rm-theme")}catch(e){}if(!t)t=matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RawMaps">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>RawMaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Modo paseo: mapa MyMaps bloqueado arriba, ficha abajo con tres alturas, navegación en la zona del pulgar.
   Estilo: design-tokens.json (Stillo): negro oliva, crema, salvia. Una sola fuente, DM Sans. */
:root{
  --bg:#141512; --surface:#1e1f1b; --raised:#2a2b26; --line:rgba(236,232,218,.09); --line2:rgba(236,232,218,.16);
  --ink:#ece8da; --ink2:#b4b0a3; --ink3:#7e7b71;
  --cream:#e4e2d3; --on-cream:#141512; --sage:#a4af6b; --sage-soft:rgba(164,175,107,.16);
  --warn:#e0a458; --warn-soft:rgba(224,164,88,.13); --rain:#8db8c4; --rain-soft:rgba(141,184,196,.13);
  --f:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f0e8; --surface:#fbfaf6; --raised:#e6e3d8; --line:rgba(28,29,25,.09); --line2:rgba(28,29,25,.18);
  --ink:#1c1d19; --ink2:#55564d; --ink3:#8a897e;
  --cream:#23251f; --on-cream:#f2f0e8; --sage:#6b7836; --sage-soft:rgba(107,120,54,.13);
  --warn:#b0601a; --warn-soft:rgba(176,96,26,.10); --rain:#3a7787; --rain-soft:rgba(58,119,135,.10);
  color-scheme:light;
}
:root[data-theme="light"] body{background:#e4e1d6}
:root[data-theme="light"] .here,:root[data-theme="light"] .mcb{background:rgba(251,250,246,.9)}
:root[data-theme="light"] .hero .ct{background:rgba(251,250,246,.85)}
:root[data-theme="light"] #sheet{box-shadow:0 -10px 30px rgba(28,29,25,.12)}
:root[data-theme="light"] .go{box-shadow:0 8px 22px rgba(28,29,25,.25)}
:root[data-theme="light"] .rainplan,:root[data-theme="light"] .rain{border-color:rgba(58,119,135,.22)}
:root[data-theme="light"] .stat.ed{border-color:rgba(107,120,54,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none} *::-webkit-scrollbar{display:none} [hidden]{display:none!important}
html,body{height:100%;margin:0} body{background:#0c0d0b;color:var(--ink);font:400 15px/1.5 var(--f);font-feature-settings:"tnum" 1;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit} button{cursor:pointer;border:0;background:none;padding:0} a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
svg{flex:0 0 auto}

#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* cabecera */
#hd{flex:0 0 auto;padding:calc(var(--st) + 12px) 16px 0;background:var(--bg);z-index:20}
.hrow{display:flex;align-items:center;gap:8px;height:42px}
.brand{flex:1;min-width:0}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.1}
.trip{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.cb svg{width:18px;height:18px}
.cb[aria-pressed="true"]{background:var(--rain-soft);border-color:var(--rain);color:var(--rain)}
#days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;margin:0 -16px}
.dc{flex:0 0 auto;height:38px;padding:0 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.dc b{font-weight:700;color:var(--ink)}
.dc[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--sage)} .dc[aria-pressed="true"] b{color:var(--sage)}
.dc .fl{width:6px;height:6px;border-radius:50%;background:var(--warn)}

/* escenario: mapa */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--surface)}
#mframe{position:absolute;left:0;right:0;width:100%;border:0;opacity:0;transition:opacity .35s}
#mframe.vis{opacity:1}
#lock{position:absolute;inset:0;z-index:2;cursor:pointer}
.mtop{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:flex;align-items:center;gap:8px;pointer-events:none}
.mtop>*{pointer-events:auto}
.here{flex:1;min-width:0;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 6px;border-radius:999px;background:rgba(20,21,18,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.here .n{flex:0 0 auto;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--sage);color:var(--on-cream);font-size:12.5px;font-weight:700}
.here .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcb{width:42px;height:42px;border-radius:50%;background:rgba(20,21,18,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.mcb svg{width:18px;height:18px}
.go{position:absolute;right:12px;z-index:4;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 16px;border-radius:999px;background:var(--cream);color:var(--on-cream);font-weight:700;font-size:14.5px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.go svg{width:17px;height:17px}
.noMap{position:absolute;left:0;right:0;top:64px;display:grid;place-items:center;padding:16px 28px;text-align:center;color:var(--ink2);font-size:13.5px}
.noMap b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:4px}

/* ficha */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-radius:28px 28px 0 0;border-top:1px solid var(--line);box-shadow:0 -12px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;height:var(--sh,56%);transition:height .22s ease}
#sheet.drag{transition:none}
.grip{flex:0 0 auto;padding:10px 0 4px;touch-action:none;cursor:grab}
.grip i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto}
.nav{flex:0 0 auto;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:12px;padding:4px 16px 12px}
.nb{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.nb.nx{background:var(--cream);color:var(--on-cream);border-color:var(--cream)}
.nb svg{width:22px;height:22px} .nb:disabled{opacity:.3}
.prog{position:relative;height:46px;touch-action:none;cursor:pointer}
.prog .ln{position:absolute;left:12px;right:12px;top:16px;height:4px;border-radius:2px;background:var(--raised)}
.prog .fill{position:absolute;left:12px;top:16px;height:4px;border-radius:2px;background:var(--sage)}
.prog .dots{position:absolute;left:12px;right:12px;top:0;height:36px}
.prog .dt{position:absolute;top:13px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--raised);border:2px solid var(--bg)}
.prog .dt.done{background:var(--sage)}
.prog .dt.cur{top:7px;width:22px;height:22px;margin-left:-11px;background:var(--sage);border:5px solid var(--sage-soft);background-clip:padding-box}
.prog .ct{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink3)}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px calc(var(--sb) + 28px)}

/* piezas comunes */
.eyebrow{font-size:12.5px;font-weight:600;color:var(--sage)}
h2{font-weight:700;font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:4px 0 12px;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--sage-soft);color:var(--sage);font-size:12.5px;font-weight:600}
.tag.w{background:var(--warn-soft);color:var(--warn)} .tag.n{background:var(--surface);color:var(--ink2)}
.tag svg{width:13px;height:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px}
.srow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:0 0 14px;padding:14px 4px}
.srow>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:0 6px;border-left:1px solid var(--line)}
.srow>div:first-child{border-left:0}
.srow svg{width:18px;height:18px;color:var(--ink3)}
.srow b{font-size:14.5px;font-weight:700;line-height:1.2}
.srow span{font-size:11.5px;color:var(--ink3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 10px}
.stat{padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px}
.stat .k svg{width:14px;height:14px}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}
.stat.ed{background:var(--sage-soft);border-color:rgba(164,175,107,.35)} .stat.ed .k{color:var(--sage)}
.stat select{appearance:none;-webkit-appearance:none;width:100%;background:transparent;border:0;color:var(--ink);font:700 24px/1.1 var(--f);letter-spacing:-.02em;padding:0;cursor:pointer}
.stat select option{background:var(--surface);font-size:16px}
.stat.ed small{color:var(--sage)}
.rnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:0 0 10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.rnote svg{width:17px;height:17px;color:var(--ink3);margin-top:1px}
.rnote b{color:var(--ink);font-weight:600}
.alerts{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.alerts li{display:flex;gap:10px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;line-height:1.45;color:var(--ink2)}
.alerts li svg{width:17px;height:17px;margin-top:1px;color:var(--ink3)}
.alerts li.w{background:var(--warn-soft);border-color:rgba(224,164,88,.25);color:var(--ink)} .alerts li.w svg{color:var(--warn)}
.alerts b{font-weight:600;color:var(--ink)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);gap:4px;margin:0 0 14px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--on-cream)}
.seg .rn[aria-pressed="true"]{background:var(--rain);color:var(--on-cream)}
.rainplan{margin:0 0 14px;border-radius:20px;background:var(--rain-soft);border:1px solid rgba(141,184,196,.25);overflow:hidden}
.rainplan summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:600;font-size:14px;color:var(--rain);cursor:pointer}
.rainplan summary::-webkit-details-marker{display:none}
.rainplan summary svg{width:17px;height:17px} .rainplan summary .ch{margin-left:auto;transition:transform .2s}
.rainplan[open] summary .ch{transform:rotate(90deg)}
.rainplan ul{margin:0;padding:0 16px 14px 43px;display:grid;gap:8px;font-size:13.5px;color:var(--ink)}
.rainplan li b{font-weight:600}
.sect{display:flex;align-items:baseline;justify-content:space-between;font-size:16px;font-weight:700;margin:20px 0 10px}
.sect span{font-size:12.5px;font-weight:500;color:var(--ink3)}
/* línea de tiempo */
.tl{position:relative;display:grid;gap:0}
.tl .row{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:0 0 4px;text-align:left;width:100%}
.tl .row::before{content:"";position:absolute;left:14px;top:30px;bottom:-4px;width:2px;background:var(--raised)}
.tl .row:last-child::before{display:none}
.tl .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);font-size:13px;font-weight:700;z-index:1}
.tl .num.meal{background:var(--raised);color:var(--ink2)} .tl .num svg{width:14px;height:14px}
.tl .num.home{background:var(--raised);color:var(--ink2)}
.tl .bx{padding:4px 0 14px;min-width:0}
.tl .t{font-size:12.5px;font-weight:600;color:var(--sage)}
.tl .t .w{color:var(--warn)}
.tl .nm{display:block;font-weight:600;font-size:15px;line-height:1.3;margin-top:1px}
.tl .s{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.tl .leg{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;margin-top:6px}
.tl .leg svg{width:13px;height:13px}
.tl .row.end .nm{color:var(--ink2);font-weight:500}
/* ficha de parada */
.hero{position:relative;display:block;width:100%;aspect-ratio:16/11;border-radius:24px;overflow:hidden;background:var(--surface);margin:0 0 12px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ld{display:grid;place-items:center;height:100%;color:var(--ink3);font-size:13px}
.hero .ct{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink);background:rgba(20,21,18,.75);backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px}
.hero .ct svg{width:13px;height:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px}
.thumbs button{flex:0 0 72px;height:72px;border-radius:16px;overflow:hidden;background:var(--surface);border:2px solid transparent;opacity:.6;transition:opacity .15s}
.thumbs button.on{border-color:var(--sage);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.meta{font-size:13px;font-weight:600;color:var(--sage)} .meta .w{color:var(--warn)}
p.why{margin:0 0 14px;font-size:15.5px;line-height:1.6;color:var(--ink)}
.rain{display:flex;gap:10px;margin:0 0 14px;padding:14px 16px;border-radius:20px;background:var(--rain-soft);border:1px solid rgba(141,184,196,.25);font-size:14px;color:var(--ink)}
.rain svg{width:18px;height:18px;color:var(--rain);margin-top:2px}
.rain b{color:var(--rain);font-weight:600}
.body{display:flex;flex-direction:column} .rainon .body .rain{order:-1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);margin:0 0 10px}
.btn svg{width:17px;height:17px}
.next{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:13px;color:var(--ink3)}
.next b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin-top:2px}
.next .ar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--on-cream);display:grid;place-items:center}
.next .ar svg{width:18px;height:18px}

/* capas */
.ov{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.ovh{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 12px) 16px 10px}
.ovh .t{flex:1;font-weight:700;font-size:17px;text-align:center;margin-right:54px}
.ovb{flex:1;min-height:0;overflow-y:auto;padding:4px 16px calc(var(--sb) + 30px)}
#fullmap{flex:1;border:0;width:100%}
.dlist{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.drow .d{font-size:22px;font-weight:700;text-align:center;line-height:1} .drow .d small{display:block;font-size:11.5px;font-weight:500;color:var(--ink3);margin-top:3px}
.drow .nm{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.drow .s{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.drow svg{width:18px;height:18px;color:var(--ink3)}
.drow.on{border-color:var(--sage)}
.vw{position:fixed;inset:0;z-index:2000;background:#0c0d0b;color:var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.vw .top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 12px) 16px 10px;gap:10px;font-size:13.5px;font-weight:600}
.vw .stg{position:relative;min-height:0;overflow:hidden}
.vw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vw .cap{padding:10px 16px calc(var(--sb) + 16px);text-align:center;font-size:12px;color:var(--ink3)}
.vw .cap a{color:var(--ink3)}
.vw .ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(20,21,18,.7);color:var(--ink);display:grid;place-items:center}
.vw .ar svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- home ---------- */
#home{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 32px);z-index:30}
.hhd{display:flex;align-items:center;gap:8px;height:42px}
.hhd .logo{flex:1}
.hello{margin:18px 0 18px}
.hello .eyebrow{color:var(--ink3);font-weight:500}
.hello h1{font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:6px 0 4px}
.hello p{margin:0;color:var(--ink2);font-size:15px}
.feat{position:relative;display:block;width:100%;text-align:left;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin:0 0 26px;color:#f2efe4}
.feat .ph{position:relative;aspect-ratio:4/3.6;background:linear-gradient(160deg,#3a3d2c,#1b1c18)}
.feat .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feat .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,11,.15) 0%,rgba(12,13,11,0) 30%,rgba(12,13,11,.55) 62%,rgba(12,13,11,.92) 100%)}
.feat .top{position:absolute;top:14px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:rgba(20,21,18,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;font-weight:600;color:#f2efe4;border:1px solid rgba(242,239,228,.14)}
.pill.sage{background:rgba(164,175,107,.9);color:#141512;border-color:transparent}
.pill svg{width:13px;height:13px}
.feat .bot{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.feat .kick{font-size:12.5px;font-weight:600;color:#c9d08f}
.feat h3{margin:4px 0 2px;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.feat .sub{font-size:14px;color:rgba(242,239,228,.78)}

quero. Los días despejados son perfectos para la Foz y los miradores."},{"t":"🍺 Superbock, no Sagres","d":"Superbock es la cerveza de Oporto. Pedir Sagres en un bar portuense levanta suspicacias."},{"t":"🤝 Propinas","d":"Restaurante con servicio en mesa: 5-10%. Bares y cafeterías de mostrador: no se espera."},{"t":"🏚 Azulejos desprendidos","d":"Los azulejos caídos y las fachadas deterioradas no son descuido, son la estética de la ciudad. Parte del carácter de Oporto es exactamente eso."},{"t":"💧 Agua del grifo","d":"Potable y de buena calidad."}]},{"h":"🍽️ COMER EN OPORTO","rows":[{"t":"🐟 Bacalhau · variable","d":"El bacalao es el plato de Portugal. Teóricamente hay 365 formas de prepararlo. Las más habituales: à brás (con huevo y patata paja), com natas (gratinado con nata) y assado (a la brasa)."},{"t":"🥩 Francesinha · 12-15€","d":"El sandwich de Oporto: pan tostado, carne, salchicha, jamón, cubierto de queso fundido y salsa de cerveza especiada. Contundente. Original de Oporto, no existe igual en ningún otro lugar."},{"t":"🐟 Pez a la brasa, Matosinhos · 15-22€","d":"Dourada, robalo o linguado en brasa de carbón en la Rua Heróis de França. La mejor comida del viaje si se llega con hambre a Matosinhos."},{"t":"🍷 Vinho Verde · 2-4€ copa","d":"Vino blanco ligeramente efervescente del norte de Portugal. Fresco, ácido, bajo en alcohol. El acompañamiento natural de cualquier comida en Oporto."},{"t":"🍷 Porto Tónico · 4-6€","d":"Vino de Oporto blanco con tónica y hielo. Aperitivo local que los portuenses toman en verano en los bares del río."}]}],"base":null,"days":[{"key":"d1","big":"1","small":"mié","label":"Día 1 · mié","title":"Llegada · Clérigos · Foz","zone":"Llegada","est":"~4–8h","start":"10:30","sunset":null,"from":"Iglesia del Carmen y Casa Escondida","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Livraria Lello: 8€ · Reservar online, sin reserva no se entra en temporada alta"]},{"h":"⏱ ANÁLISIS DE TIEMPO","lines":["Día de llegada, diseñado para ser relajado. El núcleo Clérigos cabe en 3-4h. La extensión Foz es 2h más de paseo y transporte."]},{"h":"🎯 LOS QUE MANDAN","lines":["Livraria Lello: llegar en los primeros 30 min de apertura (9h) o habrá cola","Torre de los Clérigos: mejor mañana, se llena desde las 11h","Passeio Alegre / Praia do Carneiro: tarde, el atardecer sobre el Atlántico es el cierre del día"]},{"h":"📋 ELIGE TU INTENSIDAD","lines":["Relajado (~4h): Lello → Iglesia del Carmen → Torre Clérigos → Palacio de Cristal → Mirador Bandeirinha","Normal (~6h): añade Azulejos Vasconcelos, Centro Fotografía, Jardín Chagas, Bombarda, Alfândega","Intenso (~8h): todo el día con extensión a la Foz (Passeio Alegre + Praia do Carneiro)"]},{"h":"⏰ HORARIOS CLAVE","lines":["9:00h, Livraria Lello (apertura, sin cola)","9:00h, Torre Clérigos (apertura)","17:30-19:00h, Passeio Alegre / Praia do Carneiro (atardecer)"]},{"h":"🍽️ COMIDA","lines":["Zona Bombarda-Palacio de Cristal: restaurantes sin turismo masivo. Almorzar entre los dos tramos del día.","Foz: restaurantes con terraza frente al río para cenar."]},{"h":"🚌 TRANSPORTE","lines":["Vuelta desde la Foz: Bus 500 (Foz → Praça da Liberdade, 20 min) o taxi 8-10€."]}],"stops":[{"id":"oporto-d1-0","name":"Iglesia del Carmen y Casa Escondida","closed":false,"ll":[41.1473563,-8.6162729],"q":"Iglesia del Carmen y Casa Escondida Porto","min":25,"time":"20-30 min","price":"Gratis exterior · Iglesia do Carmo 3€","hours":"Exterior 24h · Iglesia Lun-Sáb 9-18h","rating":"4.7","web":"","text":"Lo que parece una sola iglesia enorme son dos: la dos Carmelitas (1628, monjas) y la do Carmo (1768, monjes). Entre ellas hay una casa de 1 metro de ancho, la más estrecha de Oporto, construida para que monjas y monjes no tuvieran pared compartida. Sirvió para reuniones secretas durante la invasión napoleónica.","tip":"La fachada de azulejos de la Igreja do Carmo (lateral sur) es una de las mejores de la ciudad. Mirarla desde la acera de enfrente.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"oporto-d1-1","name":"Azulejos Painel - Joana Vasconcelos","closed":false,"ll":[41.1479824,-8.6150086],"q":"Azulejos Painel - Joana Vasconcelos Porto","min":5,"time":"5 min","price":"Gratis · exterior","hours":"24h","rating":"","web":"","text":"Panel de azulejos contemporáneo de Joana Vasconcelos en la fachada del edificio adyacente a Lello. Arte público de gran formato que actualiza la tradición azulejeira portuguesa. Difícil de no ver pero fácil de pasar sin identificar quién lo hizo.","tip":"En la misma parada que Lello, mirar la fachada antes de hacer cola.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Livraria Lello (a cubierto, ~2 min a pie).","leg":{"min":2,"km":0.1647134064991046,"mode":"walk"}},{"id":"oporto-d1-2","name":"Livraria Lello","closed":false,"ll":[41.1469055,-8.6147746],"q":"Livraria Lello Porto","min":40,"time":"30-45 min","price":"8€ entrada (descontable en compra) · Reservar online","hours":"Lun-Dom 9-19h · Cierres variables, confirmar","rating":"4.5","web":"","text":"Librería art nouveau de 1906: escalera curva roja, techo de cristal emplomado con el lema 'Decus in Labore'. El interior es más iglesia que tienda. J.K. Rowling vivió en Oporto 1991-1993 y la conexión con Hogwarts es popular aunque ella misma la desmintió.","tip":"Reservar entrada con antelación, desde 2017 hay control de aforo. Llegar en los primeros 30 min de apertura para fotos sin multitud. Hay cola a todas horas. Se puede ver solo por fuera cuando cierran por la tarde.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":2,"km":0.15773964675537666,"mode":"walk"}},{"id":"oporto-d1-3","name":"Torre de los Clérigos","closed":false,"ll":[41.1456705,-8.6145977],"q":"Torre de los Clérigos Porto","min":55,"time":"45-60 min","price":"8€ (incluye iglesia y museo)","hours":"Diario 9-19h","rating":"4.7","web":"","text":"Torre barroca de 76 metros (1763) diseñada por Nicola Nasoni. Fue referencia visual para barcos que entraban por el Duero. Subir los 200 escalones para la mejor panorámica del centro histórico. Buen primer punto después de dejar el equipaje, orienta visualmente toda la ciudad desde arriba.","tip":"La mejor panorámica de Oporto por precio. Llegar a las 9h cuando abre, desde las 11h hay cola. Está a 3 min a pie de Lello.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":2,"km":0.1795589693896996,"mode":"walk"}},{"id":"oporto-d1-4","name":"Centro Portugués de Fotografía","closed":false,"ll":[41.1445837,-8.615825],"q":"Centro Portugués de Fotografía Porto","min":55,"time":"45-60 min","price":"Gratis","hours":"Mar-Vie 10-18h · Sáb-Dom 15-19h · Cerrado lunes","rating":"4.4","web":"","text":"La antigua Cadeia da Relação (1767-1974): cárcel y tribunal de apelación. Planta baja para presos pobres y peligrosos, segunda planta mujeres, tercera para ricos que pagaban por comodidad. Camilo Castelo Branco estuvo preso aquí y escribió 'Amor de Perdição' en su celda. Funcionó hasta 1974, el mismo año que cayó la dictadura de Salazar. Hoy museo de fotografía con las celdas como salas.","tip":"La colección de cámaras espía camufladas (latas de Pepsi, paquetes de Marlboro) está en el 3er piso. Gratis y sin colas.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":3,"km":0.20622574589734333,"mode":"walk"}},{"id":"oporto-d1-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[41.1445837,-8.615825],"q":"restaurantes cerca de Centro Portugués de Fotografía Porto","min":75,"price":"","hours":"","text":"Zona Bombarda-Palacio de Cristal: restaurantes sin turismo masivo. Almorzar entre los dos tramos del día. Foz: restaurantes con terraza frente al río para cenar.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"oporto-d1-5","name":"Jardín de João Chagas","closed":false,"ll":[41.1459873,-8.6167545],"q":"Jardín de João Chagas Porto","min":15,"time":"15 min","price":"Gratis","hours":"Diario 8-21h (verano hasta 22h)","rating":"4.3","web":"","text":"Jardín con plátanos centenarios y esculturas de arte contemporáneo instaladas permanentemente. El árbol más antiguo tiene más de 200 años. Rodea el Centro Português de Fotografia, la antigua cárcel.","tip":"Buena pausa entre el núcleo Clérigos y el paseo hacia Bombarda. Bancos a la sombra.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.2267244727771375,"mode":"walk"}},{"id":"oporto-d1-6","name":"Mirador Bandeirinha da Saúde","closed":false,"ll":[41.1444187,-8.6220592],"q":"Mirador Bandeirinha da Saúde Porto","min":15,"time":"15 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Mirador elevado sobre el Duero con vista hacia la desembocadura en el Atlántico. Menos concurrido que los miradores del centro. Mejor al atardecer con la luz sobre el río.","tip":"Punto de transición entre el centro y el paseo a la Foz. Desde aquí arranca el paseo por la orilla hacia Passeio Alegre, unos 4 km.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Centro Portugués de Fotografía (a cubierto, ~9 min a pie).","leg":{"min":8,"km":0.6203671795909866,"mode":"walk"}},{"id":"oporto-d1-7","name":"Alfândega · parada del eléctrico","closed":false,"ll":[41.1438776,-8.6220817],"q":"Alfândega — parada del eléctrico Porto","min":30,"time":"","price":"","hours":"","rating":"","web":"","text":"🚃 Tranvía Eléctrico Línea 1 (STCP) Dirección: Passeio Alegre (sentido Foz) · 3.50€ · Se compra al conductor · Solo efectivo · Abr-Sep: 9:00-20:43h · Oct-Mar: 9:30-18:00h · Cada 20 min · Alfândega → Passeio Alegre: ~10 min · 4 paradas 📍 Passeio Alegre (terminal) está a 4 km hacia el oeste siguiendo el río. 🔗 Conexiones desde Alfândega: ➡️ Tranvía hacia Foz: Passeio Alegre (4 paradas, ~10 min) ⬅️ A pie por el paseo fluvial: Passeio Alegre (4 km, ~50 min, igual de bonito)","tip":"El tranvía sale de Infante lleno de turistas, cuando llega a Alfândega no siempre hay sitio. Si no entra, esperar el siguiente (20 min) o ir caminando.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Centro Portugués de Fotografía (a cubierto, ~9 min a pie).","leg":{"min":0,"km":0.07825618571229742,"mode":"walk"}},{"id":"oporto-d1-8","name":"Passeio Alegre · terminal del eléctrico","closed":false,"ll":[41.1476856,-8.6676701],"q":"Passeio Alegre — terminal del eléctrico Porto","min":30,"time":"","price":"","hours":"","rating":"","web":"","text":"🚃 Tranvía Eléctrico Línea 1 (STCP), Terminal Dirección vuelta: Infante (sentido centro) · 3.50€ · Se compra al conductor · Solo efectivo · Abr-Sep: 9:00-20:43h · Oct-Mar: 9:30-18:00h · Último: ~20:10h · Cada 20 min · Passeio Alegre → Infante: ~23 min · 13 paradas 📍 Jardín histórico en la desembocadura del Duero. Las olas del Atlántico rompen en la costa rocosa a pocos metros. Terminar el día aquí viendo el atardecer antes de coger el tranvía de vuelta. 🔗 Conexiones desde Passeio Alegre: ➡️ Tranvía hacia centro: Infante (13 paradas, ~23 min) 🚌 Bus 500: Praça da Liberdade (20 min, alternativa rápida)","tip":"Desde el terminal siempre hay sitio, cola mínima comparada con la de Infante.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~75 min a pie).","leg":{"min":27,"km":4.992924544279137,"mode":"transit"}},{"id":"oporto-d1-9","name":"Praia do Carneiro","closed":false,"ll":[41.1486625,-8.6759133],"q":"Praia do Carneiro Porto","min":40,"time":"30-45 min","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"Playa urbana en la desembocadura del Duero. En mayo el agua está fría pero el paseo marítimo, el faro y las olas del Atlántico rompiendo en las rocas al atardecer son el punto fotográfico. El tramo de costa desde aquí hacia el norte tiene pocas playas en toda Portugal del norte.","tip":"Último punto del día, cenar en los restaurantes de la Foz que dan al río antes de volver al centro (bus 500 directo).","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia del Carmen y Casa Escondida (a cubierto, ~87 min a pie).","leg":{"min":12,"km":0.9083183907234406,"mode":"walk"}}]},{"key":"d2","big":"2","small":"jue","label":"Día 2 · jue","title":"Sé · Ribeira · Gaia","zone":"Sé","est":"~7–9h","start":"10:30","sunset":null,"from":"Rua das Flores","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Cata de vino en Gaia: reservar online con 1-2 días de antelación en temporada alta. Graham's tiene mejor terraza, Taylor's mejor tour."]},{"h":"⏱ ANÁLISIS DE TIEMPO","lines":["Día completo y caminado. La zona Sé-Puente-Gaia-Ribeira son ~4 km de recorrido con subidas. Calcular mínimo 7h de visita útil."]},{"h":"🎯 LOS QUE MANDAN","lines":["Catedral: llegar antes de las 10h para el claustro sin grupos","Cata de vino: hora fija si se reserva con guía → encajar entre las 12h-14h","Mirador de la Victoria: mejor al atardecer, último punto antes del Passeio das Virtudes"]},{"h":"📋 ELIGE TU INTENSIDAD","lines":["Relajado (~5h): Rua das Flores → Catedral → Puente nivel superior → Gaia miradores → Cais da Ribeira → San Francisco → Mirador Victoria","Normal (~7h): añade Bolsa, Escadas do Codeçal, cata de vino, Teleférico","Intenso (~9h): todos los puntos del día"]},{"h":"⏰ HORARIOS CLAVE","lines":["9:00h, Rua das Flores (sin comercios abiertos, solo luz y azulejos)","9:30h, Catedral (claustro antes de grupos)","12:00-13:00h, Cata de vino en Gaia (incluye el tour más fresco del día)","17:30h, Mirador de la Victoria (luz del atardecer sobre el puente)"]},{"h":"🍽️ COMIDA","lines":["Evitar los restaurantes del Cais da Ribeira, precios turísticos. Subir 2 calles por Barredo o Mercadores para encontrar precios locales.","Gaia: las bodegas tienen cafetería incluida después de la cata."]}],"stops":[{"id":"oporto-d2-0","name":"Rua das Flores","closed":false,"ll":[41.144418,-8.6128125],"q":"Rua das Flores Porto","min":25,"time":"20-30 min · paseo","price":"Gratis","hours":"24h · Comercios 10-19h","rating":"4.5","web":"","text":"Calle del centro histórico con mayor densidad de azulejos en las fachadas. La arquitectura civil del XVIII y XIX en distintos estados de conservación. Mejor fotografiarla a primera hora de la mañana antes de que abran los comercios.","tip":"Entrar por el extremo norte (junto a São Bento) y avanzar hacia el sur hacia la Ribeira. A las 9h solo están los baristas y los locales.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).","leg":{"min":0,"mode":"walk","km":0}},{"id":"oporto-d2-1","name":"Largo da Pena Ventosa","closed":false,"ll":[41.1427648,-8.6130808],"q":"Largo da Pena Ventosa Porto","min":10,"time":"10 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Plaza pequeña en el barrio de la Sé: calles estrechas del barrio más antiguo de Oporto. Las fachadas con azulejos desprendidos, la ropa tendida entre ventanas y la vida local sin turismo son la atmósfera.","tip":"El barrio de la Sé es el Oporto sin restaurar, más auténtico y más incómodo que la Ribeira. Cuidado con el pavimento mojado.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.24075382145943583,"mode":"walk"}},{"id":"oporto-d2-2","name":"Mirador de la Rua das Aldas","closed":false,"ll":[41.1424459,-8.6125828],"q":"Mirador de la Rua das Aldas Porto","min":10,"time":"10 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Mirador menos conocido sobre el Duero y la Ribeira desde el barrio de la Sé. La vista incluye las bodegas de Vila Nova de Gaia al fondo. Sin la saturación del Mirador da Vitória.","tip":"Subir 5 minutos por la Rua das Aldas desde la Ribeira para una perspectiva diferente sin colas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~2 min a pie).","leg":{"min":0,"km":0.07116161407424292,"mode":"walk"}},{"id":"oporto-d2-3","name":"Catedral de Oporto","closed":false,"ll":[41.1428531,-8.6111165],"q":"Catedral de Oporto Porto","min":55,"time":"45-60 min","price":"Gratis exterior · Claustro 3€","hours":"Lun-Sáb 9-18:30h · Dom 9-12:30h y 14:30-18:30h","rating":"4.5","web":"","text":"Catedral románica del siglo XII con el claustro gótico del XIV cubierto de azulejos del siglo XVIII que narran Las Metamorfosis de Ovidio. La terraza de la catedral tiene la mejor vista del barrio de la Sé mirando hacia el río. El claustro vale los 3€, los azulejos son de calidad excepcional.","tip":"Llegar antes de las 10h para el claustro sin grupos. La vista desde la terraza es gratuita.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":2,"km":0.17012778537290646,"mode":"walk"}},{"id":"oporto-d2-4","name":"Escadas do Codeçal","closed":false,"ll":[41.141952,-8.6097886],"q":"Escadas do Codeçal Porto","min":15,"time":"10-15 min · bajada","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"Escalera medieval con casas de azulejo a ambos lados bajando desde la Sé hacia la Ribeira. El tramo más fotografiado del barrio más antiguo de Oporto. Una de las rutas de bajada con más carácter al río.","tip":"La luz de la mañana ilumina la escalera desde el este. Bajar despacio, el pavimento mojado resbala.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.19458425415837477,"mode":"walk"}},{"id":"oporto-d2-5","name":"Puente Don Luis I · nivel superior","closed":false,"ll":[41.1399589,-8.6094485],"q":"Puente Don Luis I — nivel superior Porto","min":20,"time":"15-20 min · cruce","price":"Gratis","hours":"24h","rating":"4.7","web":"","text":"El puente de hierro de 1886 diseñado por el colaborador de Gustave Eiffel, Téophile Seyrig. El nivel superior (45 metros sobre el río) es para peatones y metro. La vista sobre el Duero desde el centro del puente en ambas direcciones es la panorámica más completa de la ciudad.","tip":"Cruzar a pie hacia Gaia por el nivel superior. Volver por el nivel inferior (8 metros) al terminar en Gaia, diferente experiencia del mismo puente.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~6 min a pie).","leg":{"min":4,"km":0.2904785709683743,"mode":"walk"}},{"id":"oporto-d2-6","name":"Monasterio de la Serra do Pilar · mirador","closed":false,"ll":[41.138298,-8.6075262],"q":"Monasterio de la Serra do Pilar — mirador Porto","min":40,"time":"30-45 min","price":"Exterior gratis · Interior 3€","hours":"Exterior siempre · Visitas Mar-Sáb 10-17h","rating":"4.7","web":"","text":"La rotonda circular del monasterio agustino del siglo XVI es una rareza arquitectónica: las dos plantas son circulares completas, iglesia y claustro. Las vistas desde la explanada sobre la Ribeira y el Puente Don Luis I son la mejor perspectiva opuesta a la del Mirador da Vitória.","tip":"La explanada es el mejor mirador de Oporto para fotografiar el puente con la Ribeira al fondo. Sin cola, sin precio.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~7 min a pie).","leg":{"min":4,"km":0.31849211352176043,"mode":"walk"}},{"id":"oporto-d2-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[41.138298,-8.6075262],"q":"restaurantes cerca de Monasterio de la Serra do Pilar — mirador Porto","min":75,"price":"","hours":"","text":"Evitar los restaurantes del Cais da Ribeira, precios turísticos. Subir 2 calles por Barredo o Mercadores para encontrar precios locales. Gaia: las bodegas tienen cafetería incluida después de la cata.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"oporto-d2-7","name":"Jardim do Morro · mirador","closed":false,"ll":[41.1371459,-8.6092935],"q":"Jardim do Morro — mirador Porto","min":20,"time":"20 min","price":"Gratis","hours":"24h","rating":"4.6","web":"","text":"El jardín en la ladera de Gaia con vistas directas a la Ribeira. Junto al Monasterio. Mejor al atardecer cuando la luz cae sobre las fachadas de Oporto.","tip":"Aquí arranca el Teleférico de Gaia, si se quiere bajar al nivel del río sin andar.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~5 min a pie).","leg":{"min":3,"km":0.2544679943358652,"mode":"walk"}},{"id":"oporto-d2-8","name":"Teleférico de Gaia","closed":false,"ll":[41.138002,-8.6095865],"q":"Teleférico de Gaia Porto","min":5,"time":"5 min · trayecto","price":"6€ ida · 9€ ida y vuelta","hours":"Diario 10-20h (may-sep hasta 22h)","rating":"4.4","web":"","text":"El teleférico baja desde la explanada del Jardim do Morro hasta el borde del río en Gaia en 5 minutos, pasando sobre las bodegas de vino de Oporto. Las vistas sobre el Duero y el puente durante el descenso son únicas.","tip":"Tomar solo de bajada (6€), subir andando si hace buen tiempo. Evita la bajada a pie por la cuesta empinada. El trayecto de vuelta desde el río es a pie por el nivel inferior del puente.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~4 min a pie).","leg":{"min":0,"km":0.12779710129158528,"mode":"walk"}},{"id":"oporto-d2-9","name":"Vila Nova de Gaia · vistas, bodegas y paseo","closed":false,"ll":[41.1379278,-8.6123656],"q":"Vila Nova de Gaia — vistas, bodegas y paseo Porto","min":75,"time":"1-1.5h","price":"15-25€ según bodega y cata","hours":"Diario 10-18h · Reservar con antelación en temporada alta","rating":"4.6 (Graham's) · 4.5 (Sandeman) · 4.7 (Taylor's)","web":"","text":"La orilla sur del Duero: las bodegas de vino de Oporto se alinean desde el puente hacia el oeste. El nombre 'Vila Nova de Gaia' en los laterales de las bodegas (Sandeman, Graham's, Taylor's, Ramos Pinto) es el skyline reconocible de la ciudad desde la Ribeira. Cata en las bodegas: Las bodegas principales con cata en Vila Nova de Gaia: Graham's (1820), Sandeman (1790), Taylor's (1692). Todas ofrecen visita guiada por la bodega histórica con cata de 2-3 vinos incluida. El vino de Oporto se produce en el Douro pero envejece aquí, en bodegas de piedra que mantienen temperatura constante.","tip":"Zona para la cata de vino portugués. El paseo fluvial desde el teleférico hasta las bodegas son 5 minutos a pie. Reservar online la cata básica (la más corta). Graham's tiene las mejores vistas desde su terraza. Taylor's tiene el tour más completo. Sandeman es la más conocida pero la menos auténtica de las tres.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":4,"km":0.30274280030123174,"mode":"walk"}},{"id":"oporto-d2-10","name":"Mitad de Conejo (instalación Gaia)","closed":false,"ll":[41.1368792,-8.6150485],"q":"Mitad de Conejo (instalación Gaia) Porto","min":5,"time":"5 min","price":"Gratis","hours":"24h","rating":"4.1","web":"","text":"Escultura pública en Vila Nova de Gaia: un conejo gigante cortado por la mitad, instalado en el paseo del río. Arte público de impacto visual inmediato en un contexto inesperado. El nombre lo dice todo.","tip":"En el paseo del río entre las bodegas y el puente. Imposible de perder.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~4 min a pie).","leg":{"min":4,"km":0.3290716082346966,"mode":"walk"}},{"id":"oporto-d2-11","name":"Puente Don Luis I","closed":false,"ll":[41.1393428,-8.6092769],"q":"Puente Don Luis I Porto","min":30,"time":"","price":"","hours":"","rating":"","web":"","text":"🚶 A pie, Nivel inferior del puente · 8 m sobre el río Cruzar de vuelta hacia Oporto por el nivel inferior, diferente perspectiva del mismo puente. Más cerca del agua, más íntimo que los 45 metros del nivel superior. El nivel inferior es compartido con el tráfico rodado pero tiene acera peatonal.","tip":"Volver a Oporto por aquí después de terminar en Gaia, el contraste con la altura del nivel superior es inmediato.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Vila Nova de Gaia (a cubierto, ~5 min a pie).","leg":{"min":10,"km":0.7222390565550696,"mode":"walk"}},{"id":"oporto-d2-12","name":"Cais da Ribeira","closed":false,"ll":[41.140665,-8.611057],"q":"Cais da Ribeira Porto","min":25,"time":"20-30 min · paseo","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"El frente del río: casas de cuatro y cinco pisos con fachadas de azulejos en diferentes estados de deterioro sobre la Ribeira. El tramo entre el Puente Don Luis I y el Puente de la Arrábida al atardecer tiene el color que aparece en todas las fotos de Oporto.","tip":"Caminar por el Cais mirando hacia Gaia, la perspectiva inversa (desde el río hacia las casas) es la más fotogénica. Evitar los restaurantes del frente del río, caros y para turistas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).","leg":{"min":4,"km":0.27218386787089033,"mode":"walk"}},{"id":"oporto-d2-13","name":"Rua do Barredo","closed":false,"ll":[41.14103,-8.6122548],"q":"Rua do Barredo Porto","min":10,"time":"10 min · callejeo","price":"Gratis","hours":"24h","rating":"","web":"","text":"Una de las calles más estrechas y verticales entre la Ribeira y la Sé: escaleras, azulejos deteriorados, ropa tendida, olor a humedad. El barrio que los propios portuenses llaman 'Oporto de verdad'. Sin reformas masivas recientes.","tip":"La pendiente sube hacia la Sé, subir hasta el punto más alto para ver la diferencia de escala entre la calle y el río.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).","leg":{"min":0,"km":0.14066548087066416,"mode":"walk"}},{"id":"oporto-d2-14","name":"Rua dos Mercadores","closed":false,"ll":[41.1415164,-8.6130286],"q":"Rua dos Mercadores Porto","min":10,"time":"10 min · callejeo","price":"Gratis","hours":"24h","rating":"","web":"","text":"Paralela a Rua do Barredo: escaleras, azulejos deteriorados, ropa tendida entre ventanas. El barrio más antiguo de Oporto sin la gentrificación de la Ribeira baja.","tip":"Recorrer ambas calles en paralelo (Barredo y Mercadores) por su contraste con el paseo del río, a 200 metros de distancia.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Oporto (a cubierto, ~4 min a pie).","leg":{"min":0,"km":0.10972467750021532,"mode":"walk"}},{"id":"oporto-d2-15","name":"Iglesia de San Francisco","closed":false,"ll":[41.1410065,-8.616031],"q":"Iglesia de San Francisco Porto","min":55,"time":"45-60 min","price":"9€","hours":"Diario 9-18h (verano hasta 19h)","rating":"4.7","web":"","text":"El interior gótico cubierto con 400 kg de pan de oro brasileño del siglo XVIII, el 'árbol de Jesé' es la talla más elaborada de Portugal. Las catacumbas: los suelos de cristal muestran la acumulación de huesos de los frailes enterrados en capas sucesivas. Los nichos laterales tienen lápidas; quienes no tenían dinero para nicho van bajo el suelo de madera.","tip":"No saltarse las catacumbas, están incluidas en la entrada y casi nadie baja. El contraste con el oro del interior es llamativo.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":4,"km":0.33505428166107426,"mode":"walk"}},{"id":"oporto-d2-16","name":"Palacio de la Bolsa de Oporto","closed":false,"ll":[41.1413772,-8.6156725],"q":"Palacio de la Bolsa de Oporto Porto","min":40,"time":"30-45 min","price":"13.50€ · Solo visita guiada","hours":"Diario 9-18:30h · Tours cada 30 min","rating":"4.6","web":"","text":"Sala árabe del siglo XIX: paredes y techo cubiertos de estuco dorado y policromado en estilo morisco. Inscripciones en árabe en las puertas de un edificio neoclásico de comerciantes que nunca habían estado en Marruecos. El contraste entre el exterior sobrio y el interior es el dato.","tip":"Solo accesible con tour guiado de 30 min, apuntarse al llegar y esperar el siguiente. Vale la pena exclusivamente por la Sala Árabe.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.06629145651218273,"mode":"walk"}},{"id":"oporto-d2-17","name":"Mirador de la Victoria","closed":false,"ll":[41.1430829,-8.6158324],"q":"Mirador de la Victoria Porto","min":20,"time":"15-20 min","price":"Gratis","hours":"24h","rating":"4.6","web":"","text":"El mejor mirador del centro sobre el Puente Don Luis I y el río Duero. Técnicamente privado (terraza de un edificio) pero lo mantienen abierto a turistas. La perspectiva sobre el nivel superior del puente y las bodegas de Gaia al fondo es la fotografía de Oporto más reconocible.","tip":"La foto clásica de Oporto se toma desde aquí. Mejor al atardecer, la luz del oeste ilumina el puente y las bodegas.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palacio de la Bolsa de Oporto (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.24717840987440012,"mode":"walk"}},{"id":"oporto-d2-18","name":"Passeio das Virtudes","closed":false,"ll":[41.1441145,-8.6183358],"q":"Passeio das Virtudes Porto","min":25,"time":"20-30 min","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"Mirador sobre el Duero utilizado por los locales: estudiantes universitarios, parejas, vecinos con perros. La vista al río es lateral, no la vista frontal del Mirador da Vitória, pero la atmósfera local es irreproducible. Al atardecer hay músicos.","tip":"Cierre perfecto del día, traer algo de beber y sentarse a ver el río. Los puestos del paseo tienen vino y cerveza desde 2€.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palacio de la Bolsa de Oporto (a cubierto, ~7 min a pie).","leg":{"min":4,"km":0.3106467355115692,"mode":"walk"}}]},{"key":"d3","big":"3","small":"vie","label":"Día 3 · vie","title":"Day Trip: Guimarães → Braga","zone":"Day Trip: Guimarães → Braga","est":"~9h","start":"10:30","sunset":null,"from":"Sanctuary of Penha","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 ANTES DE SALIR","lines":["Recoger el coche a las 9:00h, Europcar R. Gonçalo Cristóvão 67. Llevar carnet de conducir. Activar via verde para autopistas de peaje al recoger."]},{"h":"⏱ ANÁLISIS DE TIEMPO","lines":["Conducción total: ~2h (Oporto→Guimarães 45min + Guimarães→Braga 20min + Braga→Oporto 45min)","Guimarães: ~2.5h (la mayoría son exteriores rápidos)","Bom Jesus + Sameiro: ~1h","Braga centro: ~2.5h","Total: ~8h, con salida a las 9h y vuelta a las 19-20h hay margen suficiente para todo."]},{"h":"🎯 LOS QUE MANDAN","lines":["Guimarães: llegar entre 9:30-10h, el centro medieval se llena desde las 11h","Bom Jesus: la foto desde abajo requiere buena luz, antes de las 15h","Jardín de Santa Bárbara (Braga): las rosas están en su mejor momento en mayo"]},{"h":"⚠️ LA ÚINICA ELECCIÓN REAL","lines":["Si entras al Paço dos Duques (45-60 min) Y a la Catedral de Braga (30-45 min), el día queda justo pero factible. Si prefieres ritmo más relajado, elige uno de los dos."]},{"h":"⏰ HORARIOS CLAVE","lines":["9:00h, Recoger coche","9:45-10:00h, Llegada a Guimarães","12:30-13:00h, Bom Jesus (luz de mediodía)","13:30h, Entrada a Braga centro"]},{"h":"🍽️ COMIDA","lines":["Guimarães: comer en el centro medieval, el bacalhau à Braga es el plato regional.","Braga: café y toucinho do céu en Rua do Souto."]},{"h":"🚗 CONDUCCIÓN","lines":["A3 desde Oporto: autopista de peaje. Llevar tarjeta o activar via verde al recoger el coche."]}],"stops":[{"id":"oporto-d3-0","name":"Sanctuary of Penha","closed":false,"ll":[41.4318214,-8.2700348],"q":"Sanctuary of Penha Porto","min":55,"time":"45-60 min","price":"Teleférico: 5€ ida y vuelta · Coche: gratis","hours":"Diario 8-18h (teleférico variable)","rating":"4.6","web":"","text":"Monte de 613m cubierto de pinos con formaciones de granito gigantes entre las que se apoya la iglesia. El teleférico parte desde el centro de Guimarães. Las vistas sobre el valle y la ciudad medieval son el punto fotográfico principal.","tip":"Combinar con el Castillo a pie, ambos están en el mismo monte. Subir en coche si se tiene, deja tiempo para el centro medieval.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~33 min a pie).","leg":{"min":0,"mode":"walk","km":0}},{"id":"oporto-d3-1","name":"Castillo de Guimarães","closed":false,"ll":[41.4478935,-8.2903191],"q":"Castillo de Guimarães Porto","min":40,"time":"30-45 min","price":"2€","hours":"Diario 10-18h","rating":"4.5","web":"","text":"Castillo del siglo X donde nació Afonso Henriques, primer rey de Portugal en 1109. Las almenas medievales y la torre del homenaje están en buen estado. Mejor fotografiarlo desde la cuesta del palacio de los Duques, la perspectiva desde abajo es más potente que desde dentro.","tip":"La subida a las almenas vale los 2€. Vista directa al Paço dos Duques y al centro medieval.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~3 min a pie).","leg":{"min":21,"km":3.198320991055137,"mode":"transit"}},{"id":"oporto-d3-2","name":"Paço dos Duques de Bragança","closed":false,"ll":[41.4465409,-8.2911855],"q":"Paço dos Duques de Bragança Porto","min":55,"time":"45-60 min","price":"5€","hours":"Diario 9:30-18h","rating":"4.5","web":"","text":"Palacio del siglo XV con torres cilíndricas y chimeneas de ladrillo que recuerdan a Borgoña. Restaurado radicalmente en los años 40 por Salazar como símbolo de la identidad nacional. El contraste entre el exterior medieval y el interior restaurado con criterio ideológico es el dato.","tip":"Entrar solo si el tiempo lo permite, el exterior y el contexto histórico son lo más interesante.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":3,"km":0.21689168174251278,"mode":"walk"}},{"id":"oporto-d3-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[41.4465409,-8.2911855],"q":"restaurantes cerca de Paço dos Duques de Bragança Porto","min":75,"price":"","hours":"","text":"Guimarães: comer en el centro medieval, el bacalhau à Braga es el plato regional. Braga: café y toucinho do céu en Rua do Souto.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"oporto-d3-3","name":"Rua de Santa Maria","closed":false,"ll":[41.4441176,-8.2927654],"q":"Rua de Santa Maria Porto","min":20,"time":"15-20 min","price":"Gratis","hours":"24h","rating":"4.6","web":"","text":"La calle medieval más fotografiada de Guimarães: casas de granito del siglo XIV con balcones de madera. El pavimento empedrado, la estrechez y la escala humana la hacen una de las calles medievales mejor conservadas del norte de Portugal.","tip":"Mejor a primera hora de la mañana, antes de los grupos de turistas. Desayunar en una de las panaderías del principio de la calle.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~5 min a pie).","leg":{"min":5,"km":0.3898894110331435,"mode":"walk"}},{"id":"oporto-d3-4","name":"Praça de São Tiago","closed":false,"ll":[41.4434742,-8.2932111],"q":"Praça de São Tiago Porto","min":15,"time":"15 min","price":"Gratis","hours":"24h","rating":"4.7","web":"","text":"La plaza románica más pequeña y auténtica del centro: adoquines medievales, casas de granito del XIII, la iglesia de São Miguel da Castelo donde bautizaron a Afonso Henriques. El ambiente al mediodía con los locales tomando café es más genuino que el turístico Largo da Oliveira.","tip":"La más fotogénica del centro medieval. Los cafés con sillas de madera en el exterior.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Paço dos Duques de Bragança (a cubierto, ~7 min a pie).","leg":{"min":0,"km":0.10479730768902325,"mode":"walk"}},{"id":"oporto-d3-5","name":"Largo da Oliveira + Padrão do Salado","closed":false,"ll":[41.442849,-8.2927935],"q":"Largo da Oliveira + Padrão do Salado Porto","min":15,"time":"15 min","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"El Padrão do Salado es un monumento gótico del siglo XIV levantado en 1340 para conmemorar la batalla donde Portugal y Castilla derrotaron al sultán de Marruecos. El olivo del centro de la plaza es otro de los supervivientes medievales.","tip":"El edificio de los Paços do Concelho (ayuntamiento medieval) detrás del Padrão tiene soportales del siglo XIV bien conservados.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~6 min a pie).","leg":{"min":0,"km":0.10107043286463153,"mode":"walk"}},{"id":"oporto-d3-6","name":"Largo da República do Brasil","closed":false,"ll":[41.4418299,-8.2908218],"q":"Largo da República do Brasil Porto","min":10,"time":"10 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Plaza modernista con el edificio de Correos y el jardín de los Pombinhos. El contraste entre el estilo ecléctico de principios del XX y el granito medieval del entorno es más llamativo de lo que sugiere el nombre.","tip":"Punto de referencia para salir hacia el coche y continuar a Braga.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Igreja de Santos Passos (a cubierto, ~2 min a pie).","leg":{"min":3,"km":0.2595181587547576,"mode":"walk"}},{"id":"oporto-d3-7","name":"Igreja de Santos Passos","closed":false,"ll":[41.4409037,-8.2897289],"q":"Igreja de Santos Passos Porto","min":10,"time":"10 min · exterior","price":"Gratis exterior","hours":"24h exterior","rating":"4.6","web":"","text":"Iglesia barroca del siglo XVIII con fachada de granito y la escalinata en perspectiva que enmarca la calle. Uno de los edificios más fotogénicos de Guimarães desde el exterior.","tip":"Solo exterior si el tiempo apremia. La escalinata es el punto fotográfico.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":2,"km":0.17874757179775894,"mode":"walk"}},{"id":"oporto-d3-8","name":"Bom Jesus do Monte · escalinata barroca","closed":false,"ll":[41.5547347,-8.3770546],"q":"Bom Jesus do Monte — escalinata barroca Porto","min":55,"time":"45-60 min","price":"Gratis · Funicular 2€ subida","hours":"Diario · Funicular 8-20h","rating":"4.7","web":"","text":"Escalinata barroca de 116 metros de altura con 581 peldaños en zigzag, fuentes y capillas en cada tramo. La perspectiva fotográfica desde abajo mirando hacia arriba es la imagen de Portugal más usada internacionalmente después de Lisboa. El funicular de 1882 sube en 3 minutos.","tip":"La foto desde abajo mirando hacia la cima es la toma clásica. Subir por la escalinata y bajar en funicular (o al revés). Parada en el camino desde Guimarães hacia Braga.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~72 min a pie).","leg":{"min":21,"km":18.977468868122706,"mode":"car"}},{"id":"oporto-d3-9","name":"Santuario de Nuestra Señora del Sameiro","closed":false,"ll":[41.5418253,-8.3698136],"q":"Santuario de Nuestra Señora del Sameiro Porto","min":20,"time":"20 min","price":"Gratis","hours":"Diario 8-18h","rating":"4.5","web":"","text":"Basílica neoclásica en la cima de un monte a 566m. Las vistas sobre el valle del Minho y hacia Guimarães son de las mejores de la región. Menos visitado que el Bom Jesus aunque está más cerca de Braga.","tip":"Parada rápida antes de bajar al centro de Braga. Las vistas justifican los 10 minutos. Bajar las escaleras para ver las vistas al fondo y la magnitud de la localización.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~84 min a pie).","leg":{"min":27,"km":2.023849486025472,"mode":"walk"}},{"id":"oporto-d3-10","name":"Casa do Raio","closed":false,"ll":[41.5483836,-8.4225933],"q":"Casa do Raio Porto","min":10,"time":"5-10 min · solo exterior","price":"Gratis exterior","hours":"24h exterior","rating":"4.5","web":"","text":"Palacete barroco del siglo XVIII cubierto de azulejos azules en la fachada, uno de los edificios civiles barrocos más fotogénicos del norte de Portugal. Actualmente es sede del Archivo Distrital. La fachada desde la calle no requiere más de 10 minutos.","tip":"La entrada al centro histórico de Braga. El azul de los azulejos a plena luz es muy potente.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~7 min a pie).","leg":{"min":29,"km":5.7883275327300145,"mode":"transit"}},{"id":"oporto-d3-11","name":"Centro histórico de Braga · eje principal","closed":false,"ll":[41.5488998,-8.4217243],"q":"Centro histórico de Braga — eje principal Porto","min":40,"time":"30-45 min · paseo","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"El eje medieval de Braga: Rua do Souto y Rua Dom Diogo de Sousa. La ciudad es conocida como la 'Roma portuguesa' por la densidad de iglesias barrocas. El contraste entre la arquitectura eclesiástica del XVIII y las tiendas actuales tiene más carácter que Lisboa.","tip":"Recorrer el eje de norte a sur, la concentración de edificios barrocos aumenta hacia la Catedral.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~8 min a pie).","leg":{"min":0,"km":0.12002477670942664,"mode":"walk"}},{"id":"oporto-d3-12","name":"Chafariz da Praça da República","closed":false,"ll":[41.551394,-8.4230942],"q":"Chafariz da Praça da República Porto","min":20,"time":"15-20 min · plaza","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"Fuente octogonal del XVIII en el centro de la plaza principal de Braga, rodeada de cafés con terraza. El ambiente de la plaza es el más vivo del centro histórico, los locales llevan generaciones sentándose aquí.","tip":"Mejor parada para un café antes de seguir al eje de iglesias. Los cafés de los soportales tienen la terraza más barata del centro.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~5 min a pie).","leg":{"min":5,"km":0.3898138679251615,"mode":"walk"}},{"id":"oporto-d3-13","name":"Jardim de Santa Bárbara","closed":false,"ll":[41.5513604,-8.4259038],"q":"Jardim de Santa Bárbara Porto","min":20,"time":"15-20 min","price":"Gratis","hours":"Diario amanecer-anochecer","rating":"4.7","web":"","text":"Jardín formal del siglo XVII junto al Palacio Episcopal: laberinto de boj recortado, fuentes y rosas. El fondo del palacio del arzobispo enmarca el jardín desde la calle. Una de las fotografías más pintorescas de Braga sin entrar a ningún edificio.","tip":"Las rosas están en su mejor momento en mayo. La foto clásica es desde la reja exterior con el palacio al fondo.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Palácio Episcopal Braga (a cubierto, ~1 min a pie).","leg":{"min":4,"km":0.30397618132214155,"mode":"walk"}},{"id":"oporto-d3-14","name":"Palácio Episcopal Braga","closed":false,"ll":[41.5509529,-8.4264201],"q":"Palácio Episcopal Braga Porto","min":10,"time":"10 min · exterior","price":"Gratis exterior","hours":"24h exterior","rating":"4.4","web":"","text":"Edificio del siglo XIV ampliado en el XVII y XVIII: una de las residencias episcopales más grandes de Portugal. La fachada da al Jardim de Santa Bárbara.","tip":"Visitar junto al jardín, están físicamente pegados.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.08117493353336275,"mode":"walk"}},{"id":"oporto-d3-15","name":"Catedral de Braga","closed":false,"ll":[41.5499885,-8.4269012],"q":"Catedral de Braga Porto","min":40,"time":"30-45 min","price":"Exterior gratis · Interior 5€","hours":"Diario 8:30-18:30h","rating":"4.6","web":"","text":"La catedral más antigua de Portugal (iniciada en 1070, terminada en 1509). La fachada es una mezcla de románico, gótico, manuelino y barroco acumulados durante 500 años. El exterior es más interesante que el interior, rodear el edificio para ver todos los estilos estratificados.","tip":"El tesoro de la catedral tiene el cáliz de San Geraldo y los ornamentos medievales mejor conservados del norte de Portugal. Vale los 5€ si te interesan.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"km":0.14880559074757552,"mode":"walk"}},{"id":"oporto-d3-16","name":"Arco de la Puerta Nueva","closed":false,"ll":[41.5502644,-8.4293422],"q":"Arco de la Puerta Nueva Porto","min":5,"time":"5 min","price":"Gratis","hours":"24h","rating":"4.5","web":"","text":"Arco del siglo XVIII que marcaba la entrada a la ciudad amurallada medieval. Uno de los pocos restos de la muralla de Braga. La perspectiva fotográfica desde dentro del arco mirando a la calle es la habitual.","tip":"Punto de referencia para salir del centro y volver al coche hacia Oporto.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Catedral de Braga (a cubierto, ~4 min a pie).","leg":{"min":4,"km":0.2670627491888702,"mode":"walk"}}]},{"key":"d4","big":"4","small":"sáb","label":"Día 4 · sáb","title":"Aliados · Bolhão · Matosinhos","zone":"Aliados","est":"~7–9h","start":"10:30","sunset":null,"from":"Estação de São Bento","endLbl":"Terminas","mode":"city","notes":[],"brief":[{"h":"🔔 RESERVAR ANTES","lines":["Casa da Música: consultar programa en casadamusica.com si hay concierto."]},{"h":"⏱ ANÁLISIS DE TIEMPO","lines":["Mañana compacta, todos los puntos del centro caben en 3.5h arrancando a las 8:30h. A las 12-12:30h libre para coger el metro a Matosinhos.","Matosinhos: toda la tarde hasta las 18-19h."]},{"h":"🎯 LOS QUE MANDAN","lines":["São Bento: llegar antes de las 9h, los grupos turísticos llenan el atrio desde las 10h","Mercado Bolhão: llegar antes de las 10h para el ambiente de mercado real · Cerrado domingos","Matosinhos: salir de Aliados antes de las 12:30h para comer allí"]},{"h":"⏰ HORARIOS CLAVE","lines":["8:30-9:00h, São Bento (sin grupos, luz de la mañana)","9:00-10:00h, Mercado Bolhão","12:30h, Metro desde Trindade a Matosinhos-Sul (25 min, 1.50€)","13:00-14:30h, Comer en Rua Heróis de França","14:30-18:30h, Playa, Parque da Cidade, Puerto Leixões"]},{"h":"🚗 TRANSPORTE VUELTA","lines":["Metro Matosinhos-Sul → Trindade: 25 min, 1.50€. O taxi/Uber directo al hotel: 15 min, 12-15€."]}],"stops":[{"id":"oporto-d4-0","name":"Estação de São Bento","closed":false,"ll":[41.1456094,-8.6103747],"q":"Estação de São Bento Porto","min":25,"time":"20-30 min","price":"Gratis","hours":"Diario 8-23h (atrio siempre abierto)","rating":"4.8","web":"","text":"Estación de tren de 1916 con 20.000 azulejos pintados a mano en el atrio central: batallas medievales, escenas rurales del norte de Portugal, la llegada del primer tren a Oporto. El contraste entre la función cotidiana (gente cogiendo trenes de cercanías) y la escala decorativa del atrio es el dato.","tip":"PRIMER PUNTO DEL DÍA, ir antes de las 9h. A partir de las 10h los grupos turísticos llenan el atrio. Los azulejos se ven mejor desde el fondo mirando hacia la entrada.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":0,"mode":"walk","km":0}},{"id":"oporto-d4-1","name":"Rua de 31 de Janeiro","closed":false,"ll":[41.1461287,-8.6102151],"q":"Rua de 31 de Janeiro Porto","min":10,"time":"10 min · paseo","price":"Gratis","hours":"24h","rating":"4.3","web":"","text":"Calle que conecta São Bento con Bolhão: casas del siglo XIX con azulejos en diferentes estados de deterioro, pequeños comercios de toda la vida, sin la gentrificación de Rua das Flores.","tip":"El contraste con Rua das Flores (más restaurada, más turística) es llamativo siendo paralelas. Esta calle tiene más vida local.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Estação de São Bento (a cubierto, ~1 min a pie).","leg":{"min":0,"km":0.07705074096374005,"mode":"walk"}},{"id":"oporto-d4-2","name":"Iglesia de San Ildefonso · fachada 11.000 azulejos","closed":false,"ll":[41.1460999,-8.6066989],"q":"Iglesia de San Ildefonso — fachada 11.000 azulejos Porto","min":20,"time":"15-20 min","price":"Gratis exterior · Interior 3€","hours":"Lun-Vie 8-12:30h y 15-18:30h · Sáb 9-12:30h · Dom 10-12:30h y 15-18:30h","rating":"4.7","web":"","text":"La fachada principal cubierta con 11.000 azulejos azules y blancos (1932) narrando escenas bíblicas y mitológicas. La Praça da Batalha delante fue un cementerio, los cuerpos siguen bajo la plaza peatonal.","tip":"La mejor perspectiva es desde el extremo opuesto de la Praça da Batalha, a unos 80 metros la fachada entera entra en el encuadre.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":5,"km":0.3827738004587916,"mode":"walk"}},{"id":"oporto-d4-3","name":"Praça da Batalha · antiguo cementerio","closed":false,"ll":[41.1454898,-8.6074304],"q":"Praça da Batalha — antiguo cementerio Porto","min":10,"time":"10 min","price":"Gratis","hours":"24h","rating":"4.2","web":"","text":"La plaza más grande del centro fue un cementerio desde el reinado de Alfonso III hasta finales del siglo XIX. Las vallas de hierro frente a la iglesia marcan el perímetro del antiguo camposanto. Los cuerpos siguen bajo la plaza peatonal.","tip":"La imagen completa de San Ildefonso se ve mejor desde aquí. La historia del cementerio no está señalizada, la mayoría de visitantes no sabe que está caminando sobre él.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Iglesia de San Ildefonso (a cubierto, ~2 min a pie).","leg":{"min":0,"km":0.11882030801955899,"mode":"walk"}},{"id":"oporto-d4-4","name":"Liberdade Square + McDonald's palacete","closed":false,"ll":[41.1466469,-8.6115366],"q":"Liberdade Square + McDonald's palacete Porto","min":15,"time":"10-15 min","price":"Gratis · McDonald's precio estándar","hours":"24h · McDonald's desde 8h","rating":"4.4","web":"","text":"La Praça da Liberdade marca el inicio de la Avenida dos Aliados. El dato: el McDonald's ocupa un palacete neoclásico restaurado del siglo XIX, interior con mármoles, estucos y molduras doradas genuinamente incongruente. El café de McDonald's aquí tiene la sala más elegante de la cadena.","tip":"Entrar aunque sea a ver el interior, nadie lo obliga a pedir nada. El contraste es lo que vale.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Estação de São Bento (a cubierto, ~3 min a pie).","leg":{"min":6,"km":0.47724583090095163,"mode":"walk"}},{"id":"oporto-d4-5","name":"Avenida dos Aliados","closed":false,"ll":[41.1483096,-8.6108148],"q":"Avenida dos Aliados Porto","min":20,"time":"15-20 min · paseo","price":"Gratis","hours":"24h","rating":"4.6","web":"","text":"El eje central de Oporto: edificios eclécticos del siglo XX con el Ayuntamiento al fondo. La escala de la avenida, los edificios bancarios con fachadas de granito y la estatua del rey Dom João I en el centro.","tip":"Caminar de sur a norte para que el Ayuntamiento quede al fondo como destino visual. La perspectiva desde el centro de la avenida es la mejor.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~3 min a pie).","leg":{"min":3,"km":0.25286496627713473,"mode":"walk"}},{"id":"oporto-d4-6","name":"Ayuntamiento de Oporto","closed":false,"ll":[41.1499084,-8.6107023],"q":"Ayuntamiento de Oporto Porto","min":15,"time":"10-15 min · exterior","price":"Gratis exterior","hours":"24h exterior","rating":"4.4","web":"","text":"Edificio neoclásico del siglo XIX en el extremo norte de los Aliados. La fachada con el reloj y el pórtico de columnas es la imagen oficial de Oporto que aparece en documentos turísticos. Mejor fotografiado desde el centro de la avenida en perspectiva.","tip":"La perspectiva desde 200 metros más abajo en los Aliados es mejor que desde delante del edificio.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":3,"km":0.2314361693804433,"mode":"walk"}},{"id":"oporto-d4-7","name":"Mercado de Bolhão","closed":false,"ll":[41.1493855,-8.6071175],"q":"Mercado de Bolhão Porto","min":40,"time":"30-45 min","price":"Gratis entrada · Productos variable","hours":"Lun-Vie 8-20h · Sáb 8-17h · Cerrado Dom","rating":"4.5","web":"","text":"Mercado cubierto de 1914 con estructura de hierro en dos pisos: balcones con puestos de flores, pescado, frutas, encajes. Reabierto en 2022 después de 4 años de restauración. El ambiente a las 9h con los locales comprando bacalao es el auténtico.","tip":"Llegar antes de las 10h para el ambiente de mercado real. Los puestos de flores en la planta baja son los más fotogénicos. Cerrado los domingos.","transport":false,"tags":[],"rain":"A cubierto: buena opción con lluvia.","leg":{"min":5,"km":0.39745122598630783,"mode":"walk"}},{"id":"oporto-d4-lunch","name":"Comida","when":"Comida · 13:30","meal":true,"ll":[41.1493855,-8.6071175],"q":"restaurantes cerca de Mercado de Bolhão Porto","min":75,"price":"","hours":"","text":"Come por la zona: busca calidad-precio fuera de lo más turístico.","tip":"","rain":"A cubierto: no cambia nada.","leg":{"min":0,"mode":"walk","km":0},"tags":["meal"]},{"id":"oporto-d4-8","name":"Capilla de las Almas","closed":false,"ll":[41.1498821,-8.6056554],"q":"Capilla de las Almas Porto","min":20,"time":"15-20 min","price":"Gratis","hours":"Lun-Sáb 8-19h · Dom 9-13h y 17-20h","rating":"4.6","web":"","text":"La fachada exterior con 15.947 azulejos azules y blancos es uno de los conjuntos de azulejos figurativos más grandes de Portugal: escenas de la vida de San Francisco de Asís y Santa Catalina en las dos fachadas. El edificio hace esquina, mejor desde el lado de la calle Fernando Tomás.","tip":"La fachada lateral (Fernando Tomás) tiene la perspectiva completa del conjunto de azulejos. En la Rua de Santa Catarina solo se ve un lado.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Mercado de Bolhão (a cubierto, ~2 min a pie).","leg":{"min":2,"km":0.1745871760814211,"mode":"walk"}},{"id":"oporto-d4-9","name":"Metro Trindade → Matosinhos-Sul","closed":false,"ll":[41.152277,-8.609299],"q":"Metro Trindade → Matosinhos-Sul Porto","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 Metro, Líneas A / B / C / E Dirección: Matosinhos-Sul · 1.50€ billete andante · Tarjeta recargable en la máquina · Cada 5-10 min · Trayecto: ~25 min 📍 Salida desde Trindade (5 min a pie desde los Aliados). Matosinhos-Sul es la última parada, no hay confusión posible. Salir por la salida ‘Praia’, el mar está a 200m. 🔗 Conexiones desde Trindade: ➡️ Líneas A/B/C/E dirección Matosinhos-Sul (~25 min) 🚌 Bus alternativo: no recomendado, el metro es más rápido y directo","tip":"Salir de los Aliados hacia las 12-12:30h para llegar a Matosinhos a la 1h.","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":7,"km":0.5264323992590061,"mode":"walk"}},{"id":"oporto-d4-10","name":"Matosinhos Sul → Metro Trindade","closed":false,"ll":[41.180171,-8.688553],"q":"Matosinhos Sul → Metro Trindade Porto","min":0,"time":"","price":"","hours":"","rating":"","web":"","text":"🚇 Metro, Líneas A / B / C Dirección: Trindade (sentido centro) · 1.50€ · Usar la misma tarjeta del viaje de ida · Cada 5-10 min · Trayecto: ~25 min 📍 Bajar en Trindade, parada del centro. 5 min a pie al hotel o a cualquier punto del centro histórico. 🔗 Conexiones desde Matosinhos-Sul: ➡️ Líneas A/B/C dirección Estádio do Dragão, bajar en Trindade (~25 min)","tip":"Alternativa si se lleva equipaje o se está cansado: Uber desde Matosinhos al hotel, ~15 min, 12-15€.","transport":true,"tags":[],"rain":"Transporte: no cambia.","leg":{"min":42,"km":9.520471123231605,"mode":"transit"}},{"id":"oporto-d4-11","name":"Rua Heróis de França · comida en Matosinhos","closed":false,"ll":[41.1811952,-8.693121],"q":"Rua Heróis de França — comida en Matosinhos Porto","min":75,"time":"1-1.5h","price":"15-22€ por persona","hours":"Diario 12-16h y 19-23h","rating":"","web":"","text":"La calle del pescado a la brasa de Portugal. Una docena de restaurantes uno al lado del otro haciendo lo mismo: dourada, robalo, linguado, bacalhau en brasa de carbón. Sin carta elaborada, sin turismo organizado. Los portuenses llevan generaciones viniendo aquí los domingos. Entrar al que tenga más locales dentro, es el único criterio necesario. Pedir la dourada entera a la brasa con patatas y ensalada.","tip":"","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~134 min a pie).","leg":{"min":7,"km":0.518564920004232,"mode":"walk"}},{"id":"oporto-d4-12","name":"Praia de Matosinhos","closed":false,"ll":[41.1763702,-8.6926763],"q":"Praia de Matosinhos Porto","min":40,"time":"30-45 min","price":"Gratis","hours":"24h","rating":"","web":"","text":"Playa atántica urbana de 2 km a 20 min del centro de Oporto. En mayo el agua está fría pero el paseo está lleno de familias, corredores y gente tomando el sol en las rocas. Las olas del Atlántico son visibles desde los restaurantes de la Rua Heróis de França. El Parque da Cidade empieza justo detrás de la playa, los dos se recorren juntos.","tip":"","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~129 min a pie).","leg":{"min":9,"km":0.6991463162689664,"mode":"walk"}},{"id":"oporto-d4-13","name":"Fuerte de San Francisco Javier","closed":false,"ll":[41.1685772,-8.6899213],"q":"Fuerte de San Francisco Javier Porto","min":15,"time":"15 min","price":"Gratis exterior","hours":"24h exterior","rating":"","web":"","text":"Fortaleza atlántica del siglo XVII en el límite entre la playa de Matosinhos y el puerto de Leixões. Los muros de granito oscurecido por el salitre se asientan sobre el litoral rocoso. Interior cerrado al público, pero el paseo por el perímetro tiene las mejores vistas del puerto industrial desde el nivel del mar.","tip":"Cinco minutos entre la playa y el Parque da Cidade. El ángulo desde el litoral rocoso al sur del fuerte, con la fortaleza de fondo y el puerto al norte, es el plano.","transport":false,"tags":[],"rain":"Al aire libre. Con lluvia fuerte, visita rápida o adelanta Ayuntamiento de Oporto (a cubierto, ~120 min a pie).","leg":{"min":16,"km":1.1657081810778673,"mode":"walk"}},{"id":"oporto-d4-14","name":"Parque da Cidade","closed":false,"ll":[41.1686739,-8.6788358],"q":"Parque da Cidade Porto","min":55,"time":"45-60 min","price":"Gratis","hours":"Diario 8-21h","rating":"","web":"","text":"El parque urbano más grande de Portugal: 83 hectáreas de praderas, lagos y bosque que llegan hasta el borde del Atlántico. Los fines de semana está lleno de familias portuenses, parejas, perros y picnics. El lago central tiene patos y barcas de remos. El acceso sur da directamente a la playa de Matosinhos. El cierre perfecto del via
